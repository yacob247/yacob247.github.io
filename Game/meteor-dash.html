<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteor Dash | Envizion Arcade</title><meta name="description" content="An original browser survival game: steer around falling meteors and beat your local high score."><link rel="stylesheet" href="arcade.css"></head>
<body><main><div class="topbar"><div><div class="muted">ENVIZION ARCADE</div><h1>Meteor Dash</h1></div><a href="index.html">All games</a></div><section class="card"><p class="muted">Steer the ship, avoid the meteors, and survive while the pace increases. Use <kbd>Arrow keys</kbd> or <kbd>A/D</kbd>; touch buttons work on phones.</p><div class="hud"><span class="stat">Score: <b id="score">0</b></span><span class="stat">Best: <b id="best">0</b></span><span class="stat">Status: <b id="state">Ready</b></span></div><canvas id="game" class="game-canvas" width="900" height="520" aria-label="Meteor Dash game"></canvas><div class="controls"><button class="button" id="start">Start / Restart</button><button class="button" id="pause">Pause</button><button class="button" data-key="ArrowLeft">◀</button><button class="button" data-key="ArrowRight">▶</button></div><div id="message" class="status">Press Start to launch.</div></section></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),stateEl=document.getElementById('state'),msg=document.getElementById('message');let W=900,H=520,ship,rocks,score,running=false,paused=false,last=0,spawn=0,keys=new Set(),best=Number(localStorage.getItem('envizion_meteor_best')||0);bestEl.textContent=best;
function resize(){const r=c.getBoundingClientRect();W=c.width=Math.max(320,Math.floor(r.width));H=c.height=Math.max(360,Math.floor(r.width*.578));if(ship)ship.y=H-54}addEventListener('resize',resize);resize();
function reset(){ship={x:W/2,y:H-54,w:34,h:22,speed:390};rocks=[];score=0;spawn=0;scoreEl.textContent='0';stateEl.textContent='Flying';msg.textContent='Dodge the meteors.';}
function start(){running=false;reset();running=true;paused=false;requestAnimationFrame(loop)}function end(){running=false;stateEl.textContent='Crashed';msg.textContent='You hit a meteor. Press Start to try again.';if(score>best){best=Math.floor(score);localStorage.setItem('envizion_meteor_best',best);bestEl.textContent=best}}
function draw(){x.fillStyle='#050914';x.fillRect(0,0,W,H);for(let i=0;i<50;i++){x.fillStyle=`rgba(191,219,254,${(i%5+1)/10})`;x.fillRect((i*83)%W,(i*47)%H,2,2)}x.fillStyle='#60a5fa';x.beginPath();x.moveTo(ship.x,ship.y-14);x.lineTo(ship.x-18,ship.y+13);x.lineTo(ship.x,ship.y+7);x.lineTo(ship.x+18,ship.y+13);x.closePath();x.fill();x.fillStyle='#fbbf24';x.fillRect(ship.x-5,ship.y+12,10,7);rocks.forEach(r=>{x.fillStyle='#fb7185';x.beginPath();x.arc(r.x,r.y,r.r,0,Math.PI*2);x.fill();x.fillStyle='#fecdd3';x.fillRect(r.x-r.r*.25,r.y-r.r*.35,3,3)})}
function loop(t){if(!running)return;if(!paused){const dt=Math.min(.035,(t-last)/1000||0);last=t;score+=dt*12;scoreEl.textContent=Math.floor(score);const speed=145+score*2.2;spawn-=dt;if(spawn<=0){rocks.push({x:20+Math.random()*(W-40),y:-20,r:10+Math.random()*15,vy:speed*(.8+Math.random()*.35)});spawn=Math.max(.18,.62-score/900)}if(keys.has('ArrowLeft')||keys.has('a'))ship.x-=ship.speed*dt;if(keys.has('ArrowRight')||keys.has('d'))ship.x+=ship.speed*dt;ship.x=Math.max(22,Math.min(W-22,ship.x));rocks.forEach(r=>r.y+=r.vy*dt);rocks=rocks.filter(r=>r.y<H+30);if(rocks.some(r=>Math.abs(r.x-ship.x)<r.r+16&&Math.abs(r.y-ship.y)<r.r+15))end()}draw();if(running)requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();keys.add(e.key.length===1?e.key.toLowerCase():e.key)}if(e.key===' '&&running)paused=!paused});addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=()=>keys.add(b.dataset.key);b.onpointerup=b.onpointerleave=()=>keys.delete(b.dataset.key)});document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(running){paused=!paused;stateEl.textContent=paused?'Paused':'Flying'}};draw();
</script></body></html>
