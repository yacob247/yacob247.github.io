<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gridlock | Envizion Arcade</title><meta name="description" content="An original local tile-merging puzzle game with keyboard and touch-friendly controls."><link rel="stylesheet" href="arcade.css"><style>.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(460px,100%);margin:auto;background:#1e293b;padding:9px;border-radius:14px}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:#263653;font-size:clamp(1.3rem,6vw,2.4rem);font-weight:800}.v2{background:#1d4ed8}.v4{background:#2563eb}.v8{background:#0891b2}.v16{background:#0d9488}.v32{background:#16a34a}.v64{background:#65a30d}.v128{background:#ca8a04}.v256{background:#ea580c}.v512{background:#dc2626}.v1024,.v2048{background:#be185d}</style></head>
<body><main><div class="topbar"><div><div class="muted">ENVIZION ARCADE</div><h1>Gridlock</h1></div><a href="index.html">All games</a></div><section class="card"><p class="muted">Slide matching numbers together to merge them. Reach 2048 if you can. Use the arrow keys or the controls below; swipe works on the board.</p><div class="hud"><span class="stat">Score: <b id="score">0</b></span><span class="stat">Best: <b id="best">0</b></span><span class="stat">Status: <b id="status">Ready</b></span></div><div id="board" class="board" tabindex="0" aria-label="Gridlock board"></div><div class="controls"><button class="button" id="new">New Game</button><button class="button" data-move="left">◀</button><button class="button" data-move="up">▲</button><button class="button" data-move="down">▼</button><button class="button" data-move="right">▶</button></div></section></main><script>
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');let grid,score=0,best=Number(localStorage.getItem('envizion_gridlock_best')||0);bestEl.textContent=best;
function empty(){return grid.flatMap((r,y)=>r.map((v,x)=>v?null:{x,y})).filter(Boolean)}function add(){const e=empty();if(e.length){const p=e[Math.floor(Math.random()*e.length)];grid[p.y][p.x]=Math.random()<.9?2:4}}function fresh(){grid=Array.from({length:4},()=>Array(4).fill(0));score=0;add();add();statusEl.textContent='Playing';render()}function line(values){const a=values.filter(Boolean),out=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){const v=a[i]*2;out.push(v);score+=v;i++}else out.push(a[i])}while(out.length<4)out.push(0);return out}function move(dir){const before=JSON.stringify(grid);if(dir==='left')grid=grid.map(r=>line(r));if(dir==='right')grid=grid.map(r=>line([...r].reverse()).reverse());if(dir==='up'){for(let x=0;x<4;x++){const col=line(grid.map(r=>r[x]));for(let y=0;y<4;y++)grid[y][x]=col[y]}}if(dir==='down'){for(let x=0;x<4;x++){const col=line(grid.map(r=>r[x]).reverse()).reverse();for(let y=0;y<4;y++)grid[y][x]=col[y]}}if(JSON.stringify(grid)!==before){add();if(score>best){best=score;localStorage.setItem('envizion_gridlock_best',best);bestEl.textContent=best}render();if(!empty().length&&!canMove()){statusEl.textContent='Game over — start a new grid.'}else if(grid.flat().includes(2048))statusEl.textContent='2048 reached — keep going!'}}function canMove(){for(let y=0;y<4;y++)for(let x=0;x<4;x++)if((grid[y][x]===grid[y+1]?.[x])||(grid[y][x]===grid[y]?.[x+1]))return true;return false}function render(){board.innerHTML='';grid.flat().forEach(v=>{const d=document.createElement('div');d.className='tile '+(v?'v'+v:'');d.textContent=v||'';board.appendChild(d)});scoreEl.textContent=score}addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();move(m)}});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));document.getElementById('new').onclick=fresh;let sx=0,sy=0;board.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});fresh();
</script></body></html>
