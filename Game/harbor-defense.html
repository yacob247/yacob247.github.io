<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor Defense | Envizion Arcade</title><meta name="description" content="An original browser defense game: aim a harbor turret, stop incoming boats, and survive escalating waves."><link rel="stylesheet" href="arcade.css"></head>
<body><main><div class="topbar"><div><div class="muted">ENVIZION ARCADE</div><h1>Harbor Defense</h1></div><a href="index.html">All games</a></div><section class="card"><p class="muted">Defend the harbor by clicking or tapping incoming boats. Move the turret with <kbd>A/D</kbd> or the arrow keys, then fire with a click. Every wave becomes faster.</p><div class="hud"><span class="stat">Score: <b id="score">0</b></span><span class="stat">Wave: <b id="wave">1</b></span><span class="stat">Harbor health: <b id="health">5</b></span><span class="stat">Best: <b id="best">0</b></span></div><canvas id="game" class="game-canvas" width="900" height="520"></canvas><div class="controls"><button class="button" id="start">Start / Restart</button><button class="button" data-key="ArrowLeft">◀</button><button class="button" data-key="ArrowRight">▶</button><button class="button" id="fire">Fire</button></div><div id="message" class="status">Press Start, then click the water to fire.</div></section></main><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,turret,boats=[],shots=[],score=0,wave=1,health=5,running=false,last=0,spawn=0,keys=new Set(),best=Number(localStorage.getItem('envizion_harbor_best')||0);$('best').textContent=best;function resize(){const r=c.getBoundingClientRect();W=c.width=Math.max(320,Math.floor(r.width));H=c.height=Math.max(360,Math.floor(r.width*.578));if(turret)turret.y=H-35}addEventListener('resize',resize);resize();function reset(){running=false;turret={x:W/2,y:H-35};boats=[];shots=[];score=0;wave=1;health=5;spawn=0;running=true;$('score').textContent=0;$('wave').textContent=1;$('health').textContent=5;$('message').textContent='Protect the harbor.';requestAnimationFrame(loop)}function fire(tx,ty){if(!running)return;const dx=tx-turret.x,dy=ty-turret.y,len=Math.hypot(dx,dy)||1;shots.push({x:turret.x,y:turret.y,vx:dx/len*520,vy:dy/len*520})}function end(){running=false;$('message').textContent='The harbor fell. Press Start to defend it again.';if(score>best){best=score;localStorage.setItem('envizion_harbor_best',best);$('best').textContent=best}}function draw(){ctx.fillStyle='#071326';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0e7490';ctx.fillRect(0,H-105,W,105);ctx.fillStyle='#334155';ctx.fillRect(0,H-55,W,55);ctx.fillStyle='#fbbf24';ctx.fillRect(turret.x-22,turret.y-10,44,15);ctx.save();ctx.translate(turret.x,turret.y);ctx.rotate(-Math.PI/2);ctx.fillRect(-5,-8,10,36);ctx.restore();boats.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(b.x,b.y,22,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e0f2fe';ctx.fillRect(b.x-8,b.y-10,16,8)});shots.forEach(s=>{ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill()})}function loop(t){if(!running)return;const dt=Math.min(.035,(t-last)/1000||0);last=t;if(keys.has('ArrowLeft')||keys.has('a'))turret.x-=400*dt;if(keys.has('ArrowRight')||keys.has('d'))turret.x+=400*dt;turret.x=Math.max(25,Math.min(W-25,turret.x));spawn-=dt;if(spawn<=0){boats.push({x:25+Math.random()*(W-50),y:-20,speed:42+wave*7+Math.random()*22,color:`hsl(${10+Math.random()*35} 85% 58%)`});spawn=Math.max(.25,1.1-wave*.07)}boats.forEach(b=>b.y+=b.speed*dt);shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt});for(let i=boats.length-1;i>=0;i--)if(boats[i].y>H-80){boats.splice(i,1);health--;$('health').textContent=health;if(health<=0){end();return}}for(let i=shots.length-1;i>=0;i--){let hit=false;for(let j=boats.length-1;j>=0;j--)if(Math.hypot(shots[i].x-boats[j].x,shots[i].y-boats[j].y)<25){boats.splice(j,1);score+=10;wave=1+Math.floor(score/100);$('score').textContent=score;$('wave').textContent=wave;hit=true;break}if(hit||shots[i].x<0||shots[i].x>W||shots[i].y<0||shots[i].y>H)shots.splice(i,1)}draw();requestAnimationFrame(loop)}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();fire((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H)});$('fire').onclick=()=>fire(turret.x,H/2);addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();keys.add(e.key.length===1?e.key.toLowerCase():e.key)}});addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=()=>keys.add(b.dataset.key);b.onpointerup=b.onpointerleave=()=>keys.delete(b.dataset.key)});$('start').onclick=reset;draw();
</script></body></html>
