The impossible histogram is D. The trick is to compare where Q1, Q2 and Q3 fall horizontally, not just look at the heights of the bars.

1. Start with the box plot
Look at the position of the box plot's five values:

Minimum → Q1 → Q2 → Q3 → Maximum

Q1 and Q3 are relatively close to the ends of the full range. That means the middle 50% of the data covers a large horizontal distance.

2. Check each histogram
The frequencies tell us where the quartiles fall. We have 16 observations, so the positions are approximately:

Q1: 4.25

Q2: 8.5

Q3: 12.75

