When Q1 and Q3 are further apart, it means the middle 50% of the data is more spread out.

Remember:

IQR = Q3 − Q1

Q1 and Q3 close together: the middle 50% of observations are clustered within a smaller range.

Q1 and Q3 far apart: the middle 50% of observations are spread across a larger range.

For your question:

The box in the box plot is relatively wide compared with the full range.

Therefore, the middle 50% of the observations covers a substantial distance.

In histogram D, Q1 and Q3 fall closer together around the centre, so it does not match the box plot.

HSC wording: A larger interquartile range indicates greater dispersion among the middle 50% of the data.

