Step 3: The fast exam method
When you see a question like this:

Identify where Q1, Q2 and Q3 sit on the box plot relative to the minimum and maximum.

Add the histogram frequencies cumulatively to locate those quartiles.

Eliminate any histogram whose quartile positions do not match the box plot.

