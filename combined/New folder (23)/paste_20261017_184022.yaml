3. Why D is impossible
In D, Q1 falls in the 3rd interval and Q3 falls in the 5th interval. Both quartiles are too close to the centre compared with the box plot, where Q1 and Q3 are much closer to the ends.

A, B and C put Q1 and Q3 in the 2nd and 6th intervals, which matches the box plot.

C is still possible despite its empty middle interval: the median can be halfway between the observations on either side of that gap.

Fast exam method: find Q1 and Q3 using cumulative frequencies, then check whether their horizontal positions match the box plot. You do not need to calculate the exact quartile values.

