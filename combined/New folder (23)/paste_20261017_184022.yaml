Your histogram has frequencies:

1, 2, 4, 2, 4, 2, 1

These are not the actual values. They tell you how many observations fall within each interval.

For example, the first interval contains 1 observation, and the second contains 2 observations. Together, those intervals contain 3 observations.

You keep adding the frequencies to count the observations until you reach the position of Q1, Q2 or Q3.

The crucial difference: with the marks 20, 30, 40, 50, 60, you can calculate the exact quartile values because you know every mark. With a histogram, you generally only know how many observations fall in each interval, so you can identify the interval containing a quartile, but not necessarily its exact value.

