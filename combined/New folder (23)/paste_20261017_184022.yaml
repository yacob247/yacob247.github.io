You are right to question that reasoning. A wider IQR does not automatically mean a histogram is impossible, and a box plot does not tell you the exact frequency in every interval.

Let's separate the ideas.

1. What the quartiles actually tell you
Q1: the 25th percentile — about 25% of observations are at or below it.

Q2: the median — about 50% are at or below it.

Q3: the 75th percentile — about 75% are at or below it.

They are positions in the ordered data, not averages of the values around them.

2. What a wider box means
A wider box means the middle 50% of observations spans a larger range of values. It does not necessarily mean fewer people got similar marks, because the box plot does not show the detailed frequencies within that range.

3. Your point about the histogram
You are correct that quartiles can fall in intervals 3, 4 and 5, or in intervals 1, 2, 3, 4 and 5, depending on the data.

The interval numbers alone cannot prove a histogram is impossible. We must compare the actual positions of Q1, the median and Q3 on the common horizontal scale, using the interval boundaries.

I previously claimed D was impossible simply because its quartiles fell in intervals 3, 4 and 5. That reasoning was insufficient, and I shouldn't have presented D as certain on that basis.

