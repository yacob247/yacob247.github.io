I see the issue now. You are mixing up the number of observations with the values of those observations. Let's separate them.

Imagine a class gets these marks:

20, 30, 40, 50, 60

There are 5 students. The marks are the actual values.

The number of students tells you how many observations there are.

The marks tell you the values of those observations.

To find Q1, you first find its position: (5 + 1) ÷ 4 = 1.5. That means Q1 lies halfway between the 1st and 2nd marks: (20 + 30) ÷ 2 = 25.

You do not add the number of students to the marks. They are different things.

Now apply this to your histogram
The frequencies 1, 2, 4, 2, 4, 2, 1 tell you how many observations fall in each interval. They do not tell you the actual marks or values.

You add the frequencies cumulatively to find which interval contains each quartile. For example:

First interval: 1 observation.

First two intervals: 1 + 2 = 3 observations.

First three intervals: 1 + 2 + 4 = 7 observations.

Since Q1 is around observation 4.25, it falls in the third interval.

The key distinction: you add frequencies to count observations. You do not add the interval frequencies to the actual data values to calculate Q1.

