<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Ship Race 3D — PBR</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#070b12;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#eaf2ff;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
  }
  canvas{display:block;position:fixed;inset:0}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .screen{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    pointer-events:none;padding:16px;
  }
  .screen.active{display:flex;pointer-events:auto}

  .panel{
    pointer-events:auto;
    background:linear-gradient(160deg,rgba(18,26,40,.94),rgba(10,15,24,.96));
    border:1px solid rgba(120,170,255,.22);
    border-radius:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:22px;
    width:min(560px,94vw);
    max-height:88vh;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:#3d5675 transparent;
  }
  .panel::-webkit-scrollbar{width:7px}
  .panel::-webkit-scrollbar-thumb{background:#3d5675;border-radius:4px}

  h1{font-size:clamp(26px,6vw,42px);letter-spacing:2px;text-align:center;
     background:linear-gradient(180deg,#ffe9a8,#f0a92e);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 4px 24px rgba(240,169,46,.25);font-weight:900}
  h2{font-size:19px;letter-spacing:1px;margin-bottom:12px;color:#cfe2ff}
  .sub{text-align:center;color:#8fa7c6;font-size:13px;margin-top:6px;letter-spacing:.5px}

  .btn{
    pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,#2a3a52,#182233);
    border:1px solid #3d5675;border-radius:13px;
    padding:13px 18px;color:#eaf2ff;font-weight:700;font-size:15px;
    cursor:pointer;transition:transform .12s ease, background .15s ease, box-shadow .15s;
    font-family:inherit;width:100%;letter-spacing:.4px;
  }
  .btn:hover:not(:disabled){background:linear-gradient(180deg,#35496a,#22304a);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .btn:active:not(:disabled){transform:translateY(0) scale(.985)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.primary{
    background:linear-gradient(180deg,#ffcf5c,#e09400);
    border-color:#ffe6a8;color:#2a1a00;
    box-shadow:0 8px 26px rgba(224,148,0,.35);
  }
  .btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#ffdb85,#f0a413)}
  .btn.small{padding:9px 14px;font-size:13px;width:auto}

  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}

  .resbar{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    margin-bottom:16px;
  }
  .res{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.055);border:1px solid rgba(140,180,255,.16);
    padding:7px 13px;border-radius:11px;font-weight:800;font-size:14px;
    min-width:74px;justify-content:center;
  }
  .res .ico{font-size:16px}

  .card{
    display:flex;gap:12px;align-items:center;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(140,180,255,.14);
    border-radius:14px;padding:12px;
    transition:.15s;
  }
  .card:hover{background:rgba(255,255,255,.075)}
  .card.locked{opacity:.45}
  .card.done{border-color:rgba(120,255,170,.4);background:rgba(60,200,120,.10)}
  .card .em{font-size:28px;width:42px;text-align:center;flex-shrink:0}
  .card .info{flex:1;min-width:0}
  .card .nm{font-weight:800;font-size:15px;letter-spacing:.3px}
  .card .ds{font-size:12px;color:#93aac9;margin-top:3px;line-height:1.35}
  .cost{font-size:12px;color:#ffd98a;margin-top:4px;font-weight:700;letter-spacing:.3px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:430px){.grid2{grid-template-columns:1fr}}

  /* HUD */
  #hud{position:absolute;inset:0;display:none;pointer-events:none;padding:14px}
  #hud.active{display:block}
  #hudTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  #hearts{font-size:24px;letter-spacing:3px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #matHud{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .matPill{
    display:flex;align-items:center;gap:6px;background:rgba(6,10,18,.6);
    border:1px solid rgba(140,180,255,.2);border-radius:20px;padding:4px 12px;
    font-weight:800;font-size:13px;backdrop-filter:blur(6px);
  }
  #progWrap{
    position:absolute;left:50%;transform:translateX(-50%);top:18px;
    width:min(340px,46vw);
  }
  #progBar{
    height:11px;border-radius:8px;background:rgba(6,10,18,.65);
    border:1px solid rgba(140,180,255,.25);overflow:hidden;
  }
  #progFill{
    height:100%;width:0%;border-radius:8px;
    background:linear-gradient(90deg,#3ddc97,#ffd166,#ff6b6b);
    transition:width .1s linear;
  }
  #distLbl{text-align:center;font-size:11px;color:#a9c1de;margin-top:4px;letter-spacing:1px;font-weight:700}

  #flash{position:fixed;inset:0;background:#ff2b2b;opacity:0;pointer-events:none;z-index:5;transition:opacity .12s}

  #hint{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    font-size:12px;color:#9fb6d4;letter-spacing:.6px;text-align:center;
    background:rgba(6,10,18,.5);padding:7px 16px;border-radius:20px;
    border:1px solid rgba(140,180,255,.15);pointer-events:none;
    transition:opacity .5s;white-space:nowrap;
  }
  .hidden{display:none !important}
  .fade{opacity:0 !important}

  .titleRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .backBtn{background:rgba(255,255,255,.07);border:1px solid rgba(140,180,255,.2);border-radius:10px;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:#dbe8ff;flex-shrink:0}
  .backBtn:hover{background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="ui">
  <!-- ============ MAIN MENU ============ -->
  <div class="screen active" id="scr-menu">
    <div class="panel">
      <h1>SHIP RACE 3D</h1>
      <div class="sub">RUN · GATHER · BUILD · SAIL</div>
      <div class="resbar" id="resMenu" style="margin-top:18px"></div>
      <div class="stack">
        <button class="btn primary" id="btnRun">▶  SAIL THE COURSE</button>
        <div class="grid2">
          <button class="btn" id="btnIslands">🏝️  ISLANDS</button>
          <button class="btn" id="btnShip">🔨  SHIPYARD</button>
        </div>
        <button class="btn" id="btnTools">🛠️  TOOL SHOP</button>
      </div>
      <div class="sub" style="margin-top:16px;font-size:11px;line-height:1.6">
        <b>A / D</b> or <b>← →</b> switch lane &nbsp;·&nbsp; <b>SPACE / W</b> jump &nbsp;·&nbsp; <b>S / SHIFT</b> slide<br>
        On mobile: <b>swipe</b> to move, jump and slide
      </div>
    </div>
  </div>

  <!-- ============ ISLANDS ============ -->
  <div class="screen" id="scr-islands">
    <div class="panel">
      <div class="titleRow">
        <div class="backBtn" data-back>←</div>
        <h2 style="margin:0;flex:1">CHOOSE AN ISLAND</h2>
      </div>
      <div class="resbar" id="resIslands"></div>
      <div class="stack" id="islandList"></div>
    </div>
  </div>

  <!-- ============ SHIPYARD ============ -->
  <div class="screen" id="scr-ship">
    <div class="panel">
      <div class="titleRow">
        <div class="backBtn" data-back>←</div>
        <h2 style="margin:0;flex:1">SHIPYARD</h2>
      </div>
      <div class="resbar" id="resShip"></div>
      <div style="font-size:12px;color:#8fa7c6;margin-bottom:12px;text-align:center" id="shipProg"></div>
      <div class="stack" id="partList"></div>
    </div>
  </div>

  <!-- ============ TOOLS ============ -->
  <div class="screen" id="scr-tools">
    <div class="panel">
      <div class="titleRow">
        <div class="backBtn" data-back>←</div>
        <h2 style="margin:0;flex:1">TOOL SHOP</h2>
      </div>
      <div class="resbar" id="resTools"></div>
      <div class="stack" id="toolList"></div>
    </div>
  </div>

  <!-- ============ RESULTS ============ -->
  <div class="screen" id="scr-result">
    <div class="panel" style="width:min(440px,94vw)">
      <h1 id="resTitle" style="font-size:30px">COURSE CLEAR!</h1>
      <div class="sub" id="resSub">Materials secured</div>
      <div class="resbar" id="resRewards" style="margin-top:20px"></div>
      <div class="stack" style="margin-top:8px">
        <button class="btn primary" id="btnAgain">🔁  RUN AGAIN</button>
        <button class="btn" id="btnHarbor">⚓  BACK TO HARBOR</button>
      </div>
    </div>
  </div>

  <!-- ============ HUD ============ -->
  <div id="hud">
    <div id="hudTop">
      <div id="hearts"></div>
      <div id="matHud"></div>
    </div>
    <div id="progWrap">
      <div id="progBar"><div id="progFill"></div></div>
      <div id="distLbl">0 m</div>
    </div>
    <div id="hint">SWIPE or A/D · SPACE to jump · S to slide</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ==========================================================================
   1. DATA
   ========================================================================== */
const LANE_X = [-2.25, 0, 2.25];
const TILE_LEN = 20;
const TILE_COUNT = 13;
const GRAVITY = -32;
const JUMP_V = 11.5;

const ISLANDS = [
  {
    id: 0, name: 'Starter Cove', emoji: '🏝️',
    desc: 'Calm shores. Plenty of timber washed up on the sand.',
    skyTop: 0x2f6fd0, skyMid: 0x9fd0ff, skyBot: 0xffe6bd,
    fog: 0xbfe0ff, ground: 0x74c25c, groundDark: 0x4a8f3f,
    propA: 0x3e8a34, propB: 0x2f6b2a, rock: 0x8a8f96,
    length: 330, speed: 13.0, density: 0.85,
    yield: { wood: 0.62, metal: 0.18, cloth: 0.20 },
    req: []
  },
  {
    id: 1, name: 'Jungle Isle', emoji: '🌴',
    desc: 'Dense canopy. Vines and fibre everywhere — watch the totems.',
    skyTop: 0x1f5fa8, skyMid: 0x86c9b0, skyBot: 0xd9f0c0,
    fog: 0xa9d6c0, ground: 0x4fa84a, groundDark: 0x2f7330,
    propA: 0x2f8a3a, propB: 0x1f5c26, rock: 0x7a8a72,
    length: 380, speed: 14.2, density: 1.0,
    yield: { wood: 0.40, metal: 0.20, cloth: 0.40 },
    req: ['hull', 'mast']
  },
  {
    id: 2, name: 'Volcano Isle', emoji: '🌋',
    desc: 'Black sand and ore veins. The air burns — run fast.',
    skyTop: 0x3a1c3a, skyMid: 0xb14a3a, skyBot: 0xffb066,
    fog: 0xc4744e, ground: 0x4a3f3a, groundDark: 0x2c2522,
    propA: 0x5c3a2e, propB: 0x3a221a, rock: 0x4a4a52,
    length: 420, speed: 15.4, density: 1.15,
    yield: { wood: 0.18, metal: 0.64, cloth: 0.18 },
    req: ['sail', 'rudder']
  },
  {
    id: 3, name: 'Frost Isle', emoji: '🏔️',
    desc: 'Glacial peaks. Rich in everything, if you can survive it.',
    skyTop: 0x2a4a7a, skyMid: 0xa8c8e8, skyBot: 0xeaf4ff,
    fog: 0xd6e8f7, ground: 0xd8e8f2, groundDark: 0x9fb8cc,
    propA: 0x7fa8c8, propB: 0x5a7f9e, rock: 0x8fa2b4,
    length: 460, speed: 16.6, density: 1.3,
    yield: { wood: 0.24, metal: 0.36, cloth: 0.40 },
    req: ['anchor', 'figurehead']
  }
];

const TOOLS = {
  axe:     { name: 'Steel Axe',    emoji: '🪓', cost: { wood: 14 },            desc: '+40% Wood gathered on every run.' },
  pickaxe: { name: 'Iron Pickaxe', emoji: '⛏️', cost: { wood: 8, metal: 8 },   desc: '+40% Metal gathered on every run.' },
  loom:    { name: 'Weaver Loom',  emoji: '🧶', cost: { wood: 10, cloth: 12 }, desc: '+40% Cloth gathered on every run.' },
  saw:     { name: 'Sawmill Saw',  emoji: '🪚', cost: { wood: 22, metal: 12 }, desc: '+25% to ALL materials. Stacks with the others.' }
};

const PARTS = {
  hull:       { name: 'Hull',        emoji: '🛶', cost: { wood: 26, metal: 6 },  desc: 'The body of your vessel.' },
  mast:       { name: 'Mast',        emoji: '🎋', cost: { wood: 18, metal: 5 },  desc: 'Holds the sail high.' },
  sail:       { name: 'Sail',        emoji: '⛵', cost: { cloth: 22, wood: 8 },  desc: 'Catches the wind.' },
  rudder:     { name: 'Rudder',      emoji: '🪝', cost: { wood: 12, metal: 12 }, desc: 'Steers through rough seas.' },
  anchor:     { name: 'Anchor',      emoji: '⚓', cost: { metal: 24, wood: 8 },  desc: 'Holds fast in any harbour.' },
  figurehead: { name: 'Figurehead',  emoji: '🐉', cost: { wood: 14, cloth: 12 }, desc: 'For luck on the long voyage.' }
};

const PART_ORDER = ['hull', 'mast', 'sail', 'rudder', 'anchor', 'figurehead'];

const MAT_META = {
  wood:  { emoji: '🪵', label: 'Wood',  color: 0x9c6b3c },
  metal: { emoji: '⚙️', label: 'Metal', color: 0xb8c2cc },
  cloth: { emoji: '🧵', label: 'Cloth', color: 0xe8dcc0 }
};

/* ==========================================================================
   2. SAVE
   ========================================================================== */
const SAVE_KEY = 'shiprace3d_pbr_v1';
function defaultSave() {
  return {
    wood: 0, metal: 0, cloth: 0,
    tools: { axe: false, pickaxe: false, loom: false, saw: false },
    parts: { hull: false, mast: false, sail: false, rudder: false, anchor: false, figurehead: false },
    island: 0,
    runs: 0
  };
}
function loadSave() {
  const d = defaultSave();
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    d.wood = raw.wood | 0; d.metal = raw.metal | 0; d.cloth = raw.cloth | 0;
    d.island = raw.island | 0; d.runs = raw.runs | 0;
    if (raw.tools) Object.assign(d.tools, raw.tools);
    if (raw.parts) Object.assign(d.parts, raw.parts);
  } catch (e) { /* ignore */ }
  return d;
}
let save = loadSave();
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

function islandUnlocked(i) {
  return ISLANDS[i].req.every(p => save.parts[p]);
}
function multipliers() {
  const m = { wood: 1, metal: 1, cloth: 1 };
  if (save.tools.axe) m.wood += 0.40;
  if (save.tools.pickaxe) m.metal += 0.40;
  if (save.tools.loom) m.cloth += 0.40;
  if (save.tools.saw) { m.wood += 0.25; m.metal += 0.25; m.cloth += 0.25; }
  return m;
}

/* ==========================================================================
   3. PROCEDURAL TEXTURES  (PBR maps)
   ========================================================================== */
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  const rep = opts.repeat || [1, 1];
  t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 8;
  t.colorSpace = opts.srgb === false ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  return t;
}

function makeNoise(size, base, amp, srgb) {
  return canvasTex(size, size, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      const v = Math.max(0, Math.min(255, (base + (Math.random() - 0.5) * amp) * 255));
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }, { srgb: srgb === true, repeat: [1, 1] });
}

/* --- wood planks --- */
const woodColor = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#8a5a33'; ctx.fillRect(0, 0, w, h);
  for (let p = 0; p < 8; p++) {
    const y0 = p * (h / 8);
    const shade = 20 + Math.random() * 45;
    ctx.fillStyle = `rgba(${90 + shade},${58 + shade * 0.6},${30 + shade * 0.4},0.30)`;
    ctx.fillRect(0, y0, w, h / 8);
    for (let i = 0; i < 26; i++) {
      const y = y0 + Math.random() * (h / 8);
      ctx.strokeStyle = `rgba(${45 + Math.random() * 45 | 0},${26 + Math.random() * 30 | 0},${10 + Math.random() * 20 | 0},${0.12 + Math.random() * 0.32})`;
      ctx.lineWidth = 0.6 + Math.random() * 2.6;
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= w; x += 14) ctx.lineTo(x, y + Math.sin(x * 0.045 + i * 1.7) * 2.6);
      ctx.stroke();
    }
    // plank seam
    ctx.strokeStyle = 'rgba(20,10,4,0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(w, y0); ctx.stroke();
  }
}, { repeat: [1, 1] });

const woodRough = makeNoise(256, 0.80, 0.30, false);
const roughTex = makeNoise(256, 0.55, 0.30, false);
const metalRough = makeNoise(256, 0.32, 0.34, false);
const clothRough = makeNoise(256, 0.88, 0.16, false);

/* --- metal scratched --- */
const metalColor = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#9aa4ad'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    ctx.strokeStyle = `rgba(${140 + Math.random() * 90 | 0},${150 + Math.random() * 90 | 0},${160 + Math.random() * 90 | 0},${Math.random() * 0.25})`;
    ctx.lineWidth = Math.random() * 1.6;
    const x = Math.random() * w, y = Math.random() * h, a = Math.random() * Math.PI;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * 30, y + Math.sin(a) * 30); ctx.stroke();
  }
}, { repeat: [2, 2] });

/* --- cloth weave --- */
const clothColor = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#efe6d2'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(190,178,152,0.45)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < w; i += 6) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
  }
}, { repeat: [3, 3] });

/* --- ground --- */
function makeGroundTex(base, dark) {
  const c = '#' + new THREE.Color(base).getHexString();
  const d = '#' + new THREE.Color(dark).getHexString();
  return canvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = c; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 4200; i++) {
      ctx.fillStyle = Math.random() < 0.5 ? d : c;
      const s = 1 + Math.random() * 3.4;
      ctx.globalAlpha = 0.10 + Math.random() * 0.30;
      ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
    }
    ctx.globalAlpha = 1;
  }, { repeat: [3, 3] });
}

/* --- water normal map --- */
const waterNormal = canvasTex(256, 256, (ctx, w, h) => {
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    img.data[i * 4] = 128 + (Math.random() - 0.5) * 70;
    img.data[i * 4 + 1] = 128 + (Math.random() - 0.5) * 70;
    img.data[i * 4 + 2] = 255;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}, { srgb: false, repeat: [26, 26] });

/* ==========================================================================
   4. RENDERER / SCENE / SKY / LIGHTS
   ========================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe0ff, 70, 190);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 4, 10);

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envRT = null;

/* --- sky shader --- */
function skyMaterial() {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x2f6fd0) },
      midColor: { value: new THREE.Color(0x9fd0ff) },
      botColor: { value: new THREE.Color(0xffe6bd) },
      sunDir:   { value: new THREE.Vector3(0.42, 0.55, 0.72).normalize() },
      sunColor: { value: new THREE.Color(0xfff2cf) }
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 topColor, midColor, botColor, sunColor, sunDir;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = mix(botColor, midColor, smoothstep(-0.18, 0.22, h));
        col = mix(col, topColor, smoothstep(0.10, 0.80, h));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += sunColor * pow(s, 220.0) * 6.0;
        col += sunColor * pow(s, 14.0) * 0.30;
        col += sunColor * pow(s, 3.0) * 0.06;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
}

function setEnvironment(isl) {
  skyMat.uniforms.topColor.value.setHex(isl.skyTop);
  skyMat.uniforms.midColor.value.setHex(isl.skyMid);
  skyMat.uniforms.botColor.value.setHex(isl.skyBot);
  envSkyMat.uniforms.topColor.value.setHex(isl.skyTop);
  envSkyMat.uniforms.midColor.value.setHex(isl.skyMid);
  envSkyMat.uniforms.botColor.value.setHex(isl.skyBot);
  scene.fog.color.setHex(isl.fog);

  const dir = new THREE.Vector3(0.42, 0.55, 0.72).normalize();
  skyMat.uniforms.sunDir.value.copy(dir);
  envSkyMat.uniforms.sunDir.value.copy(dir);
  envSun.position.copy(dir).multiplyScalar(42);

  sun.position.set(dir.x * 34, dir.y * 34, dir.z * 34);
  sun.color.setHex(isl.id === 2 ? 0xffc090 : (isl.id === 3 ? 0xe8f0ff : 0xfff0d0));
  sun.intensity = isl.id === 2 ? 2.2 : 2.7;

  hemi.color.setHex(isl.skyMid);
  hemi.groundColor.setHex(isl.groundDark);
  hemi.intensity = isl.id === 2 ? 0.55 : 0.85;

  if (envRT) envRT.dispose();
  envRT = pmrem.fromScene(envScene, 0.03, 1, 200);
  scene.environment = envRT.texture;
  scene.environmentIntensity = 1.0;
}

const harbor = { water: null, ship: null, parts: {}, built: {} };

(function buildHarbor() {
  // --- water ---
  const waterMat = new THREE.MeshStandardMaterial({

  harbor.water = water;

  // --- underwater dark plane ---
  const deep = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 600),
    new THREE.MeshStandardMaterial({ color: 0x06283d, roughness: 0.9, metalness: 0 })
  );
  deep.rotation.x = -Math.PI / 2;

  harborGroup.add(deep);

  // --- dock ---
  const dock = new THREE.Group();

  for (let i = 0; i < 5; i++) {
    const pile = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 5.5, 10), M.woodDark);
    pile.position.set(-6.4 + (i % 2 ? 1.5 : -1.5), -2.0, -7 + i * 3.5);
    pile.castShadow = true; pile.receiveShadow = true;
    dock.add(pile);
  }
  // plank seams
  for (let i = 0; i < 9; i++) {
    const seam = new THREE.Mesh(new THREE.BoxGeometry(3.62, 0.06, 0.09), M.woodDark);
    seam.position.set(-6.4, 0.73, -7.2 + i * 1.8);
    dock.add(seam);
  }
  harborGroup.add(dock);

  // --- mooring posts ---
  for (let i = 0; i < 3; i++) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 2.2, 10), M.woodDark);
    p.position.set(-4.4, 0.6, -5 + i * 5);
    p.castShadow = true;
    harborGroup.add(p);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 8), M.metalDark);
    cap.position.set(-4.4, 1.72, -5 + i * 5);
    cap.castShadow = true;
    harborGroup.add(cap);
  }

  // --- decorative rocks ---
  const rockGeo = new THREE.IcosahedronGeometry(1, 0);
  for (let i = 0; i < 14; i++) {
    const r = new THREE.Mesh(rockGeo, M.rock);
    const a = Math.random() * Math.PI * 2;
    const d = 14 + Math.random() * 40;
    r.position.set(Math.cos(a) * d, -0.2 + Math.random() * 0.6, Math.sin(a) * d - 10);
    const s = 0.6 + Math.random() * 2.4;
    r.scale.set(s, s * (0.6 + Math.random() * 0.6), s);
    r.rotation.set(Math.random(), Math.random(), Math.random());
    r.castShadow = true; r.receiveShadow = true;
    harborGroup.add(r);
  }

  // ============ SHIP ============
  const ship = new THREE.Group();
  ship.position.set(0, 0.15, 0);

  // Hull profile
  const shape = new THREE.Shape();
  shape.moveTo(-4.0, -1.55);
  shape.lineTo(1.9, -1.55);
  shape.quadraticCurveTo(4.5, -1.35, 4.6, 0);
  shape.quadraticCurveTo(4.5, 1.35, 1.9, 1.55);
  shape.lineTo(-4.0, 1.55);
  shape.quadraticCurveTo(-4.95, 0, -4.0, -1.55);

  const hullGeo = new THREE.ExtrudeGeometry(shape, {
    depth: 2.3, bevelEnabled: true, bevelSize: 0.16,
    bevelThickness: 0.16, bevelSegments: 3, curveSegments: 18
  });
  hullGeo.rotateX(-Math.PI / 2);
  hullGeo.computeVertexNormals();

  const hullMesh = new THREE.Mesh(hullGeo, M.woodDark);
  hullMesh.castShadow = true; hullMesh.receiveShadow = true;
  ship.add(hullMesh);

  // Deck
  const deckGeo = new THREE.BoxGeometry(8.0, 0.16, 2.7);
  const deckMesh = new THREE.Mesh(deckGeo, M.wood);
  deckMesh.position.set(-0.4, 2.32, 0);
  deckMesh.castShadow = true; deckMesh.receiveShadow = true;
  ship.add(deckMesh);

  // Rails
  for (const side of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.22, 0.16), M.wood);
    rail.position.set(-0.4, 2.7, side * 1.32);
    rail.castShadow = true;
    ship.add(rail);
    for (let i = 0; i < 7; i++) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 6), M.wood);
      post.position.set(-3.8 + i * 1.15, 2.55, side * 1.32);
      ship.add(post);
    }
  }

  harbor.ship = ship;
  harborGroup.add(ship);

  // ---------- PART BUILDERS ----------
  const builders = {
    hull: () => {
      const g = new THREE.Group();
      const band = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.11, 8, 40), M.metalDark);
      band.rotation.y = Math.PI / 2;
      band.scale.set(1, 1, 1);
      band.position.set(0.4, 1.5, 0);
      band.rotation.z = Math.PI / 2;
      // simpler: a metal stripe around the hull using a thin extruded shape
      g.add(band);
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.28, 3.3), M.metalDark);
      stripe.position.set(-0.1, 1.35, 0);
      stripe.castShadow = true;
      g.add(stripe);
      return g;
    },
    mast: () => {
      const g = new THREE.Group();
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 9.5, 12), M.wood);
      mast.position.set(-0.4, 2.4 + 4.75, 0);
      mast.castShadow = true;
      g.add(mast);
      const top = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), M.gold);
      top.position.set(-0.4, 2.4 + 9.6, 0);
      top.castShadow = true;
      g.add(top);
      // crow's nest
      const nest = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.6, 0.5, 14, 1, true), M.wood);
      nest.position.set(-0.4, 2.4 + 7.2, 0);
      nest.castShadow = true;
      g.add(nest);
      // spar
      const spar = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 6.4, 10), M.wood);
      spar.rotation.x = Math.PI / 2;
      spar.position.set(-0.4, 2.4 + 8.4, 0);
      spar.castShadow = true;
      g.add(spar);
      const spar2 = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 5.0, 10), M.wood);
      spar2.rotation.x = Math.PI / 2;
      spar2.position.set(-0.4, 2.4 + 5.6, 0);
      spar2.castShadow = true;
      g.add(spar2);
      return g;
    },
    sail: () => {
      const g = new THREE.Group();
      const mkSail = (w, h, bulge) => {
        const geo = new THREE.PlaneGeometry(w, h, 16, 16);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i), y = pos.getY(i);
          const u = (x / w) + 0.5;
          const v = (y / h) + 0.5;
          pos.setZ(i, Math.sin(u * Math.PI) * bulge * (0.55 + v * 0.45));
        }
        geo.computeVertexNormals();
        geo.rotateY(Math.PI / 2);
        return geo;
      };
      const main = new THREE.Mesh(mkSail(6.0, 5.4, 1.0), M.cloth);
      main.material = M.cloth.clone();
      main.material.color.setHex(0xf2ead6);
      main.position.set(-0.4 + 0.9, 2.4 + 5.6, 0);
      main.castShadow = true;
      g.add(main);

      const top = new THREE.Mesh(mkSail(4.6, 3.0, 0.75), M.cloth);
      top.material = M.cloth.clone();
      top.material.color.setHex(0xd9534f);
      top.position.set(-0.4 + 0.72, 2.4 + 9.3, 0);
      top.castShadow = true;
      g.add(top);
      return g;
    },
    rudder: () => {
      const g = new THREE.Group();
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.9, 1.25), M.woodDark);
      blade.position.set(-4.6, 0.4, 0);
      blade.rotation.z = 0.08;
      blade.castShadow = true;
      g.add(blade);
      const tiller = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.4, 8), M.wood);
      tiller.rotation.z = Math.PI / 2;
      tiller.position.set(-3.3, 2.55, 0);
      tiller.castShadow = true;
      g.add(tiller);
      const hinge1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.34, 8), M.metalDark);
      hinge1.position.set(-4.4, 1.5, 0);
      g.add(hinge1);
      const hinge2 = hinge1.clone();
      hinge2.position.y = 0.2;
      g.add(hinge2);
      return g;
    },
    anchor: () => {
      const g = new THREE.Group();
      const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 1.9, 10), M.metalDark);
      shank.position.set(4.9, 1.5, 0);
      shank.castShadow = true;
      g.add(shank);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.07, 8, 20), M.metalDark);
      ring.position.set(4.9, 2.55, 0);
      ring.rotation.y = Math.PI / 2;
      ring.castShadow = true;
      g.add(ring);
      const stock = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.5, 8), M.metalDark);
      stock.rotation.x = Math.PI / 2;
      stock.position.set(4.9, 2.2, 0);
      g.add(stock);
      const flukeGeo = new THREE.TorusGeometry(0.72, 0.1, 8, 20, Math.PI);
      for (const s of [-1, 1]) {
        const fluke = new THREE.Mesh(flukeGeo, M.metalDark);
        fluke.position.set(4.9, 0.6, s * 0.7);
        fluke.rotation.set(Math.PI / 2, 0, s > 0 ? 0 : Math.PI);
        fluke.castShadow = true;
        g.add(fluke);
      }
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.4, 8), M.metalDark);
      tip.position.set(4.9, 0.35, 0);
      tip.rotation.z = Math.PI;
      g.add(tip);
      return g;
    },
    figurehead: () => {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.5, 12), M.wood);
      body.position.set(5.0, 3.3, 0);
      body.rotation.z = -1.15;
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.30, 14, 12), M.gold);
      head.position.set(5.7, 4.0, 0);
      head.castShadow = true;
      g.add(head);
      const mane = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.09, 8, 18), M.woodRed);
      mane.position.set(5.55, 4.05, 0);
      mane.rotation.y = Math.PI / 2;
      mane.rotation.x = 0.4;
      g.add(mane);
      const eyeGeo = new THREE.SphereGeometry(0.06, 8, 6);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.4 });
      for (const s of [-1, 1]) {
        const e = new THREE.Mesh(eyeGeo, eyeMat);
        e.position.set(5.95, 4.08, s * 0.16);
        g.add(e);
      }
      return g;
    }
  };

  for (const key of PART_ORDER) {
    const grp = builders[key]();
    grp.visible = false;
    grp.userData.pop = 0;
    grp.userData.key = key;
    harbor.parts[key] = grp;
    ship.add(grp);
  }

  // Sync with save
  syncShipVisual();
})();

function syncShipVisual() {
  for (const key of PART_ORDER) {
    const g = harbor.parts[key];
    if (!g) continue;
    const shouldShow = !!save.parts[key];
    if (shouldShow && !g.visible) {
      g.visible = true;
      g.userData.pop = 0.0001;
      g.scale.setScalar(0.001);
    } else if (!shouldShow && g.visible) {
      g.visible = false;
    }
  }
}

function makeGroundMaterial(isl) {
  const tex = makeGroundTex(isl.ground, isl.groundDark);
  tex.repeat.set(3, 3);
  return new THREE.MeshStandardMaterial({
    map: tex, roughnessMap: roughTex, roughness: 0.96, metalness: 0.0,
    envMapIntensity: 0.45
  });
}

class Tile {
  constructor() {
    this.group = new THREE.Group();
    this.obstacles = [];
    this.pickups = [];
    this.z = 0;

    const ground = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.7, TILE_LEN), groundMat);
    ground.position.set(0, -0.35, -TILE_LEN / 2);
    ground.receiveShadow = true;
    this.group.add(ground);
    this.ground = ground;

    for (const s of [-1, 1]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.9, TILE_LEN), railMat);
      rail.position.set(s * 4.95, 0.10, -TILE_LEN / 2);
      rail.castShadow = true;
      rail.receiveShadow = true;
      this.group.add(rail);
      this['rail' + (s < 0 ? 'L' : 'R')] = rail;

      // posts
      for (let i = 0; i < 4; i++) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.05, 0.22), M.woodDark);
        post.position.set(s * 4.95, 0.35, -2.5 - i * 5);
        post.castShadow = true;
        this.group.add(post);
      }
    }

    // scenery slots
    this.decor = [];
    for (let i = 0; i < 3; i++) {
      const d = new THREE.Group();
      d.visible = false;
      this.group.add(d);
      this.decor.push(d);
    }
  }

  place(z, isl) {
    this.z = z;
    this.group.position.z = z;
    this.regenerate(isl);
  }

  regenerate(isl) {
    // clear dynamic
    for (const o of this.obstacles) this.group.remove(o);
    for (const p of this.pickups) this.group.remove(p);
    this.obstacles.length = 0;
    this.pickups.length = 0;

    // decor
    for (const d of this.decor) { d.visible = false; while (d.children.length) d.remove(d.children[0]); }
    if (Math.random() < 0.75) this._decor(isl);

    if (!run) return;
    const dist = -this.z;
    if (dist < 34 || dist > run.courseLen - 22) return;

    const diff = isl.density;
    const slots = [-5.5, -11, -16].sort(() => Math.random() - 0.5);
    const n = Math.random() < 0.34 * diff ? 2 : 1;
    for (let i = 0; i < n; i++) {
      this._obstacle(slots[i], isl);
    }
    this._pickups(isl);
  }

  _decor(isl) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const count = 1 + (Math.random() < 0.5 ? 1 : 0);
    for (let i = 0; i < count; i++) {
      const d = this.decor[i];
      const z = -3 - Math.random() * (TILE_LEN - 6);
      const x = side * (6.5 + Math.random() * 7);
      if (isl.id === 3) {
        // ice spire
        const h = 3 + Math.random() * 6;
        const cone = new THREE.Mesh(new THREE.ConeGeometry(1.1 + Math.random(), h, 5), M.rock);
        cone.position.set(x, h / 2 - 0.4, z);
        cone.rotation.y = Math.random() * 3;
        cone.castShadow = true; cone.receiveShadow = true;
        d.add(cone);
      } else {
        // tree
        const th = 2 + Math.random() * 2.4;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, th, 7), M.trunk);
        trunk.position.set(x, th / 2 - 0.3, z);
        trunk.castShadow = true;
        d.add(trunk);

        const leafMat = M.leaf.clone();
        leafMat.color.setHex(Math.random() < 0.5 ? isl.propA : isl.propB);
        const layers = 2 + (Math.random() < 0.5 ? 1 : 0);
        for (let L = 0; L < layers; L++) {
          const r = 1.6 - L * 0.42;
          const cone = new THREE.Mesh(new THREE.ConeGeometry(r, 1.7, 7), leafMat);
          cone.position.set(x, th - 0.3 + L * 0.85, z);
          cone.rotation.y = Math.random() * 3;
          cone.castShadow = true;
          d.add(cone);
        }
      }
      // rock
      if (Math.random() < 0.6) {
        const rk = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + Math.random() * 0.8, 0), M.rock);
        rk.position.set(x + (Math.random() - 0.5) * 3, 0.15, z + (Math.random() - 0.5) * 4);
        rk.rotation.set(Math.random(), Math.random(), Math.random());
        rk.castShadow = true; rk.receiveShadow = true;
        d.add(rk);
      }
      d.visible = true;
    }
  }

  _obstacle(localZ, isl) {
    const lane = Math.floor(Math.random() * 3);
    const r = Math.random();
    let type;
    if (r < 0.30) type = 'hurdle';
    else if (r < 0.58) type = 'lowbar';
    else if (r < 0.86) type = 'block';
    else type = 'double';

    const g = new THREE.Group();
    let collider;

    if (type === 'hurdle') {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.26, 0.28), M.woodRed);
      bar.position.y = 0.86; bar.castShadow = true; g.add(bar);
      const bar2 = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.20, 0.28), M.woodRed);
      bar2.position.y = 0.34; bar2.castShadow = true; g.add(bar2);
      for (const s of [-1, 1]) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 1.0, 8), M.metal);
        post.position.set(s * 1.1, 0.5, 0);
        post.castShadow = true; g.add(post);
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), M.gold);
        cap.position.set(s * 1.1, 1.03, 0);
        cap.castShadow = true; g.add(cap);
      }
      collider = { hx: 1.18, hy: 0.55, hz: 0.22, cy: 0.55 };
    }
    else if (type === 'lowbar') {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.55, 0.36), M.cloth);
      bar.position.y = 1.52; bar.castShadow = true; g.add(bar);
      const trim = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.09, 0.42), M.metalDark);
      trim.position.y = 1.20; trim.castShadow = true; g.add(trim);
      const trim2 = trim.clone(); trim2.position.y = 1.84; g.add(trim2);
      for (const s of [-1, 1]) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.12, 1.9, 8), M.woodDark);
        post.position.set(s * 1.12, 0.95, 0);
        post.castShadow = true; g.add(post);
      }
      collider = { hx: 1.18, hy: 0.42, hz: 0.26, cy: 1.52 };
    }
    else if (type === 'block') {
      const box = new THREE.Mesh(new THREE.BoxGeometry(2.35, 2.6, 0.7), M.woodDark);
      box.position.y = 1.3; box.castShadow = true; box.receiveShadow = true; g.add(box);
      for (let i = 0; i < 4; i++) {
        const stud = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), M.metal);
        stud.position.set(-0.85 + i * 0.57, 2.45, 0.36);
        g.add(stud);
      }
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.34, 0.74), M.woodRed);
      stripe.position.y = 2.2; stripe.castShadow = true; g.add(stripe);
      collider = { hx: 1.18, hy: 1.3, hz: 0.36, cy: 1.3 };
    }
    else { // double block spanning two lanes
      const lanes = Math.random() < 0.5 ? [0, 1] : [1, 2];
      const cx = (LANE_X[lanes[0]] + LANE_X[lanes[1]]) / 2;
      const box = new THREE.Mesh(new THREE.BoxGeometry(4.6, 2.6, 0.7), M.woodDark);
      box.position.set(cx, 1.3, 0); box.castShadow = true; box.receiveShadow = true; g.add(box);
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(4.65, 0.34, 0.74), M.woodRed);
      stripe.position.set(cx, 2.2, 0); stripe.castShadow = true; g.add(stripe);
      for (let i = 0; i < 6; i++) {
        const stud = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), M.metal);
        stud.position.set(cx - 1.8 + i * 0.72, 2.45, 0.36);
        g.add(stud);
      }
      g.position.x = 0;
      g.position.z = localZ;
      g.userData.collider = { hx: 2.35, hy: 1.3, hz: 0.36, cy: 1.3, ox: cx };
      this.group.add(g);
      this.obstacles.push(g);
      return;
    }

    g.position.set(LANE_X[lane], 0, localZ);
    g.userData.collider = collider;
    this.group.add(g);
    this.obstacles.push(g);
  }

  _pickups(isl) {
    const n = 1 + Math.floor(Math.random() * 3);
    for (let k = 0; k < n; k++) {
      const lane = Math.floor(Math.random() * 3);
      const startZ = -2.5 - Math.random() * 12;
      const count = 3 + Math.floor(Math.random() * 3);
      const type = pickType(isl);
      for (let i = 0; i < count; i++) {
        const p = makePickup(type);
        p.position.set(LANE_X[lane], 1.05, startZ - i * 1.5);
        p.userData.type = type;
        p.userData.collected = false;
        p.userData.spin = Math.random() * Math.PI * 2;
        this.group.add(p);
        this.pickups.push(p);
      }
    }
  }
}

function pickType(isl) {
  const y = isl.yield;
  const r = Math.random();
  if (r < y.wood) return 'wood';
  if (r < y.wood + y.metal) return 'metal';
  return 'cloth';
}

const pickupGeos = {
  wood: () => {
    const g = new THREE.Group();
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.62, 10), M.glowWood);
    log.rotation.z = Math.PI / 2;
    log.castShadow = true;
    g.add(log);
    for (const s of [-1, 1]) {
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.04, 10), M.wood);
      cap.rotation.z = Math.PI / 2;
      cap.position.x = s * 0.32;
      g.add(cap);
    }
    return g;
  },
  metal: () => {
    const g = new THREE.Group();
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28, 0), M.glowMetal);
    core.castShadow = true;
    g.add(core);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.045, 8, 20), M.metalDark);
    ring.rotation.x = Math.PI / 2;
    ring.castShadow = true;
    g.add(ring);
    return g;
  },
  cloth: () => {
    const g = new THREE.Group();
    const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.52, 12), M.glowCloth);
    roll.rotation.x = Math.PI / 2;
    roll.castShadow = true;
    g.add(roll);
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.23, 0.035, 8, 16), M.woodRed);
    band.rotation.y = Math.PI / 2;
    band.position.y = 0.05;
    g.add(band);
    return g;
  }
};

const pickupCache = {};
function makePickup(type) {
  if (!pickupCache[type]) pickupCache[type] = pickupGeos[type]();
  const g = pickupCache[type].clone(true);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

/* ==========================================================================
   10. RUN STATE
   ========================================================================== */
let run = null;

function createRunState(isl) {
  return {
    island: isl,
    hp: 3, maxHp: 3,
    speed: isl.speed * 0.75,
    baseSpeed: isl.speed,
    maxSpeed: isl.speed * 1.65,
    lane: 1,
    y: 0, vy: 0, air: false,
    sliding: false, slideT: 0,
    invuln: 0, slowT: 0, shake: 0,
    distance: 0, finished: false, dead: false,
    courseLen: isl.length,
    collected: { wood: 0, metal: 0, cloth: 0 },
    runTime: 0,
    animPhase: 0
  };
}

function clearTiles() {
  for (const t of tiles) {
    runGroup.remove(t.group);
  }
  tiles.length = 0;
}

function buildTiles(isl) {
  clearTiles();
  groundMat = makeGroundMaterial(isl);
  railMat = new THREE.MeshStandardMaterial({
    map: woodColor, roughnessMap: woodRough, color: 0xa87a4a,
    roughness: 0.86, metalness: 0.03, envMapIntensity: 0.6
  });

  for (let i = 0; i < TILE_COUNT; i++) {
    const t = new Tile();
    runGroup.add(t.group);
    tiles.push(t);
  }
  for (let i = 0; i < TILE_COUNT; i++) {
    tiles[i].place(-i * TILE_LEN, isl);
  }
}

function recycleTiles() {
  for (const t of tiles) {
    if (t.z - player.position.z > 42) {
      t.place(t.z - TILE_LEN * TILE_COUNT, run.island);
    }
  }
}

    ui[k].classList.toggle('active', k === name);
  }

function toHarbor() {
  mode = 'harbor';
  runGroup.visible = false;
  harborGroup.visible = true;
  scene.fog.near = 30;
  scene.fog.far = 200;
  setEnvironment(ISLANDS[save.island]);

}

function startRun() {
  const isl = ISLANDS[save.island];
  run = createRunState(isl);

  harborGroup.visible = false;
  runGroup.visible = true;
  scene.fog.near = 55;
  scene.fog.far = 175;

  setEnvironment(isl);
  buildTiles(isl);

  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  playerBody.rotation.set(0, 0, 0);
  playerBody.position.set(0, 0, 0);
  playerBody.scale.set(1, 1, 1);

  finishGate.position.set(0, 0, -isl.length);

  camera.fov = 62;
  camera.updateProjectionMatrix();
  camera.position.set(0, 3.2, 7.5);

  mode = 'run';
  showScreen('hud');
  updateHud();
  hintEl.classList.remove('fade');
  setTimeout(() => hintEl.classList.add('fade'), 3800);
}

function endRun(completed) {
  if (!run || run.finished) return;
  run.finished = true;

  const mult = multipliers();
  let gained;
  if (completed) {
    gained = {
      wood: Math.floor(run.collected.wood * mult.wood),
      metal: Math.floor(run.collected.metal * mult.metal),
      cloth: Math.floor(run.collected.cloth * mult.cloth)
    };
  } else {
    gained = {
      wood: Math.floor(run.collected.wood * mult.wood * 0.5),
      metal: Math.floor(run.collected.metal * mult.metal * 0.5),
      cloth: Math.floor(run.collected.cloth * mult.cloth * 0.5)
    };
  }

  save.wood += gained.wood;
  save.metal += gained.metal;
  save.cloth += gained.cloth;
  save.runs++;
  persist();

  // results UI
  document.getElementById('resTitle').textContent = completed ? 'COURSE CLEAR!' : 'WIPEOUT!';
  document.getElementById('resSub').textContent = completed
    ? `You reached the end of ${run.island.name}`
    : `You fell at ${Math.floor(run.distance)}m on ${run.island.name}`;

  const rr = document.getElementById('resRewards');
  rr.innerHTML = '';
  for (const k of ['wood', 'metal', 'cloth']) {
    const d = document.createElement('div');
    d.className = 'res';
    d.innerHTML = `<span class="ico">${MAT_META[k].emoji}</span><span>+${gained[k]}</span>`;
    rr.appendChild(d);
  }

  setTimeout(() => {
    mode = 'harbor';
    runGroup.visible = false;
    harborGroup.visible = true;
    scene.fog.near = 30;
    scene.fog.far = 200;
    setEnvironment(ISLANDS[save.island]);
    syncShipVisual();
    updateResBars();
    showScreen('result');
  }, 700);
}

/* ==========================================================================
   12. UPDATE — RUN
   ========================================================================== */
function updateRun(dt) {
  const st = run;
  st.runTime += dt;

  /* ---- speed ---- */
  const targetSpeed = Math.min(st.maxSpeed, st.baseSpeed + st.distance * 0.014);
  let desired = targetSpeed;
  if (st.slowT > 0) { st.slowT -= dt; desired = targetSpeed * 0.42; }
  st.speed += (desired - st.speed) * (1 - Math.exp(-dt * 4.5));

  /* ---- forward ---- */
  player.position.z -= st.speed * dt;
  st.distance = Math.max(0, -player.position.z);

  /* ---- lane ---- */
  const targetX = LANE_X[st.lane];
  player.position.x += (targetX - player.position.x) * (1 - Math.exp(-dt * 15));

  /* ---- jump ---- */
  if (st.air) {
    st.vy += GRAVITY * dt;
    st.y += st.vy * dt;
    if (st.y <= 0) {
      st.y = 0; st.vy = 0; st.air = false;
      st.sliding = false;
      st.slideT = 0;
    }
  }
  player.position.y = st.y;

  /* ---- slide ---- */
  if (st.sliding) {
    st.slideT -= dt;
    if (st.slideT <= 0) st.sliding = false;
  }

  /* ---- invuln ---- */
  if (st.invuln > 0) st.invuln -= dt;

  /* ---- animation ---- */
  const speedRatio = st.speed / st.baseSpeed;
  const grounded = !st.air;
  if (grounded && !st.sliding) {
    st.animPhase += dt * (7 + speedRatio * 4.5);
    const s = Math.sin(st.animPhase);
    const c = Math.cos(st.animPhase);
    limbs.legL.rotation.x = s * 0.95;
    limbs.legR.rotation.x = -s * 0.95;
    limbs.armL.rotation.x = -s * 0.85;
    limbs.armR.rotation.x = s * 0.85;
    limbs.armL.rotation.z = 0.10 + c * 0.05;
    limbs.armR.rotation.z = -0.10 - c * 0.05;
    playerBody.position.y = Math.abs(s) * 0.055;
    playerBody.rotation.x = 0.05;
    playerBody.rotation.z = 0;
    playerBody.rotation.y = (targetX - player.position.x) * 0.16;
  } else if (st.air) {
    limbs.legL.rotation.x = -0.75;
    limbs.legR.rotation.x = 0.45;
    limbs.armL.rotation.x = -1.5;
    limbs.armR.rotation.x = -1.5;
    playerBody.rotation.x = 0.12;
    playerBody.position.y = 0;
  }

  // slide pose
  const targetSlideRot = st.sliding ? -1.15 : 0;
  const targetSlideY = st.sliding ? 0.34 : 0;
  const targetSlideZ = st.sliding ? 0.28 : 0;
  const k = 1 - Math.exp(-dt * 16);
  playerBody.rotation.x += (targetSlideRot - playerBody.rotation.x) * k;
  playerBody.position.y += (targetSlideY - playerBody.position.y) * k;
  playerBody.position.z += (targetSlideZ - playerBody.position.z) * k;
  if (st.sliding) {
    limbs.legL.rotation.x = 0.5;
    limbs.legR.rotation.x = 0.35;
    limbs.armL.rotation.x = 1.6;
    limbs.armR.rotation.x = 1.5;
  }

  /* ---- invuln blink ---- */
  if (st.invuln > 0) {
    playerBody.visible = Math.floor(st.invuln * 16) % 2 === 0;
  } else {
    playerBody.visible = true;
  }

  /* ---- collisions ---- */
  const pc = playerCollider();
  for (const t of tiles) {
    if (Math.abs(t.z - player.position.z) > 45) continue;

    for (const ob of t.obstacles) {
      const col = ob.userData.collider;
      const ox = ob.position.x + (col.ox || 0);
      const oy = col.cy;
      const oz = t.z + ob.position.z;

      if (st.invuln > 0) continue;
      if (Math.abs(oz - pc.z) > col.hz + pc.hz) continue;
      if (Math.abs(ox - pc.x) > col.hx + pc.hx) continue;
      if (Math.abs(oy - pc.y) > col.hy + pc.hy) continue;

      hitObstacle();
      break;
    }

    for (const p of t.pickups) {
      if (p.userData.collected || !p.visible) continue;
      const pz = t.z + p.position.z;
      if (Math.abs(pz - player.position.z) > 1.4) continue;
      if (Math.abs(p.position.x - player.position.x) > 1.35) continue;
      if (Math.abs(p.position.y - (player.position.y + 0.9)) > 1.6) continue;
      p.userData.collected = true;
      p.visible = false;
      st.collected[p.userData.type]++;
      updateHud();
    }
  }

  /* ---- finish ---- */
  if (st.distance >= st.courseLen) {
    endRun(true);
    return;
  }

  /* ---- death ---- */
  if (st.hp <= 0) {
    endRun(false);
    return;
  }

  /* ---- camera ---- */
  updateRunCamera(dt);

  /* ---- shadows follow ---- */
  sun.position.set(
    player.position.x + 14,
    30,
    player.position.z + 16
  );
  sun.target.position.set(player.position.x, 0, player.position.z - 8);
  sun.target.updateMatrixWorld();

  /* ---- recycle ---- */
  recycleTiles();

  /* ---- pickups spin ---- */
  for (const t of tiles) {
    if (Math.abs(t.z - player.position.z) > 60) continue;
    for (const p of t.pickups) {
      if (!p.visible) continue;
      p.userData.spin += dt * 2.4;
      p.rotation.y = p.userData.spin;
      p.position.y = 1.05 + Math.sin(p.userData.spin * 1.4) * 0.12;
    }
  }

  /* ---- HUD ---- */
  const pct = Math.min(100, (st.distance / st.courseLen) * 100);
  progFill.style.width = pct.toFixed(1) + '%';
  distLbl.textContent = Math.floor(st.distance) + ' m  /  ' + st.courseLen + ' m';
}

function playerCollider() {
  const st = run;
  if (st.sliding && !st.air) {
    return { x: player.position.x, y: player.position.y + 0.42, z: player.position.z, hx: 0.38, hy: 0.42, hz: 0.55 };
  }
  if (st.air) {
    return { x: player.position.x, y: player.position.y + 0.85, z: player.position.z, hx: 0.34, hy: 0.80, hz: 0.34 };
  }
  return { x: player.position.x, y: player.position.y + 0.88, z: player.position.z, hx: 0.34, hy: 0.86, hz: 0.34 };
}

function hitObstacle() {
  const st = run;
  st.hp--;
  st.invuln = 1.35;
  st.slowT = 0.85;
  st.shake = 0.65;
  flashScreen();
  updateHud();
}

let flashT = 0;
const flashEl = document.getElementById('flash');
function flashScreen() {
  flashEl.style.opacity = '0.42';
  clearTimeout(flashT);
  flashT = setTimeout(() => { flashEl.style.opacity = '0'; }, 110);
}

/* ---- camera ---- */
const camLookTarget = new THREE.Vector3();
const camPosTarget = new THREE.Vector3();
let camRoll = 0;

function updateRunCamera(dt) {
  const st = run;
  const speedRatio = st.speed / st.baseSpeed;

  const behind = 6.4 + speedRatio * 1.1;
  const height = 3.0 + speedRatio * 0.35;

  camPosTarget.set(
    player.position.x * 0.72,
    height + st.y * 0.30,
    player.position.z + behind
  );

  const lerpK = 1 - Math.exp(-dt * 8.5);
  camera.position.lerp(camPosTarget, lerpK);

  // shake
  if (st.shake > 0) {
    st.shake -= dt * 1.8;
    const s = Math.max(0, st.shake) * 0.32;
    camera.position.x += (Math.random() - 0.5) * s;
    camera.position.y += (Math.random() - 0.5) * s;
  }

  camLookTarget.set(
    player.position.x * 0.62,
    1.35 + st.y * 0.55,
    player.position.z - 7.5
  );

  camera.lookAt(camLookTarget);

  // subtle roll on lane change
  const targetRoll = (LANE_X[st.lane] - player.position.x) * -0.035;
  camRoll += (targetRoll - camRoll) * (1 - Math.exp(-dt * 7));
  camera.rotateZ(camRoll);

  // fov
  const targetFov = 62 + (speedRatio - 0.75) * 9;
  camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-dt * 4));
  camera.updateProjectionMatrix();

  skyMesh.position.copy(camera.position);
}

/* ==========================================================================
   13. UPDATE — HARBOR
   ========================================================================== */
let harborTime = 0;

function updateHarbor(dt) {
  harborTime += dt;

  const t = harborTime * 0.13;
  const radius = 17;
  camera.position.set(
    Math.sin(t) * radius,
    6.5 + Math.sin(harborTime * 0.35) * 1.6,
    Math.cos(t) * radius
  );
  camera.lookAt(0, 4.2, 0);
  camera.fov += (58 - camera.fov) * (1 - Math.exp(-dt * 3));
  camera.updateProjectionMatrix();

  skyMesh.position.copy(camera.position);

  // water shimmer
  if (harbor.water) {
    waterNormal.offset.x = harborTime * 0.012;
    waterNormal.offset.y = harborTime * 0.008;
  }

  // ship bob
  if (harbor.ship) {
    harbor.ship.position.y = 0.15 + Math.sin(harborTime * 0.9) * 0.09;
    harbor.ship.rotation.z = Math.sin(harborTime * 0.62) * 0.017;
    harbor.ship.rotation.x = Math.cos(harborTime * 0.48) * 0.010;
  }

  // part pop-in animation
  for (const key of PART_ORDER) {
    const g = harbor.parts[key];
    if (!g || !g.visible) continue;
    if (g.userData.pop > 0 && g.userData.pop < 1) {
      g.userData.pop = Math.min(1, g.userData.pop + dt * 1.9);
      const e = 1 - Math.pow(1 - g.userData.pop, 3);
      const overshoot = 1 + Math.sin(e * Math.PI) * 0.13;
      g.scale.setScalar(e * overshoot);
    } else if (g.userData.pop >= 1) {
      g.scale.setScalar(1);
      g.userData.pop = 0;
    }
  }

  // sun follows
  sun.position.set(28, 34, 30);
  sun.target.position.set(0, 2, 0);
  sun.target.updateMatrixWorld();
}

/* ==========================================================================
   14. INPUT
   ========================================================================== */
const keys = {};

function doJump() {
  if (!run || run.finished) return;
  if (run.air) return;
  run.air = true;
  run.vy = JUMP_V;
  run.sliding = false;
  run.slideT = 0;
}

function doSlide() {
  if (!run || run.finished) return;
  if (run.air) {
    // fast-fall + slide on landing
    run.vy = Math.min(run.vy, -14);
    run.sliding = true;
    run.slideT = 0.75;
    return;
  }
  run.sliding = true;
  run.slideT = 0.72;
}

function moveLane(dir) {
  if (!run || run.finished) return;
  const n = run.lane + dir;
  if (n < 0 || n > 2) return;
  run.lane = n;
}

addEventListener('keydown', (e) => {
  if (e.repeat) return;
  keys[e.code] = true;
  if (mode !== 'run') return;
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': moveLane(-1); e.preventDefault(); break;
    case 'ArrowRight': case 'KeyD': moveLane(1); e.preventDefault(); break;
    case 'Space': case 'ArrowUp': case 'KeyW': doJump(); e.preventDefault(); break;
    case 'ArrowDown': case 'KeyS': case 'ShiftLeft': case 'ShiftRight': doSlide(); e.preventDefault(); break;
  }
}, { passive: false });

addEventListener('keyup', (e) => { keys[e.code] = false; });

/* ---- swipe ---- */
let touchStart = null;

function onDown(x, y) {
  if (mode !== 'run') return;
  touchStart = { x, y, t: performance.now() };
}
function onUp(x, y) {
  if (!touchStart || mode !== 'run') { touchStart = null; return; }
  const dx = x - touchStart.x;
  const dy = y - touchStart.y;
  const dist = Math.hypot(dx, dy);
  const dt = performance.now() - touchStart.t;
  touchStart = null;

  if (dist < 26) { doJump(); return; }
  if (Math.abs(dx) > Math.abs(dy)) {
    moveLane(dx > 0 ? 1 : -1);
  } else {
    if (dy < 0) doJump();
    else doSlide();
  }
}

canvas.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  onDown(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  onUp(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('mousedown', (e) => onDown(e.clientX, e.clientY));
canvas.addEventListener('mouseup', (e) => onUp(e.clientX, e.clientY));

/* ==========================================================================
   15. UI RENDERING
   ========================================================================== */
const resMenu = document.getElementById('resMenu');
const resIslands = document.getElementById('resIslands');
const resShip = document.getElementById('resShip');
const resTools = document.getElementById('resTools');
const islandList = document.getElementById('islandList');
const partList = document.getElementById('partList');
const toolList = document.getElementById('toolList');
const progFill = document.getElementById('progFill');
const distLbl = document.getElementById('distLbl');
const heartsEl = document.getElementById('hearts');
const matHud = document.getElementById('matHud');
const hintEl = document.getElementById('hint');

function resBarHTML() {
  return `
    <div class="res"><span class="ico">🪵</span><span>${save.wood}</span></div>
    <div class="res"><span class="ico">⚙️</span><span>${save.metal}</span></div>
    <div class="res"><span class="ico">🧵</span><span>${save.cloth}</span></div>
  `;
}
function updateResBars() {
  const html = resBarHTML();
  resMenu.innerHTML = html;
  resIslands.innerHTML = html;
  resShip.innerHTML = html;
  resTools.innerHTML = html;
}

function canAfford(cost) {
  for (const k in cost) if ((save[k] | 0) < cost[k]) return false;
  return true;
}
function pay(cost) {
  for (const k in cost) save[k] -= cost[k];
}
function costHTML(cost) {
  return Object.entries(cost)
    .map(([k, v]) => `${MAT_META[k].emoji} ${v}`)
    .join('  ·  ');
}

/* ---- islands ---- */
function renderIslands() {
  islandList.innerHTML = '';
  ISLANDS.forEach((isl, i) => {
    const unlocked = islandUnlocked(i);
    const selected = save.island === i;

    const card = document.createElement('div');
    card.className = 'card' + (unlocked ? '' : ' locked') + (selected ? ' done' : '');

    const reqTxt = isl.req.length
      ? 'Needs: ' + isl.req.map(p => PARTS[p].name).join(' + ')
      : 'Always available';

    card.innerHTML = `
      <div class="em">${isl.emoji}</div>
      <div class="info">
        <div class="nm">${isl.name} ${selected ? '· <span style="color:#7fe0a0">CURRENT</span>' : ''}</div>
        <div class="ds">${isl.desc}</div>
        <div class="cost">${unlocked ? 'Course ' + isl.length + 'm · Speed ' + isl.speed.toFixed(1) : '🔒 ' + reqTxt}</div>
      </div>
      <button class="btn small ${unlocked ? (selected ? '' : 'primary') : ''}" ${unlocked ? '' : 'disabled'}>
        ${selected ? 'ACTIVE' : 'SAIL'}
      </button>
    `;

    card.querySelector('button').addEventListener('click', () => {
      if (!unlocked) return;
      save.island = i;
      persist();
      setEnvironment(isl);
      renderIslands();
      updateResBars();
    });

    islandList.appendChild(card);
  });
}

/* ---- shipyard ---- */
function renderShipyard() {
  partList.innerHTML = '';
  const built = PART_ORDER.filter(p => save.parts[p]).length;
  document.getElementById('shipProg').textContent =
    `Hull complete: ${built} / ${PART_ORDER.length} pieces`;

  PART_ORDER.forEach(key => {
    const p = PARTS[key];
    const owned = save.parts[key];
    const afford = canAfford(p.cost);

    const card = document.createElement('div');
    card.className = 'card' + (owned ? ' done' : '');
    card.innerHTML = `
      <div class="em">${p.emoji}</div>
      <div class="info">
        <div class="nm">${p.name}</div>
        <div class="ds">${p.desc}</div>
        <div class="cost">${owned ? '✔ BUILT' : costHTML(p.cost)}</div>
      </div>
      <button class="btn small ${owned ? '' : 'primary'}" ${owned || !afford ? 'disabled' : ''}>
        ${owned ? 'DONE' : 'BUILD'}
      </button>
    `;

    card.querySelector('button').addEventListener('click', () => {
      if (owned || !canAfford(p.cost)) return;
      pay(p.cost);
      save.parts[key] = true;
      persist();
      syncShipVisual();
      renderShipyard();
      updateResBars();
    });

    partList.appendChild(card);
  });
}

/* ---- tools ---- */
function renderTools() {
  toolList.innerHTML = '';
  for (const key in TOOLS) {
    const t = TOOLS[key];
    const owned = save.tools[key];
    const afford = canAfford(t.cost);

    const card = document.createElement('div');
    card.className = 'card' + (owned ? ' done' : '');
    card.innerHTML = `
      <div class="em">${t.emoji}</div>
      <div class="info">
        <div class="nm">${t.name}</div>
        <div class="ds">${t.desc}</div>
        <div class="cost">${owned ? '✔ OWNED' : costHTML(t.cost)}</div>
      </div>
      <button class="btn small ${owned ? '' : 'primary'}" ${owned || !afford ? 'disabled' : ''}>
        ${owned ? 'OWNED' : 'BUY'}
      </button>
    `;

    card.querySelector('button').addEventListener('click', () => {
      if (owned || !canAfford(t.cost)) return;
      pay(t.cost);
      save.tools[key] = true;
      persist();
      renderTools();
      updateResBars();
    });

    toolList.appendChild(card);
  }
}

/* ---- HUD ---- */
function updateHud() {
  if (!run) return;
  let h = '';
  for (let i = 0; i < run.maxHp; i++) h += i < run.hp ? '❤️' : '🖤';
  heartsEl.textContent = h;

  matHud.innerHTML = `
    <div class="matPill"><span>🪵</span><span>${run.collected.wood}</span></div>
    <div class="matPill"><span>⚙️</span><span>${run.collected.metal}</span></div>
    <div class="matPill"><span>🧵</span><span>${run.collected.cloth}</span></div>
  `;
}

/* ---- wire buttons ---- */
document.getElementById('btnRun').addEventListener('click', startRun);
document.getElementById('btnIslands').addEventListener('click', () => { renderIslands(); showScreen('islands'); });
document.getElementById('btnShip').addEventListener('click', () => { renderShipyard(); showScreen('ship'); });
document.getElementById('btnTools').addEventListener('click', () => { renderTools(); showScreen('tools'); });
document.getElementById('btnAgain').addEventListener('click', startRun);
document.getElementById('btnHarbor').addEventListener('click', toHarbor);

document.querySelectorAll('[data-back]').forEach(el => {
  el.addEventListener('click', () => { updateResBars(); showScreen('menu'); });
});

/* ==========================================================================
   16. MAIN LOOP
   ========================================================================== */
let mode = 'harbor';
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (mode === 'run' && run && !run.finished) {
    updateRun(dt);
  } else if (mode === 'harbor') {
    updateHarbor(dt);
  } else if (mode === 'run' && run && run.finished) {
    // let the camera settle
    updateRunCamera(dt);
  }

  renderer.render(scene, camera);
}

/* ==========================================================================
   17. RESIZE + BOOT
   ========================================================================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// boot
setEnvironment(ISLANDS[save.island]);
syncShipVisual();
updateResBars();
showScreen('menu');
harborTime = 0;
animate();
</script>
