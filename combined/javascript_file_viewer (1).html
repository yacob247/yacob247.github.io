<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript File Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        /* Custom scrollbar for the code area */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
        /* Ensure Prism handles long lines nicely */
        pre[class*="language-"] {
            margin: 0;
            padding: 1.5rem;
            border-radius: 0.5rem;
            max-height: 70vh;
            overflow: auto;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700 flex flex-col">
        
        <!-- Header -->
        <header class="bg-gray-900/50 p-6 border-b border-gray-700 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    JS Game Previewer
                </h1>
                <p class="text-sm text-gray-400 mt-1">Upload and play your JavaScript games</p>
            </div>
            
            <!-- File Upload Section -->
            <div class="relative">
                <input type="file" id="file-upload" accept=".js" class="sr-only" />
                <label for="file-upload" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 flex items-center gap-2 shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Choose .js File
                </label>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="p-6 flex-grow flex flex-col">
            
            <!-- State: Initial/Empty -->
            <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-gray-500 h-full">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-lg">No game loaded</p>
                <p class="text-sm">Click the button above to select a JavaScript game file.</p>
            </div>

            <!-- State: Game Loaded -->
            <div id="game-viewer" class="hidden flex-col h-[600px] w-full">
                <!-- File Info Bar -->
                <div class="flex justify-between items-center mb-4 text-sm text-gray-400 bg-gray-900/30 p-3 rounded-lg border border-gray-700/50">
                    <div class="flex items-center gap-4">
                        <span id="file-name" class="font-mono text-green-400 font-medium">filename.js</span>
                        <span id="file-size" class="text-gray-500">0 bytes</span>
                    </div>
                    <div>
                        <button id="reload-btn" class="hover:text-white transition-colors duration-200 flex items-center gap-1" title="Reload Game">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Reload
                        </button>
                    </div>
                </div>

                <!-- Live Preview Container -->
                <div class="relative rounded-lg shadow-inner bg-white border border-gray-700 flex-grow overflow-hidden">
                    <iframe id="game-frame" class="w-full h-full border-0" sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
            
            <!-- Error Message Box -->
             <div id="error-message" class="hidden mt-4 p-4 bg-red-900/50 border border-red-500 rounded-lg text-red-200 flex items-start gap-3">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div id="error-text"></div>
            </div>

        </div>
    </div>

    <!-- Prism.js for Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const fileInput = document.getElementById('file-upload');
            const emptyState = document.getElementById('empty-state');
            const gameViewer = document.getElementById('game-viewer');
            const gameFrame = document.getElementById('game-frame');
            const fileNameDisplay = document.getElementById('file-name');
            const fileSizeDisplay = document.getElementById('file-size');
            const reloadBtn = document.getElementById('reload-btn');
            const errorContainer = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            let currentCodeContent = '';

            // Helper function to format file size
            function formatBytes(bytes, decimals = 2) {
                if (!+bytes) return '0 Bytes';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
            }

            // Function to show errors
            function showError(message) {
                errorText.textContent = message;
                errorContainer.classList.remove('hidden');
                
                // Hide error after 5 seconds
                setTimeout(() => {
                    errorContainer.classList.add('hidden');
                }, 5000);
            }

            // Function to load code into iframe safely
            function runGameCode(code) {
                const doc = gameFrame.contentWindow.document;
                
                // 1. Reset the iframe content
                doc.open();
                doc.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="utf-8">
                        <style>
                            body { 
                                margin: 0; 
                                padding: 0; 
                                display: flex; 
                                justify-content: center; 
                                align-items: center; 
                                height: 100vh; 
                                background-color: #333; 
                                color: white;
                                font-family: sans-serif;
                            }
                            canvas { 
                                max-width: 100%; 
                                max-height: 100%; 
                                box-shadow: 0 0 10px rgba(0,0,0,0.5);
                            }
                        </style>
                        <script>
                            // Catch errors that happen inside the iframe
                            window.onerror = function(msg, url, line, col, error) {
                                console.error("Game Error: ", msg, "at line", line);
                            };
                        <\/script>
                    </head>
                    <body>
                    </body>
                    </html>
                `);
                doc.close();

                // 2. Wait for the basic structure to load, then inject the user's script
                setTimeout(() => {
                    // Create a new script element
                    const scriptElement = doc.createElement('script');
                    
                    // Set the script content safely
                    scriptElement.textContent = code;
                    
                    // Append it to the iframe's body to execute it
                    doc.body.appendChild(scriptElement);
                    
                    // Set focus to the iframe so keyboard events work immediately for games
                    gameFrame.contentWindow.focus();
                }, 10);
            }

            // Event Listener for File Selection
            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                
                if (!file) {
                    return; // User cancelled
                }

                // Basic validation for .js files (though the accept attribute helps)
                if (!file.name.endsWith('.js') && file.type !== 'text/javascript' && file.type !== 'application/javascript') {
                    showError('Please select a valid JavaScript (.js) file.');
                    return;
                }

                const reader = new FileReader();

                reader.onload = function(e) {
                    try {
                        const content = e.target.result;
                        currentCodeContent = content;
                        
                        // Update UI with file details
                        fileNameDisplay.textContent = file.name;
                        fileSizeDisplay.textContent = formatBytes(file.size);
                        
                        // Toggle visibility
                        emptyState.classList.add('hidden');
                        gameViewer.classList.remove('hidden');
                        gameViewer.classList.add('flex');
                        
                        // Run the game
                        runGameCode(content);

                    } catch (err) {
                        console.error("Error reading file:", err);
                        showError("An error occurred while trying to read the file.");
                    }
                };

                reader.onerror = function() {
                    showError("Could not read the file. Please try again.");
                };

                // Read the file as text
                reader.readAsText(file);
                
                // Reset input so the same file can be selected again if needed
                fileInput.value = ''; 
            });

            // Event Listener for Reload Button
            reloadBtn.addEventListener('click', () => {
                if (currentCodeContent) {
                    runGameCode(currentCodeContent);
                }
            });
        });
    </script>
</body>
</html>
