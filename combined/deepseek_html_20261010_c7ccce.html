<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDR2 Snow Engine - Pure WebGL</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #a0c4ff;
            font-family: monospace; font-size: 14px; pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <div id="info">Pure WebGL RDR2 Snow | PBR Materials | No External Libraries<br>Mouse drag to look around. Scroll to zoom.</div>

    <script>
        // ==========================================
        // 1. MINIMAL MATRIX MATH LIBRARY (FROM SCRATCH)
        // ==========================================
        const mat4 = {
            create: () => new Float32Array(16),
            identity: (out) => {
                out[0]=1; out[1]=0; out[2]=0; out[3]=0;
                out[4]=0; out[5]=1; out[6]=0; out[7]=0;
                out[8]=0; out[9]=0; out[10]=1; out[11]=0;
                out[12]=0; out[13]=0; out[14]=0; out[15]=1;
                return out;
            },
            perspective: (out, fovy, aspect, near, far) => {
                const f = 1.0 / Math.tan(fovy / 2);
                out[0]=f/aspect; out[1]=0; out[2]=0; out[3]=0;
                out[4]=0; out[5]=f; out[6]=0; out[7]=0;
                out[8]=0; out[9]=0; out[10]=(far+near)/(near-far); out[11]=-1;
                out[12]=0; out[13]=0; out[14]=(2*far*near)/(near-far); out[15]=0;
                return out;
            },
            lookAt: (out, eye, center, up) => {
                let z = [eye[0]-center[0], eye[1]-center[1], eye[2]-center[2]];
                let len = Math.hypot(z[0], z[1], z[2]);
                z = [z[0]/len, z[1]/len, z[2]/len];
                let x = [up[1]*z[2] - up[2]*z[1], up[2]*z[0] - up[0]*z[2], up[0]*z[1] - up[1]*z[0]];
                len = Math.hypot(x[0], x[1], x[2]);
                x = [x[0]/len, x[1]/len, x[2]/len];
                let y = [z[1]*x[2] - z[2]*x[1], z[2]*x[0] - z[0]*x[2], z[0]*x[1] - z[1]*x[0]];
                out[0]=x[0]; out[1]=y[0]; out[2]=z[0]; out[3]=0;
                out[4]=x[1]; out[5]=y[1]; out[6]=z[1]; out[7]=0;
                out[8]=x[2]; out[9]=y[2]; out[10]=z[2]; out[11]=0;
                out[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]);
                out[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
                out[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);
                out[15]=1;
                return out;
            },
            multiply: (out, a, b) => {
                let a00=a[0], a01=a[1], a02=a[2], a03=a[3];
                let a10=a[4], a11=a[5], a12=a[6], a13=a[7];
                let a20=a[8], a21=a[9], a22=a[10], a23=a[11];
                let a30=a[12], a31=a[13], a32=a[14], a33=a[15];
                for (let i = 0; i < 4; i++) {
                    let b0=b[i*4], b1=b[i*4+1], b2=b[i*4+2], b3=b[i*4+3];
                    out[i*4] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
                    out[i*4+1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
                    out[i*4+2] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
                    out[i*4+3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
                }
                return out;
            },
            translate: (out, a, v) => {
                let x=v[0], y=v[1], z=v[2];
                let a00=a[0], a01=a[1], a02=a[2], a03=a[3];
                let a10=a[4], a11=a[5], a12=a[6], a13=a[7];
                let a20=a[8], a21=a[9], a22=a[10], a23=a[11];
                out[0]=a00; out[1]=a01; out[2]=a02; out[3]=a03;
                out[4]=a10; out[5]=a11; out[6]=a12; out[7]=a13;
                out[8]=a20; out[9]=a21; out[10]=a22; out[11]=a23;
                out[12]=a00*x + a10*y + a20*z + a[12];
                out[13]=a01*x + a11*y + a21*z + a[13];
                out[14]=a02*x + a12*y + a22*z + a[14];
                out[15]=a03*x + a13*y + a23*z + a[15];
                return out;
            },
            scale: (out, a, v) => {
                let x=v[0], y=v[1], z=v[2];
                out[0]=a[0]*x; out[1]=a[1]*x; out[2]=a[2]*x; out[3]=a[3]*x;
                out[4]=a[4]*y; out[5]=a[5]*y; out[6]=a[6]*y; out[7]=a[7]*y;
                out[8]=a[8]*z; out[9]=a[9]*z; out[10]=a[10]*z; out[11]=a[11]*z;
                out[12]=a[12]; out[13]=a[13]; out[14]=a[14]; out[15]=a[15];
                return out;
            }
        };

        // ==========================================
        // 2. PROCEDURAL NOISE (FOR MOUNTAINS)
        // ==========================================
        function noise(x, y) {
            let n = Math.sin(x * 0.05) * Math.cos(y * 0.05) * 2.0;
            n += Math.sin(x * 0.1 + 1.3) * Math.cos(y * 0.1 + 2.1) * 1.0;
            n += Math.sin(x * 0.2 + 4.5) * Math.cos(y * 0.2 + 3.7) * 0.5;
            return n;
        }

        // ==========================================
        // 3. WEBGL SETUP
        // ==========================================
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
        
        if (!gl) { alert("WebGL not supported"); }

        // Extensions for PBR texture data
        gl.getExtension('OES_element_index_uint');
        gl.getExtension('OES_standard_derivatives');

        function createShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        function createProgram(vsSource, fsSource) {
            const vs = createShader(gl.VERTEX_SHADER, vsSource);
            const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(program));
                return null;
            }
            return program;
        }

        // ==========================================
        // 4. GLSL SHADERS (THE CORE OF RDR2 SNOW)
        // ==========================================

        // --- PBR TERRAIN SHADER ---
        const terrainVS = `
            attribute vec3 aPosition;
            attribute vec3 aNormal;
            uniform mat4 uProjection;
            uniform mat4 uView;
            uniform mat4 uModel;
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            void main() {
                vec4 worldPos = uModel * vec4(aPosition, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(mat3(uModel) * aNormal);
                gl_Position = uProjection * uView * worldPos;
            }
        `;

        const terrainFS = `
            precision highp float;
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            uniform vec3 uCameraPos;
            uniform vec3 uLightDir;
            uniform vec3 uLightColor;
            uniform vec3 uAmbientColor;
            
            // PBR Constants
            const float PI = 3.14159265359;

            // GGX Normal Distribution Function
            float DistributionGGX(vec3 N, vec3 H, float roughness) {
                float a = roughness * roughness;
                float a2 = a * a;
                float NdotH = max(dot(N, H), 0.0);
                float NdotH2 = NdotH * NdotH;
                float nom = a2;
                float denom = (NdotH2 * (a2 - 1.0) + 1.0);
                denom = PI * denom * denom;
                return nom / max(denom, 0.001);
            }

            // Smith's Schlick-GGX Geometry Function
            float GeometrySchlickGGX(float NdotV, float roughness) {
                float r = (roughness + 1.0);
                float k = (r * r) / 8.0;
                float nom = NdotV;
                float denom = NdotV * (1.0 - k) + k;
                return nom / max(denom, 0.001);
            }

            float GeometrySmith(vec3 N, vec3 V, vec3 L, float roughness) {
                float NdotV = max(dot(N, V), 0.0);
                float NdotL = max(dot(N, L), 0.0);
                float ggx2 = GeometrySchlickGGX(NdotV, roughness);
                float ggx1 = GeometrySchlickGGX(NdotL, roughness);
                return ggx1 * ggx2;
            }

            // Fresnel-Schlick Equation
            vec3 fresnelSchlick(float cosTheta, vec3 F0) {
                return F0 + (1.0 - F0) * pow(clamp(1.0 - cosTheta, 0.0, 1.0), 5.0);
            }

            void main() {
                vec3 N = normalize(vNormal);
                vec3 V = normalize(uCameraPos - vWorldPos);
                
                // Snow material properties
                float roughness = 0.85; // Snow is very rough
                float metallic = 0.0;
                vec3 albedo = vec3(0.85, 0.9, 0.95); // Slightly blueish white for Antarctica
                vec3 F0 = vec3(0.04); 
                F0 = mix(F0, albedo, metallic);

                // Reflectance equation
                vec3 L = normalize(-uLightDir);
                vec3 H = normalize(V + L);
                float NdotL = max(dot(N, L), 0.0);
                
                // Cook-Torrance BRDF
                float NDF = DistributionGGX(N, H, roughness);
                float G = GeometrySmith(N, V, L, roughness);
                vec3 F = fresnelSchlick(max(dot(H, V), 0.0), F0);
                
                vec3 numerator = NDF * G * F;
                float denominator = 4.0 * max(dot(N, V), 0.0) * NdotL + 0.001;
                vec3 specular = numerator / denominator;
                
                vec3 kS = F;
                vec3 kD = vec3(1.0) - kS;
                kD *= 1.0 - metallic;
                
                vec3 color = (kD * albedo / PI + specular) * uLightColor * NdotL;
                
                // Subsurface Scattering simulation for snow (light bleeding through)
                float sss = max(dot(N, L), 0.0) * 0.2;
                color += albedo * sss * uLightColor;
                
                // Ambient and fog
                vec3 ambient = uAmbientColor * albedo;
                color += ambient;
                
                // Exponential Fog (RDR2 Blizzard style)
                float dist = length(uCameraPos - vWorldPos);
                float fogDensity = 0.005;
                float fogFactor = exp(-dist * fogDensity);
                fogFactor = clamp(fogFactor, 0.0, 1.0);
                vec3 fogColor = vec3(0.7, 0.8, 0.9);
                
                color = mix(fogColor, color, fogFactor);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- SNOWFALL PARTICLE SHADER ---
        const snowVS = `
            attribute vec3 aPosition;
            attribute float aRandom;
            uniform mat4 uProjection;
            uniform mat4 uView;
            uniform float uTime;
            uniform float uWind;
            varying float vAlpha;
            varying float vSize;

            void main() {
                vec3 pos = aPosition;
                
                // RDR2 style wind turbulence
                float t = uTime * 0.5 + aRandom * 100.0;
                float noiseX = sin(pos.y * 0.3 + t) * cos(pos.x * 0.2 + t * 0.5);
                float noiseZ = cos(pos.y * 0.3 + t) * sin(pos.z * 0.2 + t * 0.5);
                
                // Apply wind and gravity
                pos.x += noiseX * uWind * pos.y;
                pos.z += noiseZ * uWind * pos.y;
                pos.y -= mod(uTime * 4.0 + aRandom * 20.0, 30.0); // Fall and loop
                
                // Wrap around
                if (pos.y < -5.0) pos.y += 30.0;
                
                vec4 mvPos = uView * vec4(pos, 1.0);
                gl_Position = uProjection * mvPos;
                
                // Particle size based on depth (perspective)
                vSize = (200.0 / -mvPos.z) * (0.5 + aRandom * 0.5);
                gl_PointSize = vSize;
                
                // Fade out based on distance
                vAlpha = clamp(1.0 - (-mvPos.z / 40.0), 0.0, 1.0);
            }
        `;

        const snowFS = `
            precision highp float;
            varying float vAlpha;
            
            void main() {
                // Discard corners to make perfectly round snowflakes (no pointy sprites!)
                vec2 coord = gl_PointCoord - vec2(0.5);
                float dist = length(coord);
                if (dist > 0.5) discard;
                
                // Soft edge
                float alpha = smoothstep(0.5, 0.3, dist) * vAlpha;
                
                // PBR-style lighting for the snowflake
                // Simulate specular highlight from the sun
                vec3 normal = normalize(vec3(coord.x, coord.y, sqrt(0.25 - dist*dist)));
                vec3 lightDir = normalize(vec3(0.5, 0.8, 0.3)); // Approximate sun direction
                float diff = max(dot(normal, lightDir), 0.0);
                
                vec3 color = vec3(0.8, 0.9, 1.0) + vec3(1.0) * diff * 0.8;
                gl_FragColor = vec4(color, alpha);
            }
        `;

        // --- OBJECT SHADER (TREES AND SNOWMAN) ---
        const objectVS = `
            attribute vec3 aPosition;
            attribute vec3 aNormal;
            uniform mat4 uProjection;
            uniform mat4 uView;
            uniform mat4 uModel;
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            void main() {
                vec4 worldPos = uModel * vec4(aPosition, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(mat3(uModel) * aNormal);
                gl_Position = uProjection * uView * worldPos;
            }
        `;

        const objectFS = `
            precision highp float;
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            uniform vec3 uCameraPos;
            uniform vec3 uLightDir;
            uniform vec3 uLightColor;
            uniform vec3 uAmbientColor;
            uniform vec3 uColor;
            
            void main() {
                vec3 N = normalize(vNormal);
                vec3 V = normalize(uCameraPos - vWorldPos);
                vec3 L = normalize(-uLightDir);
                
                float NdotL = max(dot(N, L), 0.0);
                
                // Diffuse
                vec3 diffuse = uColor * NdotL * uLightColor;
                
                // Ambient
                vec3 ambient = uAmbientColor * uColor;
                
                // Specular (Fresnel)
                vec3 H = normalize(V + L);
                float NdotH = max(dot(N, H), 0.0);
                float spec = pow(NdotH, 32.0) * 0.5;
                
                vec3 color = diffuse + ambient + vec3(spec);
                
                // Fog
                float dist = length(uCameraPos - vWorldPos);
                float fogFactor = exp(-dist * 0.005);
                fogFactor = clamp(fogFactor, 0.0, 1.0);
                vec3 fogColor = vec3(0.7, 0.8, 0.9);
                
                color = mix(fogColor, color, fogFactor);
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // ==========================================
        // 5. GEOMETRY GENERATION (FROM SCRATCH)
        // ==========================================

        function createTerrain() {
            const size = 100;
            const segments = 128;
            const vertices = [];
            const indices = [];
            const normals = [];
            
            for (let z = 0; z <= segments; z++) {
                for (let x = 0; x <= segments; x++) {
                    const px = (x / segments - 0.5) * size;
                    const pz = (z / segments - 0.5) * size;
                    let py = noise(px, pz);
                    
                    // Add some RDR2 style rolling hills
                    py += Math.sin(px * 0.1) * Math.cos(pz * 0.1) * 2.0;
                    py -= 2.0; // Base level
                    
                    vertices.push(px, py, pz);
                    
                    // Approximate normals using finite differences
                    const eps = 0.1;
                    const hL = noise(px - eps, pz) + Math.sin((px-eps)*0.1)*Math.cos(pz*0.1)*2.0;
                    const hR = noise(px + eps, pz) + Math.sin((px+eps)*0.1)*Math.cos(pz*0.1)*2.0;
                    const hD = noise(px, pz - eps) + Math.sin(px*0.1)*Math.cos((pz-eps)*0.1)*2.0;
                    const hU = noise(px, pz + eps) + Math.sin(px*0.1)*Math.cos((pz+eps)*0.1)*2.0;
                    
                    let nx = hL - hR;
                    let ny = 2.0 * eps;
                    let nz = hD - hU;
                    let len = Math.hypot(nx, ny, nz);
                    normals.push(nx/len, ny/len, nz/len);
                }
            }
            
            for (let z = 0; z < segments; z++) {
                for (let x = 0; x < segments; x++) {
                    const a = z * (segments + 1) + x;
                    const b = z * (segments + 1) + x + 1;
                    const c = (z + 1) * (segments + 1) + x;
                    const d = (z + 1) * (segments + 1) + x + 1;
                    
                    indices.push(a, b, c);
                    indices.push(b, d, c);
                }
            }
            
            return { vertices, normals, indices };
        }

        function createCylinder(radiusTop, radiusBottom, height, segments) {
            const vertices = [];
            const normals = [];
            const indices = [];
            
            // Side
            for (let y = 0; y <= 1; y++) {
                for (let x = 0; x <= segments; x++) {
                    const angle = (x / segments) * Math.PI * 2;
                    const r = y === 0 ? radiusBottom : radiusTop;
                    const py = y === 0 ? 0 : height;
                    vertices.push(Math.cos(angle) * r, py, Math.sin(angle) * r);
                    normals.push(Math.cos(angle), 0, Math.sin(angle));
                }
            }
            
            for (let x = 0; x < segments; x++) {
                const a = x;
                const b = x + 1;
                const c = segments + 1 + x;
                const d = segments + 1 + x + 1;
                indices.push(a, b, c);
                indices.push(b, d, c);
            }
            
            return { vertices, normals, indices };
        }

        function createCone(radius, height, segments) {
            return createCylinder(0, radius, height, segments);
        }

        function createSphere(radius, segments) {
            const vertices = [];
            const normals = [];
            const indices = [];
            
            for (let y = 0; y <= segments; y++) {
                for (let x = 0; x <= segments; x++) {
                    const u = x / segments;
                    const v = y / segments;
                    const theta = u * Math.PI * 2;
                    const phi = v * Math.PI;
                    
                    const px = radius * Math.sin(phi) * Math.cos(theta);
                    const py = radius * Math.cos(phi);
                    const pz = radius * Math.sin(phi) * Math.sin(theta);
                    
                    vertices.push(px, py, pz);
                    normals.push(px/radius, py/radius, pz/radius);
                }
            }
            
            for (let y = 0; y < segments; y++) {
                for (let x = 0; x < segments; x++) {
                    const a = y * (segments + 1) + x;
                    const b = a + 1;
                    const c = (y + 1) * (segments + 1) + x;
                    const d = c + 1;
                    indices.push(a, b, c);
                    indices.push(b, d, c);
                }
            }
            
            return { vertices, normals, indices };
        }

        // ==========================================
        // 6. INITIALIZATION
        // ==========================================

        const terrainProgram = createProgram(terrainVS, terrainFS);
        const snowProgram = createProgram(snowVS, snowFS);
        const objectProgram = createProgram(objectVS, objectFS);

        function createBuffer(data, type) {
            const buffer = gl.createBuffer();
            gl.bindBuffer(type, buffer);
            gl.bufferData(type, new Float32Array(data), gl.STATIC_DRAW);
            return buffer;
        }

        // Setup Terrain
        const terrainData = createTerrain();
        const terrainVBO = createBuffer(terrainData.vertices, gl.ARRAY_BUFFER);
        const terrainNBO = createBuffer(terrainData.normals, gl.ARRAY_BUFFER);
        const terrainIBO = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrainIBO);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(terrainData.indices), gl.STATIC_DRAW);

        // Setup Snowman
        const snowmanParts = [];
        function addPart(mesh, color, position, scale) {
            snowmanParts.push({ mesh, color, position, scale });
        }
        
        const sphereMesh = createSphere(1.0, 16);
        const sphereVBO = createBuffer(sphereMesh.vertices, gl.ARRAY_BUFFER);
        const sphereNBO = createBuffer(sphereMesh.normals, gl.ARRAY_BUFFER);
        const sphereIBO = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIBO);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(sphereMesh.indices), gl.STATIC_DRAW);
        const sphereIndexCount = sphereMesh.indices.length;

        const coneMesh = createCone(1.0, 1.0, 16);
        const coneVBO = createBuffer(coneMesh.vertices, gl.ARRAY_BUFFER);
        const coneNBO = createBuffer(coneMesh.normals, gl.ARRAY_BUFFER);
        const coneIBO = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, coneIBO);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(coneMesh.indices), gl.STATIC_DRAW);
        const coneIndexCount = coneMesh.indices.length;

        const cylinderMesh = createCylinder(0.1, 0.1, 1.0, 8);
        const cylVBO = createBuffer(cylinderMesh.vertices, gl.ARRAY_BUFFER);
        const cylNBO = createBuffer(cylinderMesh.normals, gl.ARRAY_BUFFER);
        const cylIBO = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cylIBO);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(cylinderMesh.indices), gl.STATIC_DRAW);
        const cylIndexCount = cylinderMesh.indices.length;

        // Build Snowman
        // Bottom
        addPart({vbo: sphereVBO, nbo: sphereNBO, ibo: sphereIBO, count: sphereIndexCount}, [0.9, 0.95, 1.0], [0, -0.5, -5], [1.5, 1.5, 1.5]);
        // Middle
        addPart({vbo: sphereVBO, nbo: sphereNBO, ibo: sphereIBO, count: sphereIndexCount}, [0.95, 0.98, 1.0], [0, 1.0, -5], [1.1, 1.1, 1.1]);
        // Head
        addPart({vbo: sphereVBO, nbo: sphereNBO, ibo: sphereIBO, count: sphereIndexCount}, [0.95, 0.98, 1.0], [0, 2.3, -5], [0.8, 0.8, 0.8]);
        // Eyes
        addPart({vbo: sphereVBO, nbo: sphereNBO, ibo: sphereIBO, count: sphereIndexCount}, [0.0, 0.0, 0.0], [-0.25, 2.5, -4.3], [0.08, 0.08, 0.08]);
        addPart({vbo: sphereVBO, nbo: sphereNBO, ibo: sphereIBO, count: sphereIndexCount}, [0.0, 0.0, 0.0], [0.25, 2.5, -4.3], [0.08, 0.08, 0.08]);
        // Nose (Cone)
        addPart({vbo: coneVBO, nbo: coneNBO, ibo: coneIBO, count: coneIndexCount}, [1.0, 0.4, 0.0], [0, 2.3, -4.2], [0.1, 0.5, 0.1]);
        // Arms (Cylinders)
        addPart({vbo: cylVBO, nbo: cylNBO, ibo: cylIBO, count: cylIndexCount}, [0.3, 0.2, 0.1], [-1.5, 1.2, -5], [1.0, 2.0, 1.0]);
        addPart({vbo: cylVBO, nbo: cylNBO, ibo: cylIBO, count: cylIndexCount}, [0.3, 0.2, 0.1], [1.5, 1.2, -5], [1.0, 2.0, 1.0]);

        // Setup Trees
        const trees = [];
        for (let i = 0; i < 20; i++) {
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80;
            if (Math.abs(x) < 10 && Math.abs(z) < 10) continue; // Don't spawn on snowman
            
            const treeScale = 1.0 + Math.random() * 2.0;
            trees.push({
                x: x, z: z, scale: treeScale,
                parts: [
                    { vbo: cylVBO, nbo: cylNBO, ibo: cylIBO, count: cylIndexCount, color: [0.2, 0.1, 0.05], pos: [0, 0, 0], scale: [0.3, 2.0, 0.3] },
                    { vbo: coneVBO, nbo: coneNBO, ibo: coneIBO, count: coneIndexCount, color: [0.1, 0.3, 0.1], pos: [0, 1.5, 0], scale: [1.5, 2.0, 1.5] },
                    { vbo: coneVBO, nbo: coneNBO, ibo: coneIBO, count: coneIndexCount, color: [0.1, 0.3, 0.1], pos: [0, 2.5, 0], scale: [1.2, 1.5, 1.2] },
                    { vbo: coneVBO, nbo: coneNBO, ibo: coneIBO, count: coneIndexCount, color: [0.1, 0.3, 0.1], pos: [0, 3.5, 0], scale: [0.8, 1.2, 0.8] },
                    // Snow on tree
                    { vbo: coneVBO, nbo: coneNBO, ibo: coneIBO, count: coneIndexCount, color: [0.9, 0.95, 1.0], pos: [0, 2.0, 0], scale: [1.55, 1.5, 1.55] },
                    { vbo: coneVBO, nbo: coneNBO, ibo: coneIBO, count: coneIndexCount, color: [0.9, 0.95, 1.0], pos: [0, 3.0, 0], scale: [1.25, 1.0, 1.25] },
                    { vbo: coneVBO, nbo: coneNBO, ibo: coneIBO, count: coneIndexCount, color: [0.9, 0.95, 1.0], pos: [0, 4.0, 0], scale: [0.85, 0.8, 0.85] },
                ]
            });
        }

        // Setup Snowfall Particles
        const MAX_SNOW = 3000;
        const snowPositions = new Float32Array(MAX_SNOW * 3);
        const snowRandoms = new Float32Array(MAX_SNOW);
        
        for (let i = 0; i < MAX_SNOW; i++) {
            snowPositions[i*3] = (Math.random() - 0.5) * 100;
            snowPositions[i*3+1] = Math.random() * 30;
            snowPositions[i*3+2] = (Math.random() - 0.5) * 100;
            snowRandoms[i] = Math.random();
        }
        
        const snowPosBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, snowPosBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, snowPositions, gl.STATIC_DRAW);
        
        const snowRandBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, snowRandBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, snowRandoms, gl.STATIC_DRAW);

        // ==========================================
        // 7. CAMERA AND INPUT
        // ==========================================
        let cameraPos = [0, 5, 10];
        let cameraTarget = [0, 2, -5];
        let cameraUp = [0, 1, 0];
        
        let yaw = 0;
        let pitch = -0.2;
        let radius = 15;
        
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            yaw -= dx * 0.01;
            pitch -= dy * 0.01;
            pitch = Math.max(-1.5, Math.min(1.5, pitch));
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        
        canvas.addEventListener('wheel', (e) => {
            radius += e.deltaY * 0.01;
            radius = Math.max(5, Math.min(50, radius));
        });

        // ==========================================
        // 8. RENDER LOOP
        // ==========================================
        let then = 0;
        
        function render(now) {
            now *= 0.001;
            const deltaTime = now - then;
            then = now;
            
            // Update Camera
            const cx = Math.sin(yaw) * Math.cos(pitch) * radius;
            const cy = Math.sin(pitch) * radius + 3;
            const cz = Math.cos(yaw) * Math.cos(pitch) * radius;
            cameraPos = [cx, cy, cz];
            cameraTarget = [0, 1, -5];
            
            const projectionMatrix = mat4.create();
            const viewMatrix = mat4.create();
            const modelMatrix = mat4.create();
            
            mat4.perspective(projectionMatrix, Math.PI / 4, canvas.width / canvas.height, 0.1, 1000);
            mat4.lookAt(viewMatrix, cameraPos, cameraTarget, cameraUp);
            mat4.identity(modelMatrix);
            
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.1, 0.15, 0.25, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            
            // Light uniforms (Moonlight / Blue hour)
            const lightDir = [0.5, 0.8, 0.3];
            const lightColor = [0.8, 0.85, 1.0];
            const ambientColor = [0.15, 0.2, 0.3];
            
            // 1. DRAW TERRAIN
            gl.useProgram(terrainProgram);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(terrainProgram, "uProjection"), false, projectionMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(terrainProgram, "uView"), false, viewMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(terrainProgram, "uModel"), false, modelMatrix);
            gl.uniform3fv(gl.getUniformLocation(terrainProgram, "uCameraPos"), cameraPos);
            gl.uniform3fv(gl.getUniformLocation(terrainProgram, "uLightDir"), lightDir);
            gl.uniform3fv(gl.getUniformLocation(terrainProgram, "uLightColor"), lightColor);
            gl.uniform3fv(gl.getUniformLocation(terrainProgram, "uAmbientColor"), ambientColor);
            
            const tPosLoc = gl.getAttribLocation(terrainProgram, "aPosition");
            const tNormLoc = gl.getAttribLocation(terrainProgram, "aNormal");
            
            gl.bindBuffer(gl.ARRAY_BUFFER, terrainVBO);
            gl.enableVertexAttribArray(tPosLoc);
            gl.vertexAttribPointer(tPosLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, terrainNBO);
            gl.enableVertexAttribArray(tNormLoc);
            gl.vertexAttribPointer(tNormLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrainIBO);
            gl.drawElements(gl.TRIANGLES, terrainData.indices.length, gl.UNSIGNED_INT, 0);
            
            // 2. DRAW OBJECTS (Trees and Snowman)
            gl.useProgram(objectProgram);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(objectProgram, "uProjection"), false, projectionMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(objectProgram, "uView"), false, viewMatrix);
            gl.uniform3fv(gl.getUniformLocation(objectProgram, "uCameraPos"), cameraPos);
            gl.uniform3fv(gl.getUniformLocation(objectProgram, "uLightDir"), lightDir);
            gl.uniform3fv(gl.getUniformLocation(objectProgram, "uLightColor"), lightColor);
            gl.uniform3fv(gl.getUniformLocation(objectProgram, "uAmbientColor"), ambientColor);
            
            const oPosLoc = gl.getAttribLocation(objectProgram, "aPosition");
            const oNormLoc = gl.getAttribLocation(objectProgram, "aNormal");
            const uColorLoc = gl.getUniformLocation(objectProgram, "uColor");
            
            function drawPart(vbo, nbo, ibo, count, color, pos, scale) {
                mat4.identity(modelMatrix);
                mat4.translate(modelMatrix, modelMatrix, pos);
                mat4.scale(modelMatrix, modelMatrix, scale);
                gl.uniformMatrix4fv(gl.getUniformLocation(objectProgram, "uModel"), false, modelMatrix);
                gl.uniform3fv(uColorLoc, color);
                
                gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
                gl.enableVertexAttribArray(oPosLoc);
                gl.vertexAttribPointer(oPosLoc, 3, gl.FLOAT, false, 0, 0);
                
                gl.bindBuffer(gl.ARRAY_BUFFER, nbo);
                gl.enableVertexAttribArray(oNormLoc);
                gl.vertexAttribPointer(oNormLoc, 3, gl.FLOAT, false, 0, 0);
                
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
                gl.drawElements(gl.TRIANGLES, count, gl.UNSIGNED_INT, 0);
            }
            
            // Draw Snowman
            for (let part of snowmanParts) {
                drawPart(part.vbo, part.nbo, part.ibo, part.count, part.color, part.position, part.scale);
            }
            
            // Draw Trees
            for (let tree of trees) {
                for (let part of tree.parts) {
                    const worldPos = [tree.x + part.pos[0], part.pos[1], tree.z + part.pos[2]];
                    const worldScale = [part.scale[0] * tree.scale, part.scale[1] * tree.scale, part.scale[2] * tree.scale];
                    drawPart(part.vbo, part.nbo, part.ibo, part.count, part.color, worldPos, worldScale);
                }
            }
            
            // 3. DRAW SNOWFALL (Particles)
            gl.useProgram(snowProgram);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(snowProgram, "uProjection"), false, projectionMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(snowProgram, "uView"), false, viewMatrix);
            gl.uniform1f(gl.getUniformLocation(snowProgram, "uTime"), now);
            gl.uniform1f(gl.getUniformLocation(snowProgram, "uWind"), 2.0); // RDR2 Blizzard wind
            
            const sPosLoc = gl.getAttribLocation(snowProgram, "aPosition");
            const sRandLoc = gl.getAttribLocation(snowProgram, "aRandom");
            
            gl.bindBuffer(gl.ARRAY_BUFFER, snowPosBuffer);
            gl.enableVertexAttribArray(sPosLoc);
            gl.vertexAttribPointer(sPosLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, snowRandBuffer);
            gl.enableVertexAttribArray(sRandLoc);
            gl.vertexAttribPointer(sRandLoc, 1, gl.FLOAT, false, 0, 0);
            
            gl.drawArrays(gl.POINTS, 0, MAX_SNOW);
            
            requestAnimationFrame(render);
        }

        // Resize handler
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Start
        requestAnimationFrame(render);
    </script>
</body>
</html>
