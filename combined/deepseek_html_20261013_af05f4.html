<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>

  #scrub::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%;
    background:#fff; box-shadow:0 0 10px rgba(255,255,255,.6); cursor:pointer; }

    color:rgba(255,255,255,.42); }

</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js"

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════════════════
   0.  TIMELINE  (seconds)
   ══════════════════════════════════════════════════════════════════════ */
const T = {
  slabs:       2.5,    // first pillars + slabs appear
  crack:       8.5,    // long slabs crack
  morePillars: 13.5,   // add more pillars
  boat:        19.0,   // boat arrives and is blocked
  crumble:     25.0,   // old bridge collapses
  arch:        28.5,   // voussoirs build the arch
  spandrel:    36.0,   // spandrel walls
  deck:        40.5,   // roadway
  railings:    44.5,   // railings
  flood:       49.0,   // flood rises
  openArches:  54.5,   // side arches open
  END:         60.0
};

/* ══════════════════════════════════════════════════════════════════════
   1.  RENDERER · SCENE · CAMERA
   ══════════════════════════════════════════════════════════════════════ */
const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace  = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.4, 1600);

/* ── procedural sky (equirect) → PMREM environment for real IBL ─────── */
function makeSkyTexture(){
  const W = 2048, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');

  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#123f7d');
  g.addColorStop(0.24, '#3f74b4');
  g.addColorStop(0.40, '#7aa8d2');
  g.addColorStop(0.478,'#c3d8e6');
  g.addColorStop(0.500,'#e2e8ea');
  g.addColorStop(0.512,'#8b8172');
  g.addColorStop(0.62, '#5c5343');
  g.addColorStop(0.80, '#3a342a');
  g.addColorStop(1.00, '#232019');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  // wispy clouds
  x.globalCompositeOperation = 'screen';
  for (let i = 0; i < 26; i++){
    const cx = Math.random()*W, cy = H*0.10 + Math.random()*H*0.30;
    const r  = 90 + Math.random()*230;
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    const a  = 0.05 + Math.random()*0.11;
    rg.addColorStop(0, `rgba(255,255,255,${a})`);
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = rg;
    x.save(); x.translate(cx, cy); x.scale(1, 0.32);
    x.beginPath(); x.arc(0, 0, r, 0, Math.PI*2); x.fill(); x.restore();
  }
  x.globalCompositeOperation = 'source-over';

  // sun disc + glow
  const sx = W*0.285, sy = H*0.215;
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, 260);
  sg.addColorStop(0.00, 'rgba(255,253,244,1)');
  sg.addColorStop(0.05, 'rgba(255,246,214,0.95)');
  sg.addColorStop(0.22, 'rgba(255,236,190,0.30)');
  sg.addColorStop(1.00, 'rgba(255,230,180,0)');
  x.fillStyle = sg; x.beginPath(); x.arc(sx, sy, 260, 0, Math.PI*2); x.fill();
  x.fillStyle = '#fffdf6'; x.beginPath(); x.arc(sx, sy, 26, 0, Math.PI*2); x.fill();

  const t = new THREE.CanvasTexture(c);
  t.mapping    = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const skyTex = makeSkyTexture();
const pmrem  = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(skyTex).texture;
scene.background  = skyTex;
scene.backgroundIntensity = 1.0;
scene.fog = new THREE.Fog(0xa9bfd2, 190, 760);
pmrem.dispose();

/* ── sun ────────────────────────────────────────────────────────────── */
const sun = new THREE.DirectionalLight(0xfff0d6, 3.1);
sun.position.set(59, 93, -49);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-72, right:72, top:62, bottom:-62, near:1, far:340 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.055;
sun.target.position.set(0, 5, 0);
scene.add(sun, sun.target);

/* ══════════════════════════════════════════════════════════════════════
   2.  PROCEDURAL PBR TEXTURE FACTORY
   ══════════════════════════════════════════════════════════════════════ */
function hash2(ix, iy, period){
  ix = ((ix % period) + period) % period;
  iy = ((iy % period) + period) % period;
  let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function pnoise(x, y, period){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi, yi, period),     b = hash2(xi+1, yi, period);
  const c = hash2(xi, yi+1, period),   d = hash2(xi+1, yi+1, period);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function tfbm(u, v, freq, oct, gain = 0.5){
  let s = 0, amp = 1, tot = 0, f = freq;
  for (let i = 0; i < oct; i++){ s += amp*pnoise(u*f, v*f, f); tot += amp; amp *= gain; f *= 2; }
  return s / tot;
}

function cv(size){ const c = document.createElement('canvas'); c.width = c.height = size; return c; }

function makeNormalMap(height, size, strength){
  const c = cv(size), ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size), d = img.data;
  for (let y = 0; y < size; y++){
    for (let x = 0; x < size; x++){
      const xm = (x - 1 + size) % size, xp = (x + 1) % size;
      const ym = (y - 1 + size) % size, yp = (y + 1) % size;
      const dx = height[y*size + xp] - height[y*size + xm];
      const dy = height[yp*size + x] - height[ym*size + x];
      let nx = -dx*strength, ny = dy*strength, nz = 1;
      const l = Math.hypot(nx, ny, nz);
      const i = (y*size + x)*4;
      d[i]   = (nx/l*0.5 + 0.5)*255;
      d[i+1] = (ny/l*0.5 + 0.5)*255;
      d[i+2] = (nz/l*0.5 + 0.5)*255;
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ── STONE ──────────────────────────────────────────────────────────── */
function makeStone(){
  const S = 512;
  const h = new Float32Array(S*S);
  const alb = cv(S), rgh = cv(S);
  const ac = alb.getContext('2d'), rc = rgh.getContext('2d');
  const ai = ac.createImageData(S, S), ri = rc.createImageData(S, S);
  const ad = ai.data, rd = ri.data;

  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const u = x/S, v = y/S;
      const base  = tfbm(u, v, 4, 5);
      const grain = tfbm(u + 3.7, v + 1.3, 34, 3);
      const pit   = Math.pow(Math.abs(tfbm(u + 9.1, v + 5.5, 62, 2) - 0.5)*2, 7);
      let n = base*0.62 + grain*0.38;
      n -= pit*0.30;
      n = Math.max(0, Math.min(1, n));
      h[y*S + x] = n;

      // cool grey limestone with warm flecks
      const shade = 0.42 + n*0.60;
      const warm  = (grain - 0.5)*0.10;
      const i = (y*S + x)*4;
      ad[i]   = Math.min(255, (150*shade + warm*90) );
      ad[i+1] = Math.min(255, (148*shade + warm*70) );
      ad[i+2] = Math.min(255, (140*shade + warm*30) );

      const r = 0.66 + (1 - n)*0.26 + pit*0.14;
      rd[i] = rd[i+1] = rd[i+2] = Math.min(255, r*255);
      rd[i+3] = 255;
    }
  }
  ac.putImageData(ai, 0, 0); rc.putImageData(ri, 0, 0);

  const map = new THREE.CanvasTexture(alb);
  map.colorSpace = THREE.SRGBColorSpace;
  const rough = new THREE.CanvasTexture(rgh);
  [map, rough].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; });

  return { map, rough, normal: makeNormalMap(h, S, 2.6) };
}

/* ── WOOD ───────────────────────────────────────────────────────────── */
function makeWood(){
  const S = 512, h = new Float32Array(S*S);
  const alb = cv(S), ac = alb.getContext('2d');
  const ai = ac.createImageData(S, S), ad = ai.data;

  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const u = x/S, v = y/S;
      const warp = tfbm(u*0.4, v*3.0, 3, 3) * 0.35;
      const rings = Math.sin((v*22 + warp*9) * Math.PI) * 0.5 + 0.5;
      const fib   = tfbm(u + 11.2, v + 4.4, 48, 3);
      const n = rings*0.55 + fib*0.45;
      h[y*S + x] = n;
      const i = (y*S + x)*4;
      ad[i]   = 74 + n*78;
      ad[i+1] = 46 + n*58;
      ad[i+2] = 24 + n*40;
      ad[i+3] = 255;
    }
  }
  ac.putImageData(ai, 0, 0);
  const map = new THREE.CanvasTexture(alb);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.anisotropy = 8;
  return { map, normal: makeNormalMap(h, S, 1.7) };
}

/* ── SOIL / RIVERBANK ───────────────────────────────────────────────── */
function makeSoil(){
  const S = 512, h = new Float32Array(S*S);
  const alb = cv(S), ac = alb.getContext('2d');
  const ai = ac.createImageData(S, S), ad = ai.data;

  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const u = x/S, v = y/S;
      const clump = tfbm(u, v, 7, 5);
      const grit  = tfbm(u + 5.1, v + 8.8, 58, 3);
      const n = clump*0.68 + grit*0.32;
      h[y*S + x] = n;
      const i = (y*S + x)*4;
      ad[i]   = 92 + n*70;
      ad[i+1] = 78 + n*62;
      ad[i+2] = 54 + n*46;
      ad[i+3] = 255;
    }
  }
  ac.putImageData(ai, 0, 0);
  const map = new THREE.CanvasTexture(alb);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.anisotropy = 8;
  return { map, normal: makeNormalMap(h, S, 3.1) };
}

/* ── WATER (ripple normal map, animated by UV scroll) ───────────────── */
function makeWaterNormal(){
  const S = 256, h = new Float32Array(S*S);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const u = x/S, v = y/S;
      const a = tfbm(u, v, 5, 4);
      const b = tfbm(u + 0.31, v + 0.77, 11, 3);
      h[y*S + x] = a*0.6 + b*0.4;
    }
  }
  return makeNormalMap(h, S, 1.5);
}

const TEX = {
  stone: makeStone(),
  wood:  makeWood(),
  soil:  makeSoil(),
  water: makeWaterNormal()
};

/* ══════════════════════════════════════════════════════════════════════
   3.  PBR MATERIALS
   ══════════════════════════════════════════════════════════════════════ */
const MAT = {
  stone: new THREE.MeshStandardMaterial({
    map: TEX.stone.map, roughnessMap: TEX.stone.rough, normalMap: TEX.stone.normal,
    normalScale: new THREE.Vector2(1.15, 1.15),
    color: 0xffffff, roughness: 1.0, metalness: 0.0, envMapIntensity: 1.0
  }),
  stoneDark: new THREE.MeshStandardMaterial({
    map: TEX.stone.map, roughnessMap: TEX.stone.rough, normalMap: TEX.stone.normal,
    normalScale: new THREE.Vector2(1.35, 1.35),
    color: 0x9b968c, roughness: 1.0, metalness: 0.0, envMapIntensity: 0.85
  }),
  stoneWarm: new THREE.MeshStandardMaterial({
    map: TEX.stone.map, roughnessMap: TEX.stone.rough, normalMap: TEX.stone.normal,
    normalScale: new THREE.Vector2(1.0, 1.0),
    color: 0xc9b79a, roughness: 1.0, metalness: 0.0, envMapIntensity: 1.0
  }),
  wood: new THREE.MeshStandardMaterial({
    map: TEX.wood.map, normalMap: TEX.wood.normal,
    normalScale: new THREE.Vector2(0.8, 0.8),
    color: 0xffffff, roughness: 0.72, metalness: 0.0, envMapIntensity: 0.8
  }),
  soil: new THREE.MeshStandardMaterial({
    map: TEX.soil.map, normalMap: TEX.soil.normal,
    normalScale: new THREE.Vector2(1.5, 1.5),
    color: 0xffffff, roughness: 0.97, metalness: 0.0, envMapIntensity: 0.7
  }),
  iron: new THREE.MeshStandardMaterial({
    color: 0x54585e, roughness: 0.38, metalness: 1.0, envMapIntensity: 1.2
  }),
  water: new THREE.MeshPhysicalMaterial({
    color: 0x0a2630, roughness: 0.055, metalness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.045,
    normalMap: TEX.water, normalScale: new THREE.Vector2(0.30, 0.30),
    transparent: true, opacity: 0.9,
    envMapIntensity: 1.9, side: THREE.DoubleSide
  }),
  sail: new THREE.MeshStandardMaterial({
    color: 0xd9cfb8, roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide,
    envMapIntensity: 0.75
  })
};

/* ══════════════════════════════════════════════════════════════════════
   4.  GEOMETRY HELPERS  (world-scale UVs so texel density is constant)
   ══════════════════════════════════════════════════════════════════════ */
function boxGeo(w, h, d, uvScale = 0.22){
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f = 0; f < 6; f++){
    const [fw, fh] = dims[f];
    for (let i = 0; i < 4; i++){
      const k = f*4 + i;
      uv.setXY(k, uv.getX(k)*fw*uvScale, uv.getY(k)*fh*uvScale);
    }
  }
  uv.needsUpdate = true;
  return g;
}

const root = new THREE.Group();
scene.add(root);

/* animation system ---------------------------------------------------- */
const anims = [];
function registerBase(m){
  m.userData.base = { p: m.position.clone(), q: m.quaternion.clone(), s: m.scale.clone() };
}
function addAnim(mesh, keys){ anims.push({ mesh, keys }); }

function buildIn(mesh, t0, dur = 0.9, drop = 7){
  const b = mesh.userData.base;
  addAnim(mesh, [
    { t: t0,       p: b.p.clone().setY(b.p.y + drop), q: b.q.clone(), s: b.s.clone().multiplyScalar(0.04) },
    { t: t0 + dur, p: b.p.clone(),                    q: b.q.clone(), s: b.s.clone() }
  ]);
}
function despawn(mesh, t0, dur = 1.5, fall = 17){
  const b = mesh.userData.base;
  const e = new THREE.Euler(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
  addAnim(mesh, [
    { t: t0, p: b.p.clone(), q: b.q.clone(), s: b.s.clone() },
    { t: t0 + dur,
      p: b.p.clone().add(new THREE.Vector3((Math.random()-.5)*7, -fall, (Math.random()-.5)*7)),
      q: b.q.clone().multiply(new THREE.Quaternion().setFromEuler(e)),
      s: b.s.clone().multiplyScalar(0.03) }
  ]);
}

function addBox(w, h, d, x, y, z, rz = 0, mat = MAT.stone, uvS = 0.22, cast = true){
  const m = new THREE.Mesh(boxGeo(w, h, d, uvS), mat);
  m.position.set(x, y, z);
  m.rotation.z = rz;
  m.castShadow = cast;
  m.receiveShadow = true;
  root.add(m);
  registerBase(m);
  return m;
}

/* ══════════════════════════════════════════════════════════════════════
   5.  BRIDGE MATHEMATICS
   ══════════════════════════════════════════════════════════════════════ */
const BED_Z      = -6.0;
const WATER_Z    =  0.0;
const BANK_TOP   =  1.0;
const BANK_X     = 18.5;
const SPAN       = 37.0;
const RISE       =  7.2;
const SPRING_Z   = BANK_TOP;

const R_IN   = (SPAN*SPAN/4 + RISE*RISE) / (2*RISE);   // 27.37
const ZC     = SPRING_Z + RISE - R_IN;                 // -19.17
const THETA  = Math.asin((SPAN/2) / R_IN);             // 42.53°
const ARCH_T = 1.30;
const R_OUT  = R_IN + ARCH_T;

const BRIDGE_W  = 9.0;
const DECK_W    = 9.6;
const DECK_T    = 1.0;
const DECK_HALF = 34.0;
const DECK_CROWN= 10.60;
const DECK_SAG  =  1.10;

const extradosY = x => {
  const ax = Math.min(Math.abs(x), R_OUT - 1e-4);
  return ZC + Math.sqrt(R_OUT*R_OUT - ax*ax);
};
const deckTopY = x => DECK_CROWN - DECK_SAG * (x/DECK_HALF)**2;
const deckBotY = x => deckTopY(x) - DECK_T;
const spandrelBotY = x =>
  Math.abs(x) >= R_OUT ? BANK_TOP : Math.max(BANK_TOP, extradosY(x) + 0.10);

/* small flood arches -------------------------------------------------- */
const SMALL = [];
for (const sgn of [1, -1]){
  for (const [xcA, hw, rise] of [[12.5, 2.20, 1.60], [17.5, 1.70, 1.20]]){
    const Rs = (hw*hw + rise*rise) / (2*rise);
    const sz = spandrelBotY(sgn * xcA);
    SMALL.push({ xc: sgn*xcA, hw, rise, springZ: sz, Rs, zc: sz + rise - Rs });
  }
}
function insideSmallArch(x, y){
  for (const a of SMALL){
    const dx = x - a.xc;

function makeBoat(withMast, scale = 1){
  const g = new THREE.Group();

  const shape = new THREE.Shape();
  shape.moveTo(0, 6);
  shape.bezierCurveTo(2.4, 3.4, 2.4, -3.4, 0, -6);
  shape.bezierCurveTo(-2.4, -3.4, -2.4, 3.4, 0, 6);

  const hullGeo = new THREE.ExtrudeGeometry(shape, {
    depth: 2.2, bevelEnabled: true, bevelThickness: 0.4,
    bevelSize: 0.35, bevelSegments: 2, curveSegments: 14
  });
  hullGeo.rotateX(-Math.PI/2);
  hullGeo.translate(0, -1.1, 0);

  const hull = new THREE.Mesh(hullGeo, MAT.wood);
  hull.castShadow = hull.receiveShadow = true;
  g.add(hull);

  // gunwale
  const rim = new THREE.Mesh(new THREE.TorusGeometry(5.6, 0.16, 6, 40), MAT.wood);
  rim.rotation.x = Math.PI/2;
  rim.scale.set(1, 0.42, 1);
  rim.position.y = 1.05;
  rim.castShadow = true;
  g.add(rim);

  if (withMast){
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 6.4, 10), MAT.wood);
    mast.position.y = 4.4; mast.castShadow = true; g.add(mast);

    const sail = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.4), MAT.sail);
    sail.position.set(0, 4.9, 0.25);
    sail.castShadow = true;
    g.add(sail);

    const yard = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 4.9, 8), MAT.wood);
    yard.rotation.z = Math.PI/2; yard.position.y = 7.05; g.add(yard);
  }

  g.scale.setScalar(scale);
  return g;
}

  root.add(b);

}

  const th = Math.asin(Math.min(0.999, a.hw / a.Rs));
  const nv = 14, ring = 0.46;

  for (let i = 0; i < nv; i++){
    const phi = -th + (i + 0.5) * (2*th / nv);
    const rr  = a.Rs + ring/2;
    const px  = a.xc + rr * Math.sin(phi);
    const py  = a.zc + rr * Math.cos(phi);
    const tang = (2*th / nv) * rr * 1.12;
    const m = addBox(tang, ring, BRIDGE_W*0.98, px, py, 0, -phi, MAT.stone, 0.42);
    buildIn(m, T.spandrel + 0.6 + i*0.045, 0.6, 6);
  }

  // filler blocks that are knocked out when the flood comes
  const ncol = 4, w = 2*a.hw / ncol;
  for (let i = 0; i < ncol; i++){
    const cx = a.xc - a.hw + (i + 0.5) * w;
    const xL = cx - w/2, xR = cx + w/2;
    const topL = a.zc + Math.sqrt(Math.max(0, a.Rs*a.Rs - (xL - a.xc)**2));
    const topR = a.zc + Math.sqrt(Math.max(0, a.Rs*a.Rs - (xR - a.xc)**2));
    const topY = Math.min(topL, topR) - 0.10;
    const h = topY - a.springZ;
    if (h <= 0.25) continue;
    const m = addBox(w*0.94, h*0.96, BRIDGE_W*0.98,
                     cx, a.springZ + h/2, 0, 0, MAT.stoneDark, 0.34);
    buildIn(m, T.deck + 0.8 + i*0.12, 0.7, 6);
    plugs.push(m);
  }
}

   15. FLOOD  (water level rise)
   ══════════════════════════════════════════════════════════════════════ */
const FLOOD_Y = 4.25;
function waterLevelAt(t){
  if (t <= T.flood) return WATER_Z;
  const u = Math.min(1, (t - T.flood) / 7.0);
  const e = u*u*(3 - 2*u);
  return WATER_Z + e * (FLOOD_Y - WATER_Z);
}

const CAM_KEYS = [
  { t:  0.0, pos: [  6, 26, -92], tgt: [ 0,  5, 0] },
  { t:  7.0, pos: [ -2, 10, -46], tgt: [ 0,  4, 0] },

  { t: 56.0, pos: [ 38, 20, -62], tgt: [ 0,  5, 0] },
  { t: 60.0, pos: [ 30, 34, -96], tgt: [ 0,  4, 0] }
];

const camPos = new THREE.Vector3(), camTgt = new THREE.Vector3();
const _pA = new THREE.Vector3(), _pB = new THREE.Vector3();
const _tA = new THREE.Vector3(), _tB = new THREE.Vector3();

function updateCamera(t){
  const K = CAM_KEYS;
  if (t <= K[0].t){ camPos.set(...K[0].pos); camTgt.set(...K[0].tgt); }
  else if (t >= K[K.length-1].t){
    camPos.set(...K[K.length-1].pos); camTgt.set(...K[K.length-1].tgt);
  } else {
    let i = 0;
    while (i < K.length - 2 && t > K[i+1].t) i++;
    const A = K[i], B = K[i+1];
    let u = (t - A.t) / (B.t - A.t);
    u = u*u*(3 - 2*u);
    _pA.set(...A.pos); _pB.set(...B.pos);
    _tA.set(...A.tgt); _tB.set(...B.tgt);
    camPos.lerpVectors(_pA, _pB, u);
    camTgt.lerpVectors(_tA, _tB, u);
  }
  // subtle handheld drift
  const b = t * 0.55;
  camPos.x += Math.sin(b*0.9) * 0.30 + Math.sin(b*2.3) * 0.10;
  camPos.y += Math.sin(b*1.3 + 1.7) * 0.24;
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
  camera.rotation.z += Math.sin(b*0.7) * 0.0045;
}

/* ══════════════════════════════════════════════════════════════════════
   17. ANIMATION UPDATER
   ══════════════════════════════════════════════════════════════════════ */
const easeOut = u => 1 - Math.pow(1 - u, 3);

function updateAnims(t){
  for (const a of anims){
    const K = a.keys;
    if (t < K[0].t){ a.mesh.visible = false; continue; }
    a.mesh.visible = true;

    if (t >= K[K.length-1].t){
      const L = K[K.length-1];
      a.mesh.position.copy(L.p);
      a.mesh.quaternion.copy(L.q);
      a.mesh.scale.copy(L.s);
      continue;
    }
    let i = 0;
    while (i < K.length - 2 && t > K[i+1].t) i++;
    const A = K[i], B = K[i+1];
    const u = easeOut((t - A.t) / (B.t - A.t));
    a.mesh.position.lerpVectors(A.p, B.p, u);
    a.mesh.quaternion.slerpQuaternions(A.q, B.q, u);
    a.mesh.scale.lerpVectors(A.s, B.s, u);
  }
}

function updateBoats(t){
  for (const b of boats){
    const P = b.path;
    const o = b.obj;
    if (t < P[0].t){ o.visible = false; continue; }
    o.visible = true;
    if (t >= P[P.length-1].t){
      o.position.z = P[P.length-1].z;
      o.position.y = waterLevelAt(t) + P[P.length-1].y;
    } else {
      let i = 0;
      while (i < P.length - 2 && t > P[i+1].t) i++;
      const A = P[i], B = P[i+1];
      const u = (t - A.t) / (B.t - A.t);
      o.position.z = A.z + (B.z - A.z) * u;
      o.position.y = waterLevelAt(t) + A.y + (B.y - A.y) * u;
    }
    // bob on the swell
    o.position.y += Math.sin(t*1.9 + b.scale*13) * 0.11;
    o.rotation.z  = Math.sin(t*1.35 + b.scale*7) * 0.022;
    o.rotation.x  = Math.sin(t*1.6 + b.scale*3) * 0.015;
  }
}

const timeLabel = document.getElementById('time');

const ICON_PLAY  = 'M8 5v14l11-7z';
const ICON_PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';

playBtn.addEventListener('click', () => {
  playing = !playing;
  playIcon.innerHTML = `<path d="${playing ? ICON_PAUSE : ICON_PLAY}"/>`;
});

scrub.addEventListener('input', () => {
  time = (scrub.value / 1000) * T.END;
  renderFrame(time);
});

function fmt(s){
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${r}`;
}

/* ══════════════════════════════════════════════════════════════════════
   20. RENDER LOOP
   ══════════════════════════════════════════════════════════════════════ */
function renderFrame(t){
  updateAnims(t);

  // water level + ripple scroll
  water.position.y = waterLevelAt(t);
  TEX.water.offset.x = t * 0.013;
  TEX.water.offset.y = t * 0.026;

  updateBoats(t);
  updateCamera(t);

  // gentle sun drift for a living sky
  sun.position.set(59 + Math.sin(t*0.03)*8, 93, -49 + Math.cos(t*0.03)*8);
  sun.target.position.set(0, 5, 0);
  sun.target.updateMatrixWorld();

  renderer.render(scene, camera);
}

function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (playing){
    time += dt;
    if (time > T.END) time = 0;
  }

  scrub.value = (time / T.END) * 1000;
  timeLabel.textContent = `${fmt(time)} / ${fmt(T.END)}`;
  updateCaption(time);
  renderFrame(time);

  renderer.setAnimationLoop(loop);
}

/* resize -------------------------------------------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ══════════════════════════════════════════════════════════════════════
   21. START
   ══════════════════════════════════════════════════════════════════════ */
renderFrame(0);
renderer.compile(scene, camera);

const loader = document.getElementById('loader');
loader.classList.add('done');
setTimeout(() => loader.remove(), 800);

renderer.setAnimationLoop(loop);
</script>
</body>
</html>
