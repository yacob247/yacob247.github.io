<style>

  #grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.05;

    animation:grain .5s steps(3) infinite}

  #boot{position:fixed;inset:0;z-index:90;background:radial-gradient(ellipse at 50% 40%,#0b1018,#03050a 75%);

  #bootP{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;color:#9d968a;

  #beginBtn{margin-top:48px;font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;

    border:1px solid rgba(224,180,95,.45);padding:15px 52px;border-radius:2px;cursor:pointer;
    transition:background .25s,color .25s,box-shadow .25s}
  #beginBtn:hover{background:rgba(224,180,95,.12);color:#fff;box-shadow:0 0 30px rgba(224,180,95,.22)}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ==================================================================
   0.  SMALL MATH / NOISE HELPERS
   ================================================================== */
const rnd  = (a,b)=> a + Math.random()*(b-a);
const clamp= (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453123; return s-Math.floor(s); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,o){ o=o||4; let s=0,a=0.5,f=1; for(let i=0;i<o;i++){ s+=a*vnoise(x*f,y*f); f*=2; a*=0.5; } return s; }

/* ==================================================================
   1.  PROCEDURAL PBR TEXTURE SETS
   ================================================================== */
function buildTexSet(size, fn, repeat){
  repeat = repeat||1;
  const N=size;
  const cCol=document.createElement('canvas'); cCol.width=cCol.height=N;
  const cRgh=document.createElement('canvas'); cRgh.width=cRgh.height=N;
  const cNrm=document.createElement('canvas'); cNrm.width=cNrm.height=N;
  const col=cCol.getContext('2d'), rgh=cRgh.getContext('2d'), nrm=cNrm.getContext('2d');
  const iCol=col.createImageData(N,N), iRgh=rgh.createImageData(N,N), iNrm=nrm.createImageData(N,N);
  const H=new Float32Array(N*N);
  const o={r:0,g:0,b:0,rough:1,h:0};
  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      const i=y*N+x;
      o.r=0;o.g=0;o.b=0;o.rough=1;o.h=0;
      fn(x/N, y/N, o);
      iCol.data[i*4  ]=clamp(o.r*255,0,255)|0;
      iCol.data[i*4+1]=clamp(o.g*255,0,255)|0;
      iCol.data[i*4+2]=clamp(o.b*255,0,255)|0;
      iCol.data[i*4+3]=255;
      const rv=clamp(o.rough*255,0,255)|0;
      iRgh.data[i*4]=rv; iRgh.data[i*4+1]=rv; iRgh.data[i*4+2]=rv; iRgh.data[i*4+3]=255;
      H[i]=o.h;
    }
  }
  const S=2.4;
  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      const i=y*N+x;
      const l=H[y*N+((x-1+N)%N)], r=H[y*N+((x+1)%N)];
      const u=H[((y-1+N)%N)*N+x], d=H[((y+1)%N)*N+x];
      let nx=(l-r)*S, ny=(u-d)*S, nz=1;
      const len=Math.hypot(nx,ny,nz); nx/=len; ny/=len; nz/=len;
      iNrm.data[i*4  ]=(nx*0.5+0.5)*255;
      iNrm.data[i*4+1]=(ny*0.5+0.5)*255;
      iNrm.data[i*4+2]=(nz*0.5+0.5)*255;
      iNrm.data[i*4+3]=255;
    }
  }
  col.putImageData(iCol,0,0); rgh.putImageData(iRgh,0,0); nrm.putImageData(iNrm,0,0);
  const mk=(cv,srgb)=>{
    const t=new THREE.CanvasTexture(cv);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(repeat,repeat);
    t.anisotropy=8;
    if(srgb) t.colorSpace=THREE.SRGBColorSpace;
    return t;
  };
  return { map:mk(cCol,true), roughnessMap:mk(cRgh,false), normalMap:mk(cNrm,false) };
}

/* --- pattern library ------------------------------------------------ */
const PAT = {
  asphalt:(u,v,o)=>{ const n=fbm(u*16,v*16,4), g=0.085+n*0.055, grit=hash2(u*512,v*512)*0.035;
    o.r=g+grit; o.g=g+grit*0.95; o.b=g*1.12+grit; o.rough=0.82+n*0.12; o.h=n*0.5+grit*3; },
  sidewalk:(u,v,o)=>{ const gx=Math.abs(((u*8)%1)-0.5), gy=Math.abs(((v*8)%1)-0.5);
    const line=Math.min(gx,gy)>0.465?0.055:0; const n=fbm(u*22,v*22,3);
    const g=0.30+n*0.10-line; o.r=g; o.g=g*0.99; o.b=g*0.96;
    o.rough=0.90+n*0.06; o.h=line*-3+n*0.4; },
  concrete:(u,v,o)=>{ const n=fbm(u*9,v*9,4), m=fbm(u*40,v*40,2);
    const g=0.26+n*0.10+m*0.03; o.r=g; o.g=g*0.98; o.b=g*0.93;
    o.rough=0.88+n*0.08; o.h=n*0.6+m*0.4; },
  dirt:(u,v,o)=>{ const n=fbm(u*7,v*7,5), m=fbm(u*30,v*30,3);
    o.r=0.30+n*0.13+m*0.04; o.g=0.22+n*0.10+m*0.03; o.b=0.14+n*0.06+m*0.02;
    o.rough=0.94+n*0.05; o.h=n*0.9+m*0.5; },
  stone:(u,v,o)=>{ const row=Math.floor(v*6), off=(row%2)*0.5;
    const bx=((u*5+off)%1), by=((v*6)%1);
    const mort=(bx<0.05||by<0.07)?1:0; const n=fbm(u*18,v*18,3);
    const g=(0.34+n*0.12)*(1-mort*0.45); o.r=g*1.02; o.g=g*0.99; o.b=g*0.92;
    o.rough=0.92+n*0.06; o.h=(1-mort)*0.8+n*0.3-mort*1.2; },
  plaster:(u,v,o)=>{ const n=fbm(u*26,v*26,4), m=fbm(u*90,v*90,2);
    const g=0.60+n*0.09+m*0.03; o.r=g; o.g=g*0.985; o.b=g*0.955;
    o.rough=0.86+n*0.09; o.h=n*0.35+m*0.25; },
  brick:(u,v,o)=>{ const row=Math.floor(v*10), off=(row%2)*0.5;
    const bx=((u*5+off)%1), by=((v*10)%1);
    const mortar=(bx<0.06||by<0.10)?1:0; const n=fbm(u*24,v*24,3);
    let r=0.33+n*0.10, g=0.14+n*0.055, b=0.11+n*0.04;
    if(mortar){ r=0.42; g=0.40; b=0.37; }
    o.r=r; o.g=g; o.b=b; o.rough=0.90+n*0.07;
    o.h=(1-mortar)*0.9+n*0.3-mortar*1.1; },
  tile:(u,v,o)=>{ const tx=Math.abs(((u*8)%1)-0.5), ty=Math.abs(((v*8)%1)-0.5);
    const line=Math.min(tx,ty)>0.455?1:0; const n=fbm(u*30,v*30,3);
    const g=(0.55+n*0.07)*(1-line*0.42); o.r=g*0.98; o.g=g*0.99; o.b=g;
    o.rough=0.55+n*0.15+line*0.2; o.h=(1-line)*0.5+n*0.2-line*1.0; },
  wood:(u,v,o)=>{ const grain=fbm(u*3+v*0.4, v*40, 4);
    const rings=Math.sin((u*9+grain*1.6)*Math.PI*2)*0.5+0.5;
    const n=rings*0.5+fbm(u*60,v*60,2)*0.5;
    o.r=0.30+n*0.20; o.g=0.19+n*0.13; o.b=0.105+n*0.07;
    o.rough=0.62+n*0.22; o.h=n*0.8; },
  metal:(u,v,o)=>{ const n=fbm(u*14,v*14,3), s=fbm(u*70,v*70,2);
    const g=0.44+n*0.09+s*0.03; o.r=g; o.g=g*1.005; o.b=g*1.02;
    o.rough=0.38+n*0.20; o.h=n*0.3+s*0.2; },
  carPaint:(u,v,o)=>{ const n=fbm(u*50,v*50,2); o.r=0.40+n*0.04; o.g=0.185+n*0.03;
    o.b=0.215+n*0.03; o.rough=0.22+n*0.12; o.h=n*0.15; },
  rubber:(u,v,o)=>{ const n=fbm(u*40,v*40,3); const t=Math.abs(((v*14)%1)-0.5)>0.36?0.16:0;
    const g=0.055+n*0.035+t*0.5; o.r=g; o.g=g; o.b=g*1.05; o.rough=0.95; o.h=n*0.4+t; },
  chrome:(u,v,o)=>{ const n=fbm(u*8,v*8,2); const g=0.86+n*0.09;
    o.r=g; o.g=g; o.b=g*1.02; o.rough=0.08+n*0.09; o.h=n*0.1; },
  cloth:(cr,cg,cb)=>(u,v,o)=>{ const n=fbm(u*90,v*90,3), m=fbm(u*12,v*12,3);
    o.r=cr*(0.82+n*0.24+m*0.12); o.g=cg*(0.82+n*0.24+m*0.12); o.b=cb*(0.82+n*0.24+m*0.12);
    o.rough=0.88+n*0.08; o.h=n*0.5+m*0.3; },
  skin:(u,v,o)=>{ const n=fbm(u*60,v*60,3), m=fbm(u*9,v*9,3);
    o.r=0.80+n*0.08+m*0.04; o.g=0.62+n*0.08+m*0.04; o.b=0.50+n*0.07+m*0.03;
    o.rough=0.62+n*0.10; o.h=n*0.25+m*0.2; },
  hair:(u,v,o)=>{ const n=fbm(u*180,v*10,3); const g=0.075+n*0.07;
    o.r=g; o.g=g*0.85; o.b=g*0.72; o.rough=0.52+n*0.15; o.h=n*0.7; },
  plastic:(u,v,o)=>{ const n=fbm(u*30,v*30,2); const g=0.72+n*0.05;
    o.r=g; o.g=g*0.99; o.b=g*0.97; o.rough=0.42+n*0.10; o.h=n*0.15; },
  grille:(u,v,o)=>{ const bar=Math.abs(((v*26)%1)-0.5)>0.30?1:0;
    const g=0.16+bar*0.28; o.r=g; o.g=g; o.b=g*1.04; o.rough=0.70; o.h=bar*0.8; }
};

const _cache = {};

}

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  vertexShader:`varying vec3 vDir;
    void main(){ vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vDir;
    float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec3 d = normalize(vDir);
      float t = clamp(d.y*1.15+0.18, 0.0, 1.0);
      vec3 low  = vec3(0.048,0.062,0.096);
      vec3 high = vec3(0.010,0.016,0.032);
      vec3 col = mix(low, high, t);
      vec3 gdir = normalize(vec3(0.6,0.04,-0.3));
      float glow = pow(max(dot(d,gdir),0.0), 12.0);
      col += vec3(0.62,0.38,0.17)*glow*0.75;
      if(d.y > 0.05){
        vec2 uv = d.xz/max(d.y,0.001)*3.2;
        vec2 id = floor(uv);
        float h = h21(id);
        float s = step(0.986, h);
        float tw = 0.55+0.45*sin(h*130.0);
        col += vec3(s*tw)*0.85;
      }
      gl_FragColor = vec4(col,1.0);
    }`
});

let actx=null, master=null, engineOsc=null, engineGain=null, engineFilt=null;

function initAudio(){
  if(actx) return;
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ return; }
  master = actx.createGain(); master.gain.value = 0.4; master.connect(actx.destination);

  // rain (white noise, filtered, looped)
  const len = actx.sampleRate*3;
  const buf = actx.createBuffer(1,len,actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=220;
  const lp = actx.createBiquadFilter(); lp.type='lowpass';  lp.frequency.value=1200;
  const g  = actx.createGain(); g.gain.value=0.05;
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(master); src.start();

  // drone
  const dr = actx.createOscillator(); dr.type='sine'; dr.frequency.value=44;
  const dg = actx.createGain(); dg.gain.value=0.03;
  dr.connect(dg); dg.connect(master); dr.start();
}

function startEngine(){
  if(!actx || engineOsc) return;
  engineOsc = actx.createOscillator(); engineOsc.type='sawtooth'; engineOsc.frequency.value=45;
  engineFilt = actx.createBiquadFilter(); engineFilt.type='lowpass'; engineFilt.frequency.value=300;
  engineGain = actx.createGain(); engineGain.gain.value=0.0001;
  engineOsc.connect(engineFilt); engineFilt.connect(engineGain); engineGain.connect(master);
  engineOsc.start();
  engineGain.gain.linearRampToValueAtTime(0.028, actx.currentTime+0.6);
}
function setEngineSpeed(spd){
  if(!engineOsc) return;
  engineOsc.frequency.setTargetAtTime(45 + spd*3, actx.currentTime, 0.09);
  engineGain.gain.setTargetAtTime(0.02 + spd*0.002, actx.currentTime, 0.12);
}
function stopEngine(){
  if(!engineOsc) return;
  const o=engineOsc;
  engineGain.gain.setTargetAtTime(0.0001, actx.currentTime, 0.25);
  engineOsc=null;
  setTimeout(()=>{ try{ o.stop(); }catch(e){} }, 900);
}
function chime(){
  if(!actx) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(); o.type='sine'; o.frequency.value=880;
  const g=actx.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.14,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.25);
}
function thud(){
  if(!actx) return;
  const t=actx.currentTime, len=actx.sampleRate*0.4;
  const b=actx.createBuffer(1,len,actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  const s=actx.createBufferSource(); s.buffer=b;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
  const g=actx.createGain(); g.gain.value=0.5;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function shot(){
  if(!actx) return;
  const t=actx.currentTime, len=actx.sampleRate*0.2;
  const b=actx.createBuffer(1,len,actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=actx.createBufferSource(); s.buffer=b;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2200;
  const g=actx.createGain(); g.gain.value=0.35;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}

const colliders = [];      // THREE.Box3 (may have .disabled)
const interactables = [];

function addCollider(x1,z1,x2,z2,h,y0){
  const t = 0.1;
  const b = new THREE.Box3(
    new THREE.Vector3(Math.min(x1,x2)- (x1===x2?t:0), y0||0, Math.min(z1,z2)-(z1===z2?t:0)),
    new THREE.Vector3(Math.max(x1,x2)+ (x1===x2?t:0), h, Math.max(z1,z2)+(z1===z2?t:0))
  );
  b.disabled = false;
  colliders.push(b);
  return b;
}

function W(x1,z1,x2,z2,h,mat,thick,parent,noCollide){
  const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
  const g = new THREE.BoxGeometry(len, h, thick||0.26);
  const m = new THREE.Mesh(g, mat||MAT.plaster);
  m.position.set((x1+x2)/2, h/2, (z1+z2)/2);
  m.rotation.y = -Math.atan2(dz,dx);
  m.castShadow = true; m.receiveShadow = true;
  (parent||scene).add(m);
  if(!noCollide) addCollider(x1,z1,x2,z2,h);
  return m;
}
function B(w,h,d,mat,x,y,z,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  (parent||scene).add(m); return m;
}
function P(w,h,mat,x,y,z,parent,rx){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
  m.position.set(x,y,z);
  if(rx!==undefined) m.rotation.x = rx;
  m.receiveShadow = true;
  (parent||scene).add(m); return m;
}

function makeNPC(colour, hairCol, h, x, z, ry){
  const g = new THREE.Group();
  g.position.set(x,0,z);
  g.rotation.y = ry||0;
  const scale = h/1.75;

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.22,0.58,4,10), MAT[colour]);
  torso.position.y = 1.12*scale; torso.castShadow = true; g.add(torso);

  const hips = new THREE.Mesh(new THREE.CapsuleGeometry(0.19,0.28,4,10), MAT[colour]);
  hips.position.y = 0.72*scale; hips.castShadow=true; g.add(hips);

  for(const lx of [-0.11,0.11]){
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.09,0.6,4,8), MAT.clothGrey);
    leg.position.set(lx*scale, 0.42*scale, 0); leg.castShadow=true; g.add(leg);
  }
  for(const ax of [-0.31,0.31]){
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07,0.56,4,8), MAT[colour]);
    arm.position.set(ax*scale, 1.14*scale, 0); arm.castShadow=true; g.add(arm);
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.115*scale,14,12), MAT.skin);
  head.position.y = 1.62*scale; head.castShadow=true; g.add(head);

  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.122*scale,14,12,
    0,Math.PI*2,0,Math.PI*0.62), MAT.hair);
  hair.position.y = 1.645*scale; hair.scale.set(1.0,0.95,1.02); g.add(hair);
  if(hairCol !== undefined){
    hair.material = new THREE.MeshStandardMaterial({color:hairCol, roughness:.85});
  }
  scene.add(g);
  return g;
}

const keys = {};
let pointerLocked = false;

addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code === 'Space') e.preventDefault();

  if(dlgEl.classList.contains('show')){
    const n = parseInt(e.key,10);
    if(n>=1 && n<=3){
      const el = dlgChoices.children[n-1];
      if(el) el.click();
    }
    return;
  }
  if(e.code === 'KeyE') tryInteract();
});
addEventListener('keyup', e=>{ keys[e.code] = false; });

document.addEventListener('pointerlockchange', ()=>{
  pointerLocked = (document.pointerLockElement === renderer.domElement);
});
document.addEventListener('mousemove', e=>{
  if(!pointerLocked || player.frozen) return;
  const s = 0.0022;
  player.yaw   -= e.movementX * s;
  player.pitch -= e.movementY * s;
  const lim = (player.mode === 'drive') ? 0.6 : 1.3;
  player.pitch = clamp(player.pitch, -lim, lim);
});
renderer.domElement.addEventListener('click', ()=>{
  if(!pointerLocked && !player.frozen && !dlgEl.classList.contains('show')
     && !tapeEl.classList.contains('show')){
    renderer.domElement.requestPointerLock();
  }
});

/* --- interaction ------------------------------------------------------ */
function addInteractable(o){ interactables.push(o); return o; }
function removeInteractable(o){
  const i = interactables.indexOf(o);
  if(i>=0) interactables.splice(i,1);
}

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
let currentInteract = null;

function findInteractable(){
  const fwd = _v1.set(0,0,-1).applyEuler(new THREE.Euler(0,player.yaw,0));
  let best = null, bestD = Infinity;
  for(const it of interactables){
    if(it.hidden) continue;
    const p = it.getPos ? (it.getPos(_v2), _v2) : it.mesh.position;
    const dx = p.x - player.pos.x, dz = p.z - player.pos.z;
    const d = Math.hypot(dx,dz);
    const r = it.radius || 2.4;
    if(d > r) continue;
    if(d > 0.01){
      const dot = (dx/d)*fwd.x + (dz/d)*fwd.z;
      if(dot < 0.15) continue;
    }
    if(d < bestD){ best = it; bestD = d; }
  }
  return best;
}

function tryInteract(){
  if(player.frozen) return;
  if(player.mode === 'drive'){
    if(!State.driving && State.canExit){ exitCarAction(); }
    return;
  }
  if(currentInteract && currentInteract.action){
    currentInteract.action();
  }
}

   ================================================================== */
function showDialogue(name, text, options){
  dlgName.textContent = name;
  dlgText.textContent = text;
  dlgChoices.innerHTML = '';
  const opts = (options && options.length) ? options : [{t:'Continue', next:null}];
  opts.forEach((o,i)=>{
    const d = document.createElement('div');
    d.className = 'choice';
    d.innerHTML = '<span class="num">'+(i+1)+'</span><span>'+o.t+'</span>';
    d.addEventListener('click', ()=>{
      endDialogue();
      if(o.next) setTimeout(o.next, 60);
    });
    dlgChoices.appendChild(d);
  });
  dlgEl.classList.add('show');
  player.frozen = true;
  if(document.pointerLockElement) document.exitPointerLock();
}
function endDialogue(){
  dlgEl.classList.remove('show');
  player.frozen = false;
  setTimeout(()=>{
    if(!player.frozen && !tapeEl.classList.contains('show')){
      renderer.domElement.requestPointerLock();
    }
  }, 80);
}

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

   ================================================================== */
const tmpDir = new THREE.Vector3();
const tmpEul = new THREE.Euler(0,0,0,'YXZ');

function resolveCollisions(pos, radius){
  for(const b of colliders){
    if(b.disabled) continue;
    const eyeTop = pos.y + 0.25, eyeBot = pos.y - 1.45;
    if(eyeBot > b.max.y || eyeTop < b.min.y) continue;
    const cx = clamp(pos.x, b.min.x, b.max.x);
    const cz = clamp(pos.z, b.min.z, b.max.z);
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if(d2 < radius*radius){
      if(d2 > 1e-7){
        const d = Math.sqrt(d2);
        pos.x += dx/d*(radius-d);
        pos.z += dz/d*(radius-d);
      } else {
        const p1 = pos.x - b.min.x, p2 = b.max.x - pos.x;
        const p3 = pos.z - b.min.z, p4 = b.max.z - pos.z;
        const m = Math.min(p1,p2,p3,p4);
        if(m===p1) pos.x = b.min.x - radius;
        else if(m===p2) pos.x = b.max.x + radius;
        else if(m===p3) pos.z = b.min.z - radius;
        else pos.z = b.max.z + radius;
      }
    }
  }
}

let timeAcc = 0;
function updateWalk(dt, tNow){
  if(player.frozen) { /* still allow camera */ }

  let fx=0, fz=0;
  if(!player.frozen){
    if(keys['KeyW']||keys['ArrowUp'])    fz -= 1;
    if(keys['KeyS']||keys['ArrowDown'])  fz += 1;
    if(keys['KeyA']||keys['ArrowLeft'])  fx -= 1;
    if(keys['KeyD']||keys['ArrowRight']) fx += 1;
  }
  const running = !!(keys['ShiftLeft']||keys['ShiftRight']);
  const len = Math.hypot(fx,fz);
  let moving = false;

  if(len > 0){
    fx/=len; fz/=len;
    const speed = running ? player.runSpeed : player.walkSpeed;
    const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
    const wx = fx*cy - fz*sy;
    const wz = fx*sy + fz*cy;
    player.pos.x += wx*speed*dt;
    player.pos.z += wz*speed*dt;
    moving = true;
  }

  resolveCollisions(player.pos, player.radius);

  // head bob
  const bobSpeed = running ? 12 : 8;
  player.bob += dt * (moving ? bobSpeed : 0);
  let bobY = moving ? Math.sin(player.bob)*0.045 : Math.sin(tNow*1.15)*0.008;
  let bobX = moving ? Math.cos(player.bob*0.5)*0.020 : 0;

  camera.position.set(
    player.pos.x + bobX*Math.cos(player.yaw),
    player.pos.y + bobY,
    player.pos.z - bobX*Math.sin(player.yaw)
  );
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

  // --- chapter transition triggers ---------------------------------
  if(State.chapter === 1 && player.pos.z > 4.7 && doorState.open){
    State.chapter = 2;
    quest.startStreet();
  }
}

function updateDrive(dt){
  if(State.driving){
    const maxSpeed = 26;

    if(!State.parking){
      if(keys['KeyW']||keys['ArrowUp']){
        State.driveSpeed += 12*dt;
      } else if(keys['KeyS']||keys['ArrowDown']){
        State.driveSpeed -= 18*dt;
      } else {
        State.driveSpeed -= 3*dt;
      }
      State.driveSpeed = clamp(State.driveSpeed, -6, maxSpeed);
    } else {
      // coasting
      State.driveSpeed -= 6*dt;
      if(State.driveSpeed < 0) State.driveSpeed = 0;
    }

    // steering
    let steer = 0;
    if(!player.frozen && !State.parking){
      if(keys['KeyA']||keys['ArrowLeft'])  steer += 1;
      if(keys['KeyD']||keys['ArrowRight']) steer -= 1;
    }
    if(State.parking){
      steer = Math.sin(performance.now()/1000 * 1.4)*0.15;
    }
    car.rotation.y += steer * dt * 1.4 * (Math.abs(State.driveSpeed)/maxSpeed);

    // auto-centre toward world heading π/2 when moving
    if(State.driveSpeed > 2 && !State.parking){
      const target = Math.PI/2;
      let diff = target - car.rotation.y;
      diff = ((diff + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
      car.rotation.y += diff * Math.min(1, dt*0.9);
    }

    // forward motion
    tmpDir.set(0,0,-1).applyQuaternion(car.quaternion);
    car.position.addScaledVector(tmpDir, State.driveSpeed*dt);

    // lateral shoulder drift when parking
    if(State.parking){
      const dz = 7.35 - car.position.z;
      const step = Math.sign(dz) * Math.min(1.6*dt, Math.abs(dz));
      car.position.z += step;
    } else {
      // keep on the asphalt
      if(car.position.z < 7.4) car.position.z = lerp(car.position.z, 7.4, Math.min(1,dt*3));
      if(car.position.z > 13.6) car.position.z = lerp(car.position.z, 13.6, Math.min(1,dt*3));
    }

    // wheel rotation
    const wheels = car.userData.wheels;
    if(wheels){
      for(const w of wheels) w.rotation.x -= State.driveSpeed*dt/0.33;
    }

    // engine sound
    setEngineSpeed(Math.abs(State.driveSpeed));
    spdNum.textContent = Math.round(Math.abs(State.driveSpeed)*3.6);

    // breakdown trigger
    if(!State.brokenDown && -car.position.x > 210){
      quest.breakDown();
    }

    // parking settle
    if(State.parking && State.driveSpeed < 0.25){
      State.driveSpeed = 0;
      car.position.z = 7.35;
      car.rotation.z = 0.02;
      State.parking = false;
      State.canExit = true;
      spdNum.textContent = '0';
      setObjective('Get out of the car.');
      setHint('<b>E</b> get out');
    }
  }

  // camera
  camera.position.set(-0.35, 1.50, -0.30);
  if(State.parking){
    camera.position.x += Math.sin(performance.now()/1000*9)*0.012;
    camera.position.y += Math.sin(performance.now()/1000*11)*0.010;
  }
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  if(car.userData.steerWheel){
    car.userData.steerWheel.rotation.z =
      (keys['KeyA']||keys['ArrowLeft']?1:0)*-0.5 + (keys['KeyD']||keys['ArrowRight']?1:0)*0.5;
  }
}

/* --- door animation --------------------------------------------------- */
function updateDoors(dt){
  if(doorState.open && doorState.ang < doorState.target){
    doorState.ang = Math.min(doorState.target, doorState.ang + dt*0.9);
    doorHinge.rotation.y = -doorState.ang;
  }
  if(carHood.userData.open && carHood.rotation.x > carHood.userData.target){
    carHood.rotation.x = Math.max(carHood.userData.target, carHood.rotation.x - dt*1.2);
  }
  if(busState.doorOpen && busState.doorAng < busState.doorTarget){
    busState.doorAng = Math.min(busState.doorTarget, busState.doorAng + dt*0.9);
    busDoorHinge.rotation.y = -busState.doorAng;
  }
}

/* --- bus logic -------------------------------------------------------- */
function updateBus(dt){
  if(busState.arriving && !busState.arrived){
    bus.position.x += 9*dt;
    if(bus.position.x >= -124){
      bus.position.x = -124;
      busState.arriving = false;
      busState.arrived = true;
      showSubtitle('Sanatorio?', 3.6);
      setTimeout(()=>{
        const dIt = addInteractable({
          mesh: bus,
          label: 'Open the bus door',
          radius: 4.0,
          getPos(v){ return v.set(bus.position.x, 1.2, bus.position.z - 1.4); },
          action(){
            removeInteractable(dIt);
            busState.doorOpen = true;
            busState.doorTarget = 0.85*Math.PI;
            thud();
            setObjective('Board the bus.');
            const bIt = addInteractable({
              mesh: bus,
              label: 'Board the bus',
              radius: 3.6,
              getPos(v){ return v.set(bus.position.x, 1.2, bus.position.z - 1.4); },
              action(){ quest.boardBus(); }
            });
          }
        });
        setObjective('Open the bus door.');
      }, 1200);
    }
  }
  // idle timer near the bus stop
  if(State.busReady && !State.busArrived){
    const d = Math.hypot(player.pos.x + 130, player.pos.z - 8.5);
    if(d < 9){
      busIdle += dt;
      if(busIdle > 12) quest.busArrives();
      else if(busIdle > 4 && busIdle - dt <= 4){
        showSubtitle('You wait. The road is very quiet.', 3.4);
      }
    } else {
      busIdle = Math.max(0, busIdle - dt*0.5);
    }
  }
}

/* --- interaction prompt ----------------------------------------------- */
function updateInteract(dt){
  if(player.frozen || State.ended){
    crossEl.classList.remove('hot');
    promptEl.classList.remove('show');
    currentInteract = null;
    return;
  }
  let it = findInteractable();

  if(player.mode === 'drive'){
    if(!State.driving && State.canExit){
      it = { label:'Get out', action: exitCarAction };
    } else {
      it = null;
    }
  }

  currentInteract = it;
  if(it){
    crossEl.classList.add('hot');
    promptTxt.textContent = it.label;
    promptEl.classList.add('show');
  } else {
    crossEl.classList.remove('hot');
    promptEl.classList.remove('show');
  }
}

/* --- main loop -------------------------------------------------------- */
const clock3 = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);
  const tNow = performance.now()/1000;

  sky.position.copy(camera.position);
  sky.rotation.y = tNow*0.0015;

  // moon follows the player
  moon.position.set(player.pos.x + 40, player.pos.y + 70, player.pos.z + 30);
  moon.target.position.copy(player.pos);

  if(player.mode === 'walk') updateWalk(dt, tNow);
  else updateDrive(dt);

  updateDoors(dt);
  updateBus(dt);
  updateInteract(dt);

  composer.render();
}

/* ==================================================================
   17.  BOOT
   ================================================================== */
$('beginBtn').addEventListener('click', ()=>{
  initAudio();
  bootEl.classList.add('hide');
  setTimeout(()=>{
    bootEl.style.display = 'none';
    renderer.domElement.requestPointerLock();
  }, 800);
  fadeTo(false, 1400);
  quest.startApartment();
});

// start rendering immediately (behind the boot screen)
animate();
</script>
