<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video → Contact Sheet (1 fps)</title>
<style>
  :root{
    --bg:#0d0f13;
    --panel:#15181e;
    --panel-2:#1b1f27;
    --line:#2a303b;
    --text:#e8eaf0;
    --muted:#98a0ae;
    --accent:#5b8cff;
    --accent-2:#3f6fe0;
    --warn:#ffb020;
    --err:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(1200px 600px at 20% -10%, #1a2030 0%, var(--bg) 60%) fixed;
    color:var(--text);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 18px 60px;
  }
  .wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  header h1{margin:0 0 4px;font-size:20px;letter-spacing:.2px;font-weight:650;}
  header p{margin:0;color:var(--muted);font-size:13px;}

  .panel{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  /* ---- drop zone ---- */
  .drop{
    border:1.5px dashed #333a48;
    border-radius:12px;
    padding:26px 18px;
    text-align:center;
    cursor:pointer;
    transition:.15s border-color,.15s background;
    background:rgba(255,255,255,.015);
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:rgba(91,140,255,.07);}
  .drop strong{display:block;font-size:15px;margin-bottom:4px;}
  .drop span{color:var(--muted);font-size:12.5px;}
  .drop input{display:none;}

  /* ---- settings ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-top:4px;
  }
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input[type="number"]{
    width:100%;
    background:#0e1116;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:9px;
    padding:9px 10px;
    font:inherit;
    font-variant-numeric:tabular-nums;
    outline:none;
    transition:.15s border-color,box-shadow;
  }
  .field input[type="number"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(91,140,255,.18);
  }
  .check{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--text);user-select:none;cursor:pointer;
    padding-top:22px;
  }
  .check input{accent-color:var(--accent);width:16px;height:16px;}

  /* ---- buttons ---- */
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;}
  button{
    font:inherit;font-weight:600;
    border-radius:10px;
    border:1px solid var(--line);
    background:#1e2430;
    color:var(--text);
    padding:10px 16px;
    cursor:pointer;
    transition:.15s all;
  }
  button:hover:not(:disabled){background:#27303f;border-color:#3a4557;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    border-color:var(--accent-2);
    color:#fff;
    box-shadow:0 6px 18px rgba(91,140,255,.28);
  }
  button.primary:hover:not(:disabled){filter:brightness(1.08);}

  .meta{color:var(--muted);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums;}

  /* ---- progress ---- */
  #progressWrap{margin-top:14px;display:none;}
  .bar{
    height:8px;border-radius:99px;background:#0e1116;overflow:hidden;
    border:1px solid var(--line);
  }
  .bar > i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),#8ab0ff);
    transition:width .08s linear;
  }
  #progressText{font-size:12.5px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums;}

  /* ---- output ---- */
  #sheetWrap{display:none;}
  #sheet{
    display:block;
    max-width:100%;
    height:auto;
    border-radius:10px;
    border:1px solid var(--line);
    background:#111;
  }
  .msg{font-size:12.5px;margin-top:10px;}
  .msg.warn{color:var(--warn);}
  .msg.err{color:var(--err);}
  .scroll{max-height:70vh;overflow:auto;border-radius:10px;}

  /* offscreen video used for decoding */
  #video{
    position:fixed;
    left:-99999px;
    top:0;
    width:320px;
    height:auto;
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Video → Contact Sheet</h1>
    <p>Grabs one frame every <strong>1&nbsp;second</strong> (configurable) and tiles them into a single PNG — no frame limit.</p>
  </header>

  <!-- ============ INPUT ============ -->
  <div class="panel">
    <label class="drop" id="drop">
      <strong>Drop a video here or click to choose</strong>
      <span>mp4 · webm · mov · mkv — anything the browser can decode</span>
      <input type="file" id="file" accept="video/*" />
    </label>

    <div class="grid">
      <div class="field">
        <label for="interval">Interval (seconds)</label>
        <input type="number" id="interval" value="1" min="0.1" step="0.1" />
      </div>
      <div class="field">
        <label for="cols">Columns</label>
        <input type="number" id="cols" value="6" min="1" max="60" step="1" />
      </div>
      <div class="field">
        <label for="thumb">Thumb width (px)</label>
        <input type="number" id="thumb" value="180" min="40" max="1200" step="10" />
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="stamps" checked /> Timestamps</label>
      </div>
    </div>

    <div class="row">
      <button class="primary" id="generate" disabled>Generate contact sheet</button>
      <button id="cancel" disabled>Cancel</button>
      <button id="download" disabled>Download PNG</button>
      <span class="meta" id="info">No video loaded</span>
    </div>

    <div id="progressWrap">
      <div class="bar"><i id="progressBar"></i></div>
      <div id="progressText">Working…</div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- ============ OUTPUT ============ -->
  <div class="panel" id="sheetWrap">
    <div class="scroll"><canvas id="sheet"></canvas></div>
  </div>

</div>

<video id="video" muted playsinline preload="auto"></video>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const dropEl     = $("drop");
  const fileInput  = $("file");
  const video      = $("video");
  const infoEl     = $("info");
  const msgEl      = $("msg");
  const genBtn     = $("generate");
  const cancelBtn  = $("cancel");
  const dlBtn      = $("download");
  const progWrap   = $("progressWrap");
  const progBar    = $("progressBar");
  const progText   = $("progressText");
  const sheetWrap  = $("sheetWrap");
  const sheet      = $("sheet");

  const intervalEl = $("interval");
  const colsEl     = $("cols");
  const thumbEl    = $("thumb");
  const stampsEl   = $("stamps");

  // Canvas limits — browsers refuse absurdly large canvases.
  const PAD = 10, GAP = 6;
  const MAX_W = 16000, MAX_H = 16000, MAX_PX = 120e6;
  const MIN_THUMB = 16;

  let objectURL   = null;
  let duration    = 0;
  let vidW        = 0;
  let vidH        = 0;
  let ready       = false;
  let generating  = false;
  let cancelled   = false;
  let lastBlobURL = null;

  /* ------------------------------------------------------------------ */
  /*  Helpers                                                            */
  /* ------------------------------------------------------------------ */

  function setMsg(text, cls = "") {
    msgEl.textContent = text;
    msgEl.className = "msg" + (cls ? " " + cls : "");
  }

  function fmtTime(t) {
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return m + ":" + (s < 10 ? "0" : "") + s.toFixed(2);
  }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  /* Wait until the video has seeked to `time`. */
  function seekTo(time) {
    return new Promise(resolve => {
      let settled = false;
      const done = () => {
        if (settled) return;
        settled = true;
        video.removeEventListener("seeked", done);
        clearTimeout(timer);
        resolve();
      };
      const timer = setTimeout(done, 3000); // safety net
      video.addEventListener("seeked", done);
      try {
        video.currentTime = time;
      } catch (e) {
        done();
      }
    });
  }

  /* Seek + let the browser paint the new frame. */
  async function seekAndSettle(time) {
    if (Math.abs(video.currentTime - time) > 0.0005 || video.readyState < 2) {
      await seekTo(time);
    }
    // yield to the UI / compositor
    await new Promise(r => setTimeout(r, 0));
  }

  /* Some files report duration = Infinity until you seek far ahead. */
  function resolveDuration(v) {
    return new Promise(resolve => {
      if (isFinite(v.duration) && v.duration > 0) return resolve(v.duration);
      const onSeeked = () => {
        v.removeEventListener("seeked", onSeeked);
        const d = v.duration;
        v.currentTime = 0;
        resolve(isFinite(d) && d > 0 ? d : 0);
      };
      v.addEventListener("seeked", onSeeked);
      try { v.currentTime = 1e6; } catch (e) { resolve(0); }
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Layout calculation                                                 */
  /* ------------------------------------------------------------------ */

  function computeLayout(n, aspect, desiredThumbW, desiredCols, stamps) {
    for (let thumbW = desiredThumbW; thumbW >= MIN_THUMB; thumbW -= 2) {
      const thumbH = Math.max(1, Math.round(thumbW / aspect));
      const labelH = stamps
        ? Math.min(17, Math.max(11, Math.round(thumbH * 0.5)))
        : 0;

      const maxColsW = Math.floor((MAX_W - 2 * PAD + GAP) / (thumbW + GAP));
      if (maxColsW < 1) continue;

      const startC = Math.min(desiredCols, maxColsW);
      for (let c = startC; c <= maxColsW; c++) {
        const rows = Math.ceil(n / c);
        const w = 2 * PAD + c * thumbW + (c - 1) * GAP;
        const h = 2 * PAD + rows * (thumbH + labelH) + (rows - 1) * GAP;
        if (w <= MAX_W && h <= MAX_H && w * h <= MAX_PX) {
          return { thumbW, thumbH, labelH, cols: c, rows, w, h };
        }
      }
    }
    return null;
  }

  function updateEstimate() {
    if (!ready) return;
    const interval   = Math.max(0.01, parseFloat(intervalEl.value) || 1);
    const desiredCols = clamp(parseInt(colsEl.value, 10) || 6, 1, 60);
    const desiredThumbW = clamp(parseInt(thumbEl.value, 10) || 180, 40, 1200);
    const n = Math.max(1, Math.floor(duration / interval) + 1);

    const layout = computeLayout(n, vidW / vidH, desiredThumbW, desiredCols, stampsEl.checked);
    if (!layout) {
      infoEl.textContent =
        `${vidW}×${vidH} · ${duration.toFixed(2)}s · ${n} frames · too large to render`;
    } else {
      infoEl.textContent =
        `${vidW}×${vidH} · ${duration.toFixed(2)}s · ${n} frames · ` +
        `${layout.cols}×${layout.rows} grid` +
        (layout.thumbW < desiredThumbW ? ` (thumb ${layout.thumbW}px)` : "");
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Loading                                                            */
  /* ------------------------------------------------------------------ */

  function loadFile(file) {
    if (!file) return;
    if (!file.type.startsWith("video/") && !/\.(mp4|webm|mov|m4v|mkv|ogv)$/i.test(file.name)) {
      setMsg("That doesn't look like a video file.", "err");
      return;
    }

    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(file);

    ready = false;
    duration = 0; vidW = 0; vidH = 0;
    genBtn.disabled = true;
    dlBtn.disabled = true;
    sheetWrap.style.display = "none";
    progWrap.style.display = "none";
    setMsg("");
    infoEl.textContent = "Loading " + file.name + " …";

    video.src = objectURL;
    video.load();
  }

  video.addEventListener("loadedmetadata", async () => {
    duration = await resolveDuration(video);
    vidW = video.videoWidth;
    vidH = video.videoHeight;

    if (!duration || !vidW || !vidH) {
      infoEl.textContent = "Could not read this video";
      setMsg("This file could not be decoded by the browser. Try MP4 (H.264) or WebM.", "err");
      return;
    }

    ready = true;
    genBtn.disabled = false;
    updateEstimate();
  });

  video.addEventListener("error", () => {
    infoEl.textContent = "Load error";
    setMsg("Failed to load the video. The format may be unsupported by this browser.", "err");
  });

  /* ------------------------------------------------------------------ */
  /*  Generation                                                         */
  /* ------------------------------------------------------------------ */

  async function generate() {
    if (generating || !ready) return;

    generating = true;
    cancelled = false;
    genBtn.disabled = true;
    cancelBtn.disabled = false;
    dlBtn.disabled = true;
    sheetWrap.style.display = "none";
    setMsg("");
    progWrap.style.display = "block";
    progBar.style.width = "0%";
    progText.textContent = "Preparing…";

    // --- read settings ------------------------------------------------
    const interval     = clamp(parseFloat(intervalEl.value) || 1, 0.01, 3600);
    const desiredCols  = clamp(parseInt(colsEl.value, 10) || 6, 1, 60);
    const desiredThumbW = clamp(parseInt(thumbEl.value, 10) || 180, 40, 1200);
    const stamps       = stampsEl.checked;

    // --- build timestamps: 0, interval, 2*interval ... up to duration --
    const times = [];
    for (let t = 0; t <= duration + 1e-6; t += interval) {
      times.push(Math.min(t, duration));
    }
    if (times.length === 0) times.push(0);

    // --- auto layout --------------------------------------------------
    const layout = computeLayout(times.length, vidW / vidH, desiredThumbW, desiredCols, stamps);
    if (!layout) {
      setMsg(
        `Sheet would be too large for the browser (${times.length} frames). ` +
        `Increase the interval, reduce thumb width, or lower the video length.`,
        "err"
      );
      finishGenerate();
      return;
    }

    const { thumbW, thumbH, labelH, cols, rows, w: sheetW, h: sheetH } = layout;

    sheet.width = sheetW;
    sheet.height = sheetH;
    const ctx = sheet.getContext("2d");
    ctx.fillStyle = "#0b0d11";
    ctx.fillRect(0, 0, sheetW, sheetH);

    const fontSize = Math.max(8, Math.min(11, labelH - 3));
    ctx.textBaseline = "middle";
    ctx.font = `600 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;

    // --- loop ---------------------------------------------------------
    let drawn = 0;
    const end = Math.max(0, duration - 0.02);

    for (let i = 0; i < times.length; i++) {
      if (cancelled) break;

      const t = Math.min(times[i], end);

      try {
        await seekAndSettle(t);
        if (cancelled) break;

        const x = PAD + (i % cols) * (thumbW + GAP);
        const y = PAD + Math.floor(i / cols) * (thumbH + labelH + GAP);

        // frame
        ctx.drawImage(video, 0, 0, vidW, vidH, x, y, thumbW, thumbH);

        // subtle frame border
        ctx.strokeStyle = "rgba(255,255,255,.08)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, thumbW - 1, thumbH - 1);

        // timestamp strip
        if (stamps) {
          ctx.fillStyle = "#0b0d11";
          ctx.fillRect(x, y + thumbH, thumbW, labelH);
          ctx.fillStyle = "#8f98a8";
          ctx.fillText(fmtTime(t), x + 5, y + thumbH + labelH / 2 + 0.5);
        }

        drawn++;
      } catch (e) {
        // skip unreadable frames
      }

      const pct = ((i + 1) / times.length) * 100;
      progBar.style.width = pct.toFixed(1) + "%";
      progText.textContent = `Frame ${i + 1} / ${times.length}  (${pct.toFixed(0)}%)`;

      // let the UI breathe
      if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
    }

    // --- done ---------------------------------------------------------
    if (cancelled) {
      progText.textContent = `Cancelled — ${drawn} frame${drawn === 1 ? "" : "s"} captured.`;
      setMsg("Generation cancelled.", "warn");
    } else {
      progBar.style.width = "100%";
      progText.textContent = `Done — ${drawn} frames, ${sheetW}×${sheetH}px.`;
      sheetWrap.style.display = "block";
      dlBtn.disabled = false;

      if (layout.thumbW < desiredThumbW) {
        setMsg(
          `Thumbnails were scaled down to ${layout.thumbW}px so the sheet fits browser limits. ` +
          `Increase the interval or reduce columns to keep them larger.`,
          "warn"
        );
      } else {
        setMsg("Right-click the image to copy it, or hit Download PNG.");
      }
    }

    finishGenerate();
  }

  function finishGenerate() {
    generating = false;
    cancelBtn.disabled = true;
    genBtn.disabled = !ready;
  }

  /* ------------------------------------------------------------------ */
  /*  Download                                                           */
  /* ------------------------------------------------------------------ */

  function download() {
    if (!sheet.width) return;
    const name = "contact-sheet-" + Date.now() + ".png";
    try {
      sheet.toBlob(blob => {
        if (!blob) {
          setMsg("Could not export the sheet (canvas too large). Try a larger interval.", "err");
          return;
        }
        if (lastBlobURL) URL.revokeObjectURL(lastBlobURL);
        lastBlobURL = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = lastBlobURL;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }, "image/png");
    } catch (e) {
      setMsg("Export failed: " + e.message, "err");
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Events                                                             */
  /* ------------------------------------------------------------------ */

  dropEl.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    if (fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
  });

  ["dragenter", "dragover"].forEach(ev =>
    dropEl.addEventListener(ev, e => {
      e.preventDefault();
      e.stopPropagation();
      dropEl.classList.add("over");
    })
  );
  ["dragleave", "drop"].forEach(ev =>
    dropEl.addEventListener(ev, e => {
      e.preventDefault();
      e.stopPropagation();
      dropEl.classList.remove("over");
    })
  );
  dropEl.addEventListener("drop", e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  // prevent the whole page from opening a dropped file
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => e.preventDefault());

  genBtn.addEventListener("click", generate);
  dlBtn.addEventListener("click", download);
  cancelBtn.addEventListener("click", () => {
    if (generating) cancelled = true;
  });

  [intervalEl, colsEl, thumbEl].forEach(el =>
    el.addEventListener("input", updateEstimate)
  );
  stampsEl.addEventListener("change", updateEstimate);

  window.addEventListener("beforeunload", () => {
    if (objectURL) URL.revokeObjectURL(objectURL);
    if (lastBlobURL) URL.revokeObjectURL(lastBlobURL);
  });
})();
</script>
</body>
</html>
