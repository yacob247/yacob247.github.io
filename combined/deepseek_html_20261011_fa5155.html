<script type="module">

/* ══════════════════════════════════════════════════════════════
   CONSTANTS — building footprint (matches the factory file)
   ══════════════════════════════════════════════════════════════ */
const B = {

// Change to 4.5 to sit on top of the factory floor when merging

/* ══════════════════════════════════════════════════════════════
   RENDERER · SCENE · CAMERA
   ══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

document.body.appendChild(renderer.domElement);

/* ══════════════════════════════════════════════════════════════
   PBR TEXTURE GENERATION
   ══════════════════════════════════════════════════════════════ */

function makeCanvas(s = 512){
  const c = document.createElement('canvas');
  c.width = c.height = s;
  return c;
}

function heightToNormal(hCanvas, strength = 2.0){
  const w = hCanvas.width, h = hCanvas.height;
  const src = hCanvas.getContext('2d').getImageData(0,0,w,h).data;
  const out = new ImageData(w,h);
  const dst = out.data;
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const i  = (y*w + x)*4;
      const xl = (y*w + Math.max(0,x-1))*4;
      const xr = (y*w + Math.min(w-1,x+1))*4;
      const yu = (Math.max(0,y-1)*w + x)*4;
      const yd = (Math.min(h-1,y+1)*w + x)*4;
      const dx = (src[xr] - src[xl]) / 255;
      const dy = (src[yd] - src[yu]) / 255;
      let nx = -dx * strength, ny = -dy * strength, nz = 1.0;
      const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
      nx /= len; ny /= len; nz /= len;
      dst[i]   = (nx*0.5 + 0.5) * 255;
      dst[i+1] = (ny*0.5 + 0.5) * 255;
      dst[i+2] = (nz*0.5 + 0.5) * 255;
      dst[i+3] = 255;
    }
  }
  const nc = makeCanvas(hCanvas.width);
  nc.getContext('2d').putImageData(out, 0, 0);
  return nc;
}

function toTex(canvas, repeat = 1, srgb = true){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  return t;
}

// ——————————————— CARPET ———————————————
function makeCarpet(baseColor){
  const s = 512;
  const albedo = makeCanvas(s), rough = makeCanvas(s), height = makeCanvas(s);
  const ac = albedo.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');

  ac.fillStyle = baseColor; ac.fillRect(0,0,s,s);
  const ad = ac.getImageData(0,0,s,s);
  for (let i = 0; i < ad.data.length; i += 4){
    const n = (Math.random() - 0.5) * 25;
    ad.data[i]   = Math.max(0, Math.min(255, ad.data[i]   + n));
    ad.data[i+1] = Math.max(0, Math.min(255, ad.data[i+1] + n));
    ad.data[i+2] = Math.max(0, Math.min(255, ad.data[i+2] + n));
  }
  ac.putImageData(ad, 0, 0);

  // Weave pattern — short crossed strokes
  for (let i = 0; i < 6000; i++){
    const x = Math.random()*s, y = Math.random()*s;
    ac.fillStyle = `rgba(0,0,0,${Math.random()*0.08})`;
    ac.fillRect(x, y, 2, 1);
    ac.fillStyle = `rgba(255,255,255,${Math.random()*0.05})`;
    ac.fillRect(x, y+1, 1, 2);
  }

  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  for (let i = 0; i < 4000; i++){
    const g = 100 + Math.random()*100;
    hc.fillStyle = `rgb(${g},${g},${g})`;
    hc.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }

  rc.fillStyle = '#f0f0f0'; rc.fillRect(0,0,s,s);

  return {
    map:          toTex(albedo, 8, true),
    normalMap:    toTex(heightToNormal(height, 0.5), 8, false),
    roughnessMap: toTex(rough, 8, false),
  };
}

// ——————————————— LIGHT WOOD (desk tops, floors) ———————————————
function makeLightWood(){
  const s = 512;
  const albedo = makeCanvas(s), rough = makeCanvas(s), height = makeCanvas(s);
  const ac = albedo.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');

  ac.fillStyle = '#c9a577'; ac.fillRect(0,0,s,s);
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);

  for (let i = 0; i < 180; i++){
    const y = Math.random()*s;
    ac.strokeStyle = `rgba(90,60,30,${Math.random()*0.15})`;
    ac.lineWidth = 0.8 + Math.random()*1.6;
    ac.beginPath(); ac.moveTo(0, y);
    for (let x = 0; x <= s; x += 32)
      ac.lineTo(x, y + Math.sin(x*0.015 + i)*3);
    ac.stroke();

    hc.strokeStyle = `rgba(${Math.random()>0.5?200:80},${Math.random()>0.5?200:80},${Math.random()>0.5?200:80},0.15)`;
    hc.lineWidth = 0.8;
    hc.beginPath(); hc.moveTo(0, y);
    for (let x = 0; x <= s; x += 32)
      hc.lineTo(x, y + Math.sin(x*0.015 + i)*3);
    hc.stroke();
  }

  for (let i = 0; i < 3; i++){
    const kx = Math.random()*s, ky = Math.random()*s;
    const g = ac.createRadialGradient(kx,ky,0,kx,ky,20);
    g.addColorStop(0, '#7a5638'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ac.fillStyle = g; ac.beginPath(); ac.arc(kx,ky,20,0,Math.PI*2); ac.fill();
  }

  rc.fillStyle = '#b0b0b0'; rc.fillRect(0,0,s,s);

  return {
    map:          toTex(albedo, 1, true),
    normalMap:    toTex(heightToNormal(height, 0.7), 1, false),
    roughnessMap: toTex(rough, 1, false),
  };
}

// ——————————————— DARK WOOD (executive, conference) ———————————————
function makeDarkWood(){
  const s = 512;
  const albedo = makeCanvas(s), rough = makeCanvas(s), height = makeCanvas(s);
  const ac = albedo.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');
  ac.fillStyle = '#4a2f1e'; ac.fillRect(0,0,s,s);
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  for (let i = 0; i < 220; i++){
    const y = Math.random()*s;
    ac.strokeStyle = `rgba(20,10,0,${Math.random()*0.2})`;
    ac.lineWidth = 0.6 + Math.random()*1.4;
    ac.beginPath(); ac.moveTo(0, y);
    for (let x = 0; x <= s; x += 32)
      ac.lineTo(x, y + Math.sin(x*0.02 + i)*3);
    ac.stroke();
  }
  rc.fillStyle = '#909090'; rc.fillRect(0,0,s,s);
  return {
    map:          toTex(albedo, 1, true),
    normalMap:    toTex(heightToNormal(height, 0.6), 1, false),
    roughnessMap: toTex(rough, 1, false),
  };
}

// ——————————————— POLISHED CONCRETE (lobby floor) ———————————————
function makePolishedConcrete(){
  const s = 512;
  const albedo = makeCanvas(s), rough = makeCanvas(s), height = makeCanvas(s);
  const ac = albedo.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');
  ac.fillStyle = '#c0bcb4'; ac.fillRect(0,0,s,s);
  const ad = ac.getImageData(0,0,s,s);
  for (let i = 0; i < ad.data.length; i += 4){
    const n = (Math.random() - 0.5) * 14;
    ad.data[i]   += n; ad.data[i+1] += n; ad.data[i+2] += n;
  }
  ac.putImageData(ad, 0, 0);
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  rc.fillStyle = '#505050'; rc.fillRect(0,0,s,s);   // polished = low roughness
  return {
    map:          toTex(albedo, 6, true),
    normalMap:    toTex(heightToNormal(height, 0.5), 6, false),
    roughnessMap: toTex(rough, 6, false),
  };
}

// ——————————————— WHITE PAINTED WALL ———————————————
function makePaintedWall(){
  const s = 512;
  const albedo = makeCanvas(s), rough = makeCanvas(s), height = makeCanvas(s);
  const ac = albedo.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');
  ac.fillStyle = '#eceae5'; ac.fillRect(0,0,s,s);
  const ad = ac.getImageData(0,0,s,s);
  for (let i = 0; i < ad.data.length; i += 4){
    const n = (Math.random() - 0.5) * 6;
    ad.data[i]   += n; ad.data[i+1] += n; ad.data[i+2] += n;
  }
  ac.putImageData(ad, 0, 0);
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  rc.fillStyle = '#e0e0e0'; rc.fillRect(0,0,s,s);
  return {
    map:          toTex(albedo, 3, true),
    normalMap:    toTex(heightToNormal(height, 0.3), 3, false),
    roughnessMap: toTex(rough, 3, false),
  };
}

// ——————————————— CEILING TILE ———————————————
function makeCeilingTile(){
  const s = 512;
  const albedo = makeCanvas(s), rough = makeCanvas(s), height = makeCanvas(s);
  const ac = albedo.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');
  ac.fillStyle = '#f4f3ef'; ac.fillRect(0,0,s,s);
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  // 2x2 tile grid, seams
  ac.strokeStyle = 'rgba(0,0,0,0.18)'; ac.lineWidth = 3;
  hc.strokeStyle = '#505050'; hc.lineWidth = 4;
  for (let i = 0; i <= s; i += s/2){
    ac.beginPath(); ac.moveTo(i, 0); ac.lineTo(i, s); ac.stroke();
    ac.beginPath(); ac.moveTo(0, i); ac.lineTo(s, i); ac.stroke();
    hc.beginPath(); hc.moveTo(i, 0); hc.lineTo(i, s); hc.stroke();
    hc.beginPath(); hc.moveTo(0, i); hc.lineTo(s, i); hc.stroke();
  }
  // Perforations
  for (let i = 0; i < 4000; i++){
    ac.fillStyle = `rgba(120,120,120,${Math.random()*0.3})`;
    ac.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
  rc.fillStyle = '#f0f0f0'; rc.fillRect(0,0,s,s);
  return {
    map:          toTex(albedo, 6, true),
    normalMap:    toTex(heightToNormal(height, 1.2), 6, false),
    roughnessMap: toTex(rough, 6, false),
  };
}

const TX = {

  carpetDark:   makeCarpet('#3a3d42'),

/* ══════════════════════════════════════════════════════════════
   WORLD ROOT + HELPERS
   ══════════════════════════════════════════════════════════════ */
const world = new THREE.Group();
world.position.y = OFFICE_Y;
scene.add(world);

function box(parent, x, y, z, w, h, d, mat, opts = {}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h/2, z);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.recv !== false;
  if (opts.rotY) m.rotation.y = opts.rotY;
  parent.add(m);
  return m;
}
function cyl(parent, x, y, z, r, h, mat, seg = 16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.position.set(x, y + h/2, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function plane(parent, x, y, z, w, d, mat, opts = {}){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  if (opts.rotZ) m.rotation.z = opts.rotZ;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ══════════════════════════════════════════════════════════════
   BUILDING SHELL — outer walls with windows, floor, ceiling
   ══════════════════════════════════════════════════════════════ */

/* OUTER WALLS with big windows to outside — 4 sides */
function windowedWall(side){
  // side: 'N', 'S', 'E', 'W'
  const wh = ROOM_H;
  const wallMat = MAT.wall;
  let wallX, wallZ, wallW, wallD, wallCX, wallCZ;

  if (side === 'N'){ wallZ = B.z2; wallW = B.x2 - B.x1; wallD = 0.3; wallCX = 0; }
  if (side === 'S'){ wallZ = B.z1; wallW = B.x2 - B.x1; wallD = 0.3; wallCX = 0; }
  if (side === 'E'){ wallX = B.x2; wallW = 0.3; wallD = B.z2 - B.z1; wallCZ = 0; }
  if (side === 'W'){ wallX = B.x1; wallW = 0.3; wallD = B.z2 - B.z1; wallCZ = 0; }

  if (side === 'N' || side === 'S'){
    // horizontal wall — split into segments around windows
    const totalW = B.x2 - B.x1;
    const winW = 3.5;
    const winGap = 1.0;
    const nWin = Math.floor((totalW - 2) / (winW + winGap));
    const startX = -((nWin * (winW + winGap) - winGap) / 2);
    // Base wall band below windows (sill height 0.9)
    box(shell, wallCX, 0, wallZ, totalW, 0.9, wallD, wallMat);
    // Top band above windows (from 3.0 to top)
    box(shell, wallCX, 3.0, wallZ, totalW, wh - 3.0, wallD, wallMat);
    // Between-window strips
    for (let i = 0; i <= nWin; i++){
      const x = startX - winGap/2 + i * (winW + winGap);
      box(shell, x, 0.9, wallZ, winGap, 2.1, wallD, wallMat);
    }
    // Windows — glass
    for (let i = 0; i < nWin; i++){
      const x = startX + i * (winW + winGap) + winW/2;
      box(shell, x, 0.9, wallZ, winW, 2.1, 0.04, MAT.glass, { cast:false });
      // Window frame — thin black outline
      box(shell, x, 0.9, wallZ + 0.01, winW + 0.1, 0.05, 0.08, MAT.frame);
      box(shell, x, 2.95, wallZ + 0.01, winW + 0.1, 0.05, 0.08, MAT.frame);
    }
  }
  if (side === 'E' || side === 'W'){
    const totalD = B.z2 - B.z1;
    const winW = 3.5;
    const winGap = 1.0;
    const nWin = Math.floor((totalD - 2) / (winW + winGap));
    const startZ = -((nWin * (winW + winGap) - winGap) / 2);
    box(shell, wallX, 0, wallCZ, wallW, 0.9, totalD, wallMat);
    box(shell, wallX, 3.0, wallCZ, wallW, wh - 3.0, totalD, wallMat);
    for (let i = 0; i <= nWin; i++){
      const z = startZ - winGap/2 + i * (winW + winGap);
      box(shell, wallX, 0.9, z, wallW, 2.1, winGap, wallMat);
    }
    for (let i = 0; i < nWin; i++){
      const z = startZ + i * (winW + winGap) + winW/2;
      box(shell, wallX, 0.9, z, 0.04, 2.1, winW, MAT.glass, { cast:false });
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   GLASS PARTITION WALL BUILDER
   The signature visual — black-framed glass panels.
   ══════════════════════════════════════════════════════════════ */

/**
 * Build a glass partition between two points.
 * (x1,z1) and (x2,z2) must share one coordinate (either X or Z).
 * doors: array of { center, width } describing openings.
 */
function glassWall(g, x1, z1, x2, z2, opts = {}){
  const h = opts.h || GLASS_TOP;
  const frameW = 0.06;
  const horizontal = (Math.abs(z1 - z2) < 0.01);

  const length = horizontal ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
  const start  = horizontal ? Math.min(x1, x2) : Math.min(z1, z2);
  const fixed  = horizontal ? z1 : x1;

  const doors = opts.doors || [];

  // Helper: is (t) inside a door?
  const inDoor = (t) => doors.some(d => t > d.center - d.width/2 && t < d.center + d.width/2);

  // Frame edges
  const steps = Math.max(2, Math.floor(length / 1.2));
  const seg = length / steps;

  // Bottom rail — continuous (skip door openings)
  for (let i = 0; i < steps; i++){
    const t0 = start + i * seg;
    const t1 = t0 + seg;
    if (inDoor((t0 + t1) / 2)) continue;

    if (horizontal){
      box(g, (t0 + t1)/2, 0,        fixed, seg, frameW, 0.06, MAT.frame);
      box(g, (t0 + t1)/2, h - frameW, fixed, seg, frameW, 0.06, MAT.frame);
      // Glass pane
      box(g, (t0 + t1)/2, frameW, fixed, seg - 0.02, h - 2*frameW, 0.03, MAT.glass, { cast:false });
    } else {
      box(g, fixed, 0,        (t0 + t1)/2, 0.06, frameW, seg, MAT.frame);
      box(g, fixed, h - frameW, (t0 + t1)/2, 0.06, frameW, seg, MAT.frame);
      box(g, fixed, frameW, (t0 + t1)/2, 0.03, h - 2*frameW, seg - 0.02, MAT.glass, { cast:false });
    }
  }

  // Vertical mullions at panel joints
  for (let i = 0; i <= steps; i++){
    const t = start + i * seg;
    if (inDoor(t)) continue;
    if (horizontal){
      box(g, t, 0, fixed, frameW, h, 0.06, MAT.frame);
    } else {
      box(g, fixed, 0, t, 0.06, h, frameW, MAT.frame);
    }
  }
}

/* Build a solid (opaque) wall segment */
function wallSeg(g, x1, z1, x2, z2, h = ROOM_H, mat = MAT.wall){
  const horizontal = (Math.abs(z1 - z2) < 0.01);
  const len = horizontal ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
  const cx  = (x1 + x2) / 2;
  const cz  = (z1 + z2) / 2;
  if (horizontal){
    box(g, cx, 0, cz, len, h, 0.15, mat);
  } else {
    box(g, cx, 0, cz, 0.15, h, len, mat);
  }
}

/* Big palm-like plant — a signature feature of the reference images */
function bigPlant(g, x, z){
  // Pot
  cyl(g, x, 0, z, 0.34, 0.55, MAT.pot, 20);
  cyl(g, x, 0.55, z, 0.32, 0.02, MAT.soil, 20);
  // Trunk
  cyl(g, x, 0.55, z, 0.05, 0.9, MAT.trunk, 8);
  // Palm fronds — thin tapered planes radiating out and up
  const fronds = 10;
  for (let i = 0; i < fronds; i++){
    const angle = (i / fronds) * Math.PI * 2 + Math.random() * 0.3;
    const tilt  = 0.4 + Math.random() * 0.5;
    const len   = 1.2 + Math.random() * 0.5;
    // Frond as a stretched, curved plane
    const frondGeo = new THREE.PlaneGeometry(0.5, len, 1, 4);
    const positions = frondGeo.attributes.position;
    for (let v = 0; v < positions.count; v++){
      const y = positions.getY(v);
      const t = (y / len + 0.5);
      positions.setX(v, positions.getX(v) * (1 - t * 0.7));  // taper
      positions.setZ(v, Math.sin(t * Math.PI) * 0.15);       // slight curve
    }
    frondGeo.computeVertexNormals();
    const frond = new THREE.Mesh(frondGeo, MAT.leafPalm);
    frond.position.set(x + Math.cos(angle) * 0.3, 1.4 + Math.sin(tilt) * 0.5, z + Math.sin(angle) * 0.3);
    frond.rotation.y = angle + Math.PI/2;
    frond.rotation.x = tilt;
    frond.castShadow = true;
    g.add(frond);
  }
  // Inner clusters of leaves
  for (let i = 0; i < 8; i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.15 + Math.random()*0.12, 6, 5), MAT.leafSmall);
    s.position.set(x + (Math.random()-0.5)*0.6, 1.5 + Math.random()*0.5, z + (Math.random()-0.5)*0.6);
    s.castShadow = true;
    g.add(s);
  }
}

/* Suspended linear LED light fixture */

  const half = len / 2;
  cyl(g, x - half * Math.cos(rotY), height, z, 0.01, 0.3, MAT.frame);
  cyl(g, x + half * Math.cos(rotY), height, z, 0.01, 0.3, MAT.frame);

  box(g, x, height - 0.05, z, len, 0.06, 0.08, MAT.pendantBody, { rotY });

/* Track spotlight — for corridors (matches image 3) */
function trackSpot(g, x, z, rotY = 0){
  // Rail
  box(g, x, ROOM_H - 0.05, z, 2.4, 0.06, 0.08, MAT.frame, { rotY });
  // 3 heads
  for (let i = 0; i < 3; i++){
    const t = (i - 1) * 0.7;
    const hx = x + t * Math.cos(rotY);
    const hz = z + t * Math.sin(rotY);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.18, 12), MAT.pendantBody);
    head.position.set(hx, ROOM_H - 0.22, hz);
    head.rotation.z = 0.4;
    g.add(head);
    const l = new THREE.PointLight(0xfff0d0, 2.5, 8, 2);
    l.position.set(hx, ROOM_H - 0.4, hz);
    g.add(l);
  }
}

/* Ceiling AC duct — long rectangular run with periodic vents */
function acDuct(g, x1, z1, x2, z2){
  const horizontal = Math.abs(z1 - z2) < 0.01;
  const len = horizontal ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
  const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  const y = ROOM_H - 0.5;
  if (horizontal){
    box(g, cx, y, cz, len, 0.4, 0.6, MAT.ductInsul);
    // Vents
    for (let t = -len/2 + 1; t < len/2 - 1; t += 4){
      box(g, cx + t, y - 0.05, cz, 0.8, 0.02, 0.5, MAT.frame);
    }
  } else {
    box(g, cx, y, cz, 0.6, 0.4, len, MAT.ductInsul);
    for (let t = -len/2 + 1; t < len/2 - 1; t += 4){
      box(g, cx, y - 0.05, cz + t, 0.5, 0.02, 0.8, MAT.frame);
    }
  }
}

/* Hanging pinboard of documents (for corporate wall) */
function pinboard(g, x, y, z, w = 3, h = 1.6, rotY = 0){
  box(g, x, y, z, w, h, 0.05, MAT.deskWood, { rotY });
  for (let i = 0; i < 6; i++){

    box(g, px, py, z + 0.03 * Math.cos(rotY), 0.35, 0.5, 0.01, MAT.white, { rotY });
  }
}

   ROOM DEFINITIONS
   Every room is defined by its X/Z bounds. Walls are added
   between rooms using glassWall or wallSeg.

const rooms = {};   // live THREE.Group per room — for convenience

/* Shared group for all interior partitions & props */
const interior = new THREE.Group();
world.add(interior);

/* Small helper: get or create a room group */
function room(name){
  if (!rooms[name]){
    rooms[name] = new THREE.Group();
    rooms[name].userData.name = name;
    interior.add(rooms[name]);
  }
  return rooms[name];
}

sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;

/* Toggle ceiling lights */
let lit = true;
const allPointLights = [];
scene.traverse(o => { if (o.isPointLight && o.parent && o.parent.parent === world) allPointLights.push(o); });

function toggleLights(){
  lit = !lit;
  for (const l of allPointLights) l.visible = lit;
  sun.intensity = lit ? 1.4 : 0.6;
  hemi.intensity = lit ? 0.55 : 0.2;
  warmFill.visible = lit;
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const controls = new PointerLockControls(camera, renderer.domElement);
const PLAYER = { height: 1.7, crouch: 1.05, speed: 4.8, sprint: 8.0, crouchSpeed: 2.4 };
const keys = {};

camera.position.set(24, PLAYER.height, -40);   // spawn in the lobby

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyF') toggleLights();
});
addEventListener('keyup', e => { keys[e.code] = false; });

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock',   () => overlay.style.opacity = 0);
controls.addEventListener('unlock', () => overlay.style.opacity = 1);

/* ══════════════════════════════════════════════════════════════
   SIMPLE COLLISION — the partitions are thin; we only collide
   with the outer building walls + the solid structural bits.
   Glass walls are see-through and mostly walk-through-able in
   this pass — for full collision, sample wall segments as AABBs.
   ══════════════════════════════════════════════════════════════ */
const colliders = [];
function addCollider(x1, z1, x2, z2){ colliders.push({ x1, z1, x2, z2 }); }

// Outer walls
addCollider(B.x1 - 0.5, B.z1 - 0.5, B.x1 + 0.5, B.z2 + 0.5);
addCollider(B.x2 - 0.5, B.z1 - 0.5, B.x2 + 0.5, B.z2 + 0.5);
addCollider(B.x1 - 0.5, B.z1 - 0.5, B.x2 + 0.5, B.z1 + 0.5);
addCollider(B.x1 - 0.5, B.z2 - 0.5, B.x2 + 0.5, B.z2 + 0.5);

// Conference room wall at X = 0
addCollider(-0.2, -56, 0.2, -36);
// Kitchen wall at X = -34
addCollider(-34.2, -56, -34.2, -36);
// Manager wall
addCollider(19.8, -28, 20.2, -16);
addCollider(20, -16.2, 44, -15.8);

// Just the solid / opaque walls for now. Glass is passable.

function canMove(x, z){
  const r = 0.4;
  for (const c of colliders){
    if (x + r > c.x1 && x - r < c.x2 && z + r > c.z1 && z - r < c.z2) return false;
  }
  return true;
}

/* ══════════════════════════════════════════════════════════════
   HUD + ZONE
   ══════════════════════════════════════════════════════════════ */
const zoneName  = document.getElementById('zonename');
const zoneCoord = document.getElementById('zonecoord');

function currentZone(x, z){
  // Lobby / tower area
  if (x > 0 && z < -36) return 'LOBBY · RECEPTION';
  if (x > -34 && x < 0 && z < -36) return 'CONFERENCE ROOM';
  if (x < -34 && z < -36) return 'KITCHEN';

  // Corridors
  if (z > -34 && z < -30) return 'CORRIDOR · NORTH';
  if (z > -2 && z < 2) return 'CORRIDOR · CENTER';
  if (z > 42 && z < 46) return 'CORRIDOR · SOUTH';

  // Private offices west
  if (x < -34 && z < -16) return 'PRIVATE OFFICE 1';
  if (x < -34 && z < -4) return 'PRIVATE OFFICE 2';
  if (x < -34 && z < 20) return 'PRIVATE OFFICE 3';
  if (x < -34 && z < 36) return 'QUIET ROOM';

  // Meetings west
  if (x > -30 && x < -18 && z < -16) return 'MEETING ROOM 1';
  if (x > -30 && x < -18 && z < -4)  return 'MEETING ROOM 2';
  if (x > -30 && x < -18 && z < 20)  return 'ARCHIVE';
  if (x > -30 && x < -18 && z < 40)  return 'MEETING ROOM 4';

  // Open offices
  if (x > -18 && x < 20 && z < -4) return 'OPEN OFFICE 1';
  if (x > -18 && x < 20 && z < 42) return 'OPEN OFFICE 2';
  if (x > -18 && x < 20 && z < 56) return 'OPEN OFFICE 3';

  // Manager / right side
  if (x > 20 && z < -16) return 'MANAGER OFFICE';
  if (x > 20 && x < 32 && z < -4) return 'SERVER ROOM';
  if (x > 32 && z < -4) return 'MEETING ROOM 3';
  if (x > 20 && z < 20) return 'BREAK ROOM';
  if (x > 20 && x < 32 && z < 40) return 'COPY ROOM';
  if (x > 32 && z < 40) return 'OFFICE 5';
  if (x > 20 && z < 56) return 'REST AREA';
  if (x < -34 && z < 56) return 'STORAGE';
  if (x < -18 && x > -30 && z < 56) return 'IT ROOM';

  return 'OFFICE FLOOR';
}

/* ══════════════════════════════════════════════════════════════
   MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3();
const right = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  const crouching = !!(keys['ControlLeft'] || keys['KeyC']);
  const targetH = crouching ? PLAYER.crouch : PLAYER.height;
  camera.position.y += (targetH - camera.position.y) * Math.min(1, dt * 10);

  camera.getWorldDirection(fwd);
  fwd.y = 0; fwd.normalize();
  right.crossVectors(fwd, camera.up).normalize();

  const speed = crouching ? PLAYER.crouchSpeed : (keys['ShiftLeft'] ? PLAYER.sprint : PLAYER.speed);
  const mv = new THREE.Vector3();
  if (keys['KeyW']) mv.add(fwd);
  if (keys['KeyS']) mv.sub(fwd);
  if (keys['KeyD']) mv.add(right);
  if (keys['KeyA']) mv.sub(right);
  if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed * dt);

  const nx = camera.position.x + mv.x;
  const nz = camera.position.z + mv.z;
  if (canMove(nx, camera.position.z)) camera.position.x = nx;
  if (canMove(camera.position.x, nz)) camera.position.z = nz;

  zoneName.textContent = currentZone(camera.position.x, camera.position.z);
  zoneCoord.textContent = `X ${camera.position.x.toFixed(1)} · Z ${camera.position.z.toFixed(1)}`;

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
