<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Realistic Rain — Pure WebGL2</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0e14; }
  canvas { display:block; width:100vw; height:100vh; }
  #info { position:fixed; top:14px; left:14px; color:#fff;
          font:13px system-ui,sans-serif;
          background:rgba(0,0,0,0.4); padding:8px 14px;
          border-radius:6px; pointer-events:none; z-index:10; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
          color:rgba(255,255,255,0.65); font:12px system-ui; z-index:10;
          pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Rain — <span id="state">Heavy</span></div>
<div id="hint">Click canvas · Mouse look · WASD move · Space/Shift up-down</div>
<script>
'use strict';

/* ============================================================
   CANVAS & GL
   ============================================================ */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias:true, alpha:false, powerPreference:'high-performance' });
if (!gl) { document.body.innerHTML = '<h2 style="color:#fff">WebGL2 required</h2>'; throw 0; }

/* ============================================================
   MATRICES
   ============================================================ */
const M4 = () => new Float32Array(16);
function m4perspective(o, fovy, asp, n, f) {
  const t = 1/Math.tan(fovy/2);
  o[0]=t/asp;o[1]=0;o[2]=0;o[3]=0;
  o[4]=0;o[5]=t;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=(f+n)/(n-f);o[11]=-1;
  o[12]=0;o[13]=0;o[14]=2*f*n/(n-f);o[15]=0;
  return o;
}
function m4lookAt(o, ex,ey,ez, cx,cy,cz, ux,uy,uz) {
  let zx=ex-cx, zy=ey-cy, zz=ez-cz;
  let l=Math.hypot(zx,zy,zz); zx/=l; zy/=l; zz/=l;
  let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
  l=Math.hypot(xx,xy,xz); xx/=l; xy/=l; xz/=l;
  let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1;
  return o;
}
function m4mul(o, a, b) {
  for (let i=0;i<4;i++){
    const a0=a[i],a1=a[i+4],a2=a[i+8],a3=a[i+12];
    o[i]    = a0*b[0]+a1*b[1]+a2*b[2]+a3*b[3];
    o[i+4]  = a0*b[4]+a1*b[5]+a2*b[6]+a3*b[7];
    o[i+8]  = a0*b[8]+a1*b[9]+a2*b[10]+a3*b[11];
    o[i+12] = a0*b[12]+a1*b[13]+a2*b[14]+a3*b[15];
  }
  return o;
}

/* ============================================================
   SHADER HELPERS
   ============================================================ */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src); throw 0;
  }
  return s;
}
function link(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p)); throw 0;
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace('[0]','');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

/* ============================================================
   SUN / SKY CONSTANTS
   ============================================================ */
const sunDir = (()=>{
  const v = [0.35, 0.65, 0.5];
  const l = Math.hypot(v[0],v[1],v[2]);
  return [v[0]/l, v[1]/l, v[2]/l];
})();
const sunColor  = [1.00, 0.94, 0.82];
const skyTop    = [0.055, 0.075, 0.115];
const skyHorizon= [0.16,  0.20,  0.26];
const groundCol = [0.035, 0.045, 0.060];
const fogColor  = [0.09,  0.12,  0.16];

/* ============================================================
   SKY (background)
   ============================================================ */
const skyVS = `#version 300 es
  layout(location=0) in vec2 aPos;
  out vec2 vNdc;
  void main(){ vNdc = aPos; gl_Position = vec4(aPos, 0.999999, 1.0); }`;

const skyFS = `#version 300 es
  precision highp float;
  in vec2 vNdc;
  out vec4 outColor;
  uniform mat4 uInvVP;
  uniform vec3 uSunDir, uSunColor, uCamPos;
  uniform vec3 uSkyTop, uSkyHorizon, uFog;
  uniform float uTime;

  float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),
               mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
  }
  float fbm2(vec2 p){
    return 0.55*vnoise(p)+0.30*vnoise(p*2.07+vec2(5.2,1.3))+0.15*vnoise(p*4.13+vec2(1.7,9.1));
  }

  void main(){
    vec4 nh = uInvVP * vec4(vNdc, -1.0, 1.0);
    vec4 fh = uInvVP * vec4(vNdc,  1.0, 1.0);
    vec3 dir = normalize(fh.xyz/fh.w - nh.xyz/nh.w);
    float y = dir.y;

    // Overcast gradient
    vec3 col = y >= 0.0
      ? mix(uSkyHorizon, uSkyTop, pow(y, 0.55))
      : mix(uSkyHorizon, uFog,      pow(-y, 0.7));

    // Heavy storm clouds — big and dark
    if (y > 0.02) {
      vec2 uv = dir.xz / (y + 0.15) * 1.1 + uTime * 0.005;
      float c1 = fbm2(uv * 0.9);
      float c2 = fbm2(uv * 2.3 + vec2(3.1, 7.7));
      float cloud = smoothstep(0.35, 0.75, c1 * 0.7 + c2 * 0.3);
      float density = smoothstep(0.02, 0.28, y);
      // dark undersides, slightly brighter tops
      vec3 cloudDark = vec3(0.06, 0.075, 0.10);
      vec3 cloudLit  = vec3(0.20, 0.24, 0.30);
      float lit = smoothstep(0.0, 0.6, dot(dir, uSunDir));
      vec3 cCol = mix(cloudDark, cloudLit, lit);
      col = mix(col, cCol, cloud * 0.85 * density);
    }

    // Soft sun glow behind clouds
    float sd = max(dot(dir, uSunDir), 0.0);
    col += uSunColor * pow(sd, 6.0) * 0.10;

    outColor = vec4(col, 1.0);
  }`;

/* ============================================================
   GROUND (dark, wet, with rain ripples)
   ============================================================ */
const groundVS = `#version 300 es
  layout(location=0) in vec3 aPos;
  uniform mat4 uVP;
  uniform vec2 uGridOffset;
  out vec3 vWorldPos, vNormal;
  void main(){
    vec2 wp = aPos.xz + uGridOffset;
    vec3 p = vec3(wp.x, 0.0, wp.y);
    vWorldPos = p; vNormal = vec3(0.0, 1.0, 0.0);
    gl_Position = uVP * vec4(p, 1.0);
  }`;

const groundFS = `#version 300 es
  precision highp float;
  in vec3 vWorldPos, vNormal;
  out vec4 outColor;
  uniform float uTime;
  uniform vec3 uCamPos, uSunDir, uSunColor;
  uniform vec3 uGroundColor, uSkyHorizon, uFog;

  float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),
               mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
  }

  // Expanding ring from each "drop hit" cell
  float rippleField(vec2 p, float t, float scale) {
    vec2 cell = floor(p / scale);
    vec2 uv = fract(p / scale) - 0.5;
    float h = hash21(cell);
    float phase = fract(t * 0.8 + h * 7.13);
    float r = length(uv) * 1.6;
    // ring: bright edge expanding outward
    float ring = smoothstep(phase - 0.06, phase, r) *
                 (1.0 - smoothstep(phase, phase + 0.12, r));
    // fade as it expands + individual per-cell fade
    float fade = (1.0 - phase) * (1.0 - phase);
    return ring * fade;
  }

  void main(){
    vec3 N = normalize(vNormal);
    vec3 V = normalize(uCamPos - vWorldPos);
    vec3 L = normalize(uSunDir);

    // Base ground — dark and wet
    vec3 col = uGroundColor;

    // Ripples: 3 octaves at different scales = looks like many drops hitting
    vec2 p = vWorldPos.xz;
    float t = uTime;
    float ripples = 0.0;
    ripples += rippleField(p,          t,        2.5) * 1.00;
    ripples += rippleField(p * 1.7 + 41.0, t,    1.6) * 0.65;
    ripples += rippleField(p * 3.1 + 17.0, t,    1.0) * 0.45;
    ripples = clamp(ripples, 0.0, 1.0);

    // Ripples brighten the ground (wet sparkle)
    col += vec3(0.55, 0.70, 0.90) * ripples * 0.55;

    // Direct light + fill from sky
    float NdL = max(dot(N, L), 0.0);
    col += uSunColor * NdL * 0.06;

    // Fresnel sky reflection on wet surface
    float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
    col = mix(col, uSkyHorizon, fres * 0.45);

    // Distance fade to fog
    float d = length(vWorldPos - uCamPos);
    col = mix(col, uFog, smoothstep(35.0, 110.0, d));

    outColor = vec4(col, 1.0);
  }`;

/* ============================================================
   RAIN — instanced streaks
   ============================================================ */
const rainVS = `#version 300 es
  layout(location=0) in vec2 aQuad;        // base quad (-1..1)
  layout(location=1) in vec3 aPos;         // drop head (current position)
  layout(location=2) in vec3 aVel;         // velocity
  layout(location=3) in vec2 aSize;        // (length, width)
  layout(location=4) in float aBright;     // per-drop brightness

  uniform mat4 uVP;
  uniform vec3 uCamPos;

  out vec2  vUv;
  out float vBright;
  out float vFade;
  out float vHeadGlow;

  void main(){
    vec3 toCam = uCamPos - aPos;
    float dist = length(toCam);
    vec3 V = toCam / dist;

    // Fall direction
    vec3 dir = normalize(aVel);

    // Right vector perpendicular to both view and fall direction
    vec3 right = cross(dir, V);
    float rl = length(right);
    right = rl > 0.0001 ? right / rl : vec3(1.0, 0.0, 0.0);

    // Streak runs from head (current) up to tail (opposite of fall dir)
    vec3 up = -dir;

    // quad.y=-1 → head, +1 → tail. Map to [0,1] for uv
    float t = (aQuad.y + 1.0) * 0.5;

    // Width is perpendicular to streak; length runs along it
    vec3 worldPos = aPos
                  + right * (aQuad.x * aSize.y * 0.5)
                  + up    * (t * aSize.x);

    gl_Position = uVP * vec4(worldPos, 1.0);

    vUv        = vec2(aQuad.x * 0.5 + 0.5, t);
    vBright    = aBright;

    // Fade far drops to avoid visual noise at distance
    vFade  = 1.0 - smoothstep(35.0, 85.0, dist);
    // Fade very-near drops so they don't pop in our face
    vFade *= smoothstep(0.6, 2.5, dist);

    // Head glow — brightest at leading edge
    vHeadGlow = exp(-t * 14.0);
  }`;

const rainFS = `#version 300 es
  precision highp float;
  in vec2  vUv;
  in float vBright;
  in float vFade;
  in float vHeadGlow;
  out vec4 outColor;

  uniform vec3 uSunDir;
  uniform vec3 uSunColor;
  uniform vec3 uSkyHorizon;

  void main(){
    // vUv.x: across width, 0.5 is center
    // vUv.y: 0 = head (leading edge), 1 = tail

    // Soft gaussian across the width
    float wx = vUv.x * 2.0 - 1.0;
    float widthFade = exp(-wx * wx * 5.0);

    // Length falloff — sharp at head, gradual at tail
    float ly = vUv.y;
    float headFade = smoothstep(0.00, 0.10, ly);
    float tailFade = 1.0 - smoothstep(0.45, 1.00, ly);
    float lengthFade = headFade * tailFade;

    // Composite alpha — low overall so it's translucent, not solid
    float alpha = widthFade * lengthFade * vBright * vFade;
    alpha = clamp(alpha, 0.0, 1.0);

    // Colour: cool silver-blue, tinted toward sky at the base
    vec3 col = mix(vec3(0.80, 0.88, 1.00), uSkyHorizon, 0.15);

    // Add subtle brightness at the head — like refracted light
    col += vHeadGlow * uSunColor * 0.30;

    // Reduce total alpha so it reads as water not paint
    outColor = vec4(col, alpha * 0.55);
  }`;

/* ============================================================
   SPLASHES — expanding rings on the ground
   ============================================================ */
const splashVS = `#version 300 es
  layout(location=0) in vec2 aQuad;
  layout(location=1) in vec3 aPos;
  layout(location=2) in vec2 aParams; // (age 0..1, size)

  uniform mat4 uVP;

  out vec2  vUv;
  out float vAge;

  void main(){
    float age  = aParams.x;
    float size = aParams.y;
    // Ripple expands as it ages
    float scale = size * (0.25 + age * 1.6);

    vec3 worldPos = aPos + vec3(aQuad.x * scale, 0.005, aQuad.y * scale);

    gl_Position = uVP * vec4(worldPos, 1.0);
    vUv = aQuad;
    vAge = age;
  }`;

const splashFS = `#version 300 es
  precision highp float;
  in vec2  vUv;
  in float vAge;
  out vec4 outColor;

  void main(){
    float r = length(vUv);
    // Ring: bright at leading edge of expanding circle
    float ring = smoothstep(0.65, 0.88, r) * (1.0 - smoothstep(0.88, 1.0, r));
    // Fade out as it ages
    float life = 1.0 - vAge;
    life *= life;
    float alpha = ring * life * 0.5;
    // Slight blue tint (water)
    outColor = vec4(0.75, 0.85, 1.0, alpha);
  }`;

/* ============================================================
   PROGRAMS
   ============================================================ */
const progSky     = link(skyVS,     skyFS);
const progGround  = link(groundVS,  groundFS);
const progRain    = link(rainVS,    rainFS);
const progSplash  = link(splashVS,  splashFS);

/* ============================================================
   BASE QUAD (used by rain + splash)
   ============================================================ */
const baseQuadVAO = gl.createVertexArray();
const baseQuadBuf = gl.createBuffer();
gl.bindVertexArray(baseQuadVAO);
gl.bindBuffer(gl.ARRAY_BUFFER, baseQuadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1,-1,   1,-1,   -1,1,   1,1
]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

/* ============================================================
   SKY VAO (fullscreen triangle)
   ============================================================ */
const skyVAO = gl.createVertexArray();
gl.bindVertexArray(skyVAO);
{
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
}
gl.bindVertexArray(null);

/* ============================================================
   GROUND GRID
   ============================================================ */
function makeGrid(size, segs) {
  const half = size/2, step = size/segs;
  const v = new Float32Array((segs+1)*(segs+1)*3);
  let k = 0;
  for (let j=0;j<=segs;j++) for (let i=0;i<=segs;i++) {
    v[k++] = -half + i*step;
    v[k++] = 0;
    v[k++] = -half + j*step;
  }
  const idx = new Uint32Array(segs*segs*6);
  let m = 0;
  for (let j=0;j<segs;j++) for (let i=0;i<segs;i++) {
    const a = j*(segs+1)+i, b = a+1, c = a+segs+1, d = c+1;
    idx[m++]=a; idx[m++]=c; idx[m++]=b;
    idx[m++]=b; idx[m++]=c; idx[m++]=d;
  }
  return { v, idx };
}
const GROUND_SIZE = 400, GROUND_SEGS = 120;
const groundMesh = makeGrid(GROUND_SIZE, GROUND_SEGS);
const groundVAO = gl.createVertexArray();
gl.bindVertexArray(groundVAO);
{
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, groundMesh.v, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, groundMesh.idx, gl.STATIC_DRAW);
}
gl.bindVertexArray(null);

/* ============================================================
   RAIN DROPS — instanced
   ============================================================ */
const RAIN_COUNT = 3500;
const RAIN_HALF  = 40;      // half-size of the box around camera (x,z)
const RAIN_TOP   = 30;      // spawn height
const RAIN_FLOOR = 0;       // ground

// Per-instance data layout (interleaved):
//   position (3f) | velocity (3f) | length+width (2f) | brightness (1f)
const RAIN_FLOATS = 9;
const rainData = new Float32Array(RAIN_COUNT * RAIN_FLOATS);

// JS-side simulation state
const drops = new Array(RAIN_COUNT);

// 3 layers with distinct character
function spawnDrop(i, camX, camZ, initial) {
  const r = Math.random();
  let layer;
  if (r < 0.10)      layer = 0; // near — big, fast
  else if (r < 0.40) layer = 1; // mid
  else               layer = 2; // far — small, dense

  let L, W, S;
  if (layer === 0)      { L = 0.90 + Math.random()*0.70; W = 0.020 + Math.random()*0.012; S = 17 + Math.random()*5; }
  else if (layer === 1) { L = 0.45 + Math.random()*0.40; W = 0.012 + Math.random()*0.008; S = 12 + Math.random()*4; }
  else                  { L = 0.20 + Math.random()*0.25; W = 0.006 + Math.random()*0.005; S = 9  + Math.random()*3; }

  // Wrapping position relative to camera
  const x = camX + (Math.random()*2-1) * RAIN_HALF;
  const z = camZ + (Math.random()*2-1) * RAIN_HALF;
  // If this is a respawn, we may want the drop to start above
  const y = initial
    ? RAIN_FLOOR + Math.random() * (RAIN_TOP - RAIN_FLOOR)
    : RAIN_TOP - Math.random() * 2.0;

  const bright = 0.45 + Math.random() * 0.55;

  // Slight wind skew
  const windX = 1.6 + Math.random()*0.6;
  const windZ = 0.4 + Math.random()*0.3;

  drops[i] = {
    x, y, z,
    vx: windX, vy: -S, vz: windZ,
    length: L, width: W,
    bright: bright,
  };
}

// Initialize
for (let i = 0; i < RAIN_COUNT; i++) spawnDrop(i, 0, 0, true);

// Write current drop state into the Float32Array
function writeRainData() {
  let k = 0;
  for (let i = 0; i < RAIN_COUNT; i++) {
    const d = drops[i];
    rainData[k++] = d.x;
    rainData[k++] = d.y;
    rainData[k++] = d.z;
    rainData[k++] = d.vx;
    rainData[k++] = d.vy;
    rainData[k++] = d.vz;
    rainData[k++] = d.length;
    rainData[k++] = d.width;
    rainData[k++] = d.bright;
  }
}

const rainVAO = gl.createVertexArray();
const rainBuf = gl.createBuffer();
gl.bindVertexArray(rainVAO);

// Base quad
gl.bindBuffer(gl.ARRAY_BUFFER, baseQuadBuf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// Per-instance interleaved
gl.bindBuffer(gl.ARRAY_BUFFER, rainBuf);
gl.bufferData(gl.ARRAY_BUFFER, rainData, gl.DYNAMIC_DRAW);
const STRIDE = RAIN_FLOATS * 4;
// position
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 3, gl.FLOAT, false, STRIDE, 0);
gl.vertexAttribDivisor(1, 1);
// velocity
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 3, gl.FLOAT, false, STRIDE, 12);
gl.vertexAttribDivisor(2, 1);
// size (length, width)
gl.enableVertexAttribArray(3);
gl.vertexAttribPointer(3, 2, gl.FLOAT, false, STRIDE, 24);
gl.vertexAttribDivisor(3, 1);
// brightness
gl.enableVertexAttribArray(4);
gl.vertexAttribPointer(4, 1, gl.FLOAT, false, STRIDE, 32);
gl.vertexAttribDivisor(4, 1);

gl.bindVertexArray(null);

/* ============================================================
   SPLASHES — instanced
   ============================================================ */
const SPLASH_MAX = 400;
const splashes = [];
for (let i = 0; i < SPLASH_MAX; i++) {
  splashes.push({ x:0, z:0, age: 2.0, size: 0.4, active: false });
}
let splashCursor = 0;

function spawnSplash(x, z) {
  const s = splashes[splashCursor];
  s.x = x; s.z = z;
  s.age = 0;
  s.size = 0.25 + Math.random() * 0.35;
  s.active = true;
  splashCursor = (splashCursor + 1) % SPLASH_MAX;
}

const splashData = new Float32Array(SPLASH_MAX * 5); // (x, y, z, age, size)

function writeSplashData() {
  let k = 0;
  for (let i = 0; i < SPLASH_MAX; i++) {
    const s = splashes[i];
    splashData[k++] = s.x;
    splashData[k++] = 0.01;
    splashData[k++] = s.z;
    splashData[k++] = s.active ? Math.min(s.age, 1.0) : 1.0;
    splashData[k++] = s.size;
  }
}

const splashVAO = gl.createVertexArray();
const splashBuf = gl.createBuffer();
gl.bindVertexArray(splashVAO);

gl.bindBuffer(gl.ARRAY_BUFFER, baseQuadBuf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

gl.bindBuffer(gl.ARRAY_BUFFER, splashBuf);
gl.bufferData(gl.ARRAY_BUFFER, splashData, gl.DYNAMIC_DRAW);
const SPL_STRIDE = 5 * 4;
// position
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 3, gl.FLOAT, false, SPL_STRIDE, 0);
gl.vertexAttribDivisor(1, 1);
// params (age, size)
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 2, gl.FLOAT, false, SPL_STRIDE, 12);
gl.vertexAttribDivisor(2, 1);

gl.bindVertexArray(null);

/* ============================================================
   CAMERA / INPUT
   ============================================================ */
const cam = { pos: [0, 3.2, 12], yaw: 0, pitch: -0.08 };
let mouseDown = false, lastX = 0, lastY = 0;

canvas.addEventListener('mousedown', e => {
  mouseDown = true; lastX = e.clientX; lastY = e.clientY;
  if (canvas.requestPointerLock) canvas.requestPointerLock();
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  const dx = e.movementX != null ? e.movementX : (e.clientX - lastX);
  const dy = e.movementY != null ? e.movementY : (e.clientY - lastY);
  lastX = e.clientX; lastY = e.clientY;
  cam.yaw   -= dx * 0.003;
  cam.pitch -= dy * 0.003;
  cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch));
});
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup',   e => keys[e.code] = false);

const view = M4();
function updateCamera(dt) {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const cy = Math.cos(cam.yaw),   sy = Math.sin(cam.yaw);
  const fwd = [sy*cp, sp, -cy*cp];
  const rx = fwd[2], ry = 0, rz = -fwd[0];
  const rl = Math.hypot(rx,ry,rz)||1;
  const r = [rx/rl, ry/rl, rz/rl];

  let vx=0, vy=0, vz=0;
  if (keys['KeyW']) { vx+=fwd[0]; vy+=fwd[1]; vz+=fwd[2]; }
  if (keys['KeyS']) { vx-=fwd[0]; vy-=fwd[1]; vz-=fwd[2]; }
  if (keys['KeyA']) { vx-=r[0];   vy-=r[1];   vz-=r[2]; }
  if (keys['KeyD']) { vx+=r[0];   vy+=r[1];   vz+=r[2]; }
  if (keys['Space'])      vy += 1;
  if (keys['ShiftLeft'])  vy -= 1;

  const l = Math.hypot(vx,vy,vz)||1;
  const SPEED = 10;
  cam.pos[0] += vx/l * SPEED * dt;
  cam.pos[1] += vy/l * SPEED * dt;
  cam.pos[2] += vz/l * SPEED * dt;
  cam.pos[1] = Math.max(0.6, Math.min(60, cam.pos[1]));

  m4lookAt(view, cam.pos[0],cam.pos[1],cam.pos[2],
           cam.pos[0]+fwd[0], cam.pos[1]+fwd[1], cam.pos[2]+fwd[2], 0,1,0);
}

/* ============================================================
   RAIN SIMULATION
   ============================================================ */
function updateRain(dt) {
  const camX = cam.pos[0], camZ = cam.pos[2];

  for (let i = 0; i < RAIN_COUNT; i++) {
    const d = drops[i];

    // Integrate
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.z += d.vz * dt;

    // Ground hit → respawn + splash (only near layer sometimes)
    if (d.y <= RAIN_FLOOR) {
      // Spawn a splash roughly where the drop hit (only for near/mid to avoid clutter)
      if (i % 5 === 0 && Math.abs(d.x - camX) < 30 && Math.abs(d.z - camZ) < 30) {
        spawnSplash(d.x, d.z);
      }
      spawnDrop(i, camX, camZ, false);
      continue;
    }

    // Wrap horizontally around the camera
    if (d.x < camX - RAIN_HALF) d.x += RAIN_HALF * 2;
    if (d.x > camX + RAIN_HALF) d.x -= RAIN_HALF * 2;
    if (d.z < camZ - RAIN_HALF) d.z += RAIN_HALF * 2;
    if (d.z > camZ + RAIN_HALF) d.z -= RAIN_HALF * 2;
  }

  // Update splashes
  for (let i = 0; i < SPLASH_MAX; i++) {
    const s = splashes[i];
    if (!s.active) continue;
    s.age += dt * 1.8;
    if (s.age >= 1.0) s.active = false;
  }
}

/* ============================================================
   LOOP
   ============================================================ */
const proj = M4(), vp = M4(), invVP = M4();

function resize() {
  const dpr = Math.min(window.devicePixelRatio, 1.75);
  const w = Math.floor(canvas.clientWidth  * dpr) || Math.floor(innerWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr) || Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}
window.addEventListener('resize', resize);
resize();

const stateEl = document.getElementById('state');

let lastT = performance.now();
let fpsAccum = 0, fpsCount = 0, fpsTimer = 0;

function frame(now) {
  requestAnimationFrame(frame);

  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  const time = now / 1000;

  // ---- Camera & simulation ----
  updateCamera(dt);
  updateRain(dt);

  // ---- Matrices ----
  m4perspective(proj, 62 * Math.PI / 180, canvas.width / canvas.height, 0.1, 500);
  m4mul(vp, proj, view);

  // Simple inverse for sky unprojection — we only need the rotation part
  // Construct a full inverse from proj * view (small matrix math)
  invertMVP(invVP, vp);

  // ---- SKY PASS ----
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.BLEND);

  gl.clearColor(0.04, 0.05, 0.08, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(progSky.p);
  gl.uniformMatrix4fv(progSky.u.uInvVP, false, invVP);
  gl.uniform3fv(progSky.u.uSunDir, sunDir);
  gl.uniform3fv(progSky.u.uSunColor, sunColor);
  gl.uniform3f (progSky.u.uCamPos, cam.pos[0], cam.pos[1], cam.pos[2]);
  gl.uniform3fv(progSky.u.uSkyTop, skyTop);
  gl.uniform3fv(progSky.u.uSkyHorizon, skyHorizon);
  gl.uniform3fv(progSky.u.uFog, fogColor);
  gl.uniform1f (progSky.u.uTime, time);

  gl.bindVertexArray(skyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);

  // ---- Ground ----
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);

  gl.useProgram(progGround.p);
  gl.uniformMatrix4fv(progGround.u.uVP, false, vp);
  gl.uniform2f(progGround.u.uGridOffset, cam.pos[0], cam.pos[2]);
  gl.uniform1f (progGround.u.uTime, time);
  gl.uniform3f (progGround.u.uCamPos, cam.pos[0], cam.pos[1], cam.pos[2]);
  gl.uniform3fv(progGround.u.uSunDir, sunDir);
  gl.uniform3fv(progGround.u.uSunColor, sunColor);
  gl.uniform3fv(progGround.u.uGroundColor, groundCol);
  gl.uniform3fv(progGround.u.uSkyHorizon, skyHorizon);
  gl.uniform3fv(progGround.u.uFog, fogColor);

  gl.bindVertexArray(groundVAO);
  gl.drawElements(gl.TRIANGLES, groundMesh.idx.length, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);

  // ---- Rain (alpha blended, no depth write) ----
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);

  // Upload current drop state
  writeRainData();
  gl.bindBuffer(gl.ARRAY_BUFFER, rainBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, rainData);

  gl.useProgram(progRain.p);
  gl.uniformMatrix4fv(progRain.u.uVP, false, vp);
  gl.uniform3f (progRain.u.uCamPos, cam.pos[0], cam.pos[1], cam.pos[2]);
  gl.uniform3fv(progRain.u.uSunDir, sunDir);
  gl.uniform3fv(progRain.u.uSunColor, sunColor);
  gl.uniform3fv(progRain.u.uSkyHorizon, skyHorizon);

  gl.bindVertexArray(rainVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, RAIN_COUNT);
  gl.bindVertexArray(null);

  // ---- Splashes ----
  writeSplashData();
  gl.bindBuffer(gl.ARRAY_BUFFER, splashBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, splashData);

  gl.useProgram(progSplash.p);
  gl.uniformMatrix4fv(progSplash.u.uVP, false, vp);

  gl.bindVertexArray(splashVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, SPLASH_MAX);
  gl.bindVertexArray(null);

  gl.depthMask(true);

  // ---- Status ----
  fpsAccum += 1 / Math.max(dt, 1e-4);
  fpsCount += 1;
  fpsTimer += dt;
  if (fpsTimer > 0.5) {
    const fps = Math.round(fpsAccum / fpsCount);
    stateEl.textContent = 'Heavy · ' + RAIN_COUNT + ' drops · ' + fps + ' fps';
    fpsAccum = 0; fpsCount = 0; fpsTimer = 0;
  }
}

/* ============================================================
   Inverse of a 4×4 (used for sky ray unprojection)
   ============================================================ */
function invertMVP(o, m) {
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3];
  const a10=m[4],a11=m[5],a12=m[6],a13=m[7];
  const a20=m[8],a21=m[9],a22=m[10],a23=m[11];
  const a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10;
  const b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12;
  const b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30;
  const b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11 - b01*b10 + b02*b09 + b03*b08 - b04*b07 + b05*b06;
  if (!det) { o.set(m); return; }
  det = 1/det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det;
  o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det;
  o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det;
  o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det;
  o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det;
  o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det;
  o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det;
  o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det;
  o[15]=(a20*b03-a21*b01+a22*b00)*det;
}

requestAnimationFrame(frame);
</script>
</body>
</html>
