<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Storm Rain — WebGL2 + Audio</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#05080b; }
  canvas { display:block; width:100vw; height:100vh; }
  #info { position:fixed; top:14px; left:14px; color:#fff;
          font:13px system-ui,sans-serif;
          background:rgba(0,0,0,0.45); padding:8px 14px;
          border-radius:6px; pointer-events:none; z-index:10; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
          color:rgba(255,255,255,0.6); font:12px system-ui; z-index:10;
          pointer-events:none; }
  #ui {
    position:fixed; top:14px; right:14px;
    background:rgba(10,14,20,0.72);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px; padding:12px 14px;
    font:12px/1.7 system-ui, sans-serif;
    color:#dce6f2; z-index:20;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    min-width:160px; user-select:none;
  }
  #ui h4 { margin:0 0 8px; font-size:11px; letter-spacing:1.4px;
           text-transform:uppercase; color:#7fb8d8; font-weight:600; }
  #ui label { display:flex; align-items:center; gap:8px; cursor:pointer; padding:2px 0; }
  #ui label:hover { color:#fff; }
  #ui input[type=checkbox] {
    appearance:none; -webkit-appearance:none;
    width:14px; height:14px; border-radius:3px;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.05);
    cursor:pointer; position:relative;
    transition: all .15s;
  }
  #ui input[type=checkbox]:checked { background:#3fbbe0; border-color:#3fbbe0; }
  #ui input[type=checkbox]:checked::after {
    content:''; position:absolute; left:4px; top:1px;
    width:4px; height:8px; border:solid #0a0e14; border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  #ui .row { display:flex; align-items:center; gap:8px; margin-top:8px; }
  #ui .row input[type=range] { flex:1; }
  #ui .row span { opacity:.6; min-width:34px; }

  #clickHint {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,8,11,0.55);
    color:#dce6f2; font:15px system-ui;
    z-index:30; cursor:pointer;
    backdrop-filter: blur(3px);
  }
  #clickHint .box {
    background:rgba(10,14,20,0.9);
    padding:22px 32px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
  }
  #clickHint .box small {
    display:block; opacity:.55; margin-top:8px; font-size:12px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Storm — <span id="state">Heavy rain</span></div>
<div id="hint">Click · Mouse look · WASD walk · Shift run · Space jump</div>

<div id="ui">
  <h4>Layers</h4>
  <label><input type="checkbox" id="tg-sky"     checked> Sky</label>
  <label><input type="checkbox" id="tg-clouds"  checked> Clouds</label>
  <label><input type="checkbox" id="tg-ground"  checked> Ground</label>
  <label><input type="checkbox" id="tg-rain"    checked> Rain</label>
  <label><input type="checkbox" id="tg-splash"  checked> Splashes</label>
  <label><input type="checkbox" id="tg-sound"   checked> Sound</label>
  <div class="row">
    <span>Rain</span>
    <input type="range" id="sl-rain" min="0" max="200" value="100">
  </div>
</div>

<div id="clickHint">
  <div class="box">
    Click anywhere to start
    <small>Mouse look · WASD walk · Shift run · Space jump · ESC to release</small>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   CANVAS & GL
   ============================================================ */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias:true, alpha:false, powerPreference:'high-performance' });
if (!gl) { document.body.innerHTML = '<h2 style="color:#fff">WebGL2 required</h2>'; throw 0; }

/* ============================================================
   MATRICES
   ============================================================ */
const M4 = () => new Float32Array(16);
function m4perspective(o, fovy, asp, n, f) {
  const t = 1/Math.tan(fovy/2);
  o[0]=t/asp;o[1]=0;o[2]=0;o[3]=0;
  o[4]=0;o[5]=t;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=(f+n)/(n-f);o[11]=-1;
  o[12]=0;o[13]=0;o[14]=2*f*n/(n-f);o[15]=0;
  return o;
}
function m4lookAt(o, ex,ey,ez, cx,cy,cz, ux,uy,uz) {
  let zx=ex-cx, zy=ey-cy, zz=ez-cz;
  let l=Math.hypot(zx,zy,zz); zx/=l; zy/=l; zz/=l;
  let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
  l=Math.hypot(xx,xy,xz); xx/=l; xy/=l; xz/=l;
  let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1;
  return o;
}
function m4mul(o, a, b) {
  for (let i=0;i<4;i++){
    const a0=a[i],a1=a[i+4],a2=a[i+8],a3=a[i+12];
    o[i]    = a0*b[0]+a1*b[1]+a2*b[2]+a3*b[3];
    o[i+4]  = a0*b[4]+a1*b[5]+a2*b[6]+a3*b[7];
    o[i+8]  = a0*b[8]+a1*b[9]+a2*b[10]+a3*b[11];
    o[i+12] = a0*b[12]+a1*b[13]+a2*b[14]+a3*b[15];
  }
  return o;
}
function m4invert(o, m) {
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3];
  const a10=m[4],a11=m[5],a12=m[6],a13=m[7];
  const a20=m[8],a21=m[9],a22=m[10],a23=m[11];
  const a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10;
  const b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12;
  const b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30;
  const b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if (!det) { o.set(m); return; }
  det = 1/det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det;
  o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det;
  o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det;
  o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det;
  o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det;
  o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det;
  o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det;
  o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det;
  o[15]=(a20*b03-a21*b01+a22*b00)*det;
}

/* ============================================================
   SHADER HELPERS
   ============================================================ */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src); throw 0;
  }
  return s;
}
function link(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p)); throw 0;
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace('[0]','');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

/* ============================================================
   SUN + WIND
   ============================================================ */
const sunDir = (() => {
  const v = [0.55, 0.20, 0.55];
  const l = Math.hypot(v[0],v[1],v[2]);
  return [v[0]/l, v[1]/l, v[2]/l];
})();
const sunColor = [1.00, 0.88, 0.70];
const WIND = [0.55, 0.18];

/* ============================================================
   GLSL COMMON
   ============================================================ */
const GLSL_COMMON = `
  float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),
               mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
  }
  float fbm2(vec2 p){
    return 0.55*vnoise(p)+0.30*vnoise(p*2.07+vec2(5.2,1.3))+0.15*vnoise(p*4.13+vec2(1.7,9.1));
  }
  float fbm3(vec2 p){
    return 0.5*vnoise(p)+0.25*vnoise(p*2.11+vec2(3.1,7.7))
         + 0.15*vnoise(p*4.23+vec2(8.3,1.9))+0.10*vnoise(p*8.37+vec2(2.7,4.4));
  }
  float luminance(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
`;

const GLSL_SKY_FN = `
  vec3 skySample(vec3 dir, vec3 sunDir, vec3 sunColor, float t, float cloudAmt) {
    float y = dir.y;
    vec3 zenith  = vec3(0.14, 0.17, 0.22);
    vec3 mid     = vec3(0.30, 0.34, 0.40);
    vec3 horizon = vec3(0.58, 0.60, 0.64);
    vec3 sky = mix(horizon, mid, smoothstep(0.0, 0.35, y));
    sky      = mix(sky, zenith, smoothstep(0.25, 0.85, y));
    float hband = smoothstep(0.30, -0.02, y) * smoothstep(-0.20, -0.02, y);
    sky = mix(sky, vec3(0.42, 0.44, 0.48), hband * 0.5);
    float sd = max(dot(dir, sunDir), 0.0);
    sky += sunColor * pow(sd, 6.0) * 0.18;
    sky += sunColor * pow(sd, 60.0) * 0.35;

    if (y > 0.005 && cloudAmt > 0.001) {
      vec2 uv = dir.xz / (y + 0.14) * 0.65;
      vec2 drift = vec2(t * 0.0060, -t * 0.0035);
      float n1 = fbm3(uv * 0.55 + drift);
      float n2 = fbm3(uv * 1.45 - drift * 1.4 + vec2(3.1, 7.7));
      float n3 = fbm3(uv * 3.60 + drift * 2.2);
      vec2 uvV = dir.xz / (y + 0.05) * 1.5;
      float billow = fbm2(uvV * 0.9 + drift * 0.7);
      float coverage = n1 * 0.55 + n2 * 0.28 + n3 * 0.17;
      coverage = max(coverage, billow * 0.85);
      coverage = smoothstep(0.34, 0.72, coverage);
      float thickness = smoothstep(0.05, 0.55, y) * coverage;
      float edgeGlow = pow(max(dot(dir, sunDir), 0.0), 3.0) * (1.0 - coverage);
      float base = 1.0 - thickness * 0.75;
      vec3 cloudDark  = vec3(0.16, 0.18, 0.22);
      vec3 cloudMidC  = vec3(0.42, 0.44, 0.48);
      vec3 cloudLitC  = vec3(0.86, 0.86, 0.85);
      vec3 cloud = mix(cloudDark, cloudLitC, clamp(base * 0.55 + edgeGlow * 1.4, 0.0, 1.0));
      cloud = mix(cloud, cloudMidC, 0.35);
      cloud += sunColor * edgeGlow * 0.55;
      sky = mix(sky, cloud, coverage * cloudAmt);
    }
    return sky;
  }
`;

/* ============================================================
   SKY
   ============================================================ */
const skyVS = `#version 300 es
  layout(location=0) in vec2 aPos;
  out vec2 vNdc;
  void main(){ vNdc = aPos; gl_Position = vec4(aPos, 0.999999, 1.0); }`;

const skyFS = `#version 300 es
  precision highp float;
  in vec2 vNdc;
  out vec4 outColor;
  uniform mat4 uInvVP;
  uniform vec3 uCamPos, uSunDir, uSunColor;
  uniform float uTime, uRainIntensity, uCloudAmt, uSkyOn;
  ${GLSL_COMMON}
  ${GLSL_SKY_FN}
  void main(){
    if (uSkyOn < 0.5) { outColor = vec4(0.20, 0.23, 0.28, 1.0); return; }
    vec4 nh = uInvVP * vec4(vNdc, -1.0, 1.0);
    vec4 fh = uInvVP * vec4(vNdc,  1.0, 1.0);
    vec3 dir = normalize(fh.xyz/fh.w - nh.xyz/nh.w);
    vec3 col = skySample(dir, uSunDir, uSunColor, uTime, uCloudAmt);
    float horizon = smoothstep(0.25, -0.05, dir.y) * smoothstep(-0.15, 0.0, dir.y);
    vec3 curtain = vec3(0.42, 0.44, 0.48);
    float depthInRain = smoothstep(0.30, -0.05, dir.y);
    col = mix(col, curtain, horizon * uRainIntensity * 0.55);
    col = mix(col, curtain * 0.85, depthInRain * uRainIntensity * 0.20);
    outColor = vec4(col, 1.0);
  }`;

/* ============================================================
   GROUND
   ============================================================ */
const groundVS = `#version 300 es
  layout(location=0) in vec3 aPos;
  uniform mat4 uVP;
  uniform vec2 uGridOffset;
  out vec3 vWorldPos, vNormal;
  void main(){
    vec2 wp = aPos.xz + uGridOffset;
    vec3 p = vec3(wp.x, 0.0, wp.y);
    vWorldPos = p; vNormal = vec3(0.0, 1.0, 0.0);
    gl_Position = uVP * vec4(p, 1.0);
  }`;

const groundFS = `#version 300 es
  precision highp float;
  in vec3 vWorldPos, vNormal;
  out vec4 outColor;
  uniform float uTime, uRainIntensity, uCloudAmt;
  uniform vec3 uCamPos, uSunDir, uSunColor;
  ${GLSL_COMMON}
  ${GLSL_SKY_FN}

  float dropRipples(vec2 p, float t) {
    float total = 0.0;
    for (int k = 0; k < 3; k++) {
      float scale = float(k+1) * 0.9;
      vec2 cell = floor(p / scale);
      vec2 uv = fract(p / scale) - 0.5;
      float h = hash21(cell + float(k) * 13.7);
      float phase = fract(t * (1.2 + h * 0.5) + h * 7.13);
      float r = length(uv) * 1.5;
      float ring = smoothstep(phase - 0.08, phase, r) *
                   (1.0 - smoothstep(phase, phase + 0.15, r));
      float fade = (1.0 - phase) * (1.0 - phase);
      total += ring * fade * (1.0 - float(k) * 0.25);
    }
    return clamp(total, 0.0, 1.0);
  }

  void main(){
    vec3 N = vec3(0.0, 1.0, 0.0);
    vec3 V = normalize(uCamPos - vWorldPos);
    vec2 p = vWorldPos.xz;

    float puddle = fbm2(p * 0.045 + vec2(11.7, 3.4));
    puddle = smoothstep(0.40, 0.65, puddle);
    float puddleEdge = fbm2(p * 0.22 + vec2(2.1, 8.9));
    puddle *= mix(0.7, 1.0, puddleEdge);

    float grain = vnoise(p * 6.5) * 0.6 + vnoise(p * 18.0) * 0.4;
    vec3 dryCol = vec3(0.14, 0.135, 0.13) + grain * 0.035;
    vec3 wetCol = vec3(0.030, 0.034, 0.042) + grain * 0.008;
    vec3 surface = mix(dryCol, wetCol, puddle);

    float impacts = dropRipples(p, uTime);
    impacts *= uRainIntensity;

    vec3 R = reflect(-V, N);
    float rippleDistort = vnoise(p * 2.4 + vec2(uTime * 0.5, uTime * 0.3)) * 0.02 * puddle;
    R.xz += (rippleDistort - 0.01);
    vec3 refl = skySample(R, uSunDir, uSunColor, uTime, uCloudAmt);

    float NdV = max(dot(N, V), 0.0);
    float fres = 0.02 + 0.98 * pow(1.0 - NdV, 5.0);
    float reflectAmt = fres * (0.15 + 0.85 * puddle);

    vec3 col = mix(surface, refl, reflectAmt);

    vec3 ringSky = skySample(vec3(R.x, 0.25, R.z), uSunDir, uSunColor, uTime, uCloudAmt);
    col = mix(col, ringSky * 1.4, impacts * 0.35);

    vec3 H = normalize(uSunDir + V);
    float NdH = max(dot(N, H), 0.0);
    col += uSunColor * pow(NdH, 500.0) * puddle * 0.9;
    col += uSunColor * pow(NdH, 40.0) * (0.20 + puddle * 0.35);

    float d = length(vWorldPos - uCamPos);
    vec3 lowSky = vec3(0.34, 0.36, 0.42);
    float fogAmt = smoothstep(8.0, 110.0, d);
    fogAmt = mix(fogAmt, min(1.0, fogAmt * 1.25), uRainIntensity);
    col = mix(col, lowSky, fogAmt);
    col *= 1.0 - fogAmt * 0.12;

    outColor = vec4(col, 1.0);
  }`;

/* ============================================================
   RAIN
   ============================================================ */
const rainVS = `#version 300 es
  layout(location=0) in vec2 aQuad;
  layout(location=1) in vec3 aPos;
  layout(location=2) in vec3 aVel;
  layout(location=3) in vec2 aSize;
  layout(location=4) in float aSeed;
  uniform mat4 uVP;
  uniform vec3 uCamPos;
  out vec2  vUv;
  out float vFade;
  out float vSeed;
  out vec3  vWorldPos;
  void main(){
    vec3 toCam = uCamPos - aPos;
    float dist = length(toCam);
    vec3 V = toCam / dist;
    vec3 dir = normalize(aVel);
    vec3 right = cross(dir, V);
    float rl = length(right);
    right = rl > 1e-4 ? right / rl : vec3(1.0, 0.0, 0.0);
    vec3 up = -dir;
    float t = (aQuad.y + 1.0) * 0.5;
    float lengthScale = mix(1.0, 0.30, smoothstep(2.5, 0.5, dist));
    vec3 worldPos = aPos + right * (aQuad.x * aSize.y * 0.5)
                         + up    * (t * aSize.x * lengthScale);
    gl_Position = uVP * vec4(worldPos, 1.0);
    vUv = vec2(aQuad.x, t);
    vFade = smoothstep(85.0, 40.0, dist) * smoothstep(0.8, 3.0, dist);
    vSeed = aSeed;
    vWorldPos = worldPos;
  }`;

const rainFS = `#version 300 es
  precision highp float;
  in vec2  vUv;
  in float vFade;
  in float vSeed;
  in vec3  vWorldPos;
  out vec4 outColor;
  uniform vec3 uCamPos, uSunDir, uSunColor;
  uniform float uTime, uRainIntensity, uCloudAmt;
  ${GLSL_COMMON}
  ${GLSL_SKY_FN}
  void main(){
    float wx = vUv.x;
    float widthFade = exp(-wx * wx * 8.0);
    float ly = vUv.y;
    float headFade = smoothstep(0.00, 0.05, ly);
    float tailFade = 1.0 - smoothstep(0.55, 1.00, ly);
    float lengthFade = headFade * tailFade;

    vec3 viewRay = normalize(vWorldPos - uCamPos);
    vec3 behind = viewRay.y > 0.005
      ? skySample(viewRay, uSunDir, uSunColor, uTime, uCloudAmt)
      : vec3(0.06, 0.07, 0.09);

    float bgLum = luminance(behind);
    float backlit = pow(max(dot(viewRay, uSunDir), 0.0), 2.5);

    vec3 dropCol = behind * 0.85 + uSunColor * backlit * 0.35 + vec3(0.01, 0.012, 0.015);

    float alpha = 0.06;
    alpha += backlit * 0.30;
    alpha *= 0.15 + 0.85 * smoothstep(0.02, 0.40, bgLum);
    alpha *= 0.85;
    alpha *= uRainIntensity;
    alpha *= widthFade * lengthFade * vFade;
    alpha *= mix(0.55, 1.25, vSeed);
    alpha = clamp(alpha, 0.0, 0.55);

    outColor = vec4(dropCol, alpha);
  }`;

/* ============================================================
   SPLASHES — crown spray droplets
   ============================================================ */
const splashVS = `#version 300 es
  layout(location=0) in vec2 aQuad;
  layout(location=1) in vec3 aPos;
  layout(location=2) in float aSize;
  layout(location=3) in float aAlpha;
  layout(location=4) in float aSeed;
  uniform mat4 uVP;
  uniform vec3 uCamPos;
  out vec2  vUv;
  out float vAlpha;
  out float vSeed;
  out vec3  vWorldPos;
  void main(){
    vec3 toCam = uCamPos - aPos;
    vec3 V = normalize(toCam);
    vec3 up = vec3(0.0, 1.0, 0.0);
    if (abs(dot(up, V)) > 0.99) up = vec3(0.0, 0.0, 1.0);
    vec3 right = normalize(cross(up, V));
    vec3 upV   = cross(V, right);
    vec3 wp = aPos + right * (aQuad.x * aSize) + upV * (aQuad.y * aSize);
    gl_Position = uVP * vec4(wp, 1.0);
    vUv = aQuad;
    vAlpha = aAlpha;
    vSeed = aSeed;
    vWorldPos = wp;
  }`;

const splashFS = `#version 300 es
  precision highp float;
  in vec2  vUv;
  in float vAlpha;
  in float vSeed;
  in vec3  vWorldPos;
  out vec4 outColor;
  uniform vec3 uCamPos, uSunDir, uSunColor;
  uniform float uTime, uCloudAmt;
  ${GLSL_COMMON}
  ${GLSL_SKY_FN}
  void main(){
    float r2 = dot(vUv, vUv);
    if (r2 > 1.0) discard;
    float r = sqrt(r2);

    float z = sqrt(max(0.0, 1.0 - r2));
    vec3 n = vec3(vUv, z);

    vec3 V = normalize(vWorldPos - uCamPos);
    vec3 behind = skySample(V, uSunDir, uSunColor, uTime, uCloudAmt);

    float fres = pow(1.0 - z, 2.2);
    vec3 interior = vec3(0.030, 0.038, 0.048);
    vec3 col = mix(interior, behind, fres * 0.90);

    float a = vSeed * 6.2831853;
    vec3 L = normalize(vec3(cos(a) * 0.42, 0.82, sin(a) * 0.42));
    float spec = pow(max(dot(n, L), 0.0), 70.0);
    float backlit = pow(max(dot(-V, uSunDir), 0.0), 3.0);

    col += uSunColor * spec * 1.15;
    col += uSunColor * backlit * fres * 0.85;

    float alpha = (0.10 + fres * 0.90) * vAlpha;
    alpha *= mix(0.55, 1.0, vSeed);
    alpha = clamp(alpha, 0.0, 0.80);
    if (alpha < 0.004) discard;

    outColor = vec4(col, alpha);
  }`;

/* ============================================================
   RIPPLE RINGS ON GROUND
   ============================================================ */
const rippleVS = `#version 300 es
  layout(location=0) in vec2 aQuad;
  layout(location=1) in vec3 aPos;
  layout(location=2) in float aAge;
  layout(location=3) in float aStrength;
  uniform mat4 uVP;
  out vec2  vUv;
  out float vAge;
  out float vStrength;
  void main(){
    float maxR = 2.2 * aStrength;
    float r = maxR * aAge;
    vec3 wp = aPos + vec3(aQuad.x * r, 0.003, aQuad.y * r);
    gl_Position = uVP * vec4(wp, 1.0);
    vUv = aQuad;
    vAge = aAge;
    vStrength = aStrength;
  }`;

const rippleFS = `#version 300 es
  precision highp float;
  in vec2  vUv;
  in float vAge;
  in float vStrength;
  out vec4 outColor;
  void main(){
    float r = length(vUv);
    float ringRadius = 0.92;
    float ringWidth  = mix(0.18, 0.06, vAge);
    float ring = 1.0 - smoothstep(0.0, ringWidth, abs(r - ringRadius));
    float fade = (1.0 - vAge) * (1.0 - vAge);
    fade *= vStrength;
    float inner = (1.0 - smoothstep(0.0, 0.55, r)) * 0.15 * (1.0 - vAge);
    float alpha = (ring * 0.55 + inner) * fade;
    alpha = clamp(alpha, 0.0, 0.8);
    vec3 col = vec3(0.45, 0.55, 0.72);
    outColor = vec4(col, alpha);
  }`;

/* ============================================================
   CROWN — thin sheet of water flying out flat from an impact
   ============================================================ */
const crownVS = `#version 300 es
  layout(location=0) in vec2 aQuad;
  layout(location=1) in vec3 aPos;
  layout(location=2) in float aAge;
  layout(location=3) in float aStrength;
  layout(location=4) in float aSeed;
  uniform mat4 uVP;
  out vec2  vUv;
  out float vAge;
  out float vStrength;
  out float vSeed;
  out vec3  vWorldPos;
  void main(){
    float e = clamp(aAge, 0.0, 1.0);
    float radius = aStrength * (0.030 + 0.190 * pow(e, 0.55));
    vec3 wp = aPos + vec3(aQuad.x * radius, 0.0, aQuad.y * radius);
    gl_Position = uVP * vec4(wp, 1.0);
    vUv = aQuad;
    vAge = e;
    vStrength = aStrength;
    vSeed = aSeed;
    vWorldPos = wp;
  }`;

const crownFS = `#version 300 es
  precision highp float;
  in vec2  vUv;
  in float vAge;
  in float vStrength;
  in float vSeed;
  in vec3  vWorldPos;
  out vec4 outColor;
  uniform vec3 uCamPos, uSunDir, uSunColor;
  void main(){
    float rr = length(vUv);
    if (rr > 1.0) discard;

    float e = vAge;
    float w = mix(0.34, 0.07, e);
    float lip  = exp(-pow((rr - 0.86) / w, 2.0));
    float wash = (1.0 - smoothstep(0.0, 0.92, rr)) * 0.16;

    float fade = 1.0 - e;
    fade *= fade;
    float a = (lip * 0.80 + wash) * fade * vStrength;
    a = clamp(a, 0.0, 0.65);
    if (a < 0.004) discard;

    vec3 V = normalize(uCamPos - vWorldPos);
    float fres = 0.02 + 0.98 * pow(1.0 - clamp(V.y, 0.0, 1.0), 5.0);

    vec3 skyRefl = vec3(0.46, 0.50, 0.57);
    vec3 col = mix(vec3(0.028, 0.033, 0.042), skyRefl, fres);
    col *= mix(0.70, 1.15, lip);
    col += uSunColor * fres * 0.06;

    outColor = vec4(col, a);
  }`;

function makeGrid(size, segs) {
  const half = size/2, step = size/segs;
  const v = new Float32Array((segs+1)*(segs+1)*3);
  let k = 0;
  for (let j=0;j<=segs;j++) for (let i=0;i<=segs;i++) {
    v[k++] = -half + i*step;
    v[k++] = 0;
    v[k++] = -half + j*step;
  }
  const idx = new Uint32Array(segs*segs*6);
  let m = 0;
  for (let j=0;j<segs;j++) for (let i=0;i<segs;i++) {
    const a = j*(segs+1)+i, b = a+1, c = a+segs+1, d = c+1;
    idx[m++]=a; idx[m++]=c; idx[m++]=b;
    idx[m++]=b; idx[m++]=c; idx[m++]=d;
  }
  return { v, idx };
}

  else if (r < 0.30) { L = 0.40 + Math.random()*0.35; W = 0.007 + Math.random()*0.005; fall = 6.0 + Math.random()*2.0; seed = 0.7 + Math.random()*0.6; }
  else               { L = 0.20 + Math.random()*0.22; W = 0.004 + Math.random()*0.003; fall = 5.0 + Math.random()*1.8; seed = 0.45 + Math.random()*0.5; }
  const x = camX + (Math.random()*2-1) * RAIN_HALF;

}

/* ------------------------------------------------------------
   FOOTSTEP SPLASH — realistic, low, outward-spreading water
   ------------------------------------------------------------
   Real footstep / landing splashes do NOT throw water up in a
   fountain. The foot displaces water SIDEWAYS into a thin, low
   sheet that skims along the ground, breaks up, and falls back.
   So here we give the droplets mostly RADIAL speed and only a
   tiny lift, short lifetimes, and small sizes.
   ------------------------------------------------------------ */
function spawnSplash(x, z, force) {
  force = Math.min(force, 4.0);

  // ---- expanding crown sheet on the ground ----
  spawnCrown(x, z, force * 1.05);

  // ---- fine spray breaking off the rim, skimming outward ----
  const count = Math.max(6, Math.floor(6 + force * 7));
  for (let i = 0; i < count; i++) {
    const s = splash[splashCursor];
    splashCursor = (splashCursor + 1) % SPLASH_MAX;

    const ang = Math.random() * Math.PI * 2;

    // Radial (sideways) speed DOMINATES — this is the key difference.
    const radialSpeed = force * (1.6 + Math.random() * 1.8);

    // Very small vertical component — just enough to detach from the ground.
    const upSpeed = force * (0.20 + Math.random() * 0.40);

    // Water starts slightly outward from the impact center, not all at one point,
    // so the sheet looks like it is already spreading when it appears.
    const startOffset = 0.03 + Math.random() * 0.09;
    s.x = x + Math.cos(ang) * startOffset;
    s.y = 0.004 + Math.random() * 0.010;
    s.z = z + Math.sin(ang) * startOffset;

    s.vx = Math.cos(ang) * radialSpeed;
    s.vy = upSpeed;
    s.vz = Math.sin(ang) * radialSpeed;

    // Small water droplets
    s.size = 0.004 + Math.random() * 0.008;
    s.maxLife = 0.16 + Math.random() * 0.16;   // very short
    s.life = s.maxLife;
    s.seed = Math.random();
    s.active = true;
  }
}

function updateSplashes(dt) {
  const drag = Math.exp(-3.6 * dt);
  for (let i = 0; i < SPLASH_MAX; i++) {
    const s = splash[i];
    if (!s.active) continue;
    s.vy -= 9.81 * dt;
    s.vx *= drag;
    s.vz *= drag;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;
    s.life -= dt;
    if (s.life <= 0 || (s.y <= 0.0 && s.vy < 0)) { s.active = false; s.y = -1; }
  }
}

function writeSplashData() {
  let k = 0;
  for (let i = 0; i < SPLASH_MAX; i++) {
    const s = splash[i];
    const t = s.active ? Math.max(0, s.life / s.maxLife) : 0;
    const alpha = s.active ? Math.pow(t, 1.15) : 0.0;
    const size  = s.active ? s.size * (0.85 + 0.25 * t) : 0.0;
    splashData[k++] = s.x;
    splashData[k++] = Math.max(s.y, -1);
    splashData[k++] = s.z;
    splashData[k++] = size;
    splashData[k++] = alpha;
    splashData[k++] = s.seed;
  }
}

/* ============================================================
   AUDIO
   ============================================================ */
const Audio = (() => {
  let ctx = null;
  let master = null;
  let rainGain = null;
  let rainSrc = null;
  let windGain = null;
  let windSrc = null;
  let enabled = true;
  let started = false;
  let targetLevel = 0.65;

  function init() {
    if (ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { enabled = false; return; }
    ctx = new Ctx();

    master = ctx.createGain();
    master.gain.value = 0.42;
    master.connect(ctx.destination);

    const bufLen = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      data[i] = (b0+b1+b2+b3+b4+b5+b6 + white*0.5362) * 0.11;
      b6 = white * 0.115926;
    }
    rainSrc = ctx.createBufferSource();
    rainSrc.buffer = buf;
    rainSrc.loop = true;

    const rainFilter = ctx.createBiquadFilter();
    rainFilter.type = 'lowpass';
    rainFilter.frequency.value = 4200;
    rainFilter.Q.value = 0.6;

    const hs = ctx.createBiquadFilter();
    hs.type = 'highshelf';
    hs.frequency.value = 6000;
    hs.gain.value = -8;

    const ls = ctx.createBiquadFilter();
    ls.type = 'lowshelf';
    ls.frequency.value = 400;
    ls.gain.value = 3;

    rainGain = ctx.createGain();
    rainGain.gain.value = 0;

    rainSrc.connect(rainFilter);
    rainFilter.connect(hs);
    hs.connect(ls);
    ls.connect(rainGain);
    rainGain.connect(master);

    const wBuf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const wData = wBuf.getChannelData(0);
    let w0=0, w1=0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      w0 = 0.99 * w0 + white * 0.01;
      w1 = 0.95 * w1 + white * 0.03;
      wData[i] = (w0 + w1) * 0.8;
    }
    windSrc = ctx.createBufferSource();
    windSrc.buffer = wBuf;
    windSrc.loop = true;

    const windFilter = ctx.createBiquadFilter();
    windFilter.type = 'lowpass';
    windFilter.frequency.value = 180;

    windGain = ctx.createGain();
    windGain.gain.value = 0;

    windSrc.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(master);
  }

  function start() {
    if (!enabled) return;
    init();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (!started) {
      rainSrc.start();
      windSrc.start();
      started = true;
    }
  }

  function setRainLevel(level) {
    targetLevel = level;
    if (!ctx || !rainGain) return;
    rainGain.gain.setTargetAtTime(level * 0.65, ctx.currentTime, 0.25);
    windGain.gain.setTargetAtTime(level * 0.15, ctx.currentTime, 0.35);
  }

  function dropImpact(intensity) {
    if (!enabled || !ctx || !started) return;
    const now = ctx.currentTime;
    const dur = 0.02 + Math.random() * 0.03;
    const bufLen = Math.max(32, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) {
      const t = i / bufLen;
      const env = Math.exp(-t * 12.0);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 0.9 + Math.random() * 0.6;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1800 + Math.random() * 2500;
    bp.Q.value = 2.5;

    const g = ctx.createGain();
    g.gain.value = 0.015 + intensity * 0.035;

    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(now);
    src.stop(now + dur + 0.02);
  }

  function splash(force) {
    if (!enabled || !ctx || !started) return;
    const now = ctx.currentTime;
    const dur = 0.08 + Math.min(force, 3.0) * 0.05;
    const bufLen = Math.max(64, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) {
      const t = i / bufLen;
      const env = Math.exp(-t * 7.0) * (1.0 - t);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 0.85 + Math.random() * 0.45;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 320 + Math.min(force, 3) * 260 + Math.random() * 200;
    bp.Q.value = 1.2;

    const g = ctx.createGain();
    g.gain.value = Math.min(0.32, 0.06 + force * 0.05);

    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(now);
    src.stop(now + dur + 0.05);
  }

  function setEnabled(on) {
    enabled = on;
    if (!ctx) return;
    if (on) {
      if (ctx.state === 'suspended') ctx.resume();
      if (rainGain) rainGain.gain.setTargetAtTime(targetLevel * 0.65, ctx.currentTime, 0.15);
      if (windGain) windGain.gain.setTargetAtTime(targetLevel * 0.15, ctx.currentTime, 0.15);
    } else {
      if (rainGain) rainGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.15);
      if (windGain) windGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.15);
    }
  }

  return { start, setRainLevel, splash, dropImpact, setEnabled };
})();

/* ============================================================
   LAYER TOGGLES
   ============================================================ */
const Layer = {
  sky: true, clouds: true, ground: true, rain: true, splash: true, sound: true,
  rainLevel: 1.0,
};

document.getElementById('tg-sky').onchange    = e => Layer.sky    = e.target.checked;
document.getElementById('tg-clouds').onchange = e => Layer.clouds = e.target.checked;
document.getElementById('tg-ground').onchange = e => Layer.ground = e.target.checked;
document.getElementById('tg-rain').onchange   = e => Layer.rain   = e.target.checked;
document.getElementById('tg-splash').onchange = e => Layer.splash = e.target.checked;
document.getElementById('tg-sound').onchange  = e => {
  Layer.sound = e.target.checked;
  Audio.setEnabled(Layer.sound);
};
document.getElementById('sl-rain').oninput = e => Layer.rainLevel = e.target.value / 100;

/* ============================================================
   PLAYER
   ============================================================ */
const player = {
  pos: [0, 0, 10], yaw: 0, pitch: -0.05,
  vy: 0, onGround: true, eyeHeight: 1.65,
  walkSpeed: 3.2, runSpeed: 7.0, jumpSpeed: 5.2,
};
const step = { accum: 0, side: 0, bobPhase: 0 };

const clickHint = document.getElementById('clickHint');
function firstClick() {
  Audio.start();
  Audio.setEnabled(Layer.sound);
  clickHint.style.display = 'none';
  if (canvas.requestPointerLock) canvas.requestPointerLock();
  window.removeEventListener('mousedown', firstClick);
}
window.addEventListener('mousedown', firstClick);

canvas.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  player.yaw   -= (e.movementX || 0) * 0.003;
  player.pitch -= (e.movementY || 0) * 0.003;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
});
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup',   e => keys[e.code] = false);

function stepLength(speed) { return 0.55 + speed * 0.055; }

const view = M4();
function updateCamera(dt) {
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  const cy = Math.cos(player.yaw),   sy = Math.sin(player.yaw);
  const fwd = [sy*cp, sp, -cy*cp];
  const fwdFlat = [sy, 0, -cy];
  const fl = Math.hypot(fwdFlat[0], fwdFlat[2]) || 1;
  fwdFlat[0] /= fl; fwdFlat[2] /= fl;
  const rx = fwdFlat[2], rz = -fwdFlat[0];

  let vx = 0, vz = 0;
  if (keys['KeyW']) { vx += fwdFlat[0]; vz += fwdFlat[2]; }
  if (keys['KeyS']) { vx -= fwdFlat[0]; vz -= fwdFlat[2]; }
  if (keys['KeyA']) { vx -= rx; vz -= rz; }
  if (keys['KeyD']) { vx += rx; vz += rz; }

  const l = Math.hypot(vx, vz);
  let speed = 0;
  if (l > 0.0001) {
    speed = keys['ShiftLeft'] || keys['ShiftRight'] ? player.runSpeed : player.walkSpeed;
    vx = vx / l * speed;
    vz = vz / l * speed;
  }

  const oldX = player.pos[0];
  const oldZ = player.pos[2];
  player.pos[0] += vx * dt;
  player.pos[2] += vz * dt;

  player.vy -= 22 * dt;
  player.pos[1] += player.vy * dt;

  let justLanded = false;
  let landingForce = 0;
  if (player.pos[1] <= 0) {
    if (!player.onGround && player.vy < -1.0) {
      justLanded = true;
      landingForce = Math.min(4.5, -player.vy * 0.55);
    }
    player.pos[1] = 0;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (keys['Space'] && player.onGround) {
    player.vy = player.jumpSpeed;
    player.onGround = false;
  }

  const moveDist = Math.hypot(player.pos[0] - oldX, player.pos[2] - oldZ);
  if (player.onGround && moveDist > 0.0001) {
    step.accum += moveDist;
    const stride = stepLength(speed);
    if (step.accum >= stride) {
      step.accum -= stride;
      step.side = 1 - step.side;
      const lateralSign = step.side === 0 ? -1 : 1;
      const footX = player.pos[0] + rx * lateralSign * 0.18;
      const footZ = player.pos[2] + rz * lateralSign * 0.18;
      const force = (speed > player.walkSpeed + 0.1) ? 1.7 : 0.9;
      // spawnSplash now also spawns the crown internally
      spawnSplash(footX, footZ, force);
      spawnRipple(footX, footZ, force * 0.9);
      Audio.splash(force);
    }
  } else if (speed < 0.1) {
    step.accum = Math.min(step.accum, stepLength(speed) * 0.5);
  }

  if (justLanded && landingForce > 0.5) {
    spawnRipple(player.pos[0], player.pos[2], landingForce * 0.9);
    spawnSplash(player.pos[0], player.pos[2], landingForce);
    Audio.splash(landingForce * 1.1);
    // secondary ring of spray around the landing point
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.random() * 0.6;
      const rr = 0.20 + Math.random() * 0.30;
      spawnSplash(player.pos[0] + Math.cos(a) * rr,
                  player.pos[2] + Math.sin(a) * rr,
                  landingForce * 0.55);
    }
  }

  if (player.onGround && speed > 0.3) {
    step.bobPhase += dt * (speed > player.walkSpeed + 0.1 ? 9.5 : 6.5);
  } else {
    step.bobPhase += dt * 2.0;
  }
  const bobAmp = (speed > player.walkSpeed + 0.1 ? 0.035 : 0.022) * (speed > 0.1 ? 1 : 0);
  const bobY = Math.sin(step.bobPhase) * bobAmp;
  const bobX = Math.cos(step.bobPhase * 0.5) * bobAmp * 0.6;

  const cx = player.pos[0] + rx * bobX;
  const cz = player.pos[2] + rz * bobX;
  const cy2 = player.pos[1] + player.eyeHeight + bobY;

  m4lookAt(view, cx, cy2, cz,
           cx + fwd[0], cy2 + fwd[1], cz + fwd[2], 0, 1, 0);

  return [cx, cy2, cz];
}

/* ============================================================
   RAIN SIM + IMPACT RIPPLE + AMBIENT DROP SOUNDS
   ============================================================ */
let nextDropSoundTime = 0;

function updateRain(dt, camX, camZ, time) {
  for (let i = 0; i < RAIN_COUNT; i++) {
    const d = drops[i];
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.z += d.vz * dt;

    if (d.y <= RAIN_FLOOR) {
      const dx = d.x - camX, dz = d.z - camZ;
      const dist2 = dx * dx + dz * dz;
      if (dist2 < 400) {
        if (Math.random() < 0.06) {
          const strength = 0.25 + Math.random() * 0.35;
          spawnRipple(d.x, d.z, strength);
        }
        if (Math.random() < 0.02) {
          spawnCrown(d.x, d.z, 0.30 + Math.random() * 0.25);
        }
      }
      spawnDrop(i, camX, camZ, false);
      continue;
    }

    if (d.x < camX - RAIN_HALF) d.x += RAIN_HALF * 2;
    if (d.x > camX + RAIN_HALF) d.x -= RAIN_HALF * 2;
    if (d.z < camZ - RAIN_HALF) d.z += RAIN_HALF * 2;
    if (d.z > camZ + RAIN_HALF) d.z -= RAIN_HALF * 2;
  }

  if (Layer.sound && Layer.rain && time > nextDropSoundTime) {
    Audio.dropImpact(Layer.rainLevel * (0.5 + Math.random() * 0.6));
    nextDropSoundTime = time + 0.04 + Math.random() * 0.05;
  }
}

/* ============================================================
   LOOP
   ============================================================ */
const proj = M4(), vp = M4(), invVP = M4();

function resize() {
  const dpr = Math.min(window.devicePixelRatio, 1.75);
  const w = Math.floor(canvas.clientWidth  * dpr) || Math.floor(innerWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr) || Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}
window.addEventListener('resize', resize);
resize();

const stateEl = document.getElementById('state');
let lastT = performance.now();

function frame(now) {
  requestAnimationFrame(frame);

  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  const time = now / 1000;

  const camPos = updateCamera(dt);
  updateRain(dt, camPos[0], camPos[2], time);
  updateSplashes(dt);
  updateRipples(dt);
  updateCrowns(dt);

  const rainIntensity = Layer.rain ? Layer.rainLevel : 0.0;
  Audio.setRainLevel(Layer.sound ? Layer.rainLevel : 0);

  m4perspective(proj, 62 * Math.PI / 180, canvas.width / canvas.height, 0.1, 600);
  m4mul(vp, proj, view);
  m4invert(invVP, vp);

  /* ---- SKY ---- */
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.BLEND);
  gl.clearColor(0.06, 0.07, 0.09, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(progSky.p);
  gl.uniformMatrix4fv(progSky.u.uInvVP, false, invVP);
  gl.uniform3fv(progSky.u.uSunDir, sunDir);
  gl.uniform3fv(progSky.u.uSunColor, sunColor);
  gl.uniform3f (progSky.u.uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform1f (progSky.u.uTime, time);
  gl.uniform1f (progSky.u.uRainIntensity, rainIntensity);
  gl.uniform1f (progSky.u.uCloudAmt, Layer.clouds ? 1.0 : 0.0);
  gl.uniform1f (progSky.u.uSkyOn, Layer.sky ? 1.0 : 0.0);
  gl.bindVertexArray(skyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);

  /* ---- GROUND ---- */
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);

  if (Layer.ground) {
    gl.useProgram(progGround.p);
    gl.uniformMatrix4fv(progGround.u.uVP, false, vp);
    gl.uniform2f (progGround.u.uGridOffset, camPos[0], camPos[2]);
    gl.uniform1f (progGround.u.uTime, time);
    gl.uniform1f (progGround.u.uRainIntensity, rainIntensity);
    gl.uniform1f (progGround.u.uCloudAmt, Layer.clouds ? 1.0 : 0.0);
    gl.uniform3f (progGround.u.uCamPos, camPos[0], camPos[1], camPos[2]);
    gl.uniform3fv(progGround.u.uSunDir, sunDir);
    gl.uniform3fv(progGround.u.uSunColor, sunColor);
    gl.bindVertexArray(groundVAO);
    gl.drawElements(gl.TRIANGLES, groundMesh.idx.length, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(null);
  }

  /* ---- Blended passes ---- */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);

  if (Layer.ground && Layer.rain) {
    writeRippleData();
    gl.bindBuffer(gl.ARRAY_BUFFER, rippleBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, rippleData);
    gl.useProgram(progRipple.p);
    gl.uniformMatrix4fv(progRipple.u.uVP, false, vp);
    gl.bindVertexArray(rippleVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, RIPPLE_MAX);
    gl.bindVertexArray(null);
  }

  if (Layer.ground && Layer.splash) {
    writeCrownData();
    gl.bindBuffer(gl.ARRAY_BUFFER, crownBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, crownData);
    gl.useProgram(progCrown.p);
    gl.uniformMatrix4fv(progCrown.u.uVP, false, vp);
    gl.uniform3f (progCrown.u.uCamPos, camPos[0], camPos[1], camPos[2]);
    gl.uniform3fv(progCrown.u.uSunDir, sunDir);
    gl.uniform3fv(progCrown.u.uSunColor, sunColor);
    gl.bindVertexArray(crownVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, CROWN_MAX);
    gl.bindVertexArray(null);
  }

  if (Layer.rain) {
    writeRainData();
    gl.bindBuffer(gl.ARRAY_BUFFER, rainBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, rainData);
    gl.useProgram(progRain.p);
    gl.uniformMatrix4fv(progRain.u.uVP, false, vp);
    gl.uniform3f (progRain.u.uCamPos, camPos[0], camPos[1], camPos[2]);
    gl.uniform3fv(progRain.u.uSunDir, sunDir);
    gl.uniform3fv(progRain.u.uSunColor, sunColor);
    gl.uniform1f (progRain.u.uTime, time);
    gl.uniform1f (progRain.u.uRainIntensity, Layer.rainLevel);
    gl.uniform1f (progRain.u.uCloudAmt, Layer.clouds ? 1.0 : 0.0);
    gl.bindVertexArray(rainVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, RAIN_COUNT);
    gl.bindVertexArray(null);
  }

  if (Layer.splash) {
    writeSplashData();
    gl.bindBuffer(gl.ARRAY_BUFFER, splashBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, splashData);
    gl.useProgram(progSplash.p);
    gl.uniformMatrix4fv(progSplash.u.uVP, false, vp);
    gl.uniform3f (progSplash.u.uCamPos, camPos[0], camPos[1], camPos[2]);
    gl.uniform3fv(progSplash.u.uSunDir, sunDir);
    gl.uniform3fv(progSplash.u.uSunColor, sunColor);
    gl.uniform1f (progSplash.u.uTime, time);
    gl.uniform1f (progSplash.u.uCloudAmt, Layer.clouds ? 1.0 : 0.0);
    gl.bindVertexArray(splashVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, SPLASH_MAX);
    gl.bindVertexArray(null);
  }

  gl.depthMask(true);

  stateEl.textContent = 'Heavy · ' + RAIN_COUNT + ' drops';
}

requestAnimationFrame(frame);
</script>
</body>
</html>
