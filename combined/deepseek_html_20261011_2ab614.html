<body>

<div id="overlay">

  <div class="info">
    Two vehicles built from raw geometry.<br>
    <b>WASD</b> walk around them. <b>1</b> bike. <b>2</b> helicopter. <b>R</b> spin.
  </div>
  <div class="cta">CLICK TO ENTER</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ══════════════════════════════════════════════════════════════
   RENDERER · SCENE · CAMERA
   ══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2230);
scene.fog = new THREE.Fog(0x1a2230, 30, 80);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.05, 200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ══════════════════════════════════════════════════════════════
   PROCEDURAL PBR TEXTURES
   ══════════════════════════════════════════════════════════════ */
function makeCanvas(s = 512){ const c = document.createElement('canvas'); c.width = c.height = s; return c; }

function heightToNormal(hCanvas, strength = 2.0){
  const w = hCanvas.width, h = hCanvas.height;
  const src = hCanvas.getContext('2d').getImageData(0,0,w,h).data;
  const out = new ImageData(w,h); const dst = out.data;
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const i  = (y*w + x)*4;
      const xl = (y*w + Math.max(0,x-1))*4;
      const xr = (y*w + Math.min(w-1,x+1))*4;
      const yu = (Math.max(0,y-1)*w + x)*4;
      const yd = (Math.min(h-1,y+1)*w + x)*4;
      const dx = (src[xr] - src[xl]) / 255;
      const dy = (src[yd] - src[yu]) / 255;
      let nx = -dx * strength, ny = -dy * strength, nz = 1.0;
      const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
      nx /= len; ny /= len; nz /= len;
      dst[i]   = (nx*0.5 + 0.5) * 255;
      dst[i+1] = (ny*0.5 + 0.5) * 255;
      dst[i+2] = (nz*0.5 + 0.5) * 255;
      dst[i+3] = 255;
    }
  }
  const nc = makeCanvas(hCanvas.width);
  nc.getContext('2d').putImageData(out, 0, 0);
  return nc;
}

function toTex(canvas, repeat = 1, srgb = true){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  return t;
}

/* TIRE TREAD — knobby pattern matching a sportbike tire */
function makeTireTread(){
  const s = 512;
  const albedo = makeCanvas(s), height = makeCanvas(s), rough = makeCanvas(s);
  const ac = albedo.getContext('2d'), hc = height.getContext('2d'), rc = rough.getContext('2d');
  ac.fillStyle = '#0a0a0c'; ac.fillRect(0,0,s,s);
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  // Diagonal grooves
  for (let i = 0; i < 80; i++){
    const y = i * 6.4;
    ac.fillStyle = '#1a1a1c';
    ac.beginPath();
    ac.moveTo(0, y);
    ac.lineTo(s, y + 40);
    ac.lineTo(s, y + 46);
    ac.lineTo(0, y + 6);
    ac.closePath();
    ac.fill();
    hc.fillStyle = '#404040';
    hc.beginPath();
    hc.moveTo(0, y);
    hc.lineTo(s, y + 40);
    hc.lineTo(s, y + 46);
    hc.lineTo(0, y + 6);
    hc.closePath();
    hc.fill();
  }
  // Fine grain
  for (let i = 0; i < 4000; i++){
    ac.fillStyle = `rgba(50,50,50,${Math.random()*0.3})`;
    ac.fillRect(Math.random()*s, Math.random()*s, 1, 1);
    hc.fillStyle = `rgba(180,180,180,${Math.random()*0.4})`;
    hc.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
  rc.fillStyle = '#e0e0e0'; rc.fillRect(0,0,s,s);
  return {
    map: toTex(albedo, 8, true),
    normalMap: toTex(heightToNormal(height, 1.5), 8, false),
    roughnessMap: toTex(rough, 8, false),
  };
}

/* CARBON FIBER — used on bike panels and helicopter accents */
function makeCarbon(){
  const s = 512;
  const albedo = makeCanvas(s), height = makeCanvas(s), rough = makeCanvas(s);
  const ac = albedo.getContext('2d'), hc = height.getContext('2d'), rc = rough.getContext('2d');
  ac.fillStyle = '#0e0f12'; ac.fillRect(0,0,s,s);
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  const cell = 8;
  for (let y = 0; y < s; y += cell){
    for (let x = 0; x < s; x += cell){
      const odd = ((x / cell) + (y / cell)) % 2 === 0;
      ac.fillStyle = odd ? '#1a1c20' : '#0a0c10';
      ac.fillRect(x, y, cell, cell);
      // Weave line
      ac.strokeStyle = 'rgba(80,85,95,0.5)';
      ac.lineWidth = 1;
      ac.beginPath();
      if (odd){
        ac.moveTo(x, y + cell/2);
        ac.lineTo(x + cell, y + cell/2);
      } else {
        ac.moveTo(x + cell/2, y);
        ac.lineTo(x + cell/2, y + cell);
      }
      ac.stroke();
      hc.fillStyle = odd ? '#909090' : '#707070';
      hc.fillRect(x, y, cell, cell);
    }
  }
  rc.fillStyle = '#404040'; rc.fillRect(0,0,s,s);   // carbon is quite smooth
  return {
    map: toTex(albedo, 4, true),
    normalMap: toTex(heightToNormal(height, 1.0), 4, false),
    roughnessMap: toTex(rough, 4, false),
  };
}

/* STUDIO FLOOR — polished dark grey */
function makeStudioFloor(){
  const s = 512;
  const albedo = makeCanvas(s), rough = makeCanvas(s), height = makeCanvas(s);
  const ac = albedo.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');
  ac.fillStyle = '#2a2c30'; ac.fillRect(0,0,s,s);
  const ad = ac.getImageData(0,0,s,s);
  for (let i = 0; i < ad.data.length; i += 4){
    const n = (Math.random() - 0.5) * 10;
    ad.data[i] += n; ad.data[i+1] += n; ad.data[i+2] += n;
  }
  ac.putImageData(ad, 0, 0);
  // Grid lines
  ac.strokeStyle = 'rgba(0,0,0,0.4)'; ac.lineWidth = 2;
  for (let i = 0; i <= s; i += 128){
    ac.beginPath(); ac.moveTo(i,0); ac.lineTo(i,s); ac.stroke();
    ac.beginPath(); ac.moveTo(0,i); ac.lineTo(s,i); ac.stroke();
  }
  hc.fillStyle = '#808080'; hc.fillRect(0,0,s,s);
  rc.fillStyle = '#505050'; rc.fillRect(0,0,s,s);
  return {
    map: toTex(albedo, 12, true),
    normalMap: toTex(heightToNormal(height, 0.3), 12, false),
    roughnessMap: toTex(rough, 12, false),
  };
}

const TX = {
  tire: makeTireTread(),
  carbon: makeCarbon(),
  floor: makeStudioFloor(),
};

/* ══════════════════════════════════════════════════════════════
   MATERIAL LIBRARY
   ══════════════════════════════════════════════════════════════ */
const BASE_MAT = {
  // Universal
  chrome: new THREE.MeshStandardMaterial({ color:0xe8ecf0, metalness:1.0, roughness:0.05, envMapIntensity:1.8 }),
  darkChrome: new THREE.MeshStandardMaterial({ color:0x3a3e44, metalness:0.95, roughness:0.12, envMapIntensity:1.6 }),
  brushedAlu: new THREE.MeshStandardMaterial({ color:0xc8ccd2, metalness:0.92, roughness:0.32, envMapIntensity:1.3 }),
  blackMetal: new THREE.MeshStandardMaterial({ color:0x0e0f12, metalness:0.85, roughness:0.35, envMapIntensity:1.2 }),
  castMetal: new THREE.MeshStandardMaterial({ color:0x6a6e74, metalness:0.75, roughness:0.55, envMapIntensity:0.9 }),
  engineBlock: new THREE.MeshStandardMaterial({ color:0x1e2024, metalness:0.7, roughness:0.45, envMapIntensity:0.9 }),
  rubber: new THREE.MeshStandardMaterial({ ...TX.tire, metalness:0.0, roughness:0.95, envMapIntensity:0.25 }),
  seatLeather: new THREE.MeshStandardMaterial({ color:0x0e0e10, metalness:0.05, roughness:0.7, envMapIntensity:0.4 }),
  carbon: new THREE.MeshPhysicalMaterial({ ...TX.carbon, metalness:0.5, roughness:0.25, clearcoat:1.0, clearcoatRoughness:0.1, envMapIntensity:1.4 }),
  
  // Glass
  windscreen: new THREE.MeshPhysicalMaterial({
    color: 0x1a2535, metalness:0.0, roughness:0.04,
    transmission:0.6, thickness:0.06, ior:1.5,
    transparent:true, opacity:0.55, side:THREE.DoubleSide, envMapIntensity:1.8
  }),
  headlightGlass: new THREE.MeshPhysicalMaterial({
    color: 0xd8e4f0, metalness:0.0, roughness:0.05,
    transmission:0.75, thickness:0.05, ior:1.5,
    transparent:true, opacity:0.8
  }),
  tailLightRed: new THREE.MeshStandardMaterial({ color:0x8a1010, emissive:0xff2020, emissiveIntensity:0.6, roughness:0.3 }),
  headlightEmit: new THREE.MeshStandardMaterial({ color:0xfff8e8, emissive:0xfff4d8, emissiveIntensity:1.5, roughness:0.4 }),
  
  // Indicator lights
  ledAmber: new THREE.MeshStandardMaterial({ color:0x3a2000, emissive:0xffa030, emissiveIntensity:0.8 }),
};

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function box(parent, x, y, z, w, h, d, mat, opts = {}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.recv !== false;
  if (opts.rotY) m.rotation.y = opts.rotY;
  if (opts.rotX) m.rotation.x = opts.rotX;
  if (opts.rotZ) m.rotation.z = opts.rotZ;
  parent.add(m);
  return m;
}
function cyl(parent, x, y, z, rTop, rBot, h, mat, opts = {}){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, opts.seg || 16), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (opts.rotX) m.rotation.x = opts.rotX;
  if (opts.rotY) m.rotation.y = opts.rotY;
  if (opts.rotZ) m.rotation.z = opts.rotZ;
  parent.add(m);
  return m;
}
function sphere(parent, x, y, z, r, mat, opts = {}){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, opts.segW || 16, opts.segH || 12), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (opts.sx || opts.sy || opts.sz) m.scale.set(opts.sx || 1, opts.sy || 1, opts.sz || 1);
  parent.add(m);
  return m;
}
function torus(parent, x, y, z, r, tube, mat, opts = {}){
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, opts.segT || 10, opts.segR || 20), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (opts.rotX) m.rotation.x = opts.rotX;
  if (opts.rotY) m.rotation.y = opts.rotY;
  if (opts.rotZ) m.rotation.z = opts.rotZ;
  parent.add(m);
  return m;
}

/* ══════════════════════════════════════════════════════════════
   BUILD SPORTBIKE
   Green Kawasaki Ninja style. Front points toward -Z.
   Dimensions: 2.0m L × 0.7m W × 1.1m H
   ══════════════════════════════════════════════════════════════ */
function buildSportbike(opts = {}){
  const color = opts.color !== undefined ? opts.color : 0x4a9e2a;   // Ninja green
  const accent = opts.accent !== undefined ? opts.accent : 0x0a0a0c; // black
  const rimColor = opts.rimColor !== undefined ? opts.rimColor : 0x0e0e10;

  const bike = new THREE.Group();

  // Bike-specific materials (so we can color each bike separately)
  const fairingMat = new THREE.MeshPhysicalMaterial({
    color, metalness:0.35, roughness:0.15,
    clearcoat:1.0, clearcoatRoughness:0.05,
    envMapIntensity:1.5
  });
  const fairingDarkMat = new THREE.MeshPhysicalMaterial({
    color: accent, metalness:0.4, roughness:0.22,
    clearcoat:0.9, clearcoatRoughness:0.08,
    envMapIntensity:1.3
  });
  const rimMat = new THREE.MeshStandardMaterial({
    color: rimColor, metalness:0.9, roughness:0.22, envMapIntensity:1.5
  });

  /* —————— WHEELS —————— */
  function buildWheel(radius, width, isFront){
    const w = new THREE.Group();
    // Tire body (outer)
    const tire = new THREE.Mesh(
      new THREE.TorusGeometry(radius - 0.04, 0.045, 14, 32),
      BASE_MAT.rubber
    );
    tire.rotation.y = Math.PI / 2;
    w.add(tire);
    // Tread band — wraps to give width
    const tread = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, width, 32, 1, true),
      BASE_MAT.rubber
    );
    tread.rotation.z = Math.PI / 2;
    w.add(tread);
    // Inner rim lip
    const rimLip = new THREE.Mesh(
      new THREE.CylinderGeometry(radius - 0.08, radius - 0.08, width * 0.92, 24),
      rimMat
    );
    rimLip.rotation.z = Math.PI / 2;
    w.add(rimLip);
    // Rim face (visible star pattern — 3 spokes)
    const face = new THREE.Mesh(
      new THREE.CylinderGeometry(radius - 0.11, radius - 0.11, 0.01, 24),
      rimMat
    );
    face.rotation.z = Math.PI / 2;
    face.position.x = 0.001;
    w.add(face);
    // 3 slot cutouts — small dark wedges that read as spokes
    for (let i = 0; i < 3; i++){
      const a = (i / 3) * Math.PI * 2;
      const slot = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.94, 0.04, radius * 0.9),
        BASE_MAT.blackMetal
      );
      slot.rotation.x = a;
      slot.position.y = 0;
      w.add(slot);
    }
    // Hub (center)
    const hub = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, width, 14),
      BASE_MAT.brushedAlu
    );
    hub.rotation.z = Math.PI / 2;
    w.add(hub);
    // Brake disc — one on each side for front, one for rear
    const disc = new THREE.Mesh(
      new THREE.CylinderGeometry(radius - 0.10, radius - 0.10, 0.008, 24),
      BASE_MAT.chrome
    );
    disc.rotation.z = Math.PI / 2;
    disc.position.x = (width / 2 + 0.01) * (isFront ? 1 : -1);
    w.add(disc);
    // Brake caliper
    const caliper = new THREE.Mesh(
      new THREE.BoxGeometry(0.03, 0.12, 0.07),
      BASE_MAT.castMetal
    );
    caliper.position.set((width / 2 + 0.025) * (isFront ? 1 : -1), -radius * 0.4, -radius * 0.3);
    w.add(caliper);
    return w;
  }

  // Front wheel — at (0, 0.31, -0.70)
  const frontWheel = buildWheel(0.31, 0.11, true);
  frontWheel.position.set(0, 0.31, -0.70);
  bike.add(frontWheel);

  // Rear wheel — at (0, 0.32, 0.72)
  const rearWheel = buildWheel(0.32, 0.14, false);
  rearWheel.position.set(0, 0.32, 0.72);
  bike.add(rearWheel);
  // Rear sprocket
  cyl(rearWheel, -0.08, 0, 0, 0.09, 0.09, 0.015, BASE_MAT.brushedAlu, { rotZ: Math.PI/2 });

  /* —————— FRONT FORKS —————— */
  // Two fork tubes, raked forward ~25°, from triple clamp to axle
  // Triple clamp at (0, 0.85, -0.55), axle at (0, 0.31, -0.70)
  const forkTopY = 0.92, forkTopZ = -0.48;
  const forkBotY = 0.31, forkBotZ = -0.70;
  for (const sx of [-0.10, 0.10]){
    // Upper fork tube (gold in the reference)
    const upperLen = 0.35;
    cyl(bike, sx, (forkTopY + 0.55) / 2, (forkTopZ + (-0.58)) / 2,
        0.025, 0.025, 0.28, BASE_MAT.brushedAlu,
        { rotX: -0.35 });
    // Lower fork slider (black, thicker)
    cyl(bike, sx, (forkBotY + 0.55) / 2, (forkBotZ + -0.58) / 2,
        0.03, 0.03, 0.42, BASE_MAT.blackMetal,
        { rotX: -0.35 });
  }
  // Triple clamp
  box(bike, 0, 0.90, -0.50, 0.24, 0.06, 0.14, BASE_MAT.blackMetal);
  box(bike, 0, 0.78, -0.52, 0.24, 0.05, 0.12, BASE_MAT.blackMetal);
  // Front axle
  cyl(bike, 0, 0.31, -0.70, 0.02, 0.02, 0.16, BASE_MAT.brushedAlu, { rotZ: Math.PI/2 });

  /* —————— FRONT FENDER —————— */
  // A curved fender over the front wheel
  const fenderShape = new THREE.Shape();
  fenderShape.moveTo(-0.09, 0);
  fenderShape.lineTo(0.09, 0);
  fenderShape.lineTo(0.09, 0.03);
  fenderShape.quadraticCurveTo(0, 0.05, -0.09, 0.03);
  fenderShape.lineTo(-0.09, 0);
  const fenderGeo = new THREE.ExtrudeGeometry(fenderShape, { depth: 0.30, bevelEnabled: false });
  const fender = new THREE.Mesh(fenderGeo, fairingMat);
  fender.position.set(0, 0.55, -0.70);
  fender.rotation.x = Math.PI / 2;
  bike.add(fender);

  /* —————— HANDLEBARS — CLIP-ONS —————— */
  for (const sx of [-1, 1]){
    // Bar going outward and slightly forward
    const bar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.014, 0.014, 0.24, 10),
      BASE_MAT.chrome
    );
    bar.rotation.z = Math.PI / 2 + sx * 0.15;
    bar.rotation.y = sx * 0.2;
    bar.position.set(sx * 0.17, 0.88, -0.50);
    bike.add(bar);
    // Grip (black rubber)
    const grip = new THREE.Mesh(
      new THREE.CylinderGeometry(0.018, 0.018, 0.12, 12),
      BASE_MAT.blackMetal
    );
    grip.rotation.z = Math.PI / 2 + sx * 0.15;
    grip.rotation.y = sx * 0.2;
    grip.position.set(sx * 0.27, 0.86, -0.48);
    bike.add(grip);
    // Brake/clutch lever
    const lever = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.012, 0.03),
      BASE_MAT.chrome
    );
    lever.position.set(sx * 0.30, 0.87, -0.54);
    lever.rotation.z = sx * 0.1;
    bike.add(lever);
    // Mirror stalk + mirror
    const stalk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.008, 0.008, 0.14, 8),
      BASE_MAT.blackMetal
    );
    stalk.position.set(sx * 0.20, 1.02, -0.50);
    stalk.rotation.z = sx * 0.3;
    bike.add(stalk);
    // Mirror head (flat oval)
    const mirror = new THREE.Mesh(
      new THREE.BoxGeometry(0.10, 0.05, 0.02),
      BASE_MAT.blackMetal
    );
    mirror.position.set(sx * 0.24, 1.10, -0.48);
    mirror.rotation.z = sx * 0.15;
    bike.add(mirror);
  }
  // Instrument cluster above the triple clamp
  box(bike, 0, 0.94, -0.42, 0.18, 0.05, 0.10, BASE_MAT.blackMetal);
  box(bike, 0, 0.945, -0.36, 0.16, 0.03, 0.005, BASE_MAT.blackMetal);

  /* —————— FRONT COWL / FAIRING —————— */
  // The main front fairing. Angled sharp nose, wraparound at the sides.
  // I'll build this from a series of tapered shapes.
  const cowl = new THREE.Group();
  // Upper nose — sharp point
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.14, 0.32, 6),
    fairingMat
  );
  nose.rotation.x = -Math.PI / 2 + 0.1;
  nose.position.set(0, 0.85, -0.92);
  cowl.add(nose);
  // Wide body behind the nose
  const cowlBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.20, 0.22, 0.30, 8),
    fairingMat
  );
  cowlBody.rotation.x = Math.PI / 2;
  cowlBody.position.set(0, 0.85, -0.70);
  cowl.add(cowlBody);
  // Side panels — extend down to hide the engine
  const sidePanelGeo = new THREE.ExtrudeGeometry(
    (() => {
      const s = new THREE.Shape();
      s.moveTo(-0.18, 0.12);
      s.lineTo(0.18, 0.12);
      s.lineTo(0.20, -0.05);
      s.lineTo(0.14, -0.22);
      s.lineTo(-0.14, -0.22);
      s.lineTo(-0.20, -0.05);
      s.lineTo(-0.18, 0.12);
      return s;
    })(),
    { depth: 0.02, bevelEnabled: false }
  );
  for (const sx of [-1, 1]){
    const panel = new THREE.Mesh(sidePanelGeo, fairingMat);
    panel.rotation.y = Math.PI / 2;
    panel.position.set(sx * 0.19, 0.72, -0.55);
    cowl.add(panel);
  }
  bike.add(cowl);

  /* —————— HEADLIGHTS —————— */
  // Twin headlight — one on each side of the nose
  for (const sx of [-1, 1]){
    const lens = new THREE.Mesh(
      new THREE.SphereGeometry(0.065, 14, 10),
      BASE_MAT.headlightEmit
    );
    lens.scale.set(1, 0.7, 0.4);
    lens.position.set(sx * 0.095, 0.83, -0.98);
    bike.add(lens);
    // Amber turn signals
    const turn = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 10, 8),
      BASE_MAT.ledAmber
    );
    turn.scale.set(1, 0.6, 0.5);
    turn.position.set(sx * 0.16, 0.78, -0.88);
    bike.add(turn);
  }
  // Windscreen — tinted, above the nose
  const windscreen = new THREE.Mesh(
    new THREE.BoxGeometry(0.28, 0.18, 0.02),
    BASE_MAT.windscreen
  );
  windscreen.position.set(0, 1.02, -0.85);
  windscreen.rotation.x = -0.55;
  bike.add(windscreen);
  // Windscreen trim (thin edge)
  box(bike, 0, 0.94, -0.92, 0.28, 0.02, 0.02, BASE_MAT.blackMetal);

  /* —————— FUEL TANK —————— */
  // Rounded teardrop shape — scaled sphere + a small hump behind
  const tank = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 20, 14),
    fairingMat
  );
  tank.scale.set(1.0, 0.85, 1.35);
  tank.position.set(0, 0.88, -0.15);
  bike.add(tank);
  // Knee insets — dark accent strips
  for (const sx of [-1, 1]){
    box(bike, sx * 0.19, 0.88, -0.15, 0.02, 0.14, 0.30, BASE_MAT.blackMetal);
  }
  // Fuel cap
  cyl(bike, 0, 1.08, -0.15, 0.035, 0.035, 0.012, BASE_MAT.brushedAlu);

  /* —————— SEAT (rider + passenger) —————— */
  // Rider seat — lower, right behind tank
  box(bike, 0, 0.86, 0.20, 0.22, 0.06, 0.34, BASE_MAT.seatLeather);
  // Slight rear hump (seat step)
  box(bike, 0, 0.91, 0.42, 0.22, 0.05, 0.10, BASE_MAT.seatLeather);
  // Passenger seat — higher, further back
  box(bike, 0, 0.94, 0.60, 0.20, 0.05, 0.28, BASE_MAT.seatLeather);

  /* —————— TAIL SECTION —————— */
  // Tapering bodywork behind passenger seat
  const tailBody = new THREE.Mesh(
    new THREE.ConeGeometry(0.13, 0.45, 6),
    fairingMat
  );
  tailBody.rotation.x = Math.PI / 2 - 0.1;
  tailBody.rotation.z = Math.PI / 6;
  tailBody.position.set(0, 0.98, 0.92);
  bike.add(tailBody);
  // Tail light (red)
  box(bike, 0, 0.98, 1.14, 0.08, 0.04, 0.02, BASE_MAT.tailLightRed);
  // Rear fender + plate holder
  box(bike, 0, 0.78, 1.05, 0.12, 0.02, 0.20, BASE_MAT.blackMetal);
  box(bike, 0, 0.68, 1.10, 0.14, 0.14, 0.01, BASE_MAT.brushedAlu);
  // Rear turn signals
  for (const sx of [-1, 1]){
    const t = new THREE.Mesh(
      new THREE.SphereGeometry(0.02, 8, 6),
      BASE_MAT.ledAmber
    );
    t.position.set(sx * 0.14, 0.78, 1.05);
    bike.add(t);
  }

  /* —————— SIDE FAIRINGS —————— */
  // Lower engine cover
  const lowerFairingGeo = new THREE.ExtrudeGeometry(
    (() => {
      const s = new THREE.Shape();
      s.moveTo(-0.20, 0.15);
      s.lineTo(0.20, 0.15);
      s.lineTo(0.22, -0.10);
      s.lineTo(0.14, -0.28);
      s.lineTo(-0.14, -0.28);
      s.lineTo(-0.22, -0.10);
      s.closePath();
      return s;
    })(),
    { depth: 0.03, bevelEnabled: false }
  );
  for (const sx of [-1, 1]){
    const panel = new THREE.Mesh(lowerFairingGeo, fairingDarkMat);
    panel.rotation.y = Math.PI / 2;
    panel.position.set(sx * 0.19, 0.42, -0.20);
    bike.add(panel);
  }
  // Belly pan (under the engine)
  box(bike, 0, 0.15, -0.15, 0.24, 0.02, 0.70, fairingDarkMat);

  /* —————— ENGINE —————— */
  // Main block
  box(bike, 0, 0.42, -0.05, 0.30, 0.30, 0.42, BASE_MAT.engineBlock);
  // Cylinder head — angled forward
  box(bike, 0, 0.52, -0.28, 0.24, 0.10, 0.20, BASE_MAT.castMetal, { rotX: 0.3 });
  // Engine cases (round, on both sides)
  for (const sx of [-1, 1]){
    cyl(bike, sx * 0.17, 0.42, 0.05, 0.10, 0.10, 0.04, BASE_MAT.brushedAlu, { rotZ: Math.PI/2 });
  }
  // Radiator grille (front of engine, behind front wheel)
  box(bike, 0, 0.45, -0.42, 0.28, 0.28, 0.02, BASE_MAT.blackMetal);
  for (let i = 0; i < 6; i++){
    box(bike, 0, 0.33 + i * 0.05, -0.43, 0.26, 0.015, 0.005, BASE_MAT.brushedAlu, { cast:false });
  }

  /* —————— EXHAUST —————— */
  // Header pipes from the head, curving down and back
  cyl(bike, 0.10, 0.42, -0.10, 0.028, 0.028, 0.30, BASE_MAT.chrome, { rotX: Math.PI/2 - 0.5 });
  cyl(bike, 0.13, 0.32, 0.10, 0.028, 0.028, 0.34, BASE_MAT.chrome, { rotX: Math.PI/2 });
  cyl(bike, 0.14, 0.34, 0.40, 0.028, 0.028, 0.20, BASE_MAT.chrome, { rotX: Math.PI/2 + 0.3 });
  // Muffler — short, on the right side
  const muffler = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.05, 0.45, 14),
    BASE_MAT.brushedAlu
  );
  muffler.rotation.x = Math.PI / 2 + 0.1;
  muffler.position.set(0.14, 0.34, 0.62);
  bike.add(muffler);
  // Muffler tip
  cyl(bike, 0.14, 0.28, 0.86, 0.048, 0.048, 0.03, BASE_MAT.blackMetal, { rotX: Math.PI/2 });

  /* —————— SWINGARM —————— */
  // From pivot (0, 0.42, 0.35) to rear axle (0, 0.32, 0.72)
  for (const sx of [-1, 1]){
    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, 0.06, 0.42),
      BASE_MAT.brushedAlu
    );
    arm.position.set(sx * 0.14, 0.40, 0.53);
    arm.rotation.x = 0.15;
    bike.add(arm);
  }
  // Pivot cover
  box(bike, 0, 0.42, 0.32, 0.34, 0.08, 0.06, BASE_MAT.engineBlock);
  // Rear axle
  cyl(bike, 0, 0.32, 0.72, 0.018, 0.018, 0.30, BASE_MAT.brushedAlu, { rotZ: Math.PI/2 });
  // Chain — top and bottom runs
  cyl(bike, 0.14, 0.38, 0.55, 0.008, 0.008, 0.45, BASE_MAT.blackMetal, { rotX: Math.PI/2 });
  cyl(bike, 0.14, 0.30, 0.55, 0.008, 0.008, 0.45, BASE_MAT.blackMetal, { rotX: Math.PI/2 });
  // Chain guard
  box(bike, 0.15, 0.36, 0.55, 0.02, 0.08, 0.42, BASE_MAT.blackMetal);

  /* —————— REAR SHOCK —————— */
  // Diagonal shock from frame to swingarm
  const shock = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.03, 0.30, 12),
    BASE_MAT.brushedAlu
  );
  shock.position.set(0, 0.55, 0.42);
  shock.rotation.x = -0.35;
  bike.add(shock);
  // Spring around it
  for (let i = 0; i < 5; i++){
    cyl(bike, 0, 0.42 + i * 0.06, 0.36 + i * 0.025, 0.05, 0.05, 0.02, BASE_MAT.blackMetal, { rotX: -0.35 });
  }

  /* —————— FOOTPEGS —————— */
  for (const sx of [-1, 1]){
    // Rider peg
    box(bike, sx * 0.20, 0.35, 0.20, 0.08, 0.015, 0.03, BASE_MAT.brushedAlu);
    // Passenger peg
    box(bike, sx * 0.19, 0.42, 0.58, 0.08, 0.015, 0.03, BASE_MAT.brushedAlu);
  }

  /* —————— KICKSTAND —————— */
  const kickstand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.012, 0.012, 0.34, 8),
    BASE_MAT.blackMetal
  );
  kickstand.position.set(-0.16, 0.20, 0.30);
  kickstand.rotation.z = 0.45;
  bike.add(kickstand);

  /* —————— ENGINE DETAILS —————— */
  // Oil sump
  box(bike, 0, 0.28, 0.02, 0.26, 0.06, 0.30, BASE_MAT.castMetal);

  // Store wheel references for animation
  bike.userData.frontWheel = frontWheel;
  bike.userData.rearWheel = rearWheel;

  return bike;
}

/* ══════════════════════════════════════════════════════════════
   BUILD HELICOPTER — Airbus EC135 style
   White body with orange accents, fenestron tail.
   Fuselage ~10.2m, rotor diameter ~10.2m.
   Front points toward -Z.
   ══════════════════════════════════════════════════════════════ */
function buildHelicopter(opts = {}){
  const bodyColor = opts.bodyColor !== undefined ? opts.bodyColor : 0xf2f2f0;
  const accentColor = opts.accentColor !== undefined ? opts.accentColor : 0xe85420;
  const heli = new THREE.Group();

  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: bodyColor, metalness:0.4, roughness:0.28,
    clearcoat:0.7, clearcoatRoughness:0.1, envMapIntensity:1.2
  });
  const accentMat = new THREE.MeshPhysicalMaterial({
    color: accentColor, metalness:0.3, roughness:0.3,
    clearcoat:0.7, clearcoatRoughness:0.1
  });
  const darkMat = new THREE.MeshPhysicalMaterial({
    color: 0x1a1c20, metalness:0.5, roughness:0.3,
    clearcoat:0.6, clearcoatRoughness:0.1
  });
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x151e2a, metalness:0.0, roughness:0.04,
    transmission:0.65, thickness:0.2, ior:1.5,
    transparent:true, opacity:0.6, side:THREE.DoubleSide, envMapIntensity:1.8
  });

  /* —————— FUSELAGE — MAIN BODY —————— */
  // Main cabin — large rounded body. Built from scaled spheres.
  // We use three sections: cockpit bubble, mid-cabin, rear taper.

  // Cockpit bubble (front) — big rounded dome
  const cockpit = new THREE.Mesh(
    new THREE.SphereGeometry(1.35, 24, 18),
    bodyMat
  );
  cockpit.scale.set(0.95, 0.85, 1.05);
  cockpit.position.set(0, 1.85, -1.5);
  heli.add(cockpit);

  // Mid cabin — slightly larger, boxier
  const cabin = new THREE.Mesh(
    new THREE.SphereGeometry(1.45, 24, 18),
    bodyMat
  );
  cabin.scale.set(1.0, 1.05, 1.15);
  cabin.position.set(0, 1.9, 0.4);
  heli.add(cabin);

  // Rear taper — small cone back to the tail
  const rearTaper = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 1.4, 1.2, 18),
    bodyMat
  );
  rearTaper.rotation.x = Math.PI / 2;
  rearTaper.position.set(0, 2.0, 1.9);
  heli.add(rearTaper);

  /* —————— ENGINE COWLING — TOP OF FUSELAGE —————— */
  // The EC135 has distinctive high engine cowls on top
  const engineCowl = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.65, 2.0),
    bodyMat
  );
  engineCowl.position.set(0, 3.0, 0.9);
  heli.add(engineCowl);
  // Rounded top
  const cowlTop = new THREE.Mesh(
    new THREE.CylinderGeometry(0.75, 0.75, 2.0, 16),
    bodyMat
  );
  cowlTop.rotation.x = Math.PI / 2;
  cowlTop.scale.set(1, 1, 0.5);
  cowlTop.position.set(0, 3.3, 0.9);
  heli.add(cowlTop);
  // Exhausts — two pipes at the rear of the cowl
  for (const sx of [-1, 1]){
    const exhaust = new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.15, 0.4, 12),
      BASE_MAT.darkChrome
    );
    exhaust.rotation.x = Math.PI / 2;
    exhaust.position.set(sx * 0.35, 2.9, 2.15);
    heli.add(exhaust);
  }

  /* —————— TAIL BOOM —————— */
  const boom = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.55, 3.6, 16),
    bodyMat
  );
  boom.rotation.x = Math.PI / 2;
  boom.position.set(0, 2.1, 4.3);
  heli.add(boom);
  // Accent stripe on boom
  const boomStripe = new THREE.Mesh(
    new THREE.CylinderGeometry(0.325, 0.555, 0.15, 16),
    accentMat
  );
  boomStripe.rotation.x = Math.PI / 2;
  boomStripe.position.set(0, 2.1, 3.0);
  heli.add(boomStripe);
  // Second stripe
  const boomStripe2 = boomStripe.clone();
  boomStripe2.position.z = 4.5;
  heli.add(boomStripe2);

  /* —————— FENESTRON (TAIL ROTOR IN DUCT) —————— */
  // Vertical tail fin — the EC135 has a distinctive fin
  const tailFin = new THREE.Mesh(
    new THREE.BoxGeometry(0.35, 2.2, 0.9),
    bodyMat
  );
  tailFin.position.set(0, 2.1, 6.3);
  heli.add(tailFin);
  // Horizontal stabilizers — small wings
  const hStab = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.1, 0.55),
    bodyMat
  );
  hStab.position.set(0, 2.0, 6.15);
  heli.add(hStab);
  // Vertical fin accent
  const finAccent = new THREE.Mesh(
    new THREE.BoxGeometry(0.37, 0.15, 0.92),
    accentMat
  );
  finAccent.position.set(0, 2.9, 6.3);
  heli.add(finAccent);

  // Fenestron housing — big torus ring
  const fenRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.75, 0.14, 12, 28),
    bodyMat
  );
  fenRing.rotation.y = Math.PI / 2;
  fenRing.position.set(0, 2.0, 6.85);
  heli.add(fenRing);
  // Inner duct surface
  const fenDuct = new THREE.Mesh(
    new THREE.CylinderGeometry(0.75, 0.75, 0.28, 28, 1, true),
    darkMat
  );
  fenDuct.rotation.z = Math.PI / 2;
  fenDuct.position.set(0, 2.0, 6.85);
  heli.add(fenDuct);

  // Fan hub inside the fenestron
  const fanHub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.12, 0.20, 12),
    BASE_MAT.brushedAlu
  );
  fanHub.rotation.z = Math.PI / 2;
  fanHub.position.set(0, 2.0, 6.85);
  heli.add(fanHub);

  // Fan blades — 8 thin blades arranged in a disc
  const fanGroup = new THREE.Group();
  fanGroup.position.set(0, 2.0, 6.85);
  for (let i = 0; i < 8; i++){
    const angle = (i / 8) * Math.PI * 2;
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 0.6, 0.10),
      darkMat
    );
    // Blade extends from hub outward
    const r = 0.18;
    blade.position.set(0, Math.cos(angle) * r, Math.sin(angle) * r);
    blade.rotation.x = angle;
    blade.rotation.y = Math.PI / 2;
    fanGroup.add(blade);
  }
  heli.add(fanGroup);
  heli.userData.fenFan = fanGroup;

  /* —————— MAIN ROTOR —————— */
  // Rotor mast
  const mast = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.15, 0.6, 12),
    BASE_MAT.brushedAlu
  );
  mast.position.set(0, 3.7, 0.4);
  heli.add(mast);
  // Rotor hub
  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.45, 0.3, 20),
    BASE_MAT.castMetal
  );
  hub.position.set(0, 4.05, 0.4);
  heli.add(hub);
  // Hub cap
  const hubCap = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 10),
    bodyMat
  );
  hubCap.scale.set(1, 0.6, 1);
  hubCap.position.set(0, 4.25, 0.4);
  heli.add(hubCap);
  // Swashplate (below the hub)
  const swash = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.55, 0.06, 20),
    BASE_MAT.brushedAlu
  );
  swash.position.set(0, 3.85, 0.4);
  heli.add(swash);

  // Main rotor blades — 4, each ~5.1m long
  const rotorGroup = new THREE.Group();
  rotorGroup.position.set(0, 4.15, 0.4);
  for (let i = 0; i < 4; i++){
    const angle = (i / 4) * Math.PI * 2;
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(5.1, 0.06, 0.35),
      darkMat
    );
    // Position blade extending outward
    blade.position.set(Math.cos(angle) * 2.55, 0, Math.sin(angle) * 2.55);
    blade.rotation.y = -angle;
    // Slight coning (blades tilt up a bit)
    blade.rotation.z = 0.03;
    rotorGroup.add(blade);
    // Blade tip (slightly narrower, painted)
    const tip = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.06, 0.35),
      accentMat
    );
    tip.position.set(Math.cos(angle) * 4.85, 0, Math.sin(angle) * 4.85);
    tip.rotation.y = -angle;
    rotorGroup.add(tip);
    // Blade root fitting (connects to hub)
    const root = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.12, 0.28),
      BASE_MAT.castMetal
    );
    root.position.set(Math.cos(angle) * 0.6, 0, Math.sin(angle) * 0.6);
    root.rotation.y = -angle;
    rotorGroup.add(root);
  }
  heli.add(rotorGroup);
  heli.userData.rotorGroup = rotorGroup;

  /* —————— COCKPIT GLASS —————— */
  // Large bubble windshield — wraps around the front
  // I'll build this as a series of angled panels
  const windshield = new THREE.Mesh(
    new THREE.SphereGeometry(1.30, 24, 18, 0, Math.PI * 2, 0, Math.PI / 2.2),
    glassMat
  );
  windshield.scale.set(0.95, 0.85, 1.05);
  windshield.position.set(0, 1.85, -1.5);
  heli.add(windshield);
  // Lower windshield panel (below the sphere cap) — an angled panel
  const lowerWS = new THREE.Mesh(
    new THREE.CylinderGeometry(1.25, 1.35, 0.6, 24, 1, true,
      -Math.PI * 0.65, Math.PI * 0.65),
    glassMat
  );
  lowerWS.position.set(0, 1.35, -1.5);
  heli.add(lowerWS);

  // Side windows (cabin doors)
  for (const sx of [-1, 1]){
    // Cabin window
    const win = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 0.7, 0.9),
      glassMat
    );
    win.position.set(sx * 1.45, 2.15, 0.3);
    heli.add(win);
    // Rear cabin window
    const win2 = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 0.6, 0.7),
      glassMat
    );
    win2.position.set(sx * 1.4, 2.15, 1.15);
    heli.add(win2);
  }

  /* —————— DOORS —————— */
  for (const sx of [-1, 1]){
    // Door frame outline
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 1.5, 1.6),
      bodyMat
    );
    door.position.set(sx * 1.42, 1.85, 0.5);
    heli.add(door);
    // Door handle
    const handle = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 0.05, 0.15),
      BASE_MAT.brushedAlu
    );
    handle.position.set(sx * 1.44, 1.9, 1.1);
    heli.add(handle);
    // Door rail (sliding track)
    const rail = new THREE.Mesh(
      new THREE.BoxGeometry(0.03, 0.03, 1.7),
      darkMat
    );
    rail.position.set(sx * 1.44, 2.65, 0.5);
    heli.add(rail);
  }

  /* —————— INTERIOR — SEATS —————— */
  // Two seats visible through the windows — driver + passenger
  for (const sx of [-1, 1]){
    // Seat base
    const seatBase = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.15, 0.55),
      BASE_MAT.seatLeather
    );
    seatBase.position.set(sx * 0.5, 1.55, -0.7);
    heli.add(seatBase);
    // Seat back
    const seatBack = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.65, 0.15),
      BASE_MAT.seatLeather
    );
    seatBack.position.set(sx * 0.5, 1.9, -0.42);
    heli.add(seatBack);
    // Headrest
    const hrest = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.2, 0.15),
      BASE_MAT.seatLeather
    );
    hrest.position.set(sx * 0.5, 2.3, -0.42);
    heli.add(hrest);
  }
  // Instrument panel (visible through the windshield)
  const panel = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.5, 0.15),
    darkMat
  );
  panel.position.set(0, 1.75, -2.5);
  panel.rotation.x = 0.3;
  heli.add(panel);

  /* —————— SKIDS —————— */
  // Two long skid tubes running front-to-back
  for (const sx of [-1, 1]){
    // Main skid tube
    const skid = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 4.6, 14),
      BASE_MAT.blackMetal
    );
    skid.rotation.x = Math.PI / 2;
    skid.position.set(sx * 1.0, 0.30, -1.2);
    heli.add(skid);
    // Upturned front tip
    const frontTip = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 0.4, 14),
      BASE_MAT.blackMetal
    );
    frontTip.rotation.x = Math.PI / 2 - 0.7;
    frontTip.position.set(sx * 1.0, 0.42, -3.55);
    heli.add(frontTip);
    // Cross tubes connecting to fuselage
    for (const z of [-1.2, 0.9]){
      const cross = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.06, 1.0, 12),
        BASE_MAT.blackMetal
      );
      cross.rotation.z = Math.PI / 2;
      cross.position.set(sx * 0.5, 0.5, z);
      heli.add(cross);
      // Vertical mount from cross tube to fuselage
      const mount = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 0.7, 12),
        BASE_MAT.blackMetal
      );
      mount.position.set(sx * 1.0, 0.7, z);
      heli.add(mount);
    }
  }
  // Skid ground plate (thin flat)
  for (const sx of [-1, 1]){
    box(heli, sx * 1.0, 0.22, -1.2, 0.14, 0.02, 4.6, BASE_MAT.rubber);
  }

  /* —————— LIGHTS —————— */
  // Anti-collision beacon on top
  const beacon = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 12, 8),
    new THREE.MeshStandardMaterial({ color:0xff2020, emissive:0xff2020, emissiveIntensity:1.5 })
  );
  beacon.position.set(0, 3.55, 1.4);
  heli.add(beacon);
  // Nav lights — red on left, green on right
  for (const sx of [-1, 1]){
    const nav = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 8, 6),
      new THREE.MeshStandardMaterial({
        color: sx < 0 ? 0xff2020 : 0x20ff20,
        emissive: sx < 0 ? 0xff2020 : 0x20ff20,
        emissiveIntensity: 0.8
      })
    );
    nav.position.set(sx * 1.4, 2.0, 0.3);
    heli.add(nav);
  }
  // Landing light (nose)
  const landing = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 12, 8),
    new THREE.MeshStandardMaterial({ color:0xfff8e0, emissive:0xfff4d0, emissiveIntensity:1.5 })
  );
  landing.scale.set(1, 0.7, 0.5);
  landing.position.set(0, 1.2, -2.75);
  heli.add(landing);

  /* —————— ACCENT STRIPES —————— */
  // Orange racing stripes along the fuselage
  const stripe1 = new THREE.Mesh(
    new THREE.BoxGeometry(2.85, 0.06, 0.02),
    accentMat
  );
  stripe1.position.set(0, 1.55, -1.0);
  // Make it curve around the body — approximate with 2 side panels
  for (const sx of [-1, 1]){
    const sideStripe = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 0.06, 2.8),
      accentMat
    );
    sideStripe.position.set(sx * 1.4, 1.55, -0.2);
    heli.add(sideStripe);
    // Lower accent
    const lowerStripe = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 0.04, 3.0),
      accentMat
    );
    lowerStripe.position.set(sx * 1.4, 1.15, -0.4);
    heli.add(lowerStripe);
  }

  heli.userData.mainRotor = rotorGroup;
  heli.userData.fenFanGroup = fanGroup;

  return heli;
}

/* ══════════════════════════════════════════════════════════════
   SCENE SETUP — studio with two vehicles
   ══════════════════════════════════════════════════════════════ */

// Floor
{
  const f = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({
    ...TX.floor, metalness:0.15, roughness:0.45, envMapIntensity:0.9
  }));
  f.rotation.x = -Math.PI / 2;
  f.position.y = 0;
  f.receiveShadow = true;
  scene.add(f);
}

// Backdrop wall (dark)
{
  const w = new THREE.Mesh(new THREE.PlaneGeometry(80, 20), new THREE.MeshStandardMaterial({
    color:0x0e1218, roughness:0.85, metalness:0.1
  }));
  w.position.set(0, 10, -25);
  scene.add(w);
}

// Build and place vehicles
const bike = buildSportbike({ color:0x4a9e2a, accent:0x0a0a0c, rimColor:0x0e0e10 });
bike.position.set(-8, 0, 0);
bike.rotation.y = 0.4;
scene.add(bike);

const heli = buildHelicopter({ bodyColor:0xf0f0ec, accentColor:0xe85420 });
heli.position.set(8, 0, 0);
heli.rotation.y = -0.5;
scene.add(heli);

/* ══════════════════════════════════════════════════════════════
   LIGHTING — 3-point studio
   ══════════════════════════════════════════════════════════════ */
const hemi = new THREE.HemisphereLight(0xc8dcf0, 0x2a2a30, 0.5);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d8, 2.2);
key.position.set(-15, 20, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -30;
key.shadow.camera.right = 30;
key.shadow.camera.top = 30;
key.shadow.camera.bottom = -30;
key.shadow.camera.near = 5;
key.shadow.camera.far = 60;
key.shadow.bias = -0.0003;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa8c4e0, 0.8);
fill.position.set(15, 10, 15);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd0a0, 1.2);
rim.position.set(0, 8, -20);
scene.add(rim);

// Add soft area-like point lights directly overhead for detail
for (const [x, z] of [[-8, 0], [8, 0]]){
  const p = new THREE.PointLight(0xfff4e0, 30, 20, 2);
  p.position.set(x, 8, z);
  scene.add(p);
}

/* ══════════════════════════════════════════════════════════════
   PLAYER CONTROLS
   ══════════════════════════════════════════════════════════════ */
const controls = new PointerLockControls(camera, renderer.domElement);
const PLAYER = { height: 1.7, crouch: 1.05, speed: 4.5, sprint: 8.0, crouchSpeed: 2.5 };
const keys = {};
camera.position.set(0, PLAYER.height, 15);

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Digit1'){
    camera.position.set(-8, PLAYER.height, 5);
  }
  if (e.code === 'Digit2'){
    camera.position.set(8, PLAYER.height, 12);
  }
  if (e.code === 'KeyR'){
    spinning = !spinning;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock',   () => overlay.style.opacity = 0);
controls.addEventListener('unlock', () => overlay.style.opacity = 1);

/* ══════════════════════════════════════════════════════════════
   HUD
   ══════════════════════════════════════════════════════════════ */
const zoneName  = document.getElementById('zonename');
const zoneCoord = document.getElementById('zonecoord');

function currentZone(x, z){
  if (x > -14 && x < -2 && z > -5 && z < 5) return 'BIKE · KAWASAKI';
  if (x > 2 && x < 16 && z > -5 && z < 5)   return 'HELI · EC135';
  return 'SHOWROOM';
}

/* ══════════════════════════════════════════════════════════════
   ANIMATION STATE
   ══════════════════════════════════════════════════════════════ */
let spinning = true;
let rotorAngle = 0;
let fenAngle = 0;

/* ══════════════════════════════════════════════════════════════
   MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3();
const right = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  const crouching = !!(keys['ControlLeft'] || keys['KeyC']);
  const targetH = crouching ? PLAYER.crouch : PLAYER.height;
  camera.position.y += (targetH - camera.position.y) * Math.min(1, dt * 10);

  camera.getWorldDirection(fwd);
  fwd.y = 0; fwd.normalize();
  right.crossVectors(fwd, camera.up).normalize();

  const speed = crouching ? PLAYER.crouchSpeed : (keys['ShiftLeft'] ? PLAYER.sprint : PLAYER.speed);
  const mv = new THREE.Vector3();
  if (keys['KeyW']) mv.add(fwd);
  if (keys['KeyS']) mv.sub(fwd);
  if (keys['KeyD']) mv.add(right);
  if (keys['KeyA']) mv.sub(right);
  if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed * dt);
  camera.position.x += mv.x;
  camera.position.z += mv.z;

  // Animate rotor + fenestron
  if (spinning){
    rotorAngle += dt * 8.0;
    fenAngle   += dt * 22.0;
  } else {
    // Slow idle
    rotorAngle += dt * 0.3;
    fenAngle   += dt * 0.8;
  }
  if (heli.userData.mainRotor) heli.userData.mainRotor.rotation.y = rotorAngle;
  if (heli.userData.fenFanGroup) heli.userData.fenFanGroup.rotation.x = fenAngle;

  // HUD
  zoneName.textContent = currentZone(camera.position.x, camera.position.z);
  zoneCoord.textContent = `X ${camera.position.x.toFixed(1)} · Z ${camera.position.z.toFixed(1)}`;

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
