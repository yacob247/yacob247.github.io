<style>
        /* Safari Compatibility & Gemini Aesthetics */
        body { font-family: 'Inter', sans-serif; background-color: #131314; color: #e3e3e3; }
        .no-select { user-select: none; }
        .glass-menu {
            background: rgba(30, 31, 32, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #5f6368; }

        .gemini-thought-container {
            border-left: 2px solid var(--color-accent);
            background: rgba(168, 199, 250, 0.03);
            border-radius: 0 12px 12px 0;
            margin: 12px 0;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #c4c7c5;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gemini-loading-dot {
            width: 6px; height: 6px;
            background-color: var(--color-accent);
            border-radius: 50%;
            display: inline-block;
            animation: geminiBounce 1.4s infinite ease-in-out both;
        }
        .gemini-loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .gemini-loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes geminiBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .streaming-cursor {
            display: inline-block;
            width: 2px; height: 1.1em;
            background: var(--color-accent);
            border-radius: 1px;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: cursorBlink 0.6s step-end infinite;
        }

        /* Toggle Switch CSS */
        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }

        .stop-btn { color: #f28b82 !important; }
        .stop-btn:hover { background: rgba(242, 139, 130, 0.1); }

        /* ── Structured markdown output ─────────────────────────── */
.output-response-zone ul {
    list-style: disc;
    padding-left: 1.5rem;
    margin: 0.6rem 0;
    space-y: 0.25rem;
}
.output-response-zone ol {
    list-style: decimal;
    padding-left: 1.5rem;
    margin: 0.6rem 0;
}
.output-response-zone li {
    margin-bottom: 0.35rem;
    line-height: 1.65;
    color: #e3e3e3;
}
.output-response-zone li::marker {
    color: var(--color-accent);
}
.output-response-zone p {
    margin-bottom: 0.65rem;
    line-height: 1.7;
}
.output-response-zone h1, 
.output-response-zone h2, 
.output-response-zone h3 {
    font-weight: 600;
    color: #ffffff;
    margin-top: 1.1rem;
    margin-bottom: 0.4rem;
}
.output-response-zone h1 { font-size: 1.2rem; }
.output-response-zone h2 { font-size: 1.05rem; }
.output-response-zone h3 { font-size: 0.95rem; color: var(--color-accent); }
.output-response-zone strong { color: #ffffff; font-weight: 600; }
.output-response-zone em { color: #c4c7c5; }
.output-response-zone hr {
    border: none;
    border-top: 1px solid #3c4043;
    margin: 1rem 0;
}
.output-response-zone blockquote {
    border-left: 3px solid var(--color-accent);
    padding: 0.4rem 0.8rem;
    margin: 0.6rem 0;
    color: #9e9e9e;
    font-style: italic;
    background: rgba(168,199,250,0.04);
    border-radius: 0 8px 8px 0;
}
.output-response-zone table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.8rem 0;
    font-size: 0.85rem;
}
.output-response-zone th {
    background: #282a2c;
    color: var(--color-accent);
    padding: 0.5rem 0.75rem;
    text-align: left;
    font-weight: 600;
    border: 1px solid #3c4043;
}
.output-response-zone td {
    padding: 0.45rem 0.75rem;
    border: 1px solid #3c4043;
    color: #e3e3e3;
}
.output-response-zone tr:nth-child(even) td { background: #1a1b1d; }
.output-response-zone code:not(pre code) {
    background: #282a2c;
    color: #a8c7fa;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-size: 0.85em;
    font-family: 'JetBrains Mono', monospace;
}

/* ════════════════════════════════════════════════════════════════════════
   LOMA CORE ENGINE — CSS FIXES
   Append after the existing <style> block (or include via <link>).
   Fixes:
     1. marked.js fenced code blocks had NO styling at all (pre/code were
        unstyled inside .output-response-zone) — now properly themed,
        scrollable, with language label support.
     2. Inline vs block code conflict resolved (`code:not(pre code)` kept,
        but `pre code` now explicitly reset so it doesn't inherit the pill
        styling).
     3. Canvas console/log lines reused inline styles scattered across JS —
        consolidated into classes so the JS no longer needs to set
        style.background/color directly (faster renders, no layout thrash).
     4. Streaming cursor + loading dots now share one timing curve so
        chat, canvas console, and Python live-output all feel identical.
     5. Long Python output / canvas iframe overflow fixed (was causing
        horizontal scroll-jank on mobile).
   ════════════════════════════════════════════════════════════════════════ */

/* ── 1 & 2. Code blocks inside AI responses ─────────────────────────── */
.output-response-zone pre {
    background: #0d0d0e;
    border: 1px solid #3c4043;
    border-radius: 12px;
    padding: 0.9rem 1rem;
    margin: 0.75rem 0;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    -webkit-overflow-scrolling: touch;
}
.output-response-zone pre code {
    background: transparent !important;
    color: #e3e3e3 !important;
    padding: 0 !important;
    border-radius: 0 !important;
    font-size: inherit !important;
    white-space: pre;
}
.output-response-zone code:not(pre code) {
    background: #282a2c;
    color: #a8c7fa;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-size: 0.85em;
    font-family: 'JetBrains Mono', monospace;
    word-break: break-word;
}
/* Optional language label, set via JS: pre[data-lang]::before */
.output-response-zone pre[data-lang]::before {
    content: attr(data-lang);
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-accent);
    margin-bottom: 0.4rem;
    opacity: 0.7;
}

/* ── 3. Canvas console — consolidated classes ───────────────────────── */
.canvas-console-row {
    display: flex;
    gap: 10px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    font-size: 11px;
    line-height: 1.5;
    font-family: 'JetBrains Mono', monospace;
}
.canvas-console-time {
    color: #3f3f46;
    flex-shrink: 0;
}
.canvas-console-msg { word-break: break-all; }
.canvas-console-msg.level-log   { color: #a1a1aa; }
.canvas-console-msg.level-warn  { color: #fbbf24; }
.canvas-console-msg.level-error { color: #f87171; }
.canvas-console-msg.level-info  { color: #60a5fa; }
.canvas-console-empty {
    font-size: 11px;
    color: #3f3f46;
    font-style: italic;
    text-align: center;
    padding: 16px 0;
}

/* ── 4. Unified streaming/typing indicators ─────────────────────────── */
.streaming-cursor,
.gemini-loading-dot {
    animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}
.live-output {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #6ee7b7;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 0.75rem;
    padding: 0.75rem;
    white-space: pre-wrap;
    line-height: 1.6;
    min-height: 1.25rem;
}
.live-output-error {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #f87171;
    background: rgba(127, 29, 29, 0.2);
    border-radius: 0.75rem;
    padding: 0.75rem;
    white-space: pre-wrap;
    margin-bottom: 0.75rem;
}

/* ── 5. Canvas iframe / overflow fixes ──────────────────────────────── */
#canvas-column { max-width: 100vw; }
#live-canvas-frame {
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
    display: block;
}
#live-canvas-code {
    width: 100%;
    height: 100%;
    resize: none;
    background: #0d0d0e;
    color: #e3e3e3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    padding: 1rem;
    border: none;
    outline: none;
    tab-size: 2;
}
#canvas-console-panel {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* Status pills (web search / routing / tool indicators) */
.status-pill {
    transition: opacity 0.2s ease;
}


    </style>
