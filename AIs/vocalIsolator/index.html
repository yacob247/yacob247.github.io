<script type="module">
import * as ort from 'onnxruntime-web';
import { DemucsProcessor, CONSTANTS } from 'https://pub-406a7f3fa4d44f41b5317520aa1aaf4a.r2.dev/newwwww/demucs-web-lib/index.js';

const MODEL_URLS = [
  'https://pub-406a7f3fa4d44f41b5317520aa1aaf4a.r2.dev/newwwww/htdemucs_embedded.onnx'
];
const SAMPLE_RATE = CONSTANTS.SAMPLE_RATE;
const $ = id => document.getElementById(id);
const fmtTime = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

function drawWave(canvas, left, c1, c2) {
  const dpr = 2;
  const W = canvas.width = canvas.clientWidth * dpr;
  const H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, c1); grad.addColorStop(1, c2);
  ctx.fillStyle = grad;
  const step = left.length / W;
  for (let x = 0; x < W; x++) {
    let mn = 1, mx = -1;
    const s0 = Math.floor(x * step), s1 = Math.min(left.length, Math.floor((x + 1) * step));
    const inc = Math.max(1, Math.floor((s1 - s0) / 50));
    for (let i = s0; i < s1; i += inc) { if (left[i] < mn) mn = left[i]; if (left[i] > mx) mx = left[i]; }
    if (mn > mx) { mn = 0; mx = 0; }
    const y1 = (H / 2) * (1 - mx), y2 = (H / 2) * (1 - mn);
    ctx.fillRect(x, y1, dpr * 0.6, Math.max(dpr * 0.6, y2 - y1));
  }
}

/* ---------- animated processing visualizer ---------- */
let vizRAF = null;
function startProcViz() {
  const canvas = $('procViz');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const bars = 64;
  let t = 0;
  function frame() {
    t += 0.06;
    ctx.clearRect(0, 0, W, H);
    const bw = W / bars;
    for (let i = 0; i < bars; i++) {
      const v = Math.abs(Math.sin(t * 1.4 + i * 0.55)) * Math.abs(Math.sin(t * 0.7 + i * 0.21));
      const h = 8 + v * (H - 24);
      const x = i * bw + bw * 0.2, w = bw * 0.6;
      const g = ctx.createLinearGradient(0, H / 2 - h / 2, 0, H / 2 + h / 2);
      const hue = 170 + Math.sin(i * 0.15 + t * 0.5) * 60;
      g.addColorStop(0, `hsla(${hue},80%,65%,.95)`);
      g.addColorStop(1, `hsla(${hue + 40},80%,55%,.35)`);
      ctx.fillStyle = g;
      const y = H / 2 - h / 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, w / 2);
      ctx.fill();
    }
    vizRAF = requestAnimationFrame(frame);
  }
  frame();
}
function stopProcViz() { if (vizRAF) { cancelAnimationFrame(vizRAF); vizRAF = null; } }

/* ---------- state & stages ---------- */
let currentFile = null, decoded = null, elapsedStart = 0, elapsedTimer = null;

function showStage(name) {
  ['stageUpload', 'stageProcess', 'stageResult'].forEach(id => $(id).hidden = (id !== name));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function decodeToBuffer(file) {
  const arrayBuffer = await file.arrayBuffer();
  const audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  const length = Math.ceil(audioBuffer.duration * SAMPLE_RATE);
  const offline = new OfflineAudioContext(2, length, SAMPLE_RATE);
  const src = offline.createBufferSource();
  src.buffer = audioBuffer;
  src.connect(offline.destination);
  src.start();
  const rendered = await offline.startRendering();
  return { audioBuffer, left: rendered.getChannelData(0),
    right: rendered.numberOfChannels > 1 ? rendered.getChannelData(1) : rendered.getChannelData(0) };
}

function loadFile(file) {
  if (!file) return;
  currentFile = file;
  $('fileName').textContent = file.name;
  $('fileDur').textContent = 'analyzing…';
  $('dropzone').hidden = true;
  $('fileCard').hidden = false;
  $('runBtn').disabled = true;
  $('ctaText').textContent = 'Analyzing track…';
  decodeToBuffer(file).then(({ audioBuffer, left, right }) => {
    decoded = { audioBuffer, left, right };
    $('fileDur').textContent = fmtTime(audioBuffer.duration) + ' · ' + file.name.split('.').pop().toUpperCase();
    drawWave($('wavePreview'), left, '#2dd4bf', '#a78bfa');
    $('runBtn').disabled = false;
    $('ctaText').textContent = '✨  Separate Vocals & Instrumental';
  }).catch(err => {
    $('ctaText').textContent = 'Could not read this file';
    console.error(err);
  });
}

function encodeWav(left, right, sampleRate) {
  const len = left.length;
  const buffer = new ArrayBuffer(44 + len * 4);
  const view = new DataView(buffer);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); view.setUint32(4, 36 + len * 4, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 2, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 4, true); view.setUint16(32, 4, true); view.setUint16(34, 16, true);
  wstr(36, 'data'); view.setUint32(40, len * 4, true);
  for (let i = 0; i < len; i++) {
    const l = Math.max(-1, Math.min(1, left[i])), r = Math.max(-1, Math.min(1, right[i]));
    view.setInt16(44 + i * 4, l < 0 ? l * 0x8000 : l * 0x7FFF, true);
    view.setInt16(46 + i * 4, r < 0 ? r * 0x8000 : r * 0x7FFF, true);
  }
  return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
}

/* ---------- upload wiring ---------- */
const dz = $('dropzone');
dz.addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));
$('changeBtn').addEventListener('click', e => {
  e.stopPropagation();
  currentFile = null; decoded = null;
  $('fileCard').hidden = true; $('dropzone').hidden = false;
  $('runBtn').disabled = true; $('ctaText').textContent = 'Select a track to begin';
  $('fileInput').value = '';
});
['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

/* ---------- model cache (IndexedDB) ---------- */
const IDB_NAME = 'stemly-cache', IDB_STORE = 'models';
function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore(IDB_STORE);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPut(key, value) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(value, key);
    rq.onsuccess = () => res(true);
    rq.onerror = () => rej(rq.error);
  });
}
async function detectBackend() {
  if ('gpu' in navigator) {
    try {
      const adapter = await Promise.race([
        navigator.gpu.requestAdapter(), // powerPreference ignored on Windows (crbug.com/369219127)
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 3000))
      ]);
      if (adapter) { $('backendBadge').textContent = 'WebGPU · GPU accelerated'; return 'webgpu'; }
    } catch (e) { /* ignore */ }
  }
  $('backendBadge').textContent = 'WASM · CPU';
  return 'wasm';
}
detectBackend();

/* ---------- fast model fetch: IDB → Cache API → network ---------- */
const IDB_KEY  = 'htdemucs_embedded_v1';
const CACHE_NAME = 'stemly-model-v1';

async function fetchModelBuffer(url, onProgress) {
  // 1. Try IndexedDB (fastest — raw ArrayBuffer, no re-download)
  try {
    const buf = await idbGet(IDB_KEY);
    if (buf) { onProgress(1, 'cache'); return { buf, source: 'idb' }; }
  } catch(e) { console.warn('IDB get failed', e); }

  // 2. Try Cache API (serves from disk, no network, streams fast)
  if ('caches' in self) {
    try {
      const cache = await caches.open(CACHE_NAME);
      const cached = await cache.match(url);
      if (cached) {
        const buf = await cached.arrayBuffer();
        if (buf && buf.byteLength > 0) { onProgress(1, 'cache'); return { buf, source: 'cache-api' }; }
      }
    } catch(e) { console.warn('Cache API get failed', e); }
  }

  // 3. Network download with streaming progress
  onProgress(0, 'network');
  const resp = await fetch(url, { mode: 'cors', cache: 'no-store' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const total = Number(resp.headers.get('content-length')) || 0;

  // Stream into a pre-allocated Uint8Array when size known (avoids Blob GC churn)
  let buf;
  if (total > 0) {
    const dest = new Uint8Array(total);
    const reader = resp.clone().body.getReader();
    let offset = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      dest.set(value, offset); offset += value.length;
      onProgress(offset / total, 'network');
    }
    buf = dest.buffer;
  } else {
    // Unknown size — collect chunks
    const reader = resp.body.getReader();
    const chunks = []; let loaded = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); loaded += value.length;
      onProgress(loaded / (loaded + 1), 'network'); // fake progress
    }
    buf = await new Blob(chunks).arrayBuffer();
  }
  if (!buf || buf.byteLength === 0) throw new Error('Empty download');

  // Save to both caches in background (don't await — don't block load)
  (async () => {
    try { await idbPut(IDB_KEY, buf); } catch(e) { console.warn('IDB save failed', e); }
    try {
      if ('caches' in self) {
        const cache = await caches.open(CACHE_NAME);
        await cache.put(url, new Response(buf.slice(0), { headers: { 'Content-Type': 'application/octet-stream' } }));
      }
    } catch(e) { console.warn('Cache API save failed', e); }
  })();

  return { buf, source: 'network' };
}

/* ---------- eager model preload (runs on page load) ---------- */
let preloadedProcessor = null;

async function preloadModel() {
  const el = $('modelStatus');
  try {
    if (el) el.innerHTML = '<span class="spinner"></span>Loading AI model…';

    const backend = await detectBackend();

    // WASM: use as many threads as possible — try without crossOriginIsolated check first
    // (some hosts set COOP/COEP, some don't; hardwareConcurrency is a good hint regardless)
    ort.env.wasm.numThreads = Math.max(1, Math.min(navigator.hardwareConcurrency || 4, self.crossOriginIsolated ? (navigator.hardwareConcurrency || 4) : 4));
    ort.env.wasm.simd = true; // explicit SIMD enable
    if (backend === 'webgpu') {
      ort.env.webgpu = { powerPreference: 'high-performance' };
    }

    const processor = new DemucsProcessor({
      ort,
      sessionOptions: backend === 'webgpu' ? undefined : { executionProviders: ['wasm'] },
      onProgress: () => {},
      onLog: () => {}
    });

   const url = MODEL_URLS[0];
const resp = await fetch(url, { mode: 'cors', cache: 'force-cache' });
if (!resp.ok) throw new Error('HTTP ' + resp.status);
const total = Number(resp.headers.get('content-length')) || 179300000;
const reader = resp.body.getReader();
const chunks = []; let loaded = 0;
while (true) {
  const { done, value } = await reader.read();
  if (done) break;
  chunks.push(value); loaded += value.length;
  if (el) el.innerHTML = '<span class="spinner"></span>Downloading… ' + Math.round(loaded / total * 100) + '%';
}
const buffer = await new Blob(chunks).arrayBuffer();
if (!buffer || buffer.byteLength === 0) throw new Error('Empty download');

idbPut(IDB_KEY, buffer).catch(e => console.warn('IDB save failed', e));
if (el) el.innerHTML = '<span class="spinner"></span>Compiling model…';


const blobUrl = URL.createObjectURL(new Blob([buffer], { type: 'application/octet-stream' }));
    await processor.loadModel(blobUrl);
    URL.revokeObjectURL(blobUrl);

    preloadedProcessor = processor;
    preloadedProcessor._backend = backend;
    if (el) {
      el.textContent = '✓ AI model ready — upload a track to begin';
      el.classList.add('ready');
    }
  } catch (err) {
    console.error('Model preload failed:', err);
    preloadedProcessor = null;
    if (el) {
      el.textContent = '⚠ AI model failed to load — check connection';
      el.classList.add('error');
    }
  }
}

// Start loading immediately on page load
preloadModel();

/* ---------- main run ---------- */
$('runBtn').addEventListener('click', async () => {
  if (!decoded) return;
  runBtn.disabled = true;
  showStage('stageProcess');
  startProcViz();
  elapsedStart = Date.now();
  elapsedTimer = setInterval(() => { $('procTimer').textContent = fmtTime((Date.now() - elapsedStart) / 1000); }, 500);
  const phases = ['Analyzing audio structure…', 'AI processing algorithm running…', 'Isolating vocal harmonics…', 'Extracting instrumental layer…', 'Refining output quality…'];
  let phaseIdx = 0;
  const phaseTimer = setInterval(() => {
    phaseIdx = (phaseIdx + 1) % phases.length;
    $('procText').textContent = phases[phaseIdx];
  }, 6000);
  $('procText').textContent = phases[0];

  try {
    let processor;
    let backend = 'wasm'; // default, will be overwritten below

    if (preloadedProcessor) {
      // Model already loaded during page load — skip loading entirely
      processor = preloadedProcessor;
      backend = preloadedProcessor._backend || 'wasm';
      $('procText').textContent = 'AI model ready — starting separation…';
      $('barFill').style.width = '25%';
    } else {
      // Fallback: preload didn't finish yet, load now (reuses IDB/Cache cache if available)
      backend = await detectBackend();
      ort.env.wasm.numThreads = Math.max(1, Math.min(navigator.hardwareConcurrency || 4, self.crossOriginIsolated ? (navigator.hardwareConcurrency || 4) : 4));
      ort.env.wasm.simd = true;
      if (backend === 'webgpu') ort.env.webgpu = { powerPreference: 'high-performance' };

      processor = new DemucsProcessor({
        ort,
        sessionOptions: backend === 'webgpu' ? undefined : { executionProviders: ['wasm'] },
        onProgress: ({ progress }) => { $('barFill').style.width = (progress * 25).toFixed(1) + '%'; },
        onLog: () => {}
      });

      $('procText').textContent = 'Loading AI model…';
      const { buf: fallbackBuf } = await fetchModelBuffer(MODEL_URLS[0], (pct, src) => {
        $('procText').textContent = src === 'cache'
          ? 'Loading model from cache…'
          : 'Downloading AI model… ' + Math.round(pct * 100) + '%';
        $('barFill').style.width = (pct * 25).toFixed(1) + '%';
      });
      $('procText').textContent = 'Compiling model…';
      const fbUrl = URL.createObjectURL(new Blob([fallbackBuf], { type: 'application/octet-stream' }));
      await processor.loadModel(fbUrl);
      URL.revokeObjectURL(fbUrl);
    }

    $('procText').textContent = 'AI processing algorithm running…';

    const t0 = Date.now();
    const result = await processor.separate(decoded.left, decoded.right);
    const elapsed = (Date.now() - t0) / 1000;
    clearInterval(phaseTimer); clearInterval(elapsedTimer);
    stopProcViz();

    // vocals + instrumental
    const instL = new Float32Array(decoded.left.length), instR = new Float32Array(decoded.left.length);
    ['drums', 'bass', 'other'].forEach(name => {
      const s = result[name]; if (!s) return;
      for (let i = 0; i < instL.length; i++) { instL[i] += s.left[i]; instR[i] += s.right[i]; }
    });
    const outputs = [
      ['vocals', result.vocals.left, result.vocals.right, '#2dd4bf', '#4ade80'],
      ['instrumental', instL, instR, '#a78bfa', '#f472b6']
    ];

    $('doneStat').innerHTML =
      '<div class="big">✨ AI processing completed — ' + fmtTime(decoded.audioBuffer.duration) +
      ' of audio in ' + fmtTime(elapsed) + '</div>' +
      '<div class="sub">Processed locally at ' + (decoded.audioBuffer.duration / elapsed).toFixed(2) + '× realtime · ' +
      backend.toUpperCase() + ' engine · 100% private, nothing uploaded</div>';

    const stemsEl = $('stems');
    stemsEl.innerHTML = '';
    const baseName = currentFile.name.replace(/\.[^.]+$/, '');
    outputs.forEach(([name, l, r, c1, c2], idx) => {
      const url = encodeWav(l, r, SAMPLE_RATE);
      const card = document.createElement('div');
      card.className = 'stemcard fade-in';
      card.style.animationDelay = (idx * 0.15) + 's';
      card.innerHTML =
        '<div class="stemhead"><div class="stemname ' + name + '">' + name + '</div>' +
        '<a class="btn" href="' + url + '" download="' + baseName + '_' + name + '.wav">⬇ Download WAV</a></div>' +
        '<canvas height="84"></canvas>' +
        '<audio controls src="' + url + '"></audio>';
      stemsEl.appendChild(card);
      drawWave(card.querySelector('canvas'), l, c1, c2);
    });

    showStage('stageResult');
  } catch (err) {
    console.error(err);
    clearInterval(phaseTimer); clearInterval(elapsedTimer);
    stopProcViz();
    $('procText').textContent = 'Something went wrong: ' + (err.message || err);
    setTimeout(() => { showStage('stageUpload'); runBtn.disabled = false; }, 4000);
  }
});

$('againBtn').addEventListener('click', () => {
  currentFile = null; decoded = null;
  $('fileCard').hidden = true; $('dropzone').hidden = false;
  $('runBtn').disabled = true; $('ctaText').textContent = 'Select a track to begin';
  $('fileInput').value = '';
  showStage('stageUpload');
});
</script>
</body>
</html>
