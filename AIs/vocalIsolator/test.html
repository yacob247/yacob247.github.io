<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Test — Qwen2-0.5B (WebLLM)</title>
<style>
  :root { --bg:#0f0f13; --card:#1a1a1f; --border:#2a2a32; --txt:#e8e8e8; --mut:#9b9b9b; --acc:#7c8cf8; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:15px; font-weight:600; }
  #status { font-size:12px; color:var(--mut); background:var(--card); border:1px solid var(--border); border-radius:99px; padding:4px 12px; }
  #status.ok { color:#4ade80; border-color:#14532d; }
  #status.err { color:#f87171; border-color:#7f1d1d; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#3b3f8f; border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .sys { align-self:center; color:var(--mut); font-size:11px; font-family:monospace; background:none; padding:0; }
  footer { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; }
  #prompt { flex:1; background:var(--card); border:1px solid var(--border); color:var(--txt); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; resize:none; }
  #prompt:focus { border-color:var(--acc); }
  #send { background:var(--acc); color:#fff; border:none; border-radius:10px; padding:10px 22px; font-size:14px; cursor:pointer; }
  #send:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>🧪 LLM Test</h1>
  <span id="status">idle — model not loaded</span>
</header>
<div id="log"></div>
<footer>
  <textarea id="prompt" rows="1" placeholder="Type a message… (Enter to send)"></textarea>
  <button id="send">Send</button>
</footer>
<script>
// Strip HuggingFace's "/resolve/main/" that WebLLM appends to model URLs,
// so requests land directly on our R2 bucket where the files actually are.
const _r2Base = "https://pub-406a7f3fa4d44f41b5317520aa1aaf4a.r2.dev/";
const _origFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
    let url = (input instanceof Request) ? input.url : String(input);
    if (url.startsWith(_r2Base)) {
        url = url.replace("/resolve/main/", "/");
        input = (input instanceof Request) ? new Request(url, input) : url;
    }
    // R2's mlc-chat-config.json claims context_window_size 100000, but the
    // wasm lib is the _cs1k build (1024-slot KV cache). Clamp it here.
    if (url.startsWith(_r2Base) && url.includes("mlc-chat-config.json")) {
        return _origFetch(input, init).then(async (resp) => {
            try {
                const cfg = await resp.json();
                cfg.context_window_size = 1024;
                if (cfg.model_config) cfg.model_config.context_window_size = 1024;
                return new Response(JSON.stringify(cfg), { headers: { "Content-Type": "application/json" } });
            } catch (e) { return resp; }
        });
    }
    return _origFetch(input, init);
};
</script>


<script type="module">
const status = document.getElementById('status');
const log = document.getElementById('log');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');

function sys(t){ const d=document.createElement('div'); d.className='msg sys'; d.textContent=t; log.appendChild(d); log.scrollTop=log.scrollHeight; }
function setStat(t, cls){ status.textContent=t; status.className=cls||''; sys('[' + new Date().toLocaleTimeString() + '] ' + t); }

// ── EXACT same endpoints & settings as index.html ──
const WEBLLM_CDN = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.84/+esm";
const MODEL_LIB_URL = "https://cdn.jsdelivr.net/gh/mlc-ai/binary-mlc-llm-libs@main/web-llm-models/v0_2_84/base/Qwen2-0.5B-Instruct-q4f16_1_cs1k-webgpu.wasm";
// Your R2 bucket (config fixed to match the q4f16_1 cs1k lib)
const MODEL_URL = "https://pub-406a7f3fa4d44f41b5317520aa1aaf4a.r2.dev/";
const CHAT_MODEL_ID = "Qwen2-0.5B-Instruct-q4f16_1-MLC";

let engine = null;

async function boot(){
  try {
    setStat('loading WebLLM library…');
    const webllm = await import(WEBLLM_CDN);
    sys('WebLLM loaded ✓');

    if (!navigator.gpu) throw new Error('navigator.gpu is undefined — use Chrome/Edge with hardware acceleration.');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('No WebGPU adapter found.');
    const info = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : {});
    sys('GPU: ' + (info.vendor||'?') + ' ' + (info.device||info.architecture||''));

    setStat('loading model (first time downloads ~500MB from R2, then cached)…');
    engine = await webllm.CreateMLCEngine(CHAT_MODEL_ID, {
      initProgressCallback: (r) => setStat(r.text || 'loading…'),
      chatOpts: { context_window_size: 1024 },
      appConfig: { cacheBackend: 'indexeddb', model_list: [{ model: MODEL_URL, model_id: CHAT_MODEL_ID, model_lib: MODEL_LIB_URL }] }
    });
    setStat('Engine ready ✓ — chat away', 'ok');
  } catch (e) {
    console.error(e);
    setStat('FAILED: ' + (e && e.message ? e.message : String(e)), 'err');
  }
}

async function send(){
  const text = promptEl.value.trim();
  if (!text || !engine) return;
  promptEl.value = '';
  addMsg('user', text);
  sendBtn.disabled = true;
  const ai = addMsg('ai', '…');
  try {
    const chunks = await engine.chat.completions.create({
      messages: [
        { role: 'system', content: 'You are a helpful, concise assistant. Answer directly.' },
        { role: 'user', content: text }
      ],
      stream: true,
      temperature: 0.75, top_p: 0.92,
      frequency_penalty: 0.35, presence_penalty: 0.3, repetition_penalty: 1.15,
      max_tokens: 384,
      stop: ['<|im_end|>', '<|im_start|>']
    });
    let full = '';
    for await (const c of chunks) {
      const d = c.choices?.[0]?.delta?.content || '';
      full += d;
      ai.textContent = full;
      log.scrollTop = log.scrollHeight;
    }
    // strip leaked end-of-turn tokens & template echo
    full = full
      .replace(/<\|im_(start|end)\|>?/g, '')
      .replace(/<\|endoftext\|>/g, '')
      .replace(/^\s*You are a helpful assistant\.?\s*/i, '')
      .trim();
    ai.textContent = full || '(empty reply)';
    sys('reply: ' + full.trim().length + ' chars');
  } catch (e) {
    console.error(e);
    ai.textContent = '⚠ ' + (e && e.message ? e.message : String(e));
  }
  sendBtn.disabled = false;
}

function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

sendBtn.addEventListener('click', send);
promptEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

boot();
</script>
</body>
</html>
