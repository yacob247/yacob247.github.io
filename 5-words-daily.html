<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily 5 · Word Learner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6edf5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            color: #1e293b;
        }
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0f172a;
        }
        header h1 span {
            background: #3b82f6;
            color: white;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7em;
            vertical-align: middle;
            margin-left: 8px;
        }
        header p {
            font-size: 1.1rem;
            color: #475569;
            margin-top: 6px;
        }
        .date-badge {
            display: inline-block;
            background: #ffffffcc;
            backdrop-filter: blur(6px);
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            margin-top: 12px;
        }

        /* ---- Global Language Selector ---- */
        .global-lang {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 2rem;
            background: #ffffffb8;
            backdrop-filter: blur(4px);
            padding: 0.75rem 1.6rem;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
            flex-wrap: wrap;
        }
        .global-lang label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e293b;
        }
        .global-lang select {
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #94a3b8;
            background: white;
            font-size: 0.95rem;
            font-weight: 500;
            color: #0f172a;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .global-lang select:hover {
            border-color: #3b82f6;
        }

        /* ---- Grid ---- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
        }

        .card {
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            padding: 1.5rem;
            box-shadow: 0 10px 24px -6px rgba(0, 20, 50, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 30px -10px rgba(0, 20, 50, 0.15);
        }

        .word-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .word {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.3px;
            line-height: 1.2;
            word-break: break-word;
        }
        .pos {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            white-space: nowrap;
            margin-left: 8px;
        }

        .phonetic {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 0.75rem;
            font-style: italic;
        }

        .definition {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #1e293b;
            margin-bottom: 0.75rem;
            flex: 1;
        }

        .example {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #475569;
            border-left: 4px solid #93c5fd;
            padding-left: 0.9rem;
            margin-bottom: 1rem;
            font-style: italic;
        }
        .example .no-example {
            color: #94a3b8;
            font-style: normal;
        }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: auto;
            flex-wrap: wrap;
        }
        .card-footer label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }
        .card-footer select {
            padding: 0.35rem 0.8rem;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 0.85rem;
            color: #1e293b;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            flex: 1;
            min-width: 100px;
        }
        .card-footer select:hover {
            border-color: #3b82f6;
            background: white;
        }

        /* Translation output */
        .translation-box {
            margin-top: 0.75rem;
            padding: 0.75rem 1rem;
            background: #f1f5f9;
            border-radius: 16px;
            font-size: 0.95rem;
            color: #0f172a;
            line-height: 1.5;
            border-left: 4px solid #3b82f6;
            word-break: break-word;
            display: none;
        }
        .translation-box.show {
            display: block;
        }
        .translation-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 2px;
        }

        /* Loading & Error states */
        .loading-state,
        .error-state {
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            color: #475569;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 4px solid #cbd5e1;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-state {
            color: #b91c1c;
            background: #fee2e2;
            border-radius: 16px;
            padding: 1.5rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .error-state button {
            margin-top: 1rem;
            padding: 0.6rem 1.8rem;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .error-state button:hover {
            background: #dc2626;
        }

        .hidden {
            display: none !important;
        }
        footer {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
        footer a {
            color: #3b82f6;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.9rem; }
            .word { font-size: 1.5rem; }
            .global-lang { padding: 0.6rem 1rem; }
            .card { padding: 1.2rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>Daily 5 <span>Word Learner</span></h1>
    <p>Five new words every day, sourced from Wikipedia & the Free Dictionary.</p>
    <div class="date-badge" id="dateBadge">Loading date…</div>
</header>

<div class="global-lang">
    <label for="globalLang">🌐 Translate all examples to:</label>
    <select id="globalLang">
        <option value="">— None —</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="nl">Dutch</option>
        <option value="ru">Russian</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh">Chinese (Simplified)</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="tr">Turkish</option>
        <option value="pl">Polish</option>
        <option value="sv">Swedish</option>
    </select>
</div>

<main id="mainContainer">
    <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <div>Fetching your 5 words for today…</div>
    </div>
    <div class="error-state hidden" id="errorState">
        <div id="errorMessage">Something went wrong.</div>
        <button id="retryBtn">Try Again</button>
    </div>
    <div class="grid hidden" id="wordGrid"></div>
</main>

<footer>
    Word data from <a href="https://dictionaryapi.dev/" target="_blank" rel="noopener">Free Dictionary API</a> ·
    Random words from <a href="https://www.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a> ·
    Translations by <a href="https://mymemory.translated.net/" target="_blank" rel="noopener">MyMemory</a>
</footer>

<script>
    (function() {
        'use strict';

        // ------------------------------------------------------------------
        //  CONFIGURATION
        // ------------------------------------------------------------------
        const CACHE_KEY_PREFIX = 'daily5_words_';
        const TARGET_WORD_COUNT = 5;
        const MAX_ATTEMPTS = 30;          // safety limit for random word fetching
        const DICTIONARY_API_BASE = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
        // Public CORS proxy to work around dictionaryapi.dev CORS limitations.
        // If this proxy becomes unavailable, you can swap it with another one
        // (e.g., https://corsproxy.io/?url= ) or host a tiny serverless function.
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        const WIKI_RANDOM_TITLE = 'https://en.wikipedia.org/api/rest_v1/page/random/title';
        const MYMEMORY_API = 'https://api.mymemory.translated.net/get';

        // ------------------------------------------------------------------
        //  DOM REFERENCES
        // ------------------------------------------------------------------
        const dateBadge = document.getElementById('dateBadge');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const wordGrid = document.getElementById('wordGrid');
        const globalLangSelect = document.getElementById('globalLang');

        // ------------------------------------------------------------------
        //  STATE
        // ------------------------------------------------------------------
        let currentWords = [];          // array of word objects (cached or fresh)
        let globalLang = '';            // current global target language code

        // ------------------------------------------------------------------
        //  UTILITIES
        // ------------------------------------------------------------------

        /** Returns today's date in YYYY-MM-DD format (local time). */
        function getTodayKey() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /** Formats the date for the badge. */
        function formatDateDisplay() {
            return new Date().toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        /** Simple delay helper. */
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /** Safely parse JSON; returns null on failure. */
        function safeJsonParse(str) {
            try { return JSON.parse(str); } catch { return null; }
        }

        // ------------------------------------------------------------------
        //  LOCAL STORAGE CACHE
        // ------------------------------------------------------------------

        function loadFromCache() {
            const key = CACHE_KEY_PREFIX + getTodayKey();
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                const data = safeJsonParse(raw);
                if (Array.isArray(data) && data.length === TARGET_WORD_COUNT) {
                    return data;
                }
            } catch (e) {
                console.warn('Cache read error', e);
            }
            return null;
        }

        function saveToCache(words) {
            const key = CACHE_KEY_PREFIX + getTodayKey();
            try {
                localStorage.setItem(key, JSON.stringify(words));
            } catch (e) {
                console.warn('Cache write error (storage may be full)', e);
            }
        }

        // ------------------------------------------------------------------
        //  WIKIPEDIA — RANDOM TITLE
        // ------------------------------------------------------------------

        /**
         * Fetches a single random Wikipedia title.
         * Returns the title string, or null if something fails.
         */
        async function fetchRandomWikiTitle() {
            try {
                const response = await fetch(WIKI_RANDOM_TITLE);
                if (!response.ok) throw new Error(`Wikipedia HTTP ${response.status}`);
                const data = await response.json();
                // The endpoint returns JSON like: { "title": "Some_Article", ... }
                if (data && typeof data.title === 'string' && data.title.trim().length > 0) {
                    // Wikipedia titles may contain underscores for spaces.
                    return data.title.replace(/_/g, ' ');
                }
                return null;
            } catch (e) {
                console.warn('Wikipedia random title failed:', e);
                return null;
            }
        }

        // ------------------------------------------------------------------
        //  DICTIONARY API
        // ------------------------------------------------------------------

        /**
         * Fetches dictionary data for a given English word.
         * Uses a CORS proxy because dictionaryapi.dev does not send
         * browser-friendly CORS headers.
         * Returns a parsed object or null on failure.
         */
        async function fetchDictionaryEntry(word) {
            const targetUrl = DICTIONARY_API_BASE + encodeURIComponent(word.toLowerCase().trim());
            const proxiedUrl = CORS_PROXY + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxiedUrl);
                if (!response.ok) {
                    // 404 simply means the word isn't in the dictionary; not a fatal error.
                    if (response.status === 404) return null;
                    throw new Error(`Dictionary proxy HTTP ${response.status}`);
                }
                const data = await response.json();

                // The API returns an array of entries. Take the first one.
                if (!Array.isArray(data) || data.length === 0) return null;
                return data[0];
            } catch (e) {
                console.warn(`Dictionary fetch failed for "${word}":`, e);
                return null;
            }
        }

        /**
         * Extracts the first suitable definition + example from a dictionary entry.
         * Returns { definition, example, partOfSpeech, phonetic } or null.
         */
        function extractDefinitionAndExample(entry) {
            if (!entry || !Array.isArray(entry.meanings)) return null;

            for (const meaning of entry.meanings) {
                if (!meaning.definitions || !Array.isArray(meaning.definitions)) continue;
                for (const def of meaning.definitions) {
                    if (def.definition && def.definition.trim().length > 0) {
                        return {
                            definition: def.definition.trim(),
                            example: (def.example && def.example.trim().length > 0)
                                ? def.example.trim()
                                : null,
                            partOfSpeech: meaning.partOfSpeech || '',
                            phonetic: entry.phonetic || (entry.phonetics && entry.phonetics[0]?.text) || ''
                        };
                    }
                }
            }
            return null;
        }

        // ------------------------------------------------------------------
        //  BUILD THE 5 DAILY WORDS
        // ------------------------------------------------------------------

        /**
         * Fetches random Wikipedia titles, checks each against the dictionary,
         * and returns an array of exactly TARGET_WORD_COUNT valid word objects.
         * Each object: { word, definition, example, partOfSpeech, phonetic, wikiTitle }
         */
        async function buildDailyWords() {
            const collected = [];
            const seenTitles = new Set();
            let attempts = 0;

            // We need to fetch titles one-by-one because the random endpoint
            // doesn't reliably support batch requests for titles.
            while (collected.length < TARGET_WORD_COUNT && attempts < MAX_ATTEMPTS) {
                attempts++;
                const title = await fetchRandomWikiTitle();

                // Skip if null, already seen, or contains characters that
                // strongly suggest a non-word (e.g., parentheses, numbers).
                if (!title) continue;
                if (seenTitles.has(title)) continue;
                seenTitles.add(title);

                // Heuristic: skip titles that are clearly not single-word concepts.
                // (e.g., "Battle of Hastings", "2001: A Space Odyssey").
                // We keep titles that are a single token or hyphenated.
                const cleaned = title.trim();
                if (!cleaned) continue;
                // Allow only letters, hyphens, and spaces (multi-word phrases may still
                // be valid dictionary entries, e.g., "ice cream").
                if (!/^[a-zA-Z\s\-']+$/.test(cleaned)) continue;

                // Fetch dictionary entry
                const entry = await fetchDictionaryEntry(cleaned);
                if (!entry) continue;

                const extracted = extractDefinitionAndExample(entry);
                if (!extracted) continue;

                // Success — add to collection.
                collected.push({
                    word: entry.word || cleaned,
                    definition: extracted.definition,
                    example: extracted.example,
                    partOfSpeech: extracted.partOfSpeech,
                    phonetic: extracted.phonetic,
                    wikiTitle: title
                });

                // Be polite to the APIs – tiny delay between requests.
                if (collected.length < TARGET_WORD_COUNT) {
                    await sleep(200 + Math.random() * 200);
                }
            }

            if (collected.length < TARGET_WORD_COUNT) {
                throw new Error(
                    `Could only find ${collected.length} valid word(s) after ${attempts} attempts. ` +
                    'The dictionary or Wikipedia may be temporarily unavailable.'
                );
            }

            return collected;
        }

        // ------------------------------------------------------------------
        //  TRANSLATION (MyMemory)
        // ------------------------------------------------------------------

        /**
         * Translates a given text into the target language using MyMemory.
         * Returns the translated string, or null on failure.
         */
        async function translateText(text, targetLang) {
            if (!text || !targetLang) return null;
            // MyMemory expects language codes like "en|es".
            const langPair = `en|${targetLang}`;
            const url = `${MYMEMORY_API}?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langPair)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`MyMemory HTTP ${response.status}`);
                const data = await response.json();

                // MyMemory returns: { responseData: { translatedText: "..." }, responseStatus: 200, ... }
                if (data && data.responseData && data.responseData.translatedText) {
                    const translated = data.responseData.translatedText;
                    // Sometimes MyMemory returns the same text if it cannot translate;
                    // we still return it so the user sees something.
                    return translated;
                }
                return null;
            } catch (e) {
                console.warn('Translation failed:', e);
                return null;
            }
        }

        // ------------------------------------------------------------------
        //  RENDERING
        // ------------------------------------------------------------------

        function renderWords(words) {
            wordGrid.innerHTML = ''; // clear previous

            words.forEach((wordObj, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;

                // Header: word + part of speech
                const headerDiv = document.createElement('div');
                headerDiv.className = 'word-header';
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.textContent = wordObj.word;
                headerDiv.appendChild(wordSpan);

                if (wordObj.partOfSpeech) {
                    const posSpan = document.createElement('span');
                    posSpan.className = 'pos';
                    posSpan.textContent = wordObj.partOfSpeech;
                    headerDiv.appendChild(posSpan);
                }
                card.appendChild(headerDiv);

                // Phonetic
                if (wordObj.phonetic) {
                    const phonDiv = document.createElement('div');
                    phonDiv.className = 'phonetic';
                    phonDiv.textContent = wordObj.phonetic;
                    card.appendChild(phonDiv);
                }

                // Definition
                const defDiv = document.createElement('div');
                defDiv.className = 'definition';
                defDiv.textContent = wordObj.definition;
                card.appendChild(defDiv);

                // Example sentence
                const exDiv = document.createElement('div');
                exDiv.className = 'example';
                if (wordObj.example) {
                    exDiv.textContent = `“${wordObj.example}”`;
                } else {
                    exDiv.innerHTML = `<span class="no-example">No example sentence available for this word.</span>`;
                }
                card.appendChild(exDiv);

                // Footer: per-card language selector
                const footerDiv = document.createElement('div');
                footerDiv.className = 'card-footer';

                const label = document.createElement('label');
                label.textContent = 'Translate:';
                label.setAttribute('for', `lang-${index}`);
                footerDiv.appendChild(label);

                const select = document.createElement('select');
                select.id = `lang-${index}`;
                select.className = 'card-lang-select';
                // Populate with the same options as the global selector
                const globalOptions = globalLangSelect.querySelectorAll('option');
                globalOptions.forEach(opt => {
                    const newOpt = document.createElement('option');
                    newOpt.value = opt.value;
                    newOpt.textContent = opt.textContent;
                    select.appendChild(newOpt);
                });
                // Set to current global language (if any)
                select.value = globalLang || '';
                footerDiv.appendChild(select);

                card.appendChild(footerDiv);

                // Translation output box (hidden by default)
                const transBox = document.createElement('div');
                transBox.className = 'translation-box';
                transBox.id = `trans-${index}`;
                transBox.innerHTML = `<div class="label">Translation</div><div class="trans-text"></div>`;
                card.appendChild(transBox);

                // Attach event listener for this card's selector
                select.addEventListener('change', async (e) => {
                    const targetLang = e.target.value;
                    if (!targetLang) {
                        transBox.classList.remove('show');
                        return;
                    }
                    // Use the example sentence if available; otherwise the definition.
                    const textToTranslate = wordObj.example || wordObj.definition;
                    if (!textToTranslate) return;

                    // Show loading state inside the box
                    transBox.classList.add('show');
                    transBox.querySelector('.trans-text').textContent = 'Translating…';

                    const translated = await translateText(textToTranslate, targetLang);
                    if (translated) {
                        transBox.querySelector('.trans-text').textContent = translated;
                    } else {
                        transBox.querySelector('.trans-text').textContent = 'Translation unavailable.';
                    }
                });

                wordGrid.appendChild(card);
            });

            // Show the grid, hide loading/error
            wordGrid.classList.remove('hidden');
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
        }

        // ------------------------------------------------------------------
        //  GLOBAL LANGUAGE SELECTOR HANDLER
        // ------------------------------------------------------------------

        globalLangSelect.addEventListener('change', async (e) => {
            globalLang = e.target.value;

            // Update all per-card selectors to match
            const cardSelects = wordGrid.querySelectorAll('.card-lang-select');
            cardSelects.forEach(select => {
                select.value = globalLang;
            });

            // If a language is selected, trigger translation for every card.
            if (!globalLang) {
                // Hide all translation boxes
                wordGrid.querySelectorAll('.translation-box').forEach(box => {
                    box.classList.remove('show');
                });
                return;
            }

            // Iterate over each card and translate its example (or definition).
            const cards = wordGrid.querySelectorAll('.card');
            for (let i = 0; i < cards.length; i++) {
                const card = cards[i];
                const index = card.dataset.index;
                const wordObj = currentWords[index];
                if (!wordObj) continue;

                const transBox = document.getElementById(`trans-${index}`);
                if (!transBox) continue;

                const textToTranslate = wordObj.example || wordObj.definition;
                if (!textToTranslate) continue;

                transBox.classList.add('show');
                transBox.querySelector('.trans-text').textContent = 'Translating…';

                const translated = await translateText(textToTranslate, globalLang);
                if (translated) {
                    transBox.querySelector('.trans-text').textContent = translated;
                } else {
                    transBox.querySelector('.trans-text').textContent = 'Translation unavailable.';
                }

                // Small delay between translation requests to avoid rate limits.
                if (i < cards.length - 1) await sleep(300);
            }
        });

        // ------------------------------------------------------------------
        //  INITIALIZATION
        // ------------------------------------------------------------------

        async function init() {
            // Update the date badge
            dateBadge.textContent = formatDateDisplay();

            // 1. Try cache first
            const cached = loadFromCache();
            if (cached) {
                currentWords = cached;
                renderWords(currentWords);
                return;
            }

            // 2. No cache for today — fetch fresh words
            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            wordGrid.classList.add('hidden');

            try {
                const freshWords = await buildDailyWords();
                currentWords = freshWords;
                saveToCache(freshWords);
                renderWords(freshWords);
            } catch (err) {
                console.error('Failed to build daily words:', err);
                loadingState.classList.add('hidden');
                wordGrid.classList.add('hidden');
                errorState.classList.remove('hidden');
                errorMessage.textContent = err.message || 'Could not fetch words. Please try again later.';
            }
        }

        // Retry button: clear today's cache and re-fetch.
        retryBtn.addEventListener('click', () => {
            const key = CACHE_KEY_PREFIX + getTodayKey();
            try { localStorage.removeItem(key); } catch (_) { /* ignore */ }
            // Reset state
            currentWords = [];
            globalLang = '';
            globalLangSelect.value = '';
            wordGrid.innerHTML = '';
            wordGrid.classList.add('hidden');
            errorState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            init();
        });

        // Kick off
        init();

    })();
</script>
</body>
</html>
