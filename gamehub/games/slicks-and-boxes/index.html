<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sticks &amp; Boxes – Envizion Games</title>
<style>
:root{--o5:#ff7a1a;--ok:#3ddc84;--dim:#9db0d6;--line:rgba(120,160,255,.25);--n7:#0f1c3a;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}html,body{margin:0;min-height:100%;background:#050914;color:#f3f6ff;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scr{display:none;min-height:100vh;align-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.scr.on{display:flex;animation:in .4s cubic-bezier(.22,1,.36,1) both}@keyframes in{from{opacity:0;transform:scale(.985)}}
.stage{position:relative;width:100%;max-width:1100px;margin:0 auto;container-type:inline-size;background-size:100% 100%;background-repeat:no-repeat;user-select:none}
.stage>*{position:absolute}
.h{border-radius:1.4cqw;color:transparent;font-size:0;transition:background .15s,box-shadow .15s,transform .12s}
.h:hover{background:rgba(255,150,40,.16);box-shadow:inset 0 0 0 .25cqw rgba(255,170,70,.8),0 0 2cqw rgba(255,122,26,.5)}
.h:active{transform:scale(.97);background:rgba(255,190,90,.34)}
.type.on{background:rgba(255,150,40,.12);box-shadow:inset 0 0 0 .3cqw #ff9a3a,0 0 2cqw rgba(255,122,26,.7)}
#play{border-radius:5cqw;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{box-shadow:0 0 3cqw rgba(255,150,40,.65)}}
.live{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:600;font-size:1.95cqw;line-height:1.3;padding:0 .8cqw}
.live b{font-size:5.2cqw;line-height:1.1;color:#ff8a1f}.lab{font-size:2.4cqw}
#lvbox{display:flex;flex-direction:column;justify-content:center;font-weight:800;letter-spacing:.1em;font-size:1.8cqw;line-height:1.1;pointer-events:none}#lvbox b{font-size:3.4cqw;letter-spacing:0}
#trobox{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:2.4cqw;pointer-events:none}
#tg{display:flex;align-items:center;justify-content:center;font-size:1.45cqw;font-weight:700;letter-spacing:.16em;white-space:nowrap;color:#d5def7;text-transform:uppercase;pointer-events:none}
#rooms{display:grid;grid-template-rows:repeat(5,1fr);font-size:1.8cqw;color:#fff}
.rr{display:grid;grid-template-columns:26% 29% 22% 23%;align-items:center;text-align:center;cursor:pointer;border-radius:1cqw}
.rr .nm{text-align:left;padding-left:1.3cqw;font-weight:600}.rr:hover{background:rgba(255,122,26,.14)}.rr.on{background:rgba(255,122,26,.25);box-shadow:inset 0 0 0 .2cqw #ff8a2a}
.dot{display:inline-block;width:1.1cqw;height:1.1cqw;border-radius:50%;margin-right:.7cqw}
#area{overflow:hidden;display:flex;align-items:center;justify-content:center}
#area svg{width:100%;height:100%;touch-action:manipulation}
.bw{width:100%;height:100%}#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.5cqw;padding:1cqw;height:100%;background:#080c18;border-radius:1.2cqw}
.c{border-radius:.8cqw;background:#0f1730;cursor:pointer}
.c.p{background:linear-gradient(145deg,#d9995a,#a8672c);box-shadow:inset 0 .25cqw 0 rgba(255,255,255,.3),inset 0 -.4cqw 0 rgba(0,0,0,.28)}
.c.R{background:linear-gradient(145deg,#ffb04d,#ff6a00);box-shadow:0 0 1.6cqw rgba(255,122,26,.6),inset 0 .25cqw 0 rgba(255,255,255,.5)}.c.sel{outline:.4cqw solid #fff}
#bar{display:flex;align-items:center;gap:1cqw;padding:0 1.2cqw}#bar .mt{flex:1;min-width:0;font-size:2cqw;font-weight:600;white-space:nowrap}
#bar .tr{height:.8cqw;border-radius:1cqw;background:#14234a;margin-top:.7cqw;overflow:hidden}#lf{display:block;height:100%;background:linear-gradient(90deg,#ff7a1a,#ffc23d)}
#bar button{width:3.8cqw;height:3.8cqw;font-size:2.4cqw;font-weight:800;border-radius:.9cqw;border:1px solid rgba(255,122,26,.65);background:#0b1430;color:#fff}#bar button:hover{background:#1b2a55}
.mod{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(5,9,20,.8);backdrop-filter:blur(6px);padding:18px}.mod.on{display:flex}
.panel{background:linear-gradient(160deg,#162a52,#080e20);border:1.5px solid rgba(255,122,26,.6);border-radius:14px;box-shadow:0 0 20px rgba(255,122,26,.2);width:min(400px,100%);padding:20px;max-height:85vh;overflow:auto}
.mod h3{margin:0 0 10px}.bar{display:flex;gap:10px;justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(180deg,#ffa04d,#e8590c);box-shadow:0 5px 16px rgba(255,122,26,.5)}.btn.g{background:#0b1430;border:1.5px solid rgba(255,122,26,.55);box-shadow:none}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.lg button{width:40px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--n7);font-weight:700}.lg button.d{background:var(--ok);color:#06210f;border-color:var(--ok)}
.ac{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);opacity:.4}.ac.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:20;background:#0b0f1d;border:1.5px solid var(--o5);padding:10px 18px;border-radius:12px;font-size:14px;max-width:90%;text-align:center;display:none}

  for(let i=s;i<=n-left;i++){rem[i]=true;p.push(i);if(go(i+1,left-1))return true;rem[i]=false;p.pop()}return false})(0,K);

const parse=i=>BX[i][0].replace(/\|/g,'');

const WC={};
function wood(c1,c2,seed,rx=1,ry=1){const k=c1+c2+seed+rx;if(WC[k])return WC[k];const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,256,256);

/* camera + tweens */
const cam={th:.4,ph:1,r:10,tx:0,ty:0,tz:0},AN=[];
const ease=t=>1-Math.pow(1-t,3),ease2=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function pulse(now){if(!st)return;

 else if(st&&st.prox){const h=rayPick(e,st.prox);st.hov=h?(mode===1?h.object.userData.i:h.object.userData.ch):(mode===1?-1:null);cv.style.cursor=h?'pointer':'grab'}});

/* ---------- matchsticks on the table ---------- */
const SS=1.5;
function sceneMS(){clearG();const[w,h]=MS[idx],g=st.g;st.meshes=[];st.prox=[];st.ghost=[];st.slots=[];st.hint=-1;st.hov=-1;st.rem=new Array(g.sticks.length).fill(false);
 g.sticks.forEach((l,i)=>{const vert=l[0]===l[2],L=SS*.94,cx=((l[0]+l[2])/2-w/2)*SS,cz=((l[1]+l[3])/2-h/2)*SS,y=vert?.27:.1,yaw=vert?Math.PI/2:0;
  const mat=MATCHMAT.clone(),pv=new THREE.Group(),inn=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(L-.12,.15,.15),mat);body.castShadow=true;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.125,14,10),HEADMAT);head.position.x=(L-.12)/2;head.castShadow=true;
  inn.add(body,head);pv.add(inn);pv.position.set(cx,y,cz);pv.rotation.y=yaw;pv.userData={mat,inn,home:new THREE.Vector3(cx,y,cz),yaw,slot:-1};G.add(pv);st.meshes.push(pv);
  const gh=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(L,.17,.17)),new THREE.LineBasicMaterial({color:0xff7a1a,transparent:true,opacity:.75}));gh.position.set(cx,y,cz);gh.rotation.y=yaw;gh.visible=false;G.add(gh);st.ghost.push(gh);
  const px=new THREE.Mesh(new THREE.BoxGeometry(L,.55,.55),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));px.position.set(cx,y,cz);px.rotation.y=yaw;px.userData.i=i;G.add(px);st.prox.push(px)})}
function setRem(i,on){const pv=st.meshes[i],u=pv.userData,p0=pv.position.clone(),y0=pv.rotation.y,z0=u.inn.rotation.z;st.rem[i]=on;st.ghost[i].visible=on;let to,yaw,flip;
 if(on){let s=0;while(st.slots[s])s++;st.slots[s]=true;u.slot=s;to=new THREE.Vector3(MS[idx][0]*SS/2+2.4+Math.floor(s/12)*1.8,.1,((s%12)-5.5)*.42);yaw=((s*37)%10-5)*.05;flip=z0+Math.PI*4}

 tween(on?720:620,t=>{const e=ease2(t);pv.position.lerpVectors(p0,to,e);pv.position.y+=Math.sin(Math.PI*t)*2.4;pv.rotation.y=y0+(yaw-y0)*e;u.inn.rotation.z=z0+(flip-z0)*e},()=>{pv.position.copy(to);u.inn.rotation.z=0})}

 if(st.rem[i])setRem(i,false);else if(st.rem.filter(Boolean).length<K)setRem(i,true);else{toast('You already removed '+K+'. Tap a dotted outline to put one back.');return}

/* ---------- box escape: tumbling blocks ---------- */
const BC=['#a8662a','#9a5a24','#b87434','#8c4f1e'];
function sceneBX(){clearG();st.blocks={};st.prox=[];st.hov=null;st.hintCh=null;
 const base=new THREE.Mesh(new THREE.BoxGeometry(6.4,.2,6.4),new THREE.MeshStandardMaterial({color:0x0d1733,roughness:.9}));base.position.y=.1;base.receiveShadow=true;G.add(base);

 wall(0,-3.3,6.8,.2);wall(0,3.3,6.8,.2);wall(-3.3,0,.2,6.8);wall(3.3,-2.2,.2,2.4);wall(3.3,1.7,.2,3.4);
 const P=pieces(st.s);Object.keys(P).forEach(ch=>{const p=P[ch],n=p.length,hor=n>1?p[1]-p[0]===1:true,r0=Math.floor(p[0]/6),c0=p[0]%6,isR=ch==='R';
  const mat=new THREE.MeshStandardMaterial({color:isR?0xff7a1a:0xffffff,map:isR?null:wood(BC[ch.charCodeAt(0)%4],'#5a3410',ch.charCodeAt(0)),roughness:isR?.3:.6,emissive:0xff7a1a,emissiveIntensity:isR?.35:0});
  const m=new THREE.Mesh(new THREE.BoxGeometry(hor?n-.2:.8,.8,hor?.8:n-.2),mat);m.castShadow=m.receiveShadow=true;
  m.position.set(hor?c0+(n-1)/2-2.5:c0-2.5,.6,hor?r0-2.5:r0+(n-1)/2-2.5);m.userData={ch,hor,mat};G.add(m);st.blocks[ch]=m;st.prox.push(m)})}
function moveBlock(ch,d){const ns=slide(st.s,ch,d);if(!ns)return false;const m=st.blocks[ch],ax=m.userData.hor?'x':'z',a0=m.position[ax];st.busy=true;

function clickBX(e){if(st.busy||st.won)return;const hit=rayPick(e,st.prox);if(!hit)return;const m=hit.object,ax=m.userData.hor?'x':'z',d=hit.point[ax]>=m.position[ax]?1:-1;
