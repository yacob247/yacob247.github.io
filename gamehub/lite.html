<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Game — Gamenetic</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  #f { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px;
        color: #94a3b8; font: 600 15px system-ui, sans-serif; }
  #b { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 8px); left: calc(env(safe-area-inset-left, 0px) + 8px);
       padding: 7px 14px; border: 0; border-radius: 999px; background: rgba(15,23,42,.78); color: #fff;
       font: 700 14px system-ui, sans-serif; opacity: 1; transition: opacity .4s; }
  #b.dim { opacity: .28; }
</style>
</head>
<body>
<!-- Phone game page: only the game and a Back button, so none of the main site's memory is used while playing. -->
<div id="ld">Loading…</div>
<iframe id="f" allow="fullscreen; autoplay; gamepad; accelerometer; cross-origin-isolated; clipboard-write; clipboard-read" allowfullscreen></iframe>
<button id="b" type="button">‹ Back</button>
<script>
(function () {
  var f = document.getElementById('f'), b = document.getElementById('b'), ld = document.getElementById('ld'), t;
  var d = null;
  try { d = JSON.parse(sessionStorage.getItem('gn_lite') || 'null'); } catch (e) {}
  var home = './' + (d && d.id ? '#/play/' + encodeURIComponent(d.id) : '');
  if (!d || typeof d.url !== 'string' || /^\s*(javascript|data|vbscript):/i.test(d.url)) {
    location.replace('./'); return; // nothing to play (e.g. page was reopened) -> main site
  }
  document.title = (d.name || 'Game') + ' — Gamenetic';
  ld.textContent = 'Loading ' + (d.name || 'game') + '…';
  f.onload = function () { ld.style.display = 'none'; };
  f.src = d.url;
  function dim() { clearTimeout(t); b.className = ''; t = setTimeout(function () { b.className = 'dim'; }, 3000); }
  dim(); document.addEventListener('touchstart', dim, { passive: true });
  b.onclick = function () { try { f.src = 'about:blank'; } catch (e) {} location.replace(home); };
  addEventListener('pagehide', function () { try { f.src = 'about:blank'; } catch (e) {} });
})();
</script>
</body>
</html>
