<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a1a">
<meta name="description" content="Play free online games in your browser — puzzle, racing, adventure, action and more. No downloads, no sign-up.">
<title>Gamenetic — Free Online Games</title>
<link rel="icon" type="image/png" href="navlogo.png">
<style>
/* ============================================================
   GAMENETIC HOMEPAGE — single file, all styles inline
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #050a1a;
  --bg-2: #071126;
  --surface: #0b1526;
  --border: #1f3a66;
  --text: #e8eefc;
  --text-2: #9db4d8;
  --accent: #ff7a1a;
  --accent-2: #ffb066;
  --cyan: #00d4ff;
  --accent-glow: rgba(255, 122, 26, .45);
  --mid-blue: #2c4f86;
  --radius: 14px;
}

[hidden] { display: none !important; }
html { background: var(--bg); }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  background:
    radial-gradient(1200px 620px at 50% -220px, #12295c 0%, transparent 70%),
    radial-gradient(900px 500px at 100% 0%, #1a1235 0%, transparent 60%),
    var(--bg);
  background-attachment: fixed;
}

code {
  font-family: ui-monospace, Consolas, monospace;
  background: #ffffff10;
  padding: 1px 6px;
  border-radius: 5px;
  font-size: .9em;
}

/* ============ HEADER ============ */
header.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 10px 18px;
  background: #050a1af0;
  border-bottom: 1px solid #ffffff12;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.nav-in {
  max-width: 1500px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.logo { display: flex; align-items: center; text-decoration: none; }
.logo img { height: 38px; width: auto; display: block; }
.logo.logo-text {
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: -.5px;
  background: linear-gradient(135deg, #ff9a3c, #ea3333);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.gsearch {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
  min-width: 180px;
  max-width: 430px;
  padding: 8px 14px;
  background: #071126e6;
  border: 1px solid #00d4ff55;
  border-radius: 12px;
  transition: border-color .2s, box-shadow .2s;
}
.gsearch:focus-within {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(0, 212, 255, .14), 0 0 22px rgba(0, 212, 255, .25);
}
.gsearch input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  color: var(--text);
  font: inherit;
  font-size: .95rem;
}
.gsearch input::placeholder { color: #7f93b8; }

/* ============ CATEGORY CHIPS ============ */
.catbar-wrap {
  max-width: 1500px;
  margin: 0 auto;
  padding: 14px 18px 0;
}
.catbar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 0 10px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 20px, #000 calc(100% - 20px), transparent);
}
.catbar::-webkit-scrollbar { display: none; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  white-space: nowrap;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: #0a1630cc;
  color: #cfe0ff;
  font-family: inherit;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
}
.pill:hover {
  border-color: var(--cyan);
  color: #fff;
  box-shadow: 0 0 14px rgba(0, 212, 255, .35);
}
.pill.active {
  background: linear-gradient(135deg, var(--accent), #ea3333);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 18px var(--accent-glow);
}
.pill-n {
  font-size: .7rem;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 999px;
  background: #ffffff1f;
  color: #dbe7ff;
}
.pill.active .pill-n { background: #00000040; color: #fff; }

/* ============ SECTIONS ============ */
.sections {
  max-width: 1500px;
  margin: 0 auto;
  padding: 6px 18px 40px;
}
.cat-section { margin-top: 28px; scroll-margin-top: 76px; }

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.sec-head h2 {
  position: relative;
  padding-left: 16px;
  font-size: 1.5rem;
  font-weight: 800;
  text-shadow: 0 0 18px rgba(0, 212, 255, .35);
}
.sec-head h2::before {
  content: "";
  position: absolute;
  left: 0;
  top: 14%;
  width: 6px;
  height: 72%;
  border-radius: 4px;
  background: linear-gradient(#ff7a1a, #00d4ff);
  box-shadow: 0 0 12px rgba(255, 122, 26, .7);
}
.sec-head .sc {
  font-size: .82rem;
  font-weight: 600;
  color: var(--text-2);
  margin-left: 10px;
  text-shadow: none;
}
.showall {
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid #ff7a1a88;
  background: #0a1630;
  color: #ffd9b8;
  font-family: inherit;
  font-size: .82rem;
  font-weight: 800;
  cursor: pointer;
  transition: all .2s;
}
.showall:hover {
  background: linear-gradient(135deg, var(--accent), #ea3333);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 18px var(--accent-glow);
}

/* ============ GRID ============ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
  align-items: start;
}

/* ============ CARD ============ */
.card {
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #0b1526, #081120);
  border: 1px solid #ffffff14;
  border-radius: var(--radius);
  overflow: hidden;
  animation: pop .4s both;
  transition: transform .22s, box-shadow .22s, border-color .22s;
}
@keyframes pop {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.card:hover {
  transform: translateY(-5px);
  border-color: var(--cyan);
  box-shadow: 0 16px 34px #000b, 0 0 26px rgba(0, 212, 255, .28);
}

.thumb {
  position: relative;
  display: block;
  aspect-ratio: 3 / 2;
  background: #0e1424;
  overflow: hidden;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .35s;
}
.card:hover .thumb img { transform: scale(1.06); }
.cat-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(5, 10, 26, .78);
  border: 1px solid rgba(0, 212, 255, .35);
  color: #bfe9ff;
  font-size: .66rem;
  font-weight: 800;
  letter-spacing: .4px;
  text-transform: uppercase;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 12px 13px 14px;
}
.card-title {
  font-size: .95rem;
  font-weight: 800;
  line-height: 1.25;
  min-height: 2.4em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-title a { color: var(--text); text-decoration: none; }
.card-title a:hover {
  color: var(--accent-2);
  text-shadow: 0 0 12px rgba(255, 122, 26, .6);
}

.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: #ffffff0d;
  border: 1px solid #ffffff14;
  color: #9db4d8;
  font-size: .66rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* ============ DESCRIPTION BOX ============ */
.desc {
  position: relative;
  padding: 9px 11px 20px;
  max-height: 6.2em;
  overflow: hidden;
  cursor: pointer;
  background: var(--mid-blue);
  border: 1px solid #4a74b0;
  border-radius: 10px;
  transition: max-height .3s ease, border-color .2s, box-shadow .2s;
}
.desc-text {
  margin: 0;
  font-size: .8rem;
  line-height: 1.45;
  color: #eaf2ff;
  filter: blur(4px);
  opacity: .45;
  -webkit-user-select: none;
  user-select: none;
  transition: filter .28s ease, opacity .28s ease;
}
.desc-hint {
  position: absolute;
  right: 8px;
  bottom: 6px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .32);
  color: #dbe9ff;
  font-size: .6rem;
  font-weight: 900;
  letter-spacing: .6px;
  text-transform: uppercase;
  pointer-events: none;
  transition: opacity .2s;
}
.desc:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}
@media (hover: hover) {
  .desc:hover {
    max-height: 60em;
    border-color: #7fb0f0;
    box-shadow: inset 0 0 0 1px #ffffff22;
  }
  .desc:hover .desc-text { filter: none; opacity: 1; }
  .desc:hover .desc-hint { opacity: 0; }
}
.desc.open {
  max-height: 60em;
  border-color: #7fb0f0;
  box-shadow: inset 0 0 0 1px #ffffff22;
}
.desc.open .desc-text { filter: none; opacity: 1; }
.desc.open .desc-hint { opacity: 0; }

/* ============ PLAY BUTTON ============ */
.play {
  margin-top: auto;
  display: block;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid #ffb06655;
  background: linear-gradient(135deg, #ff7a1a, #ea3333);
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: .88rem;
  font-weight: 900;
  letter-spacing: .3px;
  box-shadow: 0 6px 18px rgba(255, 122, 26, .35);
  transition: transform .15s, box-shadow .2s, filter .2s;
}
.play:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow: 0 10px 26px rgba(255, 122, 26, .55);
}

/* ============ STATES ============ */
.loading {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-2);
  font-size: 1rem;
  line-height: 1.7;
}
.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-2);
}
.empty h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }

/* ============ FOOTER ============ */
.foot {
  max-width: 1500px;
  margin: 20px auto 0;
  padding: 18px 18px 34px;
  border-top: 1px solid #ffffff18;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--text-2);
  font-size: .8rem;
}
.foot .disc { flex-basis: 100%; font-size: .75rem; opacity: .65; }

/* ============ RESPONSIVE ============ */
@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .sec-head h2 { font-size: 1.3rem; }
}
@media (max-width: 640px) {
  header.nav { padding: 8px 12px; }
  .logo img { height: 32px; }
  .gsearch { padding: 7px 12px; border-radius: 10px; }
  .gsearch input { font-size: .88rem; }
  .catbar-wrap { padding: 10px 12px 0; }
  .pill { padding: 7px 13px; font-size: .8rem; }
  .pill-n { display: none; }
  .sections { padding: 4px 12px 30px; }
  .cat-section { margin-top: 22px; }
  .sec-head h2 { font-size: 1.15rem; padding-left: 13px; }
  .sec-head h2::before { width: 5px; }
  .sec-head .sc { display: block; margin: 2px 0 0 13px; font-size: .72rem; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card-body { padding: 10px 10px 12px; gap: 7px; }
  .card-title { font-size: .84rem; min-height: 2.4em; }
  .tag:nth-child(3) { display: none; }
  .desc { padding: 8px 9px 18px; }
  .desc-text { font-size: .74rem; }
  .play { padding: 9px 12px; font-size: .82rem; }
  .foot { padding: 14px 12px 28px; font-size: .74rem; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .thumb img, .desc, .desc-text, .play, .pill { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="nav">
  <div class="nav-in">
    <a class="logo" href="./" aria-label="Gamenetic — home">
      <img src="pagelogo.png" alt="Gamenetic">
    </a>
    <label class="gsearch" for="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9db4d8"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input id="search" type="search" placeholder="Search games, tags, categories…" autocomplete="off" aria-label="Search games">
    </label>
  </div>
</header>

<!-- ================= CATEGORY CHIPS ================= -->
<div class="catbar-wrap">
  <div class="catbar" id="catbar" role="group" aria-label="Filter games by category"></div>
</div>

<!-- ================= GAME SECTIONS ================= -->
<main class="sections" id="sections">
  <div class="loading">Loading games…</div>
</main>

<div class="empty" id="empty" hidden>
  <h3>No games found</h3>
  <p>Try a different search or category.</p>
</div>

<noscript><div class="loading">This page needs JavaScript to load the game catalog.</div></noscript>

<!-- ================= FOOTER ================= -->
<footer class="foot">
  <div class="disc">This website does not host any game files. It only links to games provided by third-party services.</div>
  <span>Gamenetic © 2026 — all rights reserved</span>
</footer>

<script>
(function () {
  'use strict';

  /* =========================================================
     CONFIG
     ========================================================= */
  var PLAY_BASE = 'https://envizion.work/gamehub/#/play/gm-'; // + game id
  var BLOG_DIR  = 'games/';                                    // blogs live here: games/<slug>-<id>.html
  var PER_CAT   = 12;                                          // cards before "Show all"

  /* Content filter — matches the old index.html. Remove to show everything. */
  var BLOCKED = /brain\s*-?rot|skibidi|\bsigma\b|\brizz|gyatt|fanum|tung\s*tung|sahur|tralal|bombardiro|crocodilo|cappuccin[oa]|lirili|larila|chimpanzini|bananini|patapim|\bohio\b|steal\s+a\b|mewing|looksmax|italian\s+meme|\bmeme\s+(rot|game)/i;

  /* =========================================================
     DOM
     ========================================================= */
  var catbarEl   = document.getElementById('catbar');
  var sectionsEl = document.getElementById('sections');
  var emptyEl    = document.getElementById('empty');
  var searchEl   = document.getElementById('search');

  /* =========================================================
     STATE
     ========================================================= */
  var GAMES    = [];
  var SECTIONS = [];
  var expanded = {};
  var state    = { cat: 'All', q: '' };
  var secByEl  = new WeakMap();

  /* =========================================================
     HELPERS
     ========================================================= */
  var decoder = document.createElement('textarea');
  function decode(s) { decoder.innerHTML = String(s == null ? '' : s); return decoder.value; }
  function clean(s)  {
    return decode(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function slugify(s) {
    return String(s).toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/['’`]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 70)
      .replace(/-+$/g, '');
  }

  /* =========================================================
     PLACEHOLDER for broken/missing thumbnails
     ========================================================= */
  var CAT_COLORS = {
    Puzzle: ['#7c3aed', '#312e81'], Arcade: ['#ec4899', '#7c2d5b'], Board: ['#0ea5e9', '#134e6b'],
    Strategy: ['#f59e0b', '#7a4a06'], Adventure: ['#22c55e', '#14532d'], Simulation: ['#ef4444', '#7f1d1d'],
    Shooting: ['#f97316', '#7c2d12'], Racing: ['#06b6d4', '#0e4b5a'], Action: ['#e11d48', '#4c0519'],
    Sports: ['#84cc16', '#365314'], Soccer: ['#22c55e', '#14532d'], Stickman: ['#64748b', '#1e293b'],
    Girls: ['#f472b6', '#831843'], Boys: ['#3b82f6', '#1e3a8a'], Cooking: ['#fb923c', '#7c2d12'],
    Multiplayer: ['#8b5cf6', '#3b0764'], Hypercasual: ['#14b8a6', '#134e4a'], AI: ['#0ea5e9', '#082f49'],
    '3D': ['#6366f1', '#1e1b4b'], '.io': ['#00d4ff', '#082f49']
  };
  function placeholder(g) {
    var c = CAT_COLORS[g.category] || ['#1d4ed8', '#0b1526'];
    var letter = (String(g.title).match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="' + c[0] + '"/>' +
          '<stop offset="1" stop-color="' + c[1] + '"/>' +
        '</linearGradient></defs>' +
        '<rect width="512" height="384" fill="url(#g)"/>' +
        '<circle cx="440" cy="60" r="110" fill="#ffffff" opacity="0.07"/>' +
        '<circle cx="40" cy="350" r="130" fill="#ffffff" opacity="0.06"/>' +
        '<text x="256" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" ' +
          'font-size="150" font-weight="800" fill="#ffffff" opacity="0.92">' + esc(letter) + '</text>' +
        '<text x="256" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" ' +
          'font-size="26" font-weight="700" fill="#ffffff" opacity="0.6">' + esc(g.category) + '</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /* =========================================================
     NORMALIZE a catalog row. Note: `url` is ignored on purpose.
     ========================================================= */
  function normalize(it) {
    if (!it || it.id == null) return null;
    var title = clean(it.title);
    if (!title) return null;

    var id = String(it.id);
    var category = clean(it.category) || 'Other';
    if (category === '.IO') category = '.io';

    var tags = Array.isArray(it.tags)
      ? it.tags.map(function (t) { return clean(t); }).filter(Boolean)
      : String(it.tags || '').split(',').map(function (t) { return clean(t); }).filter(Boolean);

    var description = clean(it.description || '');
    if (!description) description = 'Open this game’s page to read the full guide, controls and setup tips.';

    var thumb = (typeof it.thumb === 'string' && it.thumb.trim()) ? it.thumb.trim() : '';

    var slug = slugify(title) || 'game';

    return {
      id: id,
      title: title,
      category: category,
      tags: tags,
      description: description,
      thumb: thumb,
      blog: 'blog.html?id=' + id,
      play: PLAY_BASE + id,                         // …/gamehub/#/play/gm-86555
      search: (title + ' ' + category + ' ' + tags.join(' ') + ' ' + description).toLowerCase()
    };
  }

  /* =========================================================
     CARD
     ========================================================= */
  function makeCard(g, index) {
    var card = document.createElement('article');
    card.className = 'card';
    card.style.animationDelay = Math.min(index, 8) * 30 + 'ms';

    var tagsHtml = g.tags.slice(0, 3).map(function (t) {
      return '<span class="tag">' + esc(t) + '</span>';
    }).join('');

    card.innerHTML =
      '<a class="thumb" href="' + g.blog + '" aria-label="' + esc(g.title) + ' — read the game guide">' +
        '<img alt="' + esc(g.title) + ' cover" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
        '<span class="cat-chip">' + esc(g.category) + '</span>' +
      '</a>' +
      '<div class="card-body">' +
        '<h3 class="card-title"><a href="' + g.blog + '">' + esc(g.title) + '</a></h3>' +
        '<div class="tags">' + tagsHtml + '</div>' +
        '<div class="desc" role="button" tabindex="0" aria-expanded="false" title="Hover or tap to read about this game">' +
          '<p class="desc-text">' + esc(g.description) + '</p>' +
          '<span class="desc-hint">Read</span>' +
        '</div>' +
        '<a class="play" href="' + g.play + '">▶ Play</a>' +
      '</div>';

    var img = card.querySelector('img');
    img.src = g.thumb || placeholder(g);

    img.addEventListener('error', function () {
      if (img.dataset.fb) return;
      img.dataset.fb = '1';
      img.src = placeholder(g);
    }, { once: true });

    if (img.complete && img.naturalWidth === 0 && !img.dataset.fb) {
      img.dataset.fb = '1';
      img.src = placeholder(g);
    }
    return card;
  }

  /* =========================================================
     SECTIONS
     ========================================================= */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var sec = secByEl.get(en.target);
      if (sec && sec.dirty) renderSection(sec);
    });
  }, { rootMargin: '900px 0px' });

  function buildSections() {
    var map = new Map();
    GAMES.forEach(function (g) {
      if (!map.has(g.category)) map.set(g.category, []);
      map.get(g.category).push(g);
    });

    var cats = Array.from(map.entries()).sort(function (a, b) {
      return b[1].length - a[1].length || a[0].localeCompare(b[0]);
    });

    sectionsEl.textContent = '';
    SECTIONS = [];

    cats.forEach(function (entry) {
      var name = entry[0], list = entry[1];

      var el = document.createElement('section');
      el.className = 'cat-section';
      el.id = 'cat-' + (slugify(name) || 'other');
      el.innerHTML =
        '<div class="sec-head">' +
          '<h2>' + esc(name) + '<span class="sc">' + list.length.toLocaleString() + ' games</span></h2>' +
          '<button class="showall" type="button" hidden></button>' +
        '</div>' +
        '<div class="grid"></div>';

      sectionsEl.appendChild(el);

      var sec = {
        name: name,
        games: list,
        filtered: list,
        el: el,
        gridEl: el.querySelector('.grid'),
        btnEl: el.querySelector('.showall'),
        countEl: el.querySelector('.sc'),
        rendered: false,
        dirty: true
      };

      sec.btnEl.addEventListener('click', function () {
        if (expanded[name]) delete expanded[name];
        else expanded[name] = true;
        renderSection(sec);
      });

      secByEl.set(el, sec);
      io.observe(el);
      SECTIONS.push(sec);
    });
  }

  function renderSection(sec) {
    var list = sec.filtered || sec.games;
    var all = !!expanded[sec.name];
    var count = all ? list.length : Math.min(PER_CAT, list.length);

    var frag = document.createDocumentFragment();
    for (var i = 0; i < count; i++) frag.appendChild(makeCard(list[i], i));
    sec.gridEl.textContent = '';
    sec.gridEl.appendChild(frag);

    if (list.length > PER_CAT) {
      sec.btnEl.hidden = false;
      sec.btnEl.textContent = all
        ? 'Show less'
        : 'Show all ' + list.length.toLocaleString();
    } else {
      sec.btnEl.hidden = true;
    }

    sec.rendered = true;
    sec.dirty = false;
  }

  /* =========================================================
     CHIPS
     ========================================================= */
  function buildChips() {
    var counts = new Map();
    GAMES.forEach(function (g) {
      counts.set(g.category, (counts.get(g.category) || 0) + 1);
    });
    var cats = Array.from(counts.keys()).sort(function (a, b) {
      return counts.get(b) - counts.get(a) || a.localeCompare(b);
    });

    var html = '<button class="pill active" data-cat="All" type="button">All games' +
                 '<span class="pill-n">' + GAMES.length.toLocaleString() + '</span></button>';

    cats.forEach(function (c) {
      html += '<button class="pill" data-cat="' + esc(c) + '" type="button">' + esc(c) +
                '<span class="pill-n">' + counts.get(c).toLocaleString() + '</span></button>';
    });

    catbarEl.innerHTML = html;
  }

  catbarEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.pill');
    if (!btn) return;

    state.cat = btn.dataset.cat;
    Array.prototype.forEach.call(catbarEl.children, function (p) {
      p.classList.toggle('active', p === btn);
    });

    applyFilter();

    var top = sectionsEl.getBoundingClientRect().top + window.scrollY - 76;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  });

  /* =========================================================
     FILTER / SEARCH
     ========================================================= */
  function applyFilter() {
    var q = state.q.trim().toLowerCase();
    var any = false;

    SECTIONS.forEach(function (sec) {
      if (state.cat !== 'All' && sec.name !== state.cat) { sec.el.hidden = true; return; }

      var list = q
        ? sec.games.filter(function (g) { return g.search.indexOf(q) !== -1; })
        : sec.games;

      sec.filtered = list;

      if (!list.length) { sec.el.hidden = true; return; }

      sec.el.hidden = false;
      any = true;
      sec.countEl.textContent = list.length.toLocaleString() + (list.length === 1 ? ' game' : ' games');

      if (sec.rendered) renderSection(sec);
      else sec.dirty = true;
    });

    emptyEl.hidden = any || !GAMES.length;
  }

  var searchTimer = 0;
  searchEl.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = searchEl.value;
      applyFilter();
    }, 140);
  });
  searchEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { searchEl.value = ''; state.q = ''; applyFilter(); }
  });

  /* =========================================================
     DESCRIPTION BOX — tap / keyboard toggle
     ========================================================= */
  sectionsEl.addEventListener('click', function (e) {
    var d = e.target.closest('.desc');
    if (!d) return;

    var willOpen = !d.classList.contains('open');
    closeAllDescs();
    if (willOpen) {
      d.classList.add('open');
      d.setAttribute('aria-expanded', 'true');
    }
  });

  sectionsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var d = e.target.closest('.desc');
    if (!d) return;
    e.preventDefault();
    d.click();
  });

  function closeAllDescs() {
    var open = document.querySelectorAll('.desc.open');
    Array.prototype.forEach.call(open, function (x) {
      x.classList.remove('open');
      x.setAttribute('aria-expanded', 'false');
    });
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.desc')) closeAllDescs();
  });

  /* =========================================================
     LOGO FALLBACK
     ========================================================= */
  (function () {
    var img = document.querySelector('.logo img');
    if (!img) return;
    img.addEventListener('error', function () {
      var a = img.closest('.logo');
      a.textContent = 'Gamenetic';
      a.classList.add('logo-text');
    }, { once: true });
  })();

  /* =========================================================
     BOOT
     ========================================================= */
  (async function init() {
    var data;
    try {
      var res = await fetch('catalog.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
    } catch (err) {
      sectionsEl.innerHTML =
        '<div class="loading">' +
          '<strong>Could not load catalog.json.</strong><br><br>' +
          'Make sure <code>catalog.json</code> sits next to <code>index.html</code>, ' +
          'and open the site through a local server (e.g. <code>npx serve</code>) — ' +
          'browsers block <code>fetch()</code> on <code>file://</code>.' +
        '</div>';
      console.error(err);
      return;
    }

    if (!Array.isArray(data)) data = [];

    GAMES = data
      .filter(function (it) { return it && !BLOCKED.test(String(it.title || '')); })
      .map(normalize)
      .filter(Boolean);

    if (!GAMES.length) {
      sectionsEl.innerHTML = '<div class="loading">The catalog is empty.</div>';
      return;
    }

    buildChips();
    buildSections();
    applyFilter();
  })();

})();
</script>
</body>
</html>
