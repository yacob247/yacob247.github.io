<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI Studio - Magic Eraser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            base: '#09090b',
                            card: '#121216',
                            border: '#27272a',
                            muted: '#a1a1aa'
                        }
                    },
                    backgroundImage: {
                        'checkerboard': 'conic-gradient(#27272a 90deg, transparent 90deg, transparent 270deg, #27272a 270deg, #27272a)',
                    },
                    backgroundSize: {
                        'checkerboard-size': '20px 20px',
                    },
                    backgroundPosition: {
                        'checkerboard-pos': '0 0, 10px 10px',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .transparent-bg {
            background-color: #121216;
            background-image: conic-gradient(#1f1f22 90deg, transparent 90deg, transparent 270deg, #1f1f22 270deg, #1f1f22);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        #upload-area.dragover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-dark-base text-gray-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <header class="border-b border-dark-border bg-dark-card/50 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-blue-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Z"/></svg>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-purple-400 to-blue-300 bg-clip-text text-transparent">NexusAI Studio</h1>
                <p class="text-xs text-dark-muted">Lightweight Background Eraser (~40MB)</p>
            </div>
        </div>
        <div class="hidden sm:flex items-center space-x-2 text-xs bg-dark-base border border-dark-border px-3 py-1.5 rounded-full">
            <span id="global-status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="global-status-text" class="text-dark-muted font-medium">Ready</span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
        
        <!-- Left Column: Controls & Input -->
        <section class="flex flex-col gap-6 bg-dark-card border border-dark-border p-6 rounded-2xl shadow-xl">
            
            <div id="status-panel" class="bg-dark-base border border-dark-border rounded-xl p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/></svg>
                        <span class="text-sm font-semibold">Model Status</span>
                    </div>
                    <span id="progress-percent" class="text-xs font-mono text-purple-400">0%</span>
                </div>
                <div class="w-full bg-dark-border h-1.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-purple-500 h-full w-0 transition-all duration-200"></div>
                </div>
                <p id="log-message" class="text-xs text-dark-muted font-mono break-words">Awaiting image upload...</p>
            </div>

            <!-- Image Upload Area -->
            <div id="upload-area" class="border-2 border-dashed border-dark-border rounded-2xl p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:border-purple-500/50 hover:bg-purple-500/5 transition-all group relative overflow-hidden min-h-[300px]">
                <input type="file" id="file-input" accept="image/jpeg, image/png, image/webp" class="hidden">
                
                <div id="upload-placeholder" class="flex flex-col items-center">
                    <div class="w-16 h-16 rounded-full bg-dark-base border border-dark-border flex items-center justify-center mb-4 text-dark-muted group-hover:text-purple-400 transition-colors">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    </div>
                    <p class="font-medium text-sm text-gray-300">Click or Drag & Drop</p>
                    <p class="text-xs text-dark-muted mt-1">Supports JPG, PNG, WEBP</p>
                </div>

                <img id="input-preview" class="absolute inset-0 w-full h-full object-contain hidden pointer-events-none p-2" alt="Input Preview">
            </div>

            <button id="process-btn" disabled class="w-full bg-purple-600 hover:bg-purple-500 disabled:bg-dark-border disabled:text-dark-muted disabled:shadow-none text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-purple-600/20 transition-all flex items-center justify-center space-x-2 cursor-pointer disabled:cursor-not-allowed">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z"/></svg>
                <span id="process-btn-text">Erase Background</span>
            </button>

        </section>

        <!-- Right Column: Result Output -->
        <section class="flex flex-col gap-6">
            
            <div class="bg-dark-card border border-dark-border p-6 rounded-2xl shadow-xl flex flex-col items-center justify-center min-h-[500px] relative overflow-hidden group">
                
                <div id="output-placeholder" class="flex flex-col items-center justify-center text-center p-8 z-10">
                    <div class="w-16 h-16 rounded-2xl bg-dark-base border border-dark-border flex items-center justify-center mb-4 text-dark-muted">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
                    </div>
                    <h3 class="font-semibold text-gray-300 mb-1">Result Canvas</h3>
                    <p class="text-xs text-dark-muted max-w-sm">Upload an image and click erase. The transparent subject will appear here.</p>
                </div>

                <!-- Hidden Canvas used for image processing -->
                <canvas id="processing-canvas" class="hidden"></canvas>

                <!-- Output Image Container -->
                <div id="result-container" class="absolute inset-0 w-full h-full flex flex-col items-center justify-center hidden transparent-bg p-2 rounded-xl">
                    <img id="output-image" alt="Isolated Subject" class="w-full h-full object-contain drop-shadow-2xl">
                    
                    <div class="absolute bottom-6 bg-dark-base/90 backdrop-blur-md border border-dark-border px-4 py-2 rounded-xl flex items-center space-x-3 shadow-2xl">
                        <span id="metric-badge" class="text-xs font-mono text-purple-400">0.00s</span>
                        <div class="w-px h-4 bg-dark-border"></div>
                        <a id="download-btn" download="nexusai-transparent.png" class="text-xs font-medium bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg transition-colors flex items-center space-x-2 cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                            <span>Download Transparent PNG</span>
                        </a>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <script type="module">
        import { env, AutoProcessor, AutoModel, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.2';

        // Strict Fetch Interceptor mapping exactly to your custom domain URLs
        const originalFetch = window.fetch;
        window.fetch = async function(resource, config) {
            let url = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : '');
            
            // Intercept model requests and route them to your exact R2 bucket URLs
            if (typeof url === 'string' && (url.includes('bria-rmbg-1.4') || url.includes('Xenova') || url.includes('hf.co') || url.includes('huggingface.co') || url.includes('envizion.work'))) {
                
                if (url.endsWith('preprocessor_config.json')) {
                    console.log("[NexusAI] Fetching: https://envizion.work/rmbg/preprocessor_config.json");
                    return originalFetch('https://envizion.work/rmbg/preprocessor_config.json', config);
                }
                
                if (url.endsWith('config.json')) {
                    console.log("[NexusAI] Fetching: https://envizion.work/rmbg/config.json");
                    return originalFetch('https://envizion.work/rmbg/config.json', config);
                }
                
                if (url.endsWith('.onnx') || url.includes('model_quantized.onnx')) {
                    console.log("[NexusAI] Fetching: https://envizion.work/rmbg/onnx/model_quantized.onnx");
                    return originalFetch('https://envizion.work/rmbg/onnx/model_quantized.onnx', config);
                }
            }
            
            // For all other requests, proceed normally
            return originalFetch(resource, config);
        };

        // UI Elements
        const statusDot = document.getElementById('global-status-dot');
        const statusText = document.getElementById('global-status-text');
        const progressPercent = document.getElementById('progress-percent');
        const progressBar = document.getElementById('progress-bar');
        const logMessage = document.getElementById('log-message');
        
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const inputPreview = document.getElementById('input-preview');
        
        const processBtn = document.getElementById('process-btn');
        const processBtnText = document.getElementById('process-btn-text');
        
        const outputPlaceholder = document.getElementById('output-placeholder');
        const resultContainer = document.getElementById('result-container');
        const outputImage = document.getElementById('output-image');
        const processingCanvas = document.getElementById('processing-canvas');
        const downloadBtn = document.getElementById('download-btn');
        const metricBadge = document.getElementById('metric-badge');

        let processor = null;
        let model = null;
        let isModelLoaded = false;
        let currentImageURL = null;

        // Model Constants
        const MODEL_ID = 'Xenova/bria-rmbg-1.4';
        
        function setLog(msg, isError = false) {
            if (isError) {
                logMessage.innerHTML = `<span class="text-rose-400 font-medium">${msg}</span>`;
            } else {
                logMessage.innerHTML = msg;
            }
            console.log(`[NexusAI] ${msg}`);
        }

        function setStatusState(state, text) {
            statusText.textContent = text;
            if (state === 'ready') {
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
            } else if (state === 'loading') {
                statusDot.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
            } else {
                statusDot.className = "w-2 h-2 rounded-full bg-rose-500";
            }
        }

        // --- File Upload Handling ---
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                setLog("Please upload a valid image file.", true);
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageURL = e.target.result;
                inputPreview.src = currentImageURL;
                inputPreview.classList.remove('hidden');
                uploadPlaceholder.classList.add('hidden');
                processBtn.disabled = false;
                setLog("Image loaded. Click 'Erase Background' to process.");
            };
            reader.readAsDataURL(file);
        }

        // --- Model Loading and Processing ---
        const fileProgressTracker = new Map();
        let maxOverallPct = 0;

        function updateProgress(progressInfo) {
            if (!progressInfo || !progressInfo.file) return;

            const file = progressInfo.file;
            const current = fileProgressTracker.get(file) || { loaded: 0, total: 0 };

            if (progressInfo.status === 'initiate') {
                fileProgressTracker.set(file, { loaded: 0, total: progressInfo.total || 0 });
            } else if (progressInfo.status === 'progress' || progressInfo.status === 'download') {
                const loaded = progressInfo.loaded ?? (progressInfo.progress ? (progressInfo.progress / 100) * (progressInfo.total || current.total) : current.loaded);
                const total = progressInfo.total || current.total || loaded;
                fileProgressTracker.set(file, { loaded, total });
            } else if (progressInfo.status === 'done') {
                const total = current.total || progressInfo.total || current.loaded;
                fileProgressTracker.set(file, { loaded: total, total });
            }

            let totalBytes = 0;
            let loadedBytes = 0;

            for (const item of fileProgressTracker.values()) {
                totalBytes += item.total;
                loadedBytes += item.loaded;
            }

            if (totalBytes > 0) {
                const rawPct = Math.round((loadedBytes / totalBytes) * 100);
                if (rawPct > maxOverallPct) maxOverallPct = rawPct;
                
                const displayPct = Math.min(99, maxOverallPct);
                progressBar.style.width = `${displayPct}%`;
                progressPercent.textContent = `${displayPct}%`;

                const loadedMB = (loadedBytes / (1024 * 1024)).toFixed(1);
                const totalMB = (totalBytes / (1024 * 1024)).toFixed(1);
                setLog(`Downloading lightweight engine: ${displayPct}% (${loadedMB} MB / ${totalMB} MB)`);
            }
        }

        async function loadEngine() {
            if (isModelLoaded) return true;
            
            try {
                setStatusState('loading', 'Loading AI Engine...');
                env.allowLocalModels = false;
                // Note: env.remoteHost config was removed so the fetch interceptor has 100% control

                setLog("Fetching processor config...");
                processor = await AutoProcessor.from_pretrained(MODEL_ID, {
                    progress_callback: updateProgress
                });

                setLog("Fetching lightweight vision model (~40MB)...");
                
                // Fallback architecture: Try WebGPU first, if unsupported/crashes, fallback to generic WASM
                try {
                    model = await AutoModel.from_pretrained(MODEL_ID, {
                        device: 'webgpu',
                        progress_callback: updateProgress
                    });
                    setLog("Model loaded via WebGPU (Hardware Acceleration Active).");
                } catch (gpuError) {
                    console.warn("WebGPU not supported or failed, falling back to WASM/CPU.", gpuError);
                    setLog("WebGPU not available, falling back to Universal Engine (WASM)...");
                    model = await AutoModel.from_pretrained(MODEL_ID, {
                        device: 'wasm',
                        progress_callback: updateProgress
                    });
                    setLog("Model loaded via WASM (Universal Compatibility).");
                }

                isModelLoaded = true;
                progressBar.style.width = '100%';
                progressPercent.textContent = '100%';
                setStatusState('ready', 'Engine Ready');
                return true;

            } catch (err) {
                console.error(err);
                setStatusState('error', 'Initialization Failed');
                setLog(`Error loading model: ${err.message}`, true);
                return false;
            }
        }

        processBtn.addEventListener('click', async () => {
            if (!currentImageURL) return;

            processBtn.disabled = true;
            const originalText = processBtnText.textContent;
            
            try {
                if (!isModelLoaded) {
                    processBtnText.textContent = "Loading Engine...";
                    const loaded = await loadEngine();
                    if (!loaded) throw new Error("Failed to load engine.");
                }

                processBtnText.textContent = "Isolating Subject...";
                setStatusState('loading', 'Processing Image...');
                const startTime = performance.now();

                // 1. Read the image into Transformers.js format
                setLog("Analyzing image pixels...");
                const rawImage = await RawImage.fromURL(currentImageURL);
                
                // 2. Pre-process the image
                const { pixel_values } = await processor(rawImage);
                
                // 3. Run Inference
                setLog("Generating alpha mask...");
                const { output } = await model({ input: pixel_values });

                // 4. Post-process the output tensor into a mask and resize it back to original dimensions
                const maskTensor = output[0].mul(255).to('uint8');
                const mask = await RawImage.fromTensor(maskTensor).resize(rawImage.width, rawImage.height);

                // 5. Apply the mask to the original image using HTML5 Canvas
                setLog("Applying transparency...");
                const ctx = processingCanvas.getContext('2d');
                processingCanvas.width = rawImage.width;
                processingCanvas.height = rawImage.height;
                
                // Draw original image to get its raw pixels
                const imgElement = new Image();
                imgElement.src = currentImageURL;
                await new Promise(r => imgElement.onload = r);
                ctx.drawImage(imgElement, 0, 0);
                
                // Extract pixels and apply the mask's values to the Alpha channel
                const imageData = ctx.getImageData(0, 0, processingCanvas.width, processingCanvas.height);
                for (let i = 0; i < mask.data.length; ++i) {
                    // mask.data[i] is the greyscale alpha value (0-255)
                    // imageData array is [R, G, B, A, R, G, B, A, ...]
                    imageData.data[i * 4 + 3] = mask.data[i]; 
                }
                
                // Put the modified transparent pixels back
                ctx.putImageData(imageData, 0, 0);

                // 6. Display the result
                const resultDataUrl = processingCanvas.toDataURL('image/png');
                outputImage.src = resultDataUrl;
                downloadBtn.href = resultDataUrl;
                
                outputPlaceholder.classList.add('hidden');
                resultContainer.classList.remove('hidden');

                const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                metricBadge.textContent = `${duration}s | ${rawImage.width}x${rawImage.height}`;
                
                setStatusState('ready', 'Processing Complete');
                setLog(`Success! Extracted in ${duration} seconds.`);

            } catch (err) {
                console.error(err);
                setStatusState('error', 'Processing Error');
                setLog(`Failed to process image: ${err.message}`, true);
            } finally {
                processBtn.disabled = false;
                processBtnText.textContent = originalText;
            }
        });
    </script>
</body>
</html>
