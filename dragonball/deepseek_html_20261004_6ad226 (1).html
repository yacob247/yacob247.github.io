const VW = 960, VH = 540;
let DPR = Math.min(2, devicePixelRatio || 1);
function fit(){
  DPR = Math.min(2, devicePixelRatio || 1);
  const s = Math.min(innerWidth/VW, innerHeight/VH);
  const w = VW*s, h = VH*s;
  cvs.width = VW*DPR; cvs.height = VH*DPR;
  cvs.style.width = w+'px'; cvs.style.height = h+'px';
  cvs.style.left = ((innerWidth-w)/2)+'px';
  cvs.style.top  = ((innerHeight-h)/2)+'px';
}
fit(); addEventListener('resize', fit);

const WORLD_W = 6400, WORLD_H = 5400;
const GROUND_TOP = 60, ISO = 0.55;
const FIN = v => Number.isFinite(v);
const cam = { x:0, y:0, shake:0, flash:0, flashCol:'#fff' };
const sx = wx => FIN(wx) ? wx - cam.x : -9999;
const sy = wy => FIN(wy) ? GROUND_TOP + (wy - cam.y) * ISO : -9999;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
const sgn=v=>v<0?-1:v>0?1:0;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const powerMul = () => 1 + Math.min(3.5, player.power / 6000);

function transformStep(p){
  p.form = (p.form + 1) % FORMS.length;
  const F = FORMS[p.form];
  p.transformFx = 1.0; p.invuln = 0.9;
  p.maxKi += 25; p.ki = Math.min(p.maxKi, p.ki + 55);
  p.power += 350;
  cam.flash = 0.85; cam.flashCol = F.auraCol;
  ring(p.x, p.y, F.auraCol, 120);
  spark(p.x, p.y, 44, [F.auraCol, '#fff'], 340, 0.85, 5);
  sfx('power');
  toast(p.form === 0 ? 'BASE FORM' : F.name + '  +KI  +POWER');
}
function doWarp(b){
  if(!b || !b.warp) return;
  player.x = clamp(b.warp.x, 40, WORLD_W - 40);
  player.y = clamp(b.warp.y, 40, WORLD_H - 40);
  player.z = 0; player.flying = false;
  player.vx = 0; player.vy = 0;
  cam.x = player.x - VW*0.42;
  cam.y = player.y - (VH - GROUND_TOP)/ISO*0.45;
  cam.flash = 0.7; cam.flashCol = '#8ad4ff'; cam.shake = 8;
  spark(player.x, player.y, 30, ['#8ad4ff','#fff'], 320, 0.8, 4);
  ring(player.x, player.y, '#8ad4ff', 120);
  toast('🚀 Warped to ' + b.warp.label);
  sfx('power');
}
function rr(g,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

let AC=null;
function sfx(k){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const P={
      shoot:[900,220,0.02,0.06,'square'], hit:[240,70,0.04,0.08,'sawtooth'],
      boom:[150,32,0.07,0.35,'sawtooth'], power:[140,1300,0.05,0.4,'triangle'],
      ui:[660,880,0.02,0.05,'sine'], coin:[880,1400,0.03,0.1,'sine'],
      door:[300,180,0.05,0.15,'sine'], siren:[440,880,0.05,0.5,'triangle'],
      mission:[520,1040,0.04,0.3,'triangle'], kame:[220,1600,0.08,0.9,'sawtooth'],
      typing:[440,520,0.01,0.03,'square'], bell:[880,1200,0.04,0.5,'sine'],
    }[k]||[400,200,0.03,0.08,'square'];
    o.type=P[4];
    o.frequency.setValueAtTime(P[0],t);
    o.frequency.exponentialRampToValueAtTime(P[1],t+P[3]);
    g.gain.setValueAtTime(P[2],t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+P[3]+0.02);
    o.start(t); o.stop(t+P[3]+0.03);
  }catch(e){}
}

/* Keydown: cheat console takes priority */
const keys = {}, pressed = {};
let mouseClicked = false, mouseX = 0, mouseY = 0;
addEventListener('keydown', e=>{
  if(G.cheatOpen){
    if(e.key === 'Escape'){ G.cheatOpen = false; G.cheatInput = ''; e.preventDefault(); return; }
    if(e.key === 'Enter'){ runCheat(G.cheatInput); G.cheatInput = ''; e.preventDefault(); return; }
    if(e.key === 'Backspace'){ G.cheatInput = G.cheatInput.slice(0,-1); e.preventDefault(); return; }
    if(e.key.length === 1){ G.cheatInput += e.key; e.preventDefault(); return; }
    e.preventDefault();
    return;
  }
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(!keys[k]) pressed[k]=true;
  keys[k]=true;
});
addEventListener('keyup', e=>{
  const k=e.key.toLowerCase();
  // U release triggers ki blast or kamehameha depending on charge
  if(k === 'u' && G.chargeActive){
    releaseCharge();
  }
  keys[k]=false;
});
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
function readMouse(e){
  const r = cvs.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  mouseX = (cx-r.left) * (VW/r.width);
  mouseY = (cy-r.top) * (VH/r.height);
}
addEventListener('mousedown', e=>{ mouseClicked=true; readMouse(e); });
addEventListener('touchstart', e=>{ e.preventDefault(); mouseClicked=true; readMouse(e); },{passive:false});

/* ══════════════ CHEAT CODES ══════════════ */
function runCheat(raw){
  const code = (raw || '').trim().toUpperCase();
  if(!code) return;
  G.cheatLog.push('> ' + raw);
  let msg = '';
  const args = code.split(/\s+/);
  const cmd = args[0];
  switch(cmd){
    case 'MONEY': player.zeni += 10000; msg = '💰 +10000 zeni'; break;
    case 'POWER': player.power += 5000; msg = '⚡ +5000 power'; break;
    case 'MAXHP': player.maxHp = 9999; player.hp = 9999; msg = '❤ Max HP'; break;
    case 'MAXKI': player.maxKi = 9999; player.ki = 9999; msg = '🔵 Max Ki'; break;
    case 'HEAL': player.hp = player.maxHp; player.ki = player.maxKi; msg = '✚ Healed'; break;
    case 'GOD': G.godMode = !G.godMode; msg = G.godMode ? '🛡 God ON' : '🛡 God OFF'; break;
    case 'CLEAR':
    case 'NOWANTED':
      GTA.wanted = 0; GTA.protectors.length = 0; msg = '🚔 Wanted cleared'; break;
    case 'WANTED5': GTA.wanted = 5; GTA.wantedDecayTimer = 60; msg = '⭐ 5 stars'; break;
    case 'CLEARSPAWN':
      GTA.peds.length = 0; GTA.protectors.length = 0; msg = '🧹 Cleared spawns'; break;
    case 'FORM5': player.form = 4; player.power += 2000; msg = '🌟 God form'; break;
    case 'FORM0': player.form = 0; msg = 'Base form'; break;
    case 'SHIP':
      G.shipParts.engine = G.shipParts.fuel = G.shipParts.cockpit = G.shipParts.hull = true;
      msg = '🚀 All 4 ship parts collected'; break;
    case 'BUILDSHIP':
      if(G.shipParts.engine && G.shipParts.fuel && G.shipParts.cockpit && G.shipParts.hull){
        G.hasShip = true; msg = '🛸 Ship built! Space fast-travel unlocked';
      } else { msg = 'Need all 4 parts first (try SHIP)'; }
      break;
    case 'FLY': player.flying = !player.flying; msg = player.flying ? '✈ Flying' : '🚶 Walking'; break;
    case 'MARRY': {
      // Marry nearest named NPC
      let near = null, nd = 1e9;
      for(const n of npcList){ if(!n.name) continue; const d = dist(player.x,player.y,n.x,n.y); if(d < nd){ nd=d; near=n; } }
      if(near){ G.married = near.name; G.relationships[near.name] = 100; msg = '💍 Married ' + near.name; }
      else msg = 'No named NPC nearby';
      break;
    }
    case 'KID': {
      const kid = 'Child ' + (G.children.length + 1);
      G.children.push({ name:kid, parent:G.married, age:0 });
      msg = '👶 ' + kid + ' born!'; break;
    }
    case 'LAWYER': G.career.path='law'; G.career.education.highschool = G.career.education.university = G.career.education.lawSchool = true; G.career.jobs.lawyer = true; msg='⚖ Lawyer unlocked'; break;
    case 'JUDGE': G.career.path='law'; G.career.education.highschool = G.career.education.university = G.career.education.lawSchool = true; G.career.jobs.lawyer = G.career.jobs.judge = true; msg='👑 Judge unlocked'; break;
    case 'TEACHER': G.career.path='teaching'; G.career.education.highschool = G.career.education.university = G.career.education.teachersCollege = true; G.career.jobs.teacher = true; msg='🍎 Teacher unlocked'; break;
    case 'PRINCIPAL': G.career.path='teaching'; G.career.education.highschool = G.career.education.university = G.career.education.teachersCollege = true; G.career.jobs.teacher = G.career.jobs.principal = true; msg='👑 Principal unlocked'; break;
    case 'EDU': G.career.education.highschool = G.career.education.university = true; msg='🎓 Education unlocked'; break;
    case 'TP': {
      const dest = (args[1]||'').toLowerCase();
      if(dest === 'space'){ player.x = 800; player.y = 4700; msg = 'Teleported to space'; }
      else if(dest === 'home'){ player.x = 800; player.y = 500; msg = 'Teleported home'; }
      else if(dest === 'boss'){ /* teleport to nearest undefeated boss */ 
        for(const r of REGIONS){ if(r.bossAt && !G.defeatedBosses[r.bossAt.boss]){ player.x = r.bossAt.x - 300; player.y = r.bossAt.y; msg='Near boss'; break; } }
      }
      else msg = 'TP [space|home|boss]';
      break;
    }
    case 'HELP': msg = 'MONEY POWER MAXHP MAXKI HEAL GOD CLEAR WANTED5 CLEARSPAWN FORM5 SHIP BUILDSHIP FLY MARRY KID LAWYER JUDGE TEACHER PRINCIPAL EDU TP'; break;
    default: msg = 'Unknown: ' + cmd + '  (type HELP)';
  }
  G.cheatLog.push('  ' + msg);
  if(G.cheatLog.length > 8) G.cheatLog.splice(0, G.cheatLog.length - 8);
  sfx('ui');
  toast(msg);
}

function drawFighter(g, cfg, f, opt){
  if(!cfg || !FIN(f.sx) || !FIN(f.sy)) return;
  opt = opt || {};
  const cs = cfg.scale, s = (FIN(cs)&&cs>0)?cs:1;
  const facing = (f.facing === -1) ? -1 : 1;
  const hurt = f.hurtT>0 && Math.floor(f.hurtT*30)%2===0;
  const moving = !!f.moving, flying = !!f.flying;
  const animT = FIN(f.animT) ? f.animT : 0;
  const walk = (!flying && moving) ? Math.sin(animT*12) : 0;
  const bob  = flying ? Math.sin(animT*3)*2.4
             : (moving ? Math.abs(Math.sin(animT*12))*1.4 : Math.sin(animT*2.2)*1);
  const atk  = f.attackT>0 ? f.attackT : 0;
  const alt  = flying ? clamp(1 - (f.z || 0) / 1600, 0.5, 1) : 1;
  const flyLean = flying ? (moving ? 1.05 : 0.5) : 0;
  g.save(); g.translate(f.sx, f.sy);
  const shScale = clamp(1 - (f.z || 0) / 500, 0.3, 1);
  g.fillStyle = 'rgba(0,0,0,'+(0.3*shScale)+')';
  g.beginPath(); g.ellipse(0, 0, 16*s*shScale, 5*s*shScale, 0, 0, TAU); g.fill();
  g.translate(0, -(f.z || 0));
  g.scale(facing*s*alt, s*alt);
  g.translate(0, -bob);
  if(flying){ g.translate(0,-30); g.rotate(flyLean); g.translate(0,30); }
  const skin   = hurt ? '#fff' : cfg.skin;
  const hair   = hurt ? '#fff' : cfg.hair;
  const hairHi = hurt ? '#fff' : (cfg.hairHi||cfg.hair);
  const suit   = hurt ? '#fff' : cfg.suit;
  const suitHi = hurt ? '#fff' : (cfg.suitHi||cfg.suit);
  const pants  = hurt ? '#fff' : (cfg.pants||cfg.suit);
  const boots  = hurt ? '#fff' : (cfg.boots||'#222');
  const legSw = walk*0.55;
  g.fillStyle = pants;
  g.save(); g.translate(-4,-18); g.rotate(legSw);  rr(g,-4,0,8,18,4); g.fill(); g.restore();
  g.save(); g.translate( 4,-18); g.rotate(-legSw); rr(g,-4,0,8,18,4); g.fill(); g.restore();
  g.fillStyle = boots;
  g.save(); g.translate(-4,-18); g.rotate(legSw);  rr(g,-5,14,10,6,3); g.fill(); g.restore();
  g.save(); g.translate( 4,-18); g.rotate(-legSw); rr(g,-5,14,10,6,3); g.fill(); g.restore();
  g.fillStyle = suit;   rr(g,-11,-40,22,24,8); g.fill();
  g.fillStyle = suitHi; rr(g,-7,-37,14,10,5);  g.fill();
  if(cfg.armor){
    g.fillStyle = hurt?'#fff':cfg.armor;
    rr(g,-12,-41,24,10,4); g.fill();
    g.beginPath(); g.arc(-12,-37,6,0,TAU); g.fill();
    g.beginPath(); g.arc( 12,-37,6,0,TAU); g.fill();
    if(cfg.armorBand){ g.fillStyle = hurt?'#fff':cfg.armorBand; rr(g,-12,-41,24,3,1.5); g.fill(); }
  }
  const backSw = moving ? -walk*0.5 : Math.sin(animT*2.2)*0.12;
  g.save(); g.translate(-9,-34); g.rotate(0.4 + backSw);
  g.fillStyle = skin; rr(g,-3.5,0,7,15,3.5); g.fill(); g.restore();
  g.save(); g.translate(1,-46);
  if(cfg.hairStyle!=='bald' && cfg.hairStyle!=='frieza'){
    g.fillStyle = hair;
    g.beginPath(); g.arc(0,-4,12,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='bulma' || cfg.hairStyle==='long'){
    g.fillStyle = hair;
    g.beginPath(); g.ellipse(-10,3,6,12,0.18,0,TAU); g.fill();
    g.beginPath(); g.ellipse( 9,2,5.5,11,-0.18,0,TAU); g.fill();
  }
  g.fillStyle = skin; g.beginPath(); g.arc(2,-1,9,0,TAU); g.fill();
  if(cfg.hairStyle==='bulma'){
    g.fillStyle = hair;
    g.beginPath(); g.moveTo(-11,-4); g.quadraticCurveTo(0,-20,12,-5);
    g.quadraticCurveTo(0,-11,-11,-4); g.fill();
    g.fillStyle = hairHi; g.beginPath(); g.ellipse(-3,-9,5,2.6,-0.5,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='spike'){
    const spikes = [[-9,-9,-13,-22,-5,-14],[-4,-12,-5,-27,1,-17],[2,-12,4,-28,7,-15],[8,-9,12,-23,12,-11]];
    g.fillStyle = hair;
    for(const sp of spikes){ g.beginPath(); g.moveTo(sp[0],sp[1]); g.lineTo(sp[2],sp[3]); g.lineTo(sp[4],sp[5]); g.closePath(); g.fill(); }
    g.fillStyle = hairHi; g.beginPath(); g.ellipse(-2,-16,4,2,-0.4,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='frieza'){
    g.fillStyle = hair; g.beginPath(); g.ellipse(0,-6,12,9,0,0,TAU); g.fill();
    g.fillStyle = hairHi; g.beginPath(); g.ellipse(-2,-10,7,3,-0.3,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='dodoria'){
    g.fillStyle = hair;
    for(let i=0;i<5;i++){
      const a=-0.9+i*0.42;
      g.beginPath();
      g.moveTo(Math.cos(a-0.15)*11-1, Math.sin(a-0.15)*11-4);
      g.lineTo(Math.cos(a)*18-1, Math.sin(a)*18-6);
      g.lineTo(Math.cos(a+0.15)*11-1, Math.sin(a+0.15)*11-4);
      g.closePath(); g.fill();
    }
  }
  if(cfg.hairStyle==='zarbon'){ g.fillStyle = hair; g.beginPath(); g.ellipse(-2,-8,13,8,-0.15,0,TAU); g.fill(); }
  if(cfg.hairStyle==='ginyu'){
    g.fillStyle = hair;
    g.beginPath(); g.moveTo(-9,-9); g.lineTo(-14,-22); g.lineTo(-3,-12); g.closePath(); g.fill();
    g.beginPath(); g.moveTo( 9,-9); g.lineTo( 15,-22); g.lineTo( 3,-12); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(0,-7,11,7,0,0,TAU); g.fill();
  }
  if(!hurt){
    const ec = cfg.eyeColor || '#1a2030';
    g.fillStyle = ec;
    g.beginPath(); g.arc(6,-2.5,1.8,0,TAU); g.fill();
    g.beginPath(); g.arc(1,-2.5,1.8,0,TAU); g.fill();
    if(cfg.glowEye){ g.fillStyle = cfg.glowEye; g.beginPath(); g.arc(6,-2.5,1.1,0,TAU); g.fill(); g.beginPath(); g.arc(1,-2.5,1.1,0,TAU); g.fill(); }
    else { g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(6.5,-3.2,0.6,0,TAU); g.fill(); g.beginPath(); g.arc(1.5,-3.2,0.6,0,TAU); g.fill(); }
  } else {
    g.strokeStyle='#333'; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(0,-4); g.lineTo(3,-1.5); g.lineTo(6,-4); g.stroke();
  }
  if(cfg.scouter && !hurt){
    g.fillStyle='#2b3550'; rr(g,-2,-7,11,7,2); g.fill();
    g.fillStyle='#4dff9e'; rr(g,3,-6,5,5,1.2); g.fill();
  }
  g.restore();
  let armAng = moving ? walk*0.4 : Math.sin(animT*2.2)*0.1;
  if(flying) armAng = -0.85 + Math.sin(animT*3)*0.12;
  if(atk>0) armAng = -1.1 * Math.min(1, atk/0.18);
  g.save(); g.translate(9,-34); g.rotate(armAng);
  g.fillStyle = skin; rr(g,-3.5,0,7,16,3.5); g.fill();
  g.translate(0,16); g.fillStyle = skin; g.beginPath(); g.arc(0,0,4.5,0,TAU); g.fill();
  if(atk>0){
    g.save(); g.globalCompositeOperation='lighter';
    const rg=g.createRadialGradient(0,0,1,0,0,20);
    rg.addColorStop(0,'#fff'); rg.addColorStop(0.4, cfg.kiColor||'#7fd4ff'); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(0,0,20,0,TAU); g.fill(); g.restore();
  }
  g.restore();
  if(cfg.aura && opt.auraOn!==false){
    g.save(); g.globalCompositeOperation='lighter';
    const ac = cfg.aura;
    const r = (opt.auraR||34) * (flying ? 1.25 : 1) + Math.sin(animT*6)*3;
    const ag = g.createRadialGradient(0,-22,3,0,-22,r);
    ag.addColorStop(0, ac+'bb'); ag.addColorStop(0.5, ac+'44'); ag.addColorStop(1, ac+'00');
    g.fillStyle = ag; g.beginPath(); g.arc(0,-22,r,0,TAU); g.fill(); g.restore();
  }
  if(flying){
    g.save(); g.globalCompositeOperation = 'lighter';
    const tc = cfg.aura || cfg.kiColor || '#7fd4ff';
    const len = 54 + (moving ? 48 : 0);
    const tg = g.createLinearGradient(-8,-22, -len,-22);
    tg.addColorStop(0, tc + 'cc'); tg.addColorStop(0.5, tc + '55'); tg.addColorStop(1, tc + '00');
    g.fillStyle = tg;
    g.beginPath(); g.moveTo(-6, -6); g.lineTo(-len, -16); g.lineTo(-len, -32); g.lineTo(-6, -42);
    g.closePath(); g.fill(); g.restore();
  }
  g.restore();
}

function drawBuilding(b){
  if(!FIN(b.x)||!FIN(b.y)) return;
  const bx = sx(b.x), by = sy(b.y + b.h);
  const bw = b.w, bh = b.h * ISO * 3.2;
  const dep = b.h * ISO;
  if(bx + bw < -80 || bx > VW+80) return;
  if(by < -200 || by - bh > VH+80) return;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(bx + bw/2, by, bw*0.55, dep*0.55, 0, 0, TAU); ctx.fill();
  const wallGrad = ctx.createLinearGradient(0, by - bh, 0, by);
  if(b.kind === 'shop'){ wallGrad.addColorStop(0,'#e8c85a'); wallGrad.addColorStop(1,'#8a6a1a'); }
  else if(b.kind === 'lab'){ wallGrad.addColorStop(0,'#b8e8ff'); wallGrad.addColorStop(1,'#3a7a9a'); }
  else if(b.kind === 'school'){ wallGrad.addColorStop(0,'#c8d8f0'); wallGrad.addColorStop(1,'#5a7aa8'); }
  else { wallGrad.addColorStop(0,'#d8a878'); wallGrad.addColorStop(1,'#8a5a2a'); }
  ctx.fillStyle = wallGrad;
  ctx.fillRect(bx, by - bh, bw, bh);
  ctx.fillStyle = b.kind === 'lab' ? '#7a9ac8' : (b.kind === 'shop' ? '#c8443a' : (b.kind === 'school' ? '#3a5a8a' : '#a05a2a'));
  ctx.beginPath();
  ctx.moveTo(bx - 8, by - bh);
  ctx.lineTo(bx + bw/2, by - bh - 32);
  ctx.lineTo(bx + bw + 8, by - bh);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a2a1a';
  const doorW = 42, doorH = 62;
  ctx.fillRect(bx + bw/2 - doorW/2, by - doorH, doorW, doorH);
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(bx + bw/2 + doorW/2 - 10, by - doorH/2, 2.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(180,240,255,0.85)';
  const winY = by - bh + 22;
  for(let i=0;i<Math.floor(bw/70);i++){
    const wx = bx + 22 + i*70;
    ctx.fillRect(wx, winY, 28, 28);
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2;
    ctx.strokeRect(wx, winY, 28, 28);
    ctx.beginPath();
    ctx.moveTo(wx+14, winY); ctx.lineTo(wx+14, winY+28);
    ctx.moveTo(wx, winY+14); ctx.lineTo(wx+28, winY+14);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(4,10,14,0.75)';
  ctx.font = 'bold 11px system-ui, sans-serif';
  const lw = ctx.measureText(b.label).width + 16;
  rr(ctx, bx + bw/2 - lw/2, by - bh - 55, lw, 20, 6); ctx.fill();
  ctx.fillStyle = '#7fe9ff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, bx + bw/2, by - bh - 45);
  ctx.textBaseline = 'alphabetic';
}

function drawGround(){
  ctx.fillStyle = '#0a1a2a';
  ctx.fillRect(0, 0, VW, VH);
  for(const r of REGIONS){
    const rx = r.gx * REGION_W, ry = r.gy * REGION_H;
    const px = sx(rx), py = sy(ry);
    const pw = REGION_W, ph = REGION_H * ISO;
    if(px + pw < -50 || px > VW+50) continue;
    if(py + ph < -50 || py > VH+50) continue;
    const cols = regionColor(r.g);
    const grad = ctx.createLinearGradient(0, py, 0, py + ph);
    grad.addColorStop(0, cols.base); grad.addColorStop(1, cols.top);
    ctx.fillStyle = grad; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    const tile = 80;
    for(let yy = 0; yy < REGION_H; yy += REGION_H/12){
      const cy = sy(ry + yy);
      if(cy < -30 || cy > VH+30) continue;
      for(let xx = 0; xx < REGION_W; xx += tile*2){
        const cx = sx(rx + xx + (Math.floor(yy/(REGION_H/12))%2 === 1 ? tile : 0));
        if(cx < -tile || cx > VW) continue;
        ctx.fillRect(cx, cy, tile, REGION_H/12 * ISO);
      }
    }
    if(r.g === 'grass' || r.g === 'forest' || r.g === 'namek'){
      ctx.strokeStyle = cols.accent + '60'; ctx.lineWidth = 1.5;
      for(let i=0;i<40;i++){
        const wx = rx + (i * 137.5) % REGION_W;
        const wy = ry + (i * 211.3) % REGION_H;
        const cx = sx(wx), cy = sy(wy);
        if(cx < 0 || cx > VW || cy < 0 || cy > VH) continue;
        const sway = Math.sin(worldTime*2 + i)*2;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + sway, cy - 6); ctx.stroke();
      }
    }
    if(r.g === 'island'){
      const ccx = sx(rx + REGION_W/2), ccy = sy(ry + REGION_H/2);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath(); ctx.ellipse(ccx, ccy+34, REGION_W*0.40, REGION_H*ISO*0.12, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8d29a';
      ctx.beginPath(); ctx.ellipse(ccx, ccy, REGION_W*0.34, REGION_H*ISO*0.42, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7ec46a';
      ctx.beginPath(); ctx.ellipse(ccx, ccy-6, REGION_W*0.23, REGION_H*ISO*0.29, 0, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 3;
    ctx.strokeRect(px, py, pw, ph);
  }
}

function spawnPed(region){
  const x = region.gx * REGION_W + rand(120, REGION_W-120);
  const y = region.gy * REGION_H + rand(120, REGION_H-120);
  const ch = PED_CHARS[(Math.random()*PED_CHARS.length)|0];
  return { ch, x, y, homeX:x, homeY:y, tx:x, ty:y, t: rand(0,3),
    vx:0, vy:0, animT: rand(0,3), moving:false, facing:1,
    hp: 40, maxHp: 40, panicked: false, panicT: 0, isPed: true };
}
function updatePeds(dt){
  GTA.pedSpawnTimer -= dt;
  if(GTA.pedSpawnTimer <= 0 && GTA.peds.length < 32){
    GTA.pedSpawnTimer = 0.35;
    for(let tries = 0; tries < 4; tries++){
      const testR = regionAt(player.x + rand(-1200,1200), player.y + rand(-1200,1200));
      if(!testR) continue;
      if(!(testR.g === 'city' || testR.g === 'island' || testR.id === 'village')) continue;
      const p = spawnPed(testR);
      const d = dist(p.x, p.y, player.x, player.y);
      if(d > 200 && d < 900){ GTA.peds.push(p); break; }
    }
  }
  for(let i=GTA.peds.length-1; i>=0; i--){
    const p = GTA.peds[i];
    if(p.hp <= 0){ GTA.peds.splice(i,1); continue; }
    const dToPlayer = dist(p.x, p.y, player.x, player.y);
    if(dToPlayer > 1800){ GTA.peds.splice(i,1); continue; }
    const danger = (player.attackT > 0 && dToPlayer < 260) || (GTA.protectors.length > 0 && dToPlayer < 420);
    if(danger){ p.panicked = true; p.panicT = Math.max(p.panicT, 2.5); }
    if(p.panicT > 0){ p.panicT -= dt; if(p.panicT <= 0) p.panicked = false; }
    if(p.panicked){
      const dx = p.x - player.x, dy = p.y - player.y;
      const dd = Math.hypot(dx, dy) || 1;
      p.x += (dx/dd) * 220 * dt; p.y += (dy/dd) * 170 * dt;
      p.moving = true; p.facing = dx > 0 ? 1 : -1;
    } else {
      p.t -= dt;
      if(p.t <= 0){ p.t = rand(2,5); p.tx = p.homeX + rand(-100,100); p.ty = p.homeY + rand(-60,60); }
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const dd = Math.hypot(dx, dy);
      if(dd > 5){ p.x += (dx/dd) * 38 * dt; p.y += (dy/dd) * 28 * dt; p.moving = true; p.facing = dx > 0 ? 1 : -1; }
      else p.moving = false;
    }
    p.animT += dt * (p.moving ? (p.panicked ? 2.5 : 1.5) : 0.5);
  }
}

function spawnProtector(tier, nearX, nearY){
  const def = PROTECTOR_TIERS[tier];
  if(!def) return null;
  const ang = Math.random() * TAU;
  const r = 500 + Math.random()*400;
  return { ch: def.ch, cfg: CH[def.ch], x: nearX + Math.cos(ang)*r, y: nearY + Math.sin(ang)*r,
    vx:0, vy:0, facing:-1, moving:false, hp: def.hp, maxHp: def.hp,
    dmg: def.dmg, speed: def.speed, animT:0, hurtT:0, attackT:0, atkCd: rand(0.6,1.6),
    tier: tier, name: def.name, dead: false };
}
function updateProtectors(dt){
  if(GTA.wanted > 0){
    GTA.protectorSpawnTimer -= dt;
    const tier = PROTECTOR_TIERS[GTA.wanted];
    const targetCount = tier ? tier.count : 0;
    const alive = GTA.protectors.filter(p => !p.dead).length;
    if(GTA.protectorSpawnTimer <= 0 && alive < targetCount){
      GTA.protectorSpawnTimer = tier ? tier.cd : 2;
      const pr = spawnProtector(GTA.wanted, player.x, player.y);
      if(pr){ GTA.protectors.push(pr); if(alive === 0) banner('⚠ ' + tier.name + ' INCOMING', tier.blip, 2.5); }
    }
  }
  for(let i=GTA.protectors.length-1; i>=0; i--){
    const pr = GTA.protectors[i];
    if(pr.dead){ GTA.protectors.splice(i,1); continue; }
    if(pr.hurtT > 0) pr.hurtT -= dt;
    pr.animT += dt;
    const dx = player.x - pr.x, dy = player.y - pr.y;
    const d = Math.hypot(dx, dy) || 1;
    pr.facing = dx > 0 ? 1 : -1;
    if(d > 90){ pr.vx = (dx/d) * pr.speed; pr.vy = (dy/d) * pr.speed; pr.moving = true; }
    else { pr.vx *= 0.85; pr.vy *= 0.85; pr.moving = false; }
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    pr.x = clamp(pr.x, 20, WORLD_W-20); pr.y = clamp(pr.y, 20, WORLD_H-20);
    pr.atkCd -= dt;
    if(d < 95 && pr.atkCd <= 0 && player.invuln <= 0 && !G.godMode){
      pr.atkCd = 1.3; pr.attackT = 0.3;
      damagePlayer(pr.dmg, pr.x);
    }
    if(pr.attackT > 0) pr.attackT -= dt;
  }
}
function updateWanted(dt){
  if(GTA.wanted > 0 && !G.godMode){
    GTA.wantedDecayTimer -= dt;
    if(GTA.wantedDecayTimer <= 0){
      GTA.wanted--;
      GTA.wantedDecayTimer = 15 + GTA.wanted * 5;
      if(GTA.wanted === 0){ GTA.protectors.length = 0; toast('✔ Lost the protectors'); sfx('ui'); }
    }
  }
}
function addWanted(n){
  if(G.godMode) return;
  const before = GTA.wanted;
  GTA.wanted = Math.min(5, GTA.wanted + n);
  GTA.wantedDecayTimer = 15 + GTA.wanted * 5;
  GTA.reputation = Math.max(-100, GTA.reputation - n*2);
  if(GTA.wanted > before){ banner('⭐ WANTED ' + '⭐'.repeat(GTA.wanted), '#ff5a8a', 2); sfx('siren'); }
}
function addReputation(n){ GTA.reputation = clamp(GTA.reputation + n, -100, 100); }

function startMission(marker){

      GTA.activeMission.spawned.push({
        ch: def.enemyCh || 'soldier',

      });

function completeMission(){
  const m = GTA.activeMission;
  if(!m) return;
  const def = m.def;
  GTA.completedMissions[def.id] = true;
  GTA.activeMission = null;
  player.zeni += def.reward.zeni;
  addReputation(def.reward.rep);
  if(def.reward.rep > 0 && GTA.wanted > 0) GTA.wanted = Math.max(0, GTA.wanted - 2);
  sfx('coin');
  banner('✔ ' + def.name + ' — +' + def.reward.zeni + 'z', '#7dffa8', 3);
  for(const mk of GTA.missionMarkers) if(mk.def.id === def.id) mk.taken = true;
}
function updateMission(dt){
  const m = GTA.activeMission;
  if(!m) return;
  const def = m.def;
  if(def.type === 'deliver'){
    const target = m.stage === 'accept' ? def.accept : def.target;
    const d = dist(player.x, player.y, target.x, target.y);
    if(m.stage === 'accept'){ if(d < 200){ m.stage = 'target'; toast('✔ Picked up!'); sfx('coin'); } }
    else if(m.stage === 'target'){ if(d < 120){ completeMission(); } }
  } else if(def.type === 'defeat'){
    let alive = 0;
    for(const e of m.spawned){
      if(e.hp <= 0) continue;
      alive++;
      const dx = player.x - e.x, dy = player.y - e.y;
      const dd = Math.hypot(dx, dy) || 1;
      e.facing = dx > 0 ? 1 : -1;
      if(dd > 80){ e.x += (dx/dd) * 100 * dt; e.y += (dy/dd) * 100 * dt; e.moving = true; } else e.moving = false;
      e.animT += dt * 1.5;
      e.atkCd -= dt;
      if(dd < 70 && e.atkCd <= 0 && player.invuln <= 0 && !G.godMode){ e.atkCd = 1.4; e.attackT = 0.3; damagePlayer(e.dmg, e.x); }
      if(e.attackT > 0) e.attackT -= dt;
      if(e.hurtT > 0) e.hurtT -= dt;
    }
    if(alive === 0) completeMission();
  } else if(def.type === 'chaos'){
    m.timer -= dt;
    if(GTA.wanted < 3){ toast('Lost the heat! Failed.'); GTA.activeMission = null; return; }
    if(m.timer <= 0) completeMission();
  }
}

/* ══════════════ KAMEHAMEHA + KI BLAST ══════════════ */
function fireKiBlast(){
  const p = player;
  if(p.shootT > 0 || p.ki < 3) return;
  p.shootT = FORMS[p.form].rate;
  p.ki -= 3;
  bullets.push({
    x:p.x + p.facing*22, y:p.y, vx:p.facing*820, vy:0,
    r:6, dmg:16*FORMS[p.form].dmg*powerMul(), life:1.5,
    c:FORMS[p.form].auraCol, fromPlayer:true, t:0
  });
  sfx('shoot');
}
function releaseCharge(){
  const p = player;
  if(G.chargeT < 0.22){
    // quick tap → ki blast
    fireKiBlast();
  } else {
    // held → kamehameha
    if(G.kameCharge > 0.15 && p.ki >= 5){
      const dmg = (25 + G.kameCharge * 60) * FORMS[p.form].dmg * powerMul();
      bullets.push({
        x: p.x + p.facing*22, y: p.y,
        vx: p.facing * 1600, vy: 0,
        r: 8 + G.kameCharge * 14, dmg: dmg, life: 1.4,
        c: FORMS[p.form].auraCol, fromPlayer:true, t: 0,
        isKame: true, chargeScale: G.kameCharge,
      });
      cam.shake = 14 + G.kameCharge * 8;
      cam.flash = 0.4; cam.flashCol = FORMS[p.form].auraCol;
      sfx('kame');
      spark(p.x + p.facing*40, p.y, 20, [FORMS[p.form].auraCol, '#fff'], 400, 0.6, 6);
    }
  }
  G.kameCharge = 0; G.chargeT = 0;
  G.chargeActive = false;
}
function updateKamehameha(dt){
  const p = player;
  const uHeld = keys['u'];
  // I key — always instant ki blast
  if(pressed['i']) fireKiBlast();

  if(uHeld && p.ki >= 3 && p.shootT <= 0){
    if(!G.chargeActive){ G.chargeActive = true; G.chargeT = 0; G.kameCharge = 0; }
    G.chargeT += dt;
    G.kameCharge = Math.min(1.6, G.kameCharge + dt * 1.1);
    if(Math.random() < 0.9){
      const ang = Math.random()*TAU;
      const rr2 = 20 + G.kameCharge * 30;
      parts.push({
        x: p.x + p.facing*22 + Math.cos(ang)*rr2,
        y: p.y + Math.sin(ang)*rr2*ISO,
        vx: Math.cos(ang)*40, vy: Math.sin(ang)*30,
        life: 0.4, max: 0.4, size: rand(2,4),
        c: FORMS[p.form].auraCol
      });
    }
    p.ki -= 5 * dt;
  }

  // Draw charge ball
  if(G.kameCharge > 0){
    const gx = sx(player.x + player.facing*22);
    const gy = sy(player.y) - 22;
    const r = 12 + G.kameCharge * 22;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(gx, gy, 2, gx, gy, r*2.4);
    rg.addColorStop(0, '#fff');
    rg.addColorStop(0.35, FORMS[player.form].auraCol);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(gx, gy, r*2.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function hitTarget(target, kind, x, y, dmg, reach, facing){
  if(!target) return false;
  const dx = x - player.x, dy = y - player.y;
  if(Math.abs(dx) >= reach || Math.abs(dy) >= 55 || sgn(dx) !== facing) return false;
  target.hp = (target.hp || 100) - dmg;
  player.power += dmg * 0.6;
  spark(x, y-20, 6, ['#fff','#ffd166'], 200, 0.3, 3);
  dmgText(x, y-50, Math.round(dmg), '#ffe066');
  sfx('hit');
  if(kind === 'ped'){ target.panicked = true; target.panicT = 5; addWanted(1); banner('Civilian harmed! +1 ⭐', '#ff5a8a', 1.5); player.pedKills++; }
  if(target.hp <= 0){
    if(kind === 'ped'){ spark(x, y, 20, ['#ff6b8a','#fff'], 300, 0.7, 5); addWanted(2); }
    else if(kind === 'protector'){ spark(x, y, 24, ['#ffe066','#fff'], 320, 0.7, 5); addWanted(1); }
    else { spark(x, y, 20, ['#ff9be0','#fff'], 300, 0.7, 5); }
    if(kind === 'enemy' && target.zeni){ player.zeni += target.zeni; toast('+' + target.zeni + ' zeni'); }
  }
  return true;
}

/* ══════════════ EXPLORE ══════════════ */
function updateExplore(dt){
  const p = player;
  if(p.dead) return;
  let ix = 0, iy = 0;
  if(keys['a']||keys['arrowleft'])  ix -= 1;
  if(keys['d']||keys['arrowright']) ix += 1;
  if(keys['w']||keys['arrowup'])    iy -= 1;
  if(keys['s']||keys['arrowdown'])  iy += 1;
  const mag = Math.hypot(ix, iy);
  if(mag > 0){ ix /= mag; iy /= mag; }
  if(ix !== 0) p.facing = ix > 0 ? 1 : -1;

  if(pressed['f']){ p.flying = !p.flying; sfx('power'); toast(p.flying ? '✈ FLYING' : '🚶 WALKING'); }
  if(p.flying){
    let vz = 0;
    if(keys[' ']) vz += 1;
    if(keys['control'] || keys['shift']) vz -= 1;
    p.z = clamp(p.z + vz * 480 * dt, 0, 900);
  } else {
    p.z = lerp(p.z, 0, 1 - Math.exp(-10*dt));
    if(p.z < 1) p.z = 0;
  }

  const charging = !!p.chargeActive;
  const speed = (p.flying ? 470 : 260) * (charging ? 0.35 : 1);
  const targetVx = ix * speed;
  const targetVy = iy * speed * 1.15;
  const k = 1 - Math.exp(-16*dt);
  p.vx = p.vx + (targetVx - p.vx) * k;
  p.vy = p.vy + (targetVy - p.vy) * k;
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.x = clamp(p.x, 20, WORLD_W - 20); p.y = clamp(p.y, 20, WORLD_H - 20);

  if(!p.flying){
    for(const b of ALL_BUILDINGS){
      const pad = 14;
      if(p.x > b.x + b.gx - pad && p.x < b.x + b.gx + b.w + pad &&
         p.y > b.y + b.gy - pad && p.y < b.y + b.gy + b.h + pad){
        const dx1 = Math.abs(p.x - (b.x + b.gx - pad));
        const dx2 = Math.abs(p.x - (b.x + b.gx + b.w + pad));
        const dy1 = Math.abs(p.y - (b.y + b.gy - pad));
        const dy2 = Math.abs(p.y - (b.y + b.gy + b.h + pad));
        const minD = Math.min(dx1, dx2, dy1, dy2);
        if(minD === dx1) p.x = b.x + b.gx - pad;
        else if(minD === dx2) p.x = b.x + b.gx + b.w + pad;
        else if(minD === dy1) p.y = b.y + b.gy - pad;
        else p.y = b.y + b.gy + b.h + pad;
      }
    }
  }
  if(!p.flying && isWaterAt(p.x, p.y)){
    p.hp -= 30 * dt;
    if(Math.random() < 0.3)
      parts.push({x:p.x+rand(-8,8), y:p.y+rand(-8,8), vx:rand(-40,40), vy:rand(-40,40),
        life:0.4, max:0.4, size:3, c:'#7fd4ff'});
    if(p.hp <= 0) p.hp = 0;
  }

  const r = regionAt(p.x, p.y);
  if(r && r !== G.currentRegion){
    G.currentRegion = r;
    if(!G.visitedRegions[r.id]){ G.visitedRegions[r.id] = true; toast('📍 ' + r.name); }
  }

  let near = null, nd = 1e9;
  for(const n of npcList){
    const dd = dist(p.x, p.y, n.x, n.y);
    if(dd < nd){ nd = dd; near = n; }
  }
  G.nearNPC = (nd < 130) ? near : null;
  if(near && near.name && nd < 95 && !G.met[near.name]){
    G.met[near.name] = true;
    toast('⭐ You met ' + near.name + '!');
    spark(near.x, near.y-20, 16, ['#ffe066','#fff'], 220, 0.6, 3);
    sfx('coin');
  }
  if(pressed['t'] && G.nearNPC && G.nearNPC.name) openDialogue(G.nearNPC);
  if(pressed['r'] && G.nearNPC && G.nearNPC.name) openRomance(G.nearNPC);

  for(const mk of GTA.missionMarkers){
    if(mk.taken) continue;
    if(GTA.completedMissions[mk.def.id]){ mk.taken = true; continue; }
    if(dist(p.x, p.y, mk.x, mk.y) < 80){
      if(pressed['e']){ startMission(mk); }
      G.nearbyHelper = mk;
    }
  }

  // Ship parts pickup
  updateShipParts(dt);

  for(const region of REGIONS){
    if(!region.enemies) continue;
    for(const en of region.enemies){
      if(en.dead) continue;
      if(dist(p.x, p.y, en.x, en.y) < 60){
        if(p.invuln <= 0 && !G.godMode){
          p.hp -= en.dmg * 0.5; p.invuln = 0.4;
          en.hp -= 25; p.power += 18;
          spark(p.x, p.y-20, 8, ['#ff6b8a','#fff'], 200, 0.4, 3);
          dmgText(p.x, p.y-50, 'HIT!', '#ff6b8a'); sfx('hit');
          if(en.hp <= 0){ en.dead = true; p.zeni += en.zeni; spark(en.x, en.y, 20, ['#ff9be0','#fff'], 300, 0.7, 5); toast('+' + en.zeni + ' zeni'); sfx('boom'); }
        }
      }
    }
  }

  if(p.attackCd > 0) p.attackCd -= dt;
  if(p.attackT > 0) p.attackT -= dt;
  if(p.shootT > 0) p.shootT -= dt;
  if(p.hurtT > 0) p.hurtT -= dt;
  if(p.invuln > 0) p.invuln -= dt;
  if(p.comboWindow > 0) p.comboWindow -= dt; else p.comboStep = 0;

  if((pressed['j'] || mouseClicked) && p.attackCd <= 0 && !p.chargeActive){
    p.attackT = 0.18; p.attackCd = 0.24;
    p.comboStep = (p.comboStep % 3) + 1;
    p.comboWindow = 0.6;
    const dmg = [0,18,22,30][p.comboStep] * FORMS[p.form].dmg * powerMul();
    const reach = 60 + p.comboStep * 6;
    let hitAny = false;
    for(const region of REGIONS){
      if(!region.enemies) continue;
      for(const en of region.enemies){
        if(en.dead) continue;
        if(hitTarget(en, 'enemy', en.x, en.y, dmg, reach, p.facing)){
          hitAny = true;
          if(en.hp <= 0) en.dead = true;
        }
      }
    }
    if(GTA.activeMission && GTA.activeMission.spawned){
      for(const en of GTA.activeMission.spawned){
        if(en.hp <= 0) continue;
        if(hitTarget(en, 'enemy', en.x, en.y, dmg, reach, p.facing)) hitAny = true;
      }
    }
    for(const pd of GTA.peds){ if(hitTarget(pd, 'ped', pd.x, pd.y, dmg, reach, p.facing)) hitAny = true; }
    for(const pr of GTA.protectors){
      if(hitTarget(pr, 'protector', pr.x, pr.y, dmg, reach, p.facing)){
        hitAny = true;
        if(pr.hp <= 0 && !pr.dead) pr.dead = true;
      }
    }
    if(boss && !boss.dead && boss.invuln <= 0){
      if(hitTarget(boss, 'enemy', boss.x, boss.y, dmg, reach, p.facing)){
        hitAny = true; boss.hurtT = 0.18;
        if(boss.hp <= 0){ boss.hp = 0; killBoss(); }
      }
    }
    if(boss && boss.duo && !boss.duo.dead){
      if(hitTarget(boss.duo, 'enemy', boss.duo.x, boss.duo.y, dmg, reach, p.facing)){
        hitAny = true;
        if(boss.duo.hp <= 0){ boss.duo.dead = true; sfx('boom'); }
      }
    }
    if(!hitAny){
      const fx = p.x + p.facing * reach * 0.7;
      spark(fx, p.y-20, 4, ['#fff','#7fd4ff'], 130, 0.22, 3);
      sfx('shoot');
    } else { cam.shake = 5; G.hitStop = 0.04; }
  }

  // Kamehameha + ki blast
  updateKamehameha(dt);

  // Transform — shift + E
  if(pressed['e'] && p.transformFx <= 0 && !G.nearbyHelper && keys['shift']) transformStep(p);
  if(p.transformFx > 0) p.transformFx -= dt;
  G.nearbyHelper = null;

  // Potions
  if(pressed['1'] && p.inventory.potion > 0 && p.hp < p.maxHp){
    p.inventory.potion--; p.hp = Math.min(p.maxHp, p.hp + 80);
    toast('Potion! +80 HP'); sfx('coin');
  }
  if(pressed['2'] && p.inventory.kiPotion > 0 && p.ki < p.maxKi){
    p.inventory.kiPotion--; p.ki = Math.min(p.maxKi, p.ki + 60);
    toast('Ki! +60 KI'); sfx('coin');
  }
  if(pressed['3'] && p.inventory.senzu > 0){
    p.inventory.senzu--; p.hp = p.maxHp; p.ki = p.maxKi;
    toast('Senzu! FULL'); sfx('power');
  }

  if(pressed['k'] && p.dashCd <= 0){
    p.dashCd = 0.55; p.invuln = 0.22;
    p.vx = p.facing * 800;
    for(let i=0;i<10;i++)
      spark(p.x + rand(-14,14), p.y + rand(-6,6), 1, [FORMS[p.form].auraCol,'#fff'], rand(60,200), 0.35, 3);
    sfx('power');
  }
  if(p.dashCd > 0) p.dashCd -= dt;

  // Enter building
  if(pressed['e'] && !keys['shift']){
    for(const b of ALL_BUILDINGS){
      const doorX = b.x + b.gx + b.w/2;
      const doorY = b.y + b.gy + b.h;
      if(dist(p.x, p.y, doorX, doorY) < 90 && (b.interior || b.warp)){
        G._lastBuilding = b;
        if(b.warp) doWarp(b); else enterInterior(b.interior);
        break;
      }
    }
  }

  // Boss
  for(const region of REGIONS){
    if(!region.bossAt) continue;
    if(G.defeatedBosses[region.bossAt.boss]) continue;
    if(boss) continue;
    const bd = region.bossAt;
    if(dist(p.x, p.y, bd.x, bd.y) < 380){ startBossBattle(region.bossAt.boss, bd.x, bd.y); return; }
  }

  p.walking = !p.flying && !p.chargeActive && Math.hypot(p.vx, p.vy) > 30;
  p.animT += dt * (p.flying ? 2.6 : (p.walking ? Math.max(1, Math.hypot(p.vx,p.vy)/220) : 2.4));

  p.ki = Math.min(p.maxKi, p.ki + FORMS[p.form].kiGain * dt);
  p.maxKi += 0.7 * dt;
  if(Math.random() < (p.form > 0 ? 0.75 : 0.3)){
    const c = FORMS[p.form].auraCol;
    parts.push({
      x:p.x+rand(-14,14), y:p.y+rand(-6,6),
      vx:rand(-30,30), vy:rand(-40,40),
      life:rand(0.3,0.6), max:0.6, size:rand(2,5), c
    });
  }
  if(p.flying){
    const sp = Math.hypot(p.vx, p.vy);
    const ca = FORMS[p.form].auraCol;
    const back = sp > 20 ? Math.atan2(p.vy, p.vx) + Math.PI : Math.PI;
    const n = sp > 20 ? 3 : 1;
    for(let i=0;i<n;i++){
      const spd = 60 + sp * 0.6 + rand(0, 90);
      parts.push({
        x: p.x + rand(-8,8), y: p.y + rand(-6,6), gz: p.z + rand(-10,10),
        vx: Math.cos(back)*spd*rand(0.6,1.3) + rand(-30,30),
        vy: Math.sin(back)*spd*rand(0.5,1.0)*ISO + rand(-24,24),
        life: rand(0.25,0.5), max:0.5, size: rand(3,6), c: ca
      });
    }
  }
  if(p.hp <= 0 && !p.dead && !G.godMode){
    p.dead = true;
    spark(p.x, p.y, 40, ['#ff6b9d','#fff'], 340, 1.0, 5);
    cam.flash = 0.8; cam.flashCol = '#ff3b6b';
    setTimeout(()=>{ G.mode='lose'; }, 1200);
  }
  // God mode keeps hp high
  if(G.godMode && p.hp < p.maxHp) p.hp = p.maxHp;
}

function updateNPCs(dt){
  for(const n of npcList){
    n.t -= dt;
    if(n.t <= 0){
      n.t = rand(1.5, 4);
      const a = Math.random()*TAU;
      n.tx = n.homeX + Math.cos(a)*80;
      n.ty = n.homeY + Math.sin(a)*40;
    }
    if(n.tx !== undefined){
      const dx = n.tx - n.x, dy = n.ty - n.y;
      const d = Math.hypot(dx, dy);
      if(d > 5){ n.x += (dx/d) * 40 * dt; n.y += (dy/d) * 30 * dt; n.moving = true; n.facing = dx > 0 ? 1 : -1; }
      else n.moving = false;
    }
    n.animT += dt * (n.moving ? 1.5 : 0.5);
    if(G.married && n.name === G.married && Math.random() < 0.0003){
      player.zeni += 50;
      toast(G.married + ' gave you 50z ❤');
      spark(n.x, n.y-20, 12, ['#ff7ad0','#fff'], 200, 0.7, 4);
    }
  }
}

function enterInterior(key){
  const it = INTERIORS[key];
  if(!it) return;
  G.currentInterior = key;
  G.mode = 'interior';
  it._npcs = (it.npcs || []).map(n => ({...n}));
  player.x = it.w / 2;
  player.y = it.h - 80;
  player.vx = 0; player.vy = 0;
  player.z = 0; player.flying = false;
  cam.x = 0; cam.y = 0;
  sfx('door');
  toast('Entered: ' + it.name);
}
function exitInterior(){
  const it = INTERIORS[G.currentInterior];
  G.currentInterior = null;
  G.mode = 'explore';
  if(it && G._lastBuilding){
    player.x = G._lastBuilding.x + G._lastBuilding.gx + G._lastBuilding.w/2;
    player.y = G._lastBuilding.y + G._lastBuilding.gy + G._lastBuilding.h + 60;
  }
  sfx('door');
}
function updateInterior(dt){
  const it = INTERIORS[G.currentInterior];
  if(!it) return;
  const p = player;
  if(G.laptop || G.wardrobe || campusOpen){ /* pause movement */ }
  else {
    let ix = 0, iy = 0;
    if(keys['a']||keys['arrowleft'])  ix -= 1;
    if(keys['d']||keys['arrowright']) ix += 1;
    if(keys['w']||keys['arrowup'])    iy -= 1;
    if(keys['s']||keys['arrowdown'])  iy += 1;
    const mag = Math.hypot(ix, iy);
    if(mag > 0){ ix /= mag; iy /= mag; }
    if(ix !== 0) p.facing = ix > 0 ? 1 : -1;
    const speed = 260;
    const k = 1 - Math.exp(-16*dt);
    p.vx = lerp(p.vx, ix * speed, k);
    p.vy = lerp(p.vy, iy * speed, k);
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = clamp(p.x, 30, it.w - 30);
    p.y = clamp(p.y, 30, it.h - 30);
    p.walking = Math.hypot(p.vx, p.vy) > 30;
    p.animT += dt * (p.walking ? Math.max(1, Math.hypot(p.vx,p.vy)/220) : 2.4);
  }
  if(pressed['escape'] || (p.y >= it.h - 35 && (pressed['s'] || pressed['arrowdown']))){
    exitInterior(); return;
  }
  if(pressed['e']){
    if(it.items){
      for(const item of it.items){
        if(dist(p.x, p.y, item.x, item.y) < 70){
          if(item.kind === 'heal'){
            p.hp = p.maxHp; p.ki = p.maxKi;
            toast('Fully healed!'); spark(p.x, p.y-20, 20, ['#7dffa8','#fff'], 200, 0.6, 4); sfx('power');
          } else if(item.kind === 'bed'){
            p.hp = p.maxHp; p.ki = p.maxKi;
            G.day += 1;
            toast('🛏 Slept. Day ' + G.day); sfx('power');
            cam.flash = 0.5; cam.flashCol = '#8ad4ff';
          } else if(item.kind === 'closet'){ openWardrobe(); }
          else if(item.kind === 'laptop'){ openLaptop(); }
          else if(item.kind === 'build_ship'){
            if(G.hasShip){ toast('Ship already built!'); }
            else if(G.shipParts.engine && G.shipParts.fuel && G.shipParts.cockpit && G.shipParts.hull){
              G.hasShip = true;
              banner('🛸 SHIP BUILT! Space travel unlocked', '#7dffa8', 4);
              spark(p.x, p.y-20, 60, ['#7dffa8','#7fd4ff','#fff'], 400, 1.2, 6);
              ring(p.x, p.y, '#7dffa8', 180, 0.8);
              sfx('boom');
            } else {
              const have = ['engine','fuel','cockpit','hull'].filter(k => G.shipParts[k]).length;
              toast('Need all 4 parts (' + have + '/4)');
            }
          }
          return;
        }
      }
    }
    if(it.shop){ openShop(it.shop); return; }
    if(it.campus){ openCampus(it.campus); return; }
  }
  if(p.hurtT > 0) p.hurtT -= dt;
  if(p.invuln > 0) p.invuln -= dt;
  if(p.transformFx > 0) p.transformFx -= dt;
  for(const n of (it._npcs || [])){
    n.animT = (n.animT||0) + dt * 1.2;
    n.moving = false;
    n.facing = n.x < p.x ? 1 : -1;
  }
}

let shopOpen = null;
function openShop(type){ shopOpen = { type, hoverIdx: -1 }; sfx('door'); }
function closeShop(){ shopOpen = null; }
function updateShop(dt){
  if(!shopOpen) return;
  const items = SHOP_ITEMS[shopOpen.type];
  if(mouseClicked){
    for(let i=0;i<items.length;i++){
      const ix = VW/2 - 200, iy = VH/2 - 100 + i*70;
      if(mouseX >= ix && mouseX <= ix+400 && mouseY >= iy && mouseY <= iy+56){ buyItem(shopOpen.type, i); return; }
    }
    if(mouseX > VW/2 - 60 && mouseX < VW/2 + 60 && mouseY > VH/2 + 160 && mouseY < VH/2 + 200){ closeShop(); return; }
  }
  if(pressed['escape']){ closeShop(); return; }
}
function buyItem(shopType, idx){
  const items = SHOP_ITEMS[shopType];
  const item = items[idx];
  if(!item) return;
  const repMod = GTA.reputation > 30 ? 0.85 : (GTA.reputation < -30 ? 1.25 : 1.0);
  const cost = Math.round(item.cost * repMod);
  if(player.zeni < cost){ toast('Not enough zeni!'); sfx('hit'); return; }
  player.zeni -= cost;
  if(shopType === 'items'){
    if(item.key === 'potion') player.inventory.potion++;
    else if(item.key === 'kiPotion') player.inventory.kiPotion++;
    else if(item.key === 'senzu') player.inventory.senzu++;
  } else {
    if(item.key === 'weapon'){ player.weapon++; }
    else if(item.key === 'armor'){ player.armor++; player.maxHp += 40; player.hp += 40; }
  }
  toast('Bought: ' + item.name);
  sfx('coin');
}

function openWardrobe(){ G.wardrobe = { hover: -1 }; sfx('door'); }
function closeWardrobe(){ G.wardrobe = null; }
function updateWardrobe(dt){
  if(!G.wardrobe) return;
  if(pressed['escape']){ closeWardrobe(); return; }
  if(!mouseClicked) return;
  const cols = 2, boxW = 220, boxH = 90, gapX = 20, gapY = 16;
  const totalW = cols*boxW + (cols-1)*gapX;
  const totalH = Math.ceil(OUTFITS.length/cols)*boxH + (Math.ceil(OUTFITS.length/cols)-1)*gapY;
  const startX = VW/2 - totalW/2, startY = VH/2 - totalH/2;
  for(let i=0;i<OUTFITS.length;i++){
    const cx = i % cols, cy = Math.floor(i/cols);
    const bx = startX + cx*(boxW+gapX);
    const by = startY + cy*(boxH+gapY);
    if(mouseX >= bx && mouseX <= bx+boxW && mouseY >= by && mouseY <= by+boxH){
      player.outfit = i;
      toast('Wearing: ' + OUTFITS[i].name);
      sfx('coin');
      return;
    }
  }
}

  opts.push({ label:'Give 500z (❤ +14)', fn:()=>{ if(player.zeni>=500){ player.zeni-=500; G.relationships[name]=clamp(aff+14,0,100); toast(name+' blushes ❤'); sfx('coin'); } else toast('Not enough zeni'); } });
  if(player.inventory.senzu > 0) opts.push({ label:'Give Senzu (❤ +25)', fn:()=>{ player.inventory.senzu--; G.relationships[name]=clamp(aff+25,0,100); toast(name+' is amazed ❤'); sfx('power'); } });
  if(aff >= 80 && !G.married) opts.push({ label:'💍 Propose', fn:()=>{
    if(player.zeni>=2000){ player.zeni -= 2000; G.married = name;
      banner('💍 Married to ' + name + '!', '#ff7ad0', 4); sfx('bell');
    } else toast('Need 2000z for a ring');
  }});
  if(G.married === name && G.children.length < 3) opts.push({ label:'👶 Have a child', fn:()=>{
    const kidName = 'Child ' + (G.children.length + 1);
    G.children.push({ name: kidName, parent: name, age: 0 });
    banner('👶 ' + kidName + ' born!', '#ff7ad0', 4); sfx('bell');
  }});
  opts.push({ label:'Cancel', fn:()=>{} });
  G.dialogue = { name: name + '  (❤ ' + aff + ')', lines: [ 'What do you want to say?' ], options: opts, onPick: null };
}

function openDialogue(npc){
  const name = npc.name || 'NPC';

    name: name,
    lines: [ npc.dialogue || '...' ],
    options: [
      { label:'Nice to meet you', fn:()=>{ addReputation(1); toast(name+' smiles'); } },

    ],
  };
}
function updateDialogue(){
  if(!G.dialogue) return;
  if(pressed['escape']){ G.dialogue = null; return; }

/* ══════════════ BOSS BATTLE ══════════════ */
function startBossBattle(bossId, bx, by){
  const d = BOSS_DEFS[bossId];
  if(!d) return;
  boss = {
    def:d, id:bossId, name:d.name, cfgKey:d.ch, cfg:CH[d.ch],
    x: bx + 200, y: by, vx:0, vy:0, facing:-1, moving:false,
    hp:d.hp, maxHp:d.hp, speed:d.speed, atkList:d.atk.slice(),
    hurtT:0, animT:0, dead:false,
    state:'enter', stateT:0.8, cd:1.2,
    attack:null, attackT:0, attackData:null,
    transformed:false, barked:{}, invuln:0,
  };
  if(d.duo){
    boss.duo = { name:d.duo.name, cfg:CH[d.duo.ch], x: bx + 300, y: by + 60, vx:0, vy:0,
      hp:d.duo.hp, maxHp:d.duo.hp, facing:-1, animT:0, hurtT:0, moving:false, dead:false, attackT:0, cd:1.5 };
  }
  player.x = bx - 200; player.y = by;
  player.vx = 0; player.vy = 0;
  player.z = 0; player.flying = false;
  player.invuln = 1.2; player.dead = false;
  cam.x = player.x - VW/2; cam.y = player.y - VH/2/ISO;
  cam.flash = 0.5; cam.flashCol = '#ff6b9d';
  G.mode = 'battle';
  battleTitle = boss.name; battleIntroT = 1.6;
  bullets.length = 0; parts.length = 0;
  toast('⚔ ' + boss.name + ' approaches!');
  sfx('power');
}
let battleTitle = '', battleIntroT = 0;
function endBossBattle(won){
  if(won){
    G.defeatedBosses[boss.id] = true;
    player.zeni += 150 + Math.floor(Math.random()*100);
    toast('+' + (150) + ' zeni!');
  }
  boss = null;
  bullets.length = 0; parts.length = 0;
  G.mode = 'explore';
}
function updateBattle(dt){
  const p = player;
  if(battleIntroT > 0) battleIntroT -= dt;
  let ix = 0, iy = 0;
  if(keys['a']||keys['arrowleft'])  ix -= 1;
  if(keys['d']||keys['arrowright']) ix += 1;
  if(keys['w']||keys['arrowup'])    iy -= 1;
  if(keys['s']||keys['arrowdown'])  iy += 1;
  const mag = Math.hypot(ix, iy);
  if(mag > 0){ ix /= mag; iy /= mag; }
  if(ix !== 0) p.facing = ix > 0 ? 1 : -1;
  const charging = !!p.chargeActive;
  const speed = FORMS[p.form].spd * (charging ? 0.35 : 1);
  const k = 1 - Math.exp(-16*dt);
  p.vx = lerp(p.vx, ix * speed, k);
  p.vy = lerp(p.vy, iy * speed * 1.15, k);
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.x = clamp(p.x, 40, WORLD_W-40);
  p.y = clamp(p.y, 40, WORLD_H-40);
  p.walking = Math.hypot(p.vx, p.vy) > 30 && !charging;
  p.animT += dt * (p.walking ? Math.max(1, Math.hypot(p.vx,p.vy)/220) : 2.4);

  if(p.attackCd > 0) p.attackCd -= dt;
  if(p.attackT > 0) p.attackT -= dt;
  if(p.shootT > 0) p.shootT -= dt;
  if(p.hurtT > 0) p.hurtT -= dt;
  if(p.invuln > 0) p.invuln -= dt;
  if(p.comboWindow > 0) p.comboWindow -= dt; else p.comboStep = 0;

  if((pressed['j'] || mouseClicked) && p.attackCd <= 0 && !p.chargeActive){
    p.attackT = 0.18; p.attackCd = 0.24;
    p.comboStep = (p.comboStep % 3) + 1; p.comboWindow = 0.6;
    const dmg = [0,18,22,30][p.comboStep] * FORMS[p.form].dmg * powerMul();
    let hitAny = false;
    if(boss && !boss.dead && boss.invuln <= 0){
      const dx = boss.x - p.x, dy = boss.y - p.y;
      if(Math.abs(dx) < 70 && Math.abs(dy) < 55 && sgn(dx) === p.facing){ damageBoss(dmg, p.x); hitAny = true; }
      if(boss.duo && !boss.duo.dead){
        const dx2 = boss.duo.x - p.x, dy2 = boss.duo.y - p.y;
        if(Math.abs(dx2) < 70 && Math.abs(dy2) < 55 && sgn(dx2) === p.facing){ damageDuo(dmg, p.x); hitAny = true; }
      }
    }
    spark(p.x + p.facing*44, p.y-20, 5, ['#fff','#7fd4ff'], 160, 0.22, 3);
    sfx(hitAny?'hit':'shoot');
    if(hitAny){ cam.shake = 5; G.hitStop = 0.04; }
  }

  updateKamehameha(dt);

  if(pressed['e'] && p.transformFx <= 0) transformStep(p);
  if(p.transformFx > 0) p.transformFx -= dt;
  if(p.dashCd > 0) p.dashCd -= dt;

  p.ki = Math.min(p.maxKi, p.ki + FORMS[p.form].kiGain * dt);
  p.maxKi += 0.7 * dt;

  if(boss) updateBoss(dt);

  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt; b.t += dt;
    if(b.life <= 0 || !FIN(b.x)){ bullets.splice(i,1); continue; }
    if(b.fromPlayer){
      if(boss && !boss.dead && Math.abs(b.x-boss.x) < 40 && Math.abs(b.y-boss.y) < 50){
        damageBoss(b.dmg, b.x);
        if(b.isKame) damageBoss(b.dmg*0.7, b.x);
        spark(b.x, b.y, 6, ['#fff',b.c], 200, 0.3, 3);
        if(!b.isKame) bullets.splice(i,1);
        continue;
      }
      if(boss && boss.duo && !boss.duo.dead && Math.abs(b.x-boss.duo.x) < 40 && Math.abs(b.y-boss.duo.y) < 50){
        damageDuo(b.dmg, b.x);
        if(!b.isKame) bullets.splice(i,1);
      }
    } else {
      if(!p.dead && p.invuln <= 0 && Math.abs(b.x-p.x) < 30 && Math.abs(b.y-p.y) < 40 && !G.godMode){
        damagePlayer(b.dmg, b.x); bullets.splice(i,1); continue;
      }
    }
  }

  cam.x = lerp(cam.x, p.x - VW*0.42, 1 - Math.exp(-4*dt));
  cam.y = lerp(cam.y, p.y - (VH/ISO)*0.5, 1 - Math.exp(-4*dt));
  cam.x = clamp(cam.x, 0, WORLD_W - VW);
  cam.y = clamp(cam.y, 0, WORLD_H - VH/ISO);
  if(G.godMode && p.hp < p.maxHp) p.hp = p.maxHp;
}
function damageBoss(d, fromX){
  if(!boss || boss.dead || boss.invuln > 0) return;
  boss.hp -= d; player.power += d * 0.8;
  boss.hurtT = 0.18;
  dmgText(boss.x, boss.y-60, Math.round(d), '#ffe066');
  boss.vx += (sgn(boss.x - fromX)||1) * 100;
  spark(boss.x, boss.y-20, 8, ['#fff','#ffd166'], 220, 0.3, 4);
  if(boss.hp <= 0){ boss.hp = 0; killBoss(); }
}
function damageDuo(d, fromX){
  if(!boss || !boss.duo || boss.duo.dead) return;
  boss.duo.hp -= d; player.power += d * 0.6;
  boss.duo.hurtT = 0.18;
  dmgText(boss.duo.x, boss.duo.y-60, Math.round(d), '#ffe066');
  spark(boss.duo.x, boss.duo.y-20, 8, ['#fff','#ffd166'], 220, 0.3, 4);
  if(boss.duo.hp <= 0){
    boss.duo.dead = true;
    spark(boss.duo.x, boss.duo.y, 40, ['#ff9be0','#fff'], 400, 0.9, 6);
    ring(boss.duo.x, boss.duo.y, '#ff9be0', 100); sfx('boom');
  }
}
function damagePlayer(amount, fromX){
  const p = player;
  if(p.invuln > 0 || p.dead || G.godMode) return;
  p.hp -= amount;
  p.hurtT = 0.35; p.invuln = 0.8;
  p.vx = (sgn(p.x - fromX)||1) * 300;
  cam.shake = 10; cam.flash = 0.3; cam.flashCol = '#ff3b6b';
  spark(p.x, p.y-20, 12, ['#ff4d7a','#fff'], 240, 0.5, 4);
  dmgText(p.x, p.y-70, Math.round(amount), '#ff6b8a');
  sfx('hit');
  if(p.hp <= 0 && !p.dead){
    p.dead = true;
    spark(p.x, p.y-20, 40, ['#ff6b9d','#fff'], 340, 1.0, 5);
    cam.shake = 18;
    setTimeout(()=>{ G.mode = 'lose'; }, 1200);
  }
}
function killBoss(){
  const b = boss;
  if(!b) return;
  b.dead = true; b.state = 'dying'; b.stateT = 1.8;
  cam.shake = 28; cam.flash = 1.0; cam.flashCol = '#ffffff';
  player.power += 900; player.maxKi += 40; player.ki = player.maxKi;
  toast('⚡ POWER ' + Math.round(player.power) + '!');
  spark(b.x, b.y, 80, ['#ffe066','#fff','#ff8a3d','#ff4d7a'], 520, 1.4, 7);
  ring(b.x, b.y, '#ffffff', 220, 0.7); sfx('boom');
}
function updateBoss(dt){
  const b = boss;
  if(!b || b.dead){
    if(b && b.state === 'dying'){
      b.stateT -= dt;
      if(Math.random()<0.5)
        parts.push({x:b.x+rand(-30,30), y:b.y+rand(-10,10), vx:rand(-80,80), vy:rand(-80,80),
          life:rand(0.3,0.7), max:0.7, size:rand(3,6), c:['#ffe066','#fff','#ff8a3d'][(Math.random()*3)|0]});
      if(b.stateT <= 0) endBossBattle(true);
    }
    return;
  }
  b.animT += dt;
  if(b.hurtT > 0) b.hurtT -= dt;
  if(b.invuln > 0) b.invuln -= dt;
  b.x += b.vx*dt; b.y += b.vy*dt;
  b.vx *= 0.9; b.vy *= 0.9;
  b.x = clamp(b.x, 40, WORLD_W-40); b.y = clamp(b.y, 40, WORLD_H-40);
  b.moving = Math.hypot(b.vx, b.vy) > 40;
  const p = player;
  const dx = p.x - b.x, dy = p.y - b.y;
  const dist_ = Math.hypot(dx, dy);
  b.facing = dx > 0 ? 1 : -1;
  const pct = b.hp / b.maxHp;
  const list = b.transformed && b.def.monsterBarks ? b.def.monsterBarks : (b.def.barks || []);
  const prefix = b.transformed ? 'm_' : 'n_';
  for(const entry of list){
    const key = prefix + entry[0].toFixed(2);
    if(!b.barked[key] && pct <= entry[0]){ b.barked[key] = true; toast(b.name + ': "' + entry[1] + '"'); break; }
  }
  if(b.def.transformAt && !b.transformed && pct <= b.def.transformAt){
    b.transformed = true; b.state = 'transform'; b.stateT = 1.6; b.invuln = 1.6;
    cam.shake = 22; cam.flash = 1.0; cam.flashCol = '#ffe066';
    sfx('power'); toast(b.name + ': "' + b.def.transformBark + '"');
    return;
  }
  if(b.state === 'enter'){ b.stateT -= dt; b.vx = -60; if(b.stateT <= 0){ b.state = 'idle'; b.cd = 0.6; } return; }
  if(b.state === 'transform'){
    b.stateT -= dt; b.vx = 0; b.vy = 0;
    if(Math.random() < 0.9)
      parts.push({x:b.x+rand(-26,26), y:b.y+rand(-10,10), vx:rand(-40,40), vy:rand(-160,-60), life:rand(0.3,0.7), max:0.7, size:rand(2,6), c:'#ffe066'});
    if(b.stateT <= 0){
      if(b.def.transformTo){ b.cfgKey = b.def.transformTo; b.cfg = CH[b.def.transformTo]; }
      if(b.def.monsterHp) b.maxHp = Math.round(b.maxHp * b.def.monsterHp);
      if(b.def.monsterSpeed) b.speed = b.def.monsterSpeed;
      if(b.def.monsterAtk) b.atkList = b.def.monsterAtk.slice();
      b.state = 'idle'; b.cd = 0.8;
      ring(b.x, b.y, '#ffe066', 150); spark(b.x, b.y, 60, ['#ffe066','#fff','#ffb84d'], 440, 1.0, 6);
      cam.shake = 26; sfx('boom');
    }
    return;
  }
  if(b.state === 'recover'){ b.stateT -= dt; b.vx *= 0.9; b.vy *= 0.9; if(b.stateT <= 0){ b.state = 'idle'; b.cd = rand(0.5, 0.9); } return; }
  if(b.state === 'attack'){
    b.attackT -= dt;
    const A = b.attack;
    const dir = Math.atan2(dy, dx);
    if(A === 'dash'){
      if(dist_ < 70 && p.invuln <= 0){ damagePlayer(b.transformed ? 22 : 14, b.x); b.vx *= -0.5; b.vy *= -0.5; }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.35; }
    } else if(A === 'blast' || A === 'barrage'){
      const shots = A === 'barrage' ? 6 : 2;
      b.attackData.timer -= dt;
      if(b.attackData.count < shots && b.attackData.timer <= 0){
        b.attackData.count++;
        b.attackData.timer = A === 'barrage' ? 0.11 : 0.18;
        const d2 = dir + rand(-0.15, 0.15);
        bullets.push({ x:b.x + b.facing*24, y:b.y, vx:Math.cos(d2)*420, vy:Math.sin(d2)*280, r:7, dmg:12, life:2.5, c:'#ff7ad9', fromPlayer:false, t:0 });
        sfx('shoot');
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.35; }
    } else if(A === 'charge' || A === 'rush' || A === 'kick'){
      if(!b.attackData.fired && b.attackT < 0.6){ b.attackData.fired = true; const m = Math.hypot(dx, dy) || 1; b.vx = dx/m * 640; b.vy = dy/m * 400; }
      if(dist_ < 65 && p.invuln <= 0){ damagePlayer(b.transformed ? 22 : 16, b.x); b.vx *= -0.4; b.vy *= -0.4; }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.45; }
    } else if(A === 'deathbeam' || A === 'nova'){
      if(!b.attackData.fired && b.attackT < 0.35){
        b.attackData.fired = true;
        bullets.push({ x:b.x + b.facing*24, y:b.y, vx:Math.cos(dir)*950, vy:Math.sin(dir)*550, r:10, dmg:18, life:1.6, c:'#ff2a6a', fromPlayer:false, t:0 });
        cam.shake = 6; spark(b.x + b.facing*28, b.y, 8, ['#ff2a6a','#fff'], 220, 0.3, 4); sfx('shoot');
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.3; }
    } else if(A === 'timestop'){
      if(!b.attackData.fired && b.attackT < 0.5){
        b.attackData.fired = true; G.hitStop = 0.5; cam.flash = 0.5; cam.flashCol = '#a0ff80';
        toast('GULDO: "TIME... STOP!"');
        ring(b.x, b.y, '#a0ff80', 180, 0.6); sfx('power');
        const self = b;
        setTimeout(()=>{ if(!boss || boss !== self || player.dead) return; damagePlayer(16, b.x); toast('GULDO: "HA!"'); }, 420);
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.7; }
    } else if(A === 'pose'){
      if(!b.attackData.fired && b.attackT < 0.9){
        b.attackData.fired = true; toast('GINYU: "TOKUSENTAI!"');
        const self = b;
        for(let i=0;i<5;i++){
          setTimeout(()=>{
            if(!boss || boss !== self) return;
            const d2 = Math.atan2(player.y-boss.y, player.x-boss.x) + rand(-0.3,0.3);
            bullets.push({ x:boss.x, y:boss.y, vx:Math.cos(d2)*440, vy:Math.sin(d2)*300, r:8, dmg:11, life:2.5, c:'#c07bff', fromPlayer:false, t:0 });
          }, i*110);
        }
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.55; }
    }
    return;
  }
  if(b.state === 'idle'){
    b.cd -= dt;
    if(dist_ > 180){
      const m = Math.hypot(dx, dy) || 1;
      b.vx += (dx/m) * b.speed * 2.2 * dt; b.vy += (dy/m) * b.speed * 1.6 * dt;
      b.vx = clamp(b.vx, -b.speed*1.6, b.speed*1.6);
      b.vy = clamp(b.vy, -b.speed*1.2, b.speed*1.2);
    } else { b.vx *= 0.92; b.vy *= 0.92; }
    if(b.cd <= 0){
      const pool = b.atkList;
      const A = pool[(Math.random()*pool.length)|0];
      b.attack = A;
      b.attackData = { fired:false, count:0, timer:0 };
      const DUR = {dash:0.5, blast:0.5, barrage:1.3, charge:0.75, rush:0.9, kick:0.85, deathbeam:0.5, nova:0.6, timestop:0.9, pose:1.3}[A] || 0.6;
      b.attackT = DUR; b.state = 'attack';
      if(A === 'dash'){ const m = Math.hypot(dx, dy) || 1; b.vx = dx/m * 560; b.vy = dy/m * 340; }
    }
  }
}

/* ══════════════ RENDER ══════════════ */
function renderExplore(){
  const curR = regionAt(player.x, player.y);
  const ground = curR ? curR.g : 'namek';
  const sky = ctx.createLinearGradient(0, 0, 0, VH);
  if(ground === 'space'){ sky.addColorStop(0, '#02030a'); sky.addColorStop(0.6, '#0a0a20'); sky.addColorStop(1, '#141034'); }
  else if(ground === 'island'){ sky.addColorStop(0, '#0a6ad8'); sky.addColorStop(0.5, '#5ab8ff'); sky.addColorStop(1, '#bfe8ff'); }
  else { sky.addColorStop(0, '#0a3a2a'); sky.addColorStop(0.4, '#1d6b52'); sky.addColorStop(0.7, '#4ea863'); sky.addColorStop(1, '#8fd07a'); }
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VW, VH);
  if(ground === 'space'){
    for(let i=0;i<140;i++){
      const x = (i * 137.5 + G.t*3) % VW;
      const y = (i * 211.3) % (VH-80);
      const tw = 0.35 + 0.65*Math.abs(Math.sin(G.t*2 + i));
      ctx.fillStyle = 'rgba(200,225,255,'+tw+')';
      ctx.beginPath(); ctx.arc(x, y, (i%3)*0.4+0.7, 0, TAU); ctx.fill();
    }
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const s1 = ctx.createRadialGradient(760, 80, 10, 760, 80, 160);
  s1.addColorStop(0, 'rgba(255,255,210,0.75)'); s1.addColorStop(1, 'rgba(255,255,180,0)');
  ctx.fillStyle = s1; ctx.fillRect(560, -80, 420, 360);
  ctx.restore();

  drawGround();

  // Ship parts on ground
  for(const sp of SHIP_PARTS){
    if(G.shipParts[sp.key]) continue;
    const px = sx(sp.x), py = sy(sp.y);
    if(px < -80 || px > VW+80) continue;
    const pulse = 0.6 + 0.4*Math.sin(G.t*3);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(px, py-20, 4, px, py-20, 50);
    rg.addColorStop(0, sp.col + 'cc');
    rg.addColorStop(0.5, sp.col + '44');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(px, py-20, 50, 0, TAU); ctx.fill();
    ctx.restore();
    // icon
    ctx.font = '900 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = sp.col;
    ctx.fillText(sp.name.charAt(0), px, py-18);
    // label
    ctx.font = '700 11px system-ui, sans-serif';
    const tw = ctx.measureText(sp.name).width;
    ctx.fillStyle = 'rgba(4,10,14,0.8)';
    rr(ctx, px-tw/2-8, py-56, tw+16, 20, 6); ctx.fill();
    ctx.fillStyle = sp.col;
    ctx.fillText(sp.name, px, py-42);
  }

  // Mission markers
  for(const mk of GTA.missionMarkers){
    if(mk.taken) continue;
    if(GTA.completedMissions[mk.def.id]) continue;
    const gx = sx(mk.x), gy = sy(mk.y);
    if(gx < -100 || gx > VW+100) continue;
    const pulse = 0.6 + 0.4*Math.sin(G.t*3 + mk.pulse);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(gx, gy, 4, gx, gy, 70);
    rg.addColorStop(0, 'rgba(255,224,102,'+(0.6*pulse)+')');
    rg.addColorStop(0.5, 'rgba(255,180,60,'+(0.25*pulse)+')');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(gx, gy, 70, 70*ISO, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,224,102,'+(0.85*pulse)+')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(gx, gy, 45, 45*ISO, 0, 0, TAU); ctx.stroke();
    ctx.restore();
    ctx.font = '900 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3a2a00';
    ctx.fillText('!', gx, gy - 24);
    ctx.fillStyle = '#ffd166';
    ctx.fillText('!', gx, gy - 25);
  }

  const list = [];
  for(const b of ALL_BUILDINGS) list.push({ y: b.y + b.gy + b.h, draw: () => drawBuilding(b) });

  for(const n of npcList){
    if(sx(n.x) < -100 || sx(n.x) > VW+100) continue;
    if(sy(n.y) < -100 || sy(n.y) > VH+100) continue;
    list.push({ y: n.y, draw: () => {
      const isSpouse = G.married && n.name === G.married;
      drawFighter(ctx, CH[n.ch] || CH.villager1, {
        sx: sx(n.x), sy: sy(n.y), facing: n.facing, animT: n.animT,
        moving: n.moving, hurtT: 0, attackT: 0, z: 0, scale: 1
      }, {});
      if(isSpouse){
        ctx.save();
        ctx.font = '800 14px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff7ad0';
        ctx.fillText('❤', sx(n.x), sy(n.y) - 88);
        ctx.restore();
      }
    }});
  }
  for(const pd of GTA.peds){
    if(sx(pd.x) < -100 || sx(pd.x) > VW+100) continue;
    list.push({ y: pd.y, draw: () => {
      drawFighter(ctx, CH[pd.ch] || CH.villager1, {
        sx: sx(pd.x), sy: sy(pd.y), facing: pd.facing, animT: pd.animT,
        moving: pd.moving, hurtT: 0, attackT: 0, z: 0, scale: 1
      }, {});
    }});
  }
  for(const region of REGIONS){
    if(!region.enemies) continue;
    for(const en of region.enemies){
      if(en.dead) continue;
      if(sx(en.x) < -100 || sx(en.x) > VW+100) continue;
      list.push({ y: en.y, draw: () => {
        drawFighter(ctx, CH[en.ch] || CH.soldier, {
          sx: sx(en.x), sy: sy(en.y), facing: en.x < player.x ? 1 : -1, animT: G.t*1.5,
          moving: true, hurtT: 0, attackT: 0, z: 0, scale: 1
        }, {});
      }});
    }
  }
  if(GTA.activeMission && GTA.activeMission.spawned){
    for(const en of GTA.activeMission.spawned){
      if(en.hp <= 0) continue;
      if(sx(en.x) < -140 || sx(en.x) > VW+140) continue;
      list.push({ y: en.y, draw: () => {
        drawFighter(ctx, CH[en.ch] || CH.soldier, {
          sx: sx(en.x), sy: sy(en.y), facing: en.facing, animT: en.animT,
          moving: en.moving, hurtT: en.hurtT, attackT: en.attackT, z: 0, scale: 1
        }, {});
        ctx.fillStyle = 'rgba(255,60,80,0.85)';
        ctx.beginPath(); ctx.arc(sx(en.x), sy(en.y) - 78, 4, 0, TAU); ctx.fill();
      }});
    }
  }
  for(const region of REGIONS){
    if(!region.bossAt) continue;
    if(G.defeatedBosses[region.bossAt.boss]) continue;
    if(boss) continue;
    const bd = region.bossAt;
    if(sx(bd.x) < -150 || sx(bd.x) > VW+150) continue;
    list.push({ y: bd.y, draw: () => {
      const def = BOSS_DEFS[bd.boss];
      if(!def) return;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const ac = def.transformAt ? '#ff7ad9' : '#ff2a6a';
      const gg = ctx.createRadialGradient(sx(bd.x), sy(bd.y)-30, 4, sx(bd.x), sy(bd.y)-30, 70);
      gg.addColorStop(0, ac + '55'); gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(sx(bd.x), sy(bd.y)-30, 70, 0, TAU); ctx.fill();
      ctx.restore();
      drawFighter(ctx, CH[def.ch], {
        sx: sx(bd.x), sy: sy(bd.y),
        facing: bd.x < player.x ? 1 : -1, animT: G.t*1.2,
        moving: false, hurtT: 0, attackT: 0, z: 0, scale: 1
      }, { auraOn: true, auraR: 44 });
    }});
  }
  if(boss){
    if(sx(boss.x) > -180 && sx(boss.x) < VW+180){
      list.push({ y: boss.y, draw: () => {
        const bcfg = boss.cfg || CH[boss.def.ch];
        if(!bcfg) return;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const ac = boss.transformed ? '#ffe066' : '#ff2a6a';
        const gr = boss.transformed ? 92 : 72;
        const gg = ctx.createRadialGradient(sx(boss.x), sy(boss.y)-30, 4, sx(boss.x), sy(boss.y)-30, gr);
        gg.addColorStop(0, ac + '66'); gg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(sx(boss.x), sy(boss.y)-30, gr, 0, TAU); ctx.fill();
        ctx.restore();
        if(boss.state === 'dying') ctx.globalAlpha = 0.2 + 0.8*clamp((boss.stateT||0)/1.8, 0, 1);
        drawFighter(ctx, bcfg, {
          sx: sx(boss.x), sy: sy(boss.y), facing: boss.facing, animT: boss.animT,
          moving: boss.moving, hurtT: boss.hurtT, attackT: boss.attackT || 0, z: 0, scale: 1
        }, { auraOn: true, auraR: boss.transformed ? 62 : 52 });
        ctx.globalAlpha = 1;
      }});
    }
  }
  for(const pr of GTA.protectors){
    if(pr.dead) continue;
    if(sx(pr.x) < -140 || sx(pr.x) > VW+140) continue;
    list.push({ y: pr.y, draw: () => {
      const tier = PROTECTOR_TIERS[pr.tier];
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(sx(pr.x), sy(pr.y)-30, 4, sx(pr.x), sy(pr.y)-30, 60);
      gg.addColorStop(0, (tier.blip || '#5fa8ff') + '55'); gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(sx(pr.x), sy(pr.y)-30, 60, 0, TAU); ctx.fill();
      ctx.restore();
      drawFighter(ctx, pr.cfg, {
        sx: sx(pr.x), sy: sy(pr.y), facing: pr.facing, animT: pr.animT,
        moving: pr.moving, hurtT: pr.hurtT, attackT: pr.attackT, z: 0, scale: 1
      }, { auraOn: true, auraR: 38 });
      ctx.save();
      ctx.font = '900 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = tier.blip || '#5fa8ff';
      ctx.fillText('★'.repeat(pr.tier), sx(pr.x), sy(pr.y) - 82);
      ctx.restore();
    }});
  }

  const F = FORMS[player.form];
  const outfitCfg = (OUTFITS[player.outfit] && OUTFITS[player.outfit].cfg) || F.cfg;
  const pcfg = CH[outfitCfg] || CH[F.cfg];
  const blink = player.invuln > 0 && player.hurtT <= 0 && Math.floor(player.invuln*22)%2 === 0;
  list.push({ y: player.y, draw: () => {
    if(blink) ctx.globalAlpha = 0.45;
    // God mode indicator
    if(G.godMode){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(sx(player.x), sy(player.y)-30, 4, sx(player.x), sy(player.y)-30, 90);
      gg.addColorStop(0, 'rgba(255,224,102,0.6)');
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(sx(player.x), sy(player.y)-30, 90, 0, TAU); ctx.fill();
      ctx.restore();
    }
    drawFighter(ctx, pcfg, {
      sx: sx(player.x), sy: sy(player.y),
      facing: player.facing, animT: player.animT,
      moving: player.walking, hurtT: player.hurtT, flying: player.flying,
      attackT: player.attackT, z: player.z, scale: 1
    }, { auraOn: true, auraR: FORMS[player.form].aura + Math.min(34, player.power/500) + (player.flying ? 16 : 0) });
    ctx.globalAlpha = 1;
  }});

  list.sort((a, b) => a.y - b.y);
  for(const item of list) item.draw();

  // Name tags
  for(const n of npcList){
    if(!n.name) continue;
    const dd = dist(player.x, player.y, n.x, n.y);
    if(dd > 150) continue;
    const bx2 = sx(n.x), by2 = sy(n.y) - 96;
    if(!FIN(bx2) || !FIN(by2)) continue;
    ctx.save();
    ctx.font = '700 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    const tw2 = ctx.measureText(n.name).width;
    ctx.fillStyle = 'rgba(4,10,14,0.85)';
    rr(ctx, bx2-tw2/2-10, by2-15, tw2+20, 22, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(127,233,255,'+(dd<110?0.9:0.4)+')';
    ctx.lineWidth = 1.5;
    rr(ctx, bx2-tw2/2-10, by2-15, tw2+20, 22, 7); ctx.stroke();
    ctx.fillStyle = '#7fe9ff';
    ctx.fillText(n.name, bx2, by2);
    if(dd < 110){
      ctx.font = '600 10px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,224,102,0.9)';
      ctx.fillText('[T] talk · [R] romance', bx2, by2-22);
    }
    ctx.restore();
  }

  // Bullets
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for(const b of bullets){
    if(!FIN(b.x)||!FIN(b.y)) continue;
    const x = sx(b.x), y = sy(b.y) - 20;
    if(!FIN(x)||!FIN(y)) continue;
    if(b.isKame){
      const len = 200 + b.chargeScale * 200;
      const dirSign = b.vx > 0 ? 1 : -1;
      const grad = ctx.createLinearGradient(x, y, x + dirSign*len, y);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.2, b.c);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(x + dirSign*len/2, y, len/2, b.r, 0, 0, TAU);
      ctx.fill();
      continue;
    }
    const rg = ctx.createRadialGradient(x, y, 1, x, y, b.r*3);
    rg.addColorStop(0, '#fff'); rg.addColorStop(0.35, b.c); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, b.r*3, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // Particles
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for(const p of parts){
    if(!FIN(p.x)||!FIN(p.y)||!FIN(p.size)) continue;
    const a = clamp(p.life/p.max, 0, 1);
    const x = sx(p.x), y = sy(p.y) - 18 - (p.gz || 0);
    if(!FIN(x)||!FIN(y)) continue;
    if(p.ring){
      const t = 1-a;
      const rx = p.size*t, ry = p.size*t*ISO;
      if(!FIN(rx)||!FIN(ry)) continue;
      ctx.strokeStyle = p.c;
      ctx.globalAlpha = a*0.7;
      ctx.lineWidth = 3*a+1;
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.stroke();
      continue;
    }
    ctx.globalAlpha = a;
    const rr2 = p.size*2;
    if(!FIN(rr2)) continue;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, rr2);
    rg.addColorStop(0, p.c); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, rr2, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();

  // Floats
  for(const f of floats){
    const a = clamp(f.life/f.max, 0, 1);
    if(!FIN(a)||!FIN(f.x)||!FIN(f.y)) continue;
    const x = sx(f.x), y = sy(f.y) - (f.isToast ? 80 : 0);
    if(!FIN(x)||!FIN(y)) continue;
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    if(f.isToast){
      ctx.font = '700 14px system-ui, sans-serif';
      const w = ctx.measureText(f.v).width + 24;
      ctx.fillStyle = 'rgba(4,10,14,0.85)';
      rr(ctx, x-w/2, y-12, w, 26, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(255,209,102,0.6)'; ctx.lineWidth = 1.5;
      rr(ctx, x-w/2, y-12, w, 26, 8); ctx.stroke();
      ctx.fillStyle = f.c;
      ctx.fillText(f.v, x, y+6);
    } else {
      ctx.font = '800 20px system-ui, sans-serif';
      ctx.fillStyle = f.c;
      ctx.shadowColor = f.c; ctx.shadowBlur = 10;
      ctx.fillText(f.v, x, y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
}
