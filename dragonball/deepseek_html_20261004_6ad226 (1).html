function drawInterior(){
  const it = INTERIORS[G.currentInterior];
  if(!it) return;
  ctx.fillStyle = it.bg; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, VW, 100);
  ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(0, 100, VW, 2);
  const roomX = VW/2 - it.w/2;
  const roomY = VH/2 - it.h/2 + 40;
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.fillRect(roomX, roomY, it.w, it.h);
  ctx.strokeRect(roomX, roomY, it.w, it.h);
  ctx.textAlign = 'center';
  ctx.font = '800 20px system-ui, sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.fillText(it.name, VW/2, 50);

  if(it.items){
    for(const item of it.items){
      const ix = roomX + item.x;
      const iy = roomY + item.y;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(ix, iy, 4, ix, iy, 50);
      gg.addColorStop(0, 'rgba(125,255,168,0.55)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(ix, iy, 50, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#7dffa8';
      ctx.beginPath(); ctx.arc(ix, iy, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#08301e';
      ctx.fillRect(ix-6, iy-2, 12, 4);
      ctx.fillRect(ix-2, iy-6, 4, 12);
      ctx.font = '700 12px system-ui, sans-serif';
      ctx.fillStyle = '#7dffa8';
      ctx.fillText(item.label, ix, iy + 30);
    }
  }
  if(it.shop){
    const sx0 = roomX + it.w/2, sy0 = roomY + 100;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(sx0, sy0, 4, sx0, sy0, 80);
    gg.addColorStop(0, 'rgba(255,209,102,0.5)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(sx0, sy0, 80, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.font = '900 18px system-ui, sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('🛒 SHOP', sx0, sy0 + 8);
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Walk here and press E', sx0, sy0 + 30);
  }
  for(const n of (it._npcs || [])){
    drawFighter(ctx, CH[n.ch] || CH.villager1, {
      sx: roomX + n.x, sy: roomY + n.y,
      facing: n.facing || -1, animT: n.animT || G.t,
      moving: false, hurtT: 0, attackT: 0, z: 0, scale: 1
    }, {});
    ctx.save();
    ctx.font = '600 11px system-ui, sans-serif';
    const tw = ctx.measureText(n.dialogue).width;
    const bx = roomX + n.x - tw/2 - 8;
    const by = roomY + n.y - 100;
    ctx.fillStyle = 'rgba(4,10,14,0.9)';
    rr(ctx, bx, by, tw+16, 26, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(127,233,255,0.6)'; ctx.lineWidth = 1.5;
    rr(ctx, bx, by, tw+16, 26, 8); ctx.stroke();
    ctx.fillStyle = '#eaf4ff';
    ctx.textAlign = 'center';
    ctx.fillText(n.dialogue, roomX + n.x, by + 17);
    ctx.restore();
  }
  const F = FORMS[player.form];
  const outfitCfg = (OUTFITS[player.outfit] && OUTFITS[player.outfit].cfg) || F.cfg;
  const pcfg = CH[outfitCfg] || CH[F.cfg];
  drawFighter(ctx, pcfg, {
    sx: roomX + player.x, sy: roomY + player.y,
    facing: player.facing, animT: player.animT,
    moving: player.walking, hurtT: player.hurtT,
    attackT: player.attackT, z: 0, scale: 1
  }, { auraOn: true, auraR: FORMS[player.form].aura });

  ctx.font = '700 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(160,255,220,'+(0.5+Math.sin(G.t*5)*0.4)+')';
  ctx.fillText('Walk to bottom + press S, or press ESC to exit', VW/2, VH - 20);

  if(campusOpen) drawCampus();
  if(G.laptop) drawLaptop();
  if(G.wardrobe) drawWardrobe();
}
function drawCampus(){
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, VW, VH);
  const c = G.career;
  ctx.textAlign = 'center';
  ctx.font = '900 26px system-ui, sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 16;
  const titles = { highschool:'High School Enrollment', university:'University — Choose Path', courthouse:'Courthouse — Bar Exam' };
  ctx.fillText(titles[campusOpen.type] || 'Campus', VW/2, 120);
  ctx.shadowBlur = 0;
  ctx.font = '700 15px system-ui, sans-serif';
  ctx.fillStyle = '#eaf4ff';
  if(campusOpen.type === 'highschool'){
    if(!c.education.highschool){
      ctx.fillText('Enroll & complete high school (14 days).', VW/2, VH/2 - 30);
      ctx.fillStyle = '#7dffa8';
      ctx.fillText('[ CLICK HERE TO ENROLL ]', VW/2, VH/2 + 15);
    } else { ctx.fillStyle = '#7dffa8'; ctx.fillText('✔ High school completed!', VW/2, VH/2); }
  } else if(campusOpen.type === 'university'){
    if(!c.education.university && c.education.highschool){
      ctx.fillText('Choose your path:', VW/2, VH/2 - 60);
      ctx.fillStyle = '#7fe9ff';
      ctx.fillText('[ ⚖ LAW (500z) ]', VW/2 - 200, VH/2 + 15);
      ctx.fillStyle = '#ffd166';
      ctx.fillText('[ 🎓 TEACHING (800z) ]', VW/2 + 200, VH/2 + 15);
    } else if(!c.education.highschool){
      ctx.fillStyle = '#ff9bb0';
      ctx.fillText('You need a high school diploma first.', VW/2, VH/2);
    } else { ctx.fillStyle = '#7dffa8'; ctx.fillText('✔ University completed — Path: ' + c.path, VW/2, VH/2); }
  } else if(campusOpen.type === 'courthouse'){
    if(c.path !== 'law'){ ctx.fillStyle = '#ff9bb0'; ctx.fillText('Law path required.', VW/2, VH/2); }
    else if(c.jobs.judge){ ctx.fillStyle = '#7dffa8'; ctx.fillText('👑 You are already a Judge.', VW/2, VH/2); }
    else if(c.jobs.lawyer){ ctx.fillStyle = '#ffd166'; ctx.fillText('[ CLICK TO BECOME JUDGE ]', VW/2, VH/2 + 15); }
    else if(c.education.lawSchool){ ctx.fillStyle = '#ffd166'; ctx.fillText('[ CLICK TO TAKE THE BAR & BECOME LAWYER ]', VW/2, VH/2 + 15); }
    else { ctx.fillStyle = '#ff9bb0'; ctx.fillText('Complete law school first.', VW/2, VH/2); }
  }
  ctx.font = '700 12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  let y0 = VH - 160;
  ctx.fillText('DAY ' + G.day, 60, y0); y0 += 20;
  ctx.fillText('High School: ' + (c.education.highschool ? '✔' : '—'), 60, y0); y0 += 18;
  ctx.fillText('University: ' + (c.education.university ? '✔' : '—'), 60, y0); y0 += 18;
  ctx.fillText('Path: ' + (c.path || '—'), 60, y0); y0 += 18;
  ctx.fillText('Lawyer: ' + (c.jobs.lawyer ? '✔' : '—'), 60, y0); y0 += 18;
  ctx.fillText('Judge: ' + (c.jobs.judge ? '✔' : '—'), 60, y0); y0 += 18;
  ctx.fillText('Teacher: ' + (c.jobs.teacher ? '✔' : '—'), 60, y0); y0 += 18;
  ctx.fillText('Principal: ' + (c.jobs.principal ? '✔' : '—'), 60, y0);
  ctx.textAlign = 'center';
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('ESC to close', VW/2, VH - 30);
}
function drawLaptop(){
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, VW, VH);
  const L = G.laptop;
  const c = G.career;
  ctx.fillStyle = '#111';
  rr(ctx, 40, 90, VW-80, VH-180, 14); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
  rr(ctx, 40, 90, VW-80, VH-180, 14); ctx.stroke();
  ctx.fillStyle = '#0a0f14';
  rr(ctx, 60, 110, VW-120, VH-220, 8); ctx.fill();
  const tabs = [ ['home','🏠 Home'], ['study','📚 Study'], ['teach','🍎 Teach'], ['code','💻 Code'] ];
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  for(let i=0;i<tabs.length;i++){
    const bx = 60 + i*180;
    const by = 120;
    const active = L.tab === tabs[i][0];
    ctx.fillStyle = active ? 'rgba(127,233,255,0.2)' : 'rgba(255,255,255,0.05)';
    rr(ctx, bx, by, 160, 40, 8); ctx.fill();
    ctx.strokeStyle = active ? '#7fe9ff' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5;
    rr(ctx, bx, by, 160, 40, 8); ctx.stroke();
    ctx.fillStyle = active ? '#7fe9ff' : 'rgba(255,255,255,0.8)';
    ctx.fillText(tabs[i][1], bx + 80, by + 25);
  }
  ctx.textAlign = 'left';
  ctx.font = '700 16px system-ui, sans-serif';
  ctx.fillStyle = '#eaf4ff';
  if(L.tab === 'home'){
    ctx.fillText('Welcome back, Bulma.', 100, 220);
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Day ' + G.day + '  ·  Zeni: ' + player.zeni, 100, 250);
    ctx.fillText('Career: ' + (c.path || 'undecided'), 100, 274);
    ctx.fillText('Role: ' + (c.jobs.judge ? 'Judge' : c.jobs.lawyer ? 'Lawyer' : c.jobs.principal ? 'Principal' : c.jobs.teacher ? 'Teacher' : '—'), 100, 298);
    ctx.fillText('Children: ' + (G.children.length || 'none'), 100, 322);
    ctx.fillText('Married to: ' + (G.married || '—'), 100, 346);
  }
  if(L.tab === 'study'){
    ctx.fillText('Online Class — High School', 100, 220);
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Complete high school from home.', 100, 250);
    if(!c.education.highschool){ ctx.fillStyle = '#7dffa8'; ctx.font = '800 15px system-ui, sans-serif'; ctx.fillText('[ CLICK HERE TO COMPLETE ]', 100, VH/2 + 30); }
    else { ctx.fillStyle = '#7dffa8'; ctx.fillText('✔ Already completed.', 100, VH/2 + 30); }
  }
  if(L.tab === 'teach'){
    ctx.fillText('Teacher Tools', 100, 220);
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Lessons: ' + c.lessonsCreated + '  ·  Games: ' + c.gamesCreated + '  ·  Sites: ' + c.websitesPublished, 100, 250);
    if(c.jobs.teacher){
      ctx.fillStyle = '#7fe9ff'; ctx.font = '800 15px system-ui, sans-serif';
      ctx.fillText('[ Create a Lesson Plan (+20z) ]', 100, VH/2 + 30);
      ctx.fillStyle = '#ffd166';
      ctx.fillText('[ Build a Mini-Game for Students (+30z) ]', 100, VH/2 + 100);
    } else { ctx.fillStyle = '#ff9bb0'; ctx.font = '700 14px system-ui, sans-serif'; ctx.fillText('Become a teacher first.', 100, VH/2 + 30); }
    if(c.jobs.principal){ ctx.fillStyle = '#7dffa8'; ctx.fillText('[ Publish School Website (+60z) ]', 100, VH/2 + 170); }
  }
  if(L.tab === 'code'){
    ctx.fillText('Code Editor — Mini Site', 100, 220);
    ctx.font = '500 12px monospace';
    ctx.fillStyle = '#8affa0';
    for(let i=0;i<L.codeLines.length;i++) ctx.fillText(L.codeLines[i], 100, 260 + i*20);
    ctx.fillStyle = '#7fe9ff';
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.fillText('[ 💻 Publish My Website (+40z) ]', 100, VH/2 + 140);
  }
  ctx.textAlign = 'center';
  ctx.font = '700 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('ESC to close laptop', VW/2, VH - 40);
}
function drawWardrobe(){
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.font = '900 24px system-ui, sans-serif';
  ctx.fillStyle = '#ff7ad0';
  ctx.shadowColor = '#ff7ad0'; ctx.shadowBlur = 20;
  ctx.fillText('Wardrobe', VW/2, 80);
  ctx.shadowBlur = 0;
  const cols = 2, boxW = 220, boxH = 90, gapX = 20, gapY = 16;
  const totalW = cols*boxW + (cols-1)*gapX;
  const totalH = Math.ceil(OUTFITS.length/cols)*boxH + (Math.ceil(OUTFITS.length/cols)-1)*gapY;
  const startX = VW/2 - totalW/2, startY = VH/2 - totalH/2;
  for(let i=0;i<OUTFITS.length;i++){
    const cx = i % cols, cy = Math.floor(i/cols);
    const bx = startX + cx*(boxW+gapX);
    const by = startY + cy*(boxH+gapY);
    const active = player.outfit === i;
    ctx.fillStyle = active ? 'rgba(255,122,208,0.25)' : 'rgba(255,255,255,0.06)';
    rr(ctx, bx, by, boxW, boxH, 10); ctx.fill();
    ctx.strokeStyle = active ? '#ff7ad0' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = active ? 2 : 1;
    rr(ctx, bx, by, boxW, boxH, 10); ctx.stroke();
    drawFighter(ctx, CH[OUTFITS[i].cfg], {
      sx: bx + 40, sy: by + boxH - 12,
      facing: 1, animT: G.t, moving: false, hurtT: 0, attackT: 0, z: 0, scale: 0.9
    }, { auraOn: false });
    ctx.textAlign = 'left';
    ctx.font = '800 14px system-ui, sans-serif';
    ctx.fillStyle = '#eaf4ff';
    ctx.fillText(OUTFITS[i].name, bx + 80, by + 30);
    ctx.font = '500 11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(OUTFITS[i].desc, bx + 80, by + 48);
    if(active){
      ctx.font = '800 11px system-ui, sans-serif';
      ctx.fillStyle = '#ff7ad0';
      ctx.fillText('✔ WORN', bx + 80, by + 70);
    }
  }
  ctx.textAlign = 'center';
  ctx.font = '700 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('Click an outfit · ESC to close', VW/2, VH - 40);
}
function drawShop(){
  if(!shopOpen) return;
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, VW, VH);
  const items = SHOP_ITEMS[shopOpen.type];
  const pw = 480, ph = 80 + items.length * 70 + 70;
  const px0 = VW/2 - pw/2, py0 = VH/2 - ph/2;
  ctx.fillStyle = 'rgba(10,20,26,0.95)';
  rr(ctx, px0, py0, pw, ph, 16); ctx.fill();
  ctx.strokeStyle = '#5fe0b0'; ctx.lineWidth = 2;
  rr(ctx, px0, py0, pw, ph, 16); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = '900 22px system-ui, sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 12;
  ctx.fillText(shopOpen.type === 'items' ? '🛒 ITEM SHOP' : '⚡ UPGRADE SHOP', VW/2, py0 + 40);
  ctx.shadowBlur = 0;
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillStyle = '#7fe9ff';
  ctx.fillText('Zeni: ' + player.zeni, VW/2, py0 + 62);
  for(let i=0;i<items.length;i++){
    const it = items[i];
    const ix = px0 + 40, iy = py0 + 84 + i * 70;
    const iw = pw - 80, ih = 56;
    const isHover = mouseX >= ix && mouseX <= ix+iw && mouseY >= iy && mouseY <= iy+ih;
    ctx.fillStyle = isHover ? 'rgba(95,224,176,0.15)' : 'rgba(255,255,255,0.05)';
    rr(ctx, ix, iy, iw, ih, 10); ctx.fill();
    ctx.strokeStyle = isHover ? '#5fe0b0' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = isHover ? 2 : 1;
    rr(ctx, ix, iy, iw, ih, 10); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.fillStyle = '#eaf4ff';
    ctx.fillText(it.name, ix + 16, iy + 24);
    ctx.font = '500 12px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(it.desc, ix + 16, iy + 43);
    ctx.textAlign = 'right';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText(it.cost + 'z', ix + iw - 16, iy + 34);
  }
  const cx = VW/2, cy = py0 + ph - 34;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  rr(ctx, cx-80, cy-18, 160, 36, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,90,90,0.6)'; ctx.lineWidth = 1.5;
  rr(ctx, cx-80, cy-18, 160, 36, 10); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = '800 14px system-ui, sans-serif';
  ctx.fillStyle = '#ff9be0';
  ctx.fillText('CLOSE', cx, cy+5);
}

function drawHUD(){
  const p = player;
  const F = FORMS[p.form];
  const hx=22, hy=22, hw=250, hh=17;
  ctx.fillStyle='rgba(6,14,12,0.7)';
  rr(ctx,hx-4,hy-4,hw+8,hh+8,9); ctx.fill();
  ctx.fillStyle='#12303a'; rr(ctx,hx,hy,hw,hh,5); ctx.fill();
  const hpPct = clamp(p.hp/p.maxHp,0,1);
  const hg = ctx.createLinearGradient(hx,0,hx+hw,0);
  if(hpPct>0.5){ hg.addColorStop(0,'#5bff9b'); hg.addColorStop(1,'#1fd67a'); }
  else if(hpPct>0.25){ hg.addColorStop(0,'#ffe066'); hg.addColorStop(1,'#ffa03d'); }
  else { hg.addColorStop(0,'#ff7a7a'); hg.addColorStop(1,'#e02a4a'); }
  ctx.fillStyle=hg; rr(ctx,hx,hy,hw*hpPct,hh,5); ctx.fill();
  ctx.font='700 11px system-ui, sans-serif';
  ctx.fillStyle='#fff'; ctx.textAlign='left';
  ctx.fillText('HP',hx+7,hy+12.5);
  ctx.textAlign='right';
  ctx.fillText(Math.ceil(p.hp)+' / '+p.maxHp,hx+hw-7,hy+12.5);

  const ey=hy+hh+9, ew=200, eh=11;
  ctx.fillStyle='rgba(6,14,12,0.7)';
  rr(ctx,hx-4,ey-4,ew+8,eh+8,7); ctx.fill();
  ctx.fillStyle='#102030'; rr(ctx,hx,ey,ew,eh,4); ctx.fill();
  const ePct = clamp(p.ki/p.maxKi,0,1);
  const eg = ctx.createLinearGradient(hx,0,hx+ew,0);
  eg.addColorStop(0,'#7fd4ff'); eg.addColorStop(1, F.auraCol || '#4ff0c0');
  ctx.fillStyle=eg; rr(ctx,hx,ey,ew*ePct,eh,4); ctx.fill();
  ctx.font='700 10px system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.textAlign='left';
  ctx.fillText('KI',hx+7,ey+9);

  const fc = F.auraCol || '#7fd4ff';
  ctx.font='800 13px system-ui, sans-serif';
  ctx.fillStyle=fc;
  ctx.shadowColor=fc; ctx.shadowBlur=p.form>0?10:0;
  ctx.fillText('FORM: ' + F.name, hx, ey+eh+22);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff9be0';
  ctx.fillText('⚡ POWER: ' + Math.round(p.power), hx, ey+eh+40);
  ctx.fillStyle='#ffd166';
  ctx.fillText('Zeni: ' + p.zeni, hx, ey+eh+58);
  ctx.font='700 11px system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText('[1] HP:' + p.inventory.potion + '  [2] KI:' + p.inventory.kiPotion + '  [3] Senzu:' + p.inventory.senzu, hx, ey+eh+76);

  const role = G.career.jobs.judge ? 'Judge' : G.career.jobs.lawyer ? 'Lawyer' : G.career.jobs.principal ? 'Principal' : G.career.jobs.teacher ? 'Teacher' : (G.career.path||'Undecided');
  ctx.font='700 11px system-ui, sans-serif';
  ctx.fillStyle='rgba(160,200,255,0.9)';
  ctx.fillText('Day ' + G.day + ' · ' + role + (G.married ? ' · ❤ '+G.married : '') + (G.children.length ? ' · 👶 '+G.children.length : ''), hx, ey+eh+94);

  // Ship parts status
  const partCount = ['engine','fuel','cockpit','hull'].filter(k => G.shipParts[k]).length;
  if(!G.hasShip){
    ctx.font='700 11px system-ui, sans-serif';
    ctx.fillStyle = partCount > 0 ? '#7dffa8' : 'rgba(200,200,200,0.7)';
    ctx.fillText('🚀 Ship Parts: ' + partCount + '/4', hx, ey+eh+112);
  } else {
    ctx.font='700 11px system-ui, sans-serif';
    ctx.fillStyle = '#7dffa8';
    ctx.fillText('🚀 SHIP BUILT', hx, ey+eh+112);
  }

  // Wanted
  ctx.textAlign = 'right';
  const wx0 = VW-22;
  ctx.font = '900 20px system-ui, sans-serif';
  for(let i=0;i<5;i++){
    const lit = i < GTA.wanted;
    ctx.fillStyle = lit ? '#ff5a8a' : 'rgba(255,255,255,0.15)';
    if(lit){ ctx.shadowColor='#ff5a8a'; ctx.shadowBlur=10; } else ctx.shadowBlur=0;
    ctx.fillText('★', wx0 - (4-i)*24, 36);
  }
  ctx.shadowBlur = 0;
  const rw = 160, rh = 8, rx = VW-22-rw, ry = 52;
  ctx.fillStyle = 'rgba(6,14,12,0.7)';
  rr(ctx, rx-4, ry-4, rw+8, rh+8, 6); ctx.fill();
  const rpct = (GTA.reputation + 100) / 200;
  ctx.fillStyle = '#102030'; rr(ctx, rx, ry, rw, rh, 4); ctx.fill();
  const rgrad = ctx.createLinearGradient(rx, 0, rx+rw, 0);
  rgrad.addColorStop(0, '#ff4d6a'); rgrad.addColorStop(0.5, '#8898a8'); rgrad.addColorStop(1, '#5bff9b');
  ctx.fillStyle = rgrad;
  rr(ctx, rx, ry, rw, rh, 4); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(rx + rw*rpct, ry + rh/2, 4, 0, TAU); ctx.fill();
  ctx.font = '700 10px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.textAlign = 'right';
  ctx.fillText('REP: ' + (GTA.reputation>0?'+':'') + Math.round(GTA.reputation), VW-22, ry + rh + 14);

  if(G.godMode){
    ctx.font='900 14px system-ui, sans-serif';
    ctx.fillStyle = '#ffe066';
    ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 12;
    ctx.fillText('🛡 GOD MODE', VW-22, 90);
    ctx.shadowBlur = 0;
  }

  if(GTA.activeMission){
    const m = GTA.activeMission;
    ctx.textAlign = 'center';
    ctx.font = '800 13px system-ui, sans-serif';
    const mw = 340, mx = VW/2 - mw/2, my = 22;
    ctx.fillStyle = 'rgba(4,10,14,0.8)';
    rr(ctx, mx, my, mw, 46, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(255,224,102,0.6)'; ctx.lineWidth = 1.5;
    rr(ctx, mx, my, mw, 46, 10); ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.fillText('📋 ' + m.def.name, VW/2, my + 18);
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    let sub = m.def.desc;
    if(m.def.type === 'chaos') sub = 'Survive ' + Math.ceil(m.timer) + 's';
    else if(m.def.type === 'defeat'){ const alive = m.spawned.filter(e => e.hp > 0).length; sub = 'Enemies: ' + alive; }
    else if(m.def.type === 'deliver') sub = m.stage === 'accept' ? 'Reach pickup' : 'Deliver to target';
    ctx.fillText(sub, VW/2, my + 36);
  }

  ctx.textAlign = 'right';
  ctx.font = '800 15px system-ui, sans-serif';
  if(G.currentRegion){
    ctx.fillStyle = '#7fe9ff';
    ctx.shadowColor = '#7fe9ff'; ctx.shadowBlur = 12;
    ctx.fillText('📍 ' + G.currentRegion.name, VW-22, 108);
    ctx.shadowBlur = 0;
  }
  if(p.flying){
    ctx.font = '800 13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(127,233,255,'+(0.6+0.4*Math.sin(G.t*6))+')';
    ctx.fillText('✈ FLYING', VW-22, 128);
  }

  if(G.kameCharge > 0){
    const cw = 220, ch = 12;
    const cx0 = VW/2 - cw/2, cy0 = VH - 130;
    ctx.fillStyle = 'rgba(6,14,12,0.85)';
    rr(ctx, cx0-4, cy0-4, cw+8, ch+8, 6); ctx.fill();
    ctx.fillStyle = '#102030';
    rr(ctx, cx0, cy0, cw, ch, 4); ctx.fill();
    const pct = Math.min(1, G.kameCharge / 1.6);
    const cg = ctx.createLinearGradient(cx0, 0, cx0+cw, 0);
    cg.addColorStop(0, '#7fd4ff'); cg.addColorStop(1, '#ffe066');
    ctx.fillStyle = cg;
    rr(ctx, cx0, cy0, cw*pct, ch, 4); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = '800 11px system-ui, sans-serif';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('KAMEHAMEHA CHARGING — release U', VW/2, cy0 - 8);
  }

  if(GTA.eventBanner && GTA.eventBannerT > 0){
    GTA.eventBannerT -= 1/60;
    const a = clamp(GTA.eventBannerT, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '900 26px system-ui, sans-serif';
    ctx.globalAlpha = a;
    ctx.fillStyle = GTA.eventBanner.col;
    ctx.shadowColor = GTA.eventBanner.col; ctx.shadowBlur = 24;
    ctx.fillText(GTA.eventBanner.msg, VW/2, 170);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    if(GTA.eventBannerT <= 0) GTA.eventBanner = null;
  }

  if(boss && (!boss.dead || boss.state === 'dying')){
    const bw=520, bx=VW/2-bw/2, by=VH-66;
    ctx.fillStyle='rgba(6,14,12,0.8)';
    rr(ctx,bx-6,by-24,bw+12,54,11); ctx.fill();
    ctx.font='800 13px system-ui, sans-serif';
    ctx.textAlign='left';
    const bc = boss.transformed ? '#ffe066' : '#ff8ab0';
    ctx.fillStyle=bc;
    ctx.shadowColor=bc; ctx.shadowBlur=10;
    ctx.fillText(boss.name, bx, by-8);
    ctx.shadowBlur=0;
    ctx.fillStyle='#2a0f18'; rr(ctx,bx,by,bw,17,5); ctx.fill();
    const vPct = clamp(boss.hp/boss.maxHp,0,1);
    const vg = ctx.createLinearGradient(bx,0,bx+bw,0);
    if(boss.transformed){ vg.addColorStop(0,'#ffe066'); vg.addColorStop(1,'#ff9a3d'); }
    else { vg.addColorStop(0,'#ff6b9d'); vg.addColorStop(1,'#c02a6a'); }
    ctx.fillStyle=vg;
    rr(ctx,bx,by,bw*vPct,17,5); ctx.fill();
    ctx.textAlign='right';
    ctx.font='700 11px system-ui, sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillText(Math.ceil(boss.hp)+' / '+boss.maxHp, bx+bw-8, by+13);
  }
}

function drawCheatConsole(){
  if(!G.cheatOpen){
    // Small hint
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.font = '700 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('press / for cheats', VW/2, VH - 8);
    ctx.restore();
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, VH-170, VW, 170);
  ctx.strokeStyle = '#7dffa8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, VH-170); ctx.lineTo(VW, VH-170); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.font = '800 14px system-ui, sans-serif';
  ctx.fillStyle = '#7dffa8';
  ctx.fillText('CHEAT CONSOLE  (type code + Enter · Esc to close)', 22, VH-142);
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('Try: MONEY · POWER · GOD · CLEAR · SHIP · BUILDSHIP · LAWYER · JUDGE · TEACHER · PRINCIPAL', 22, VH-120);
  ctx.fillText('      MARRY · KID · TP SPACE · TP HOME · FORM5 · MAXHP · MAXKI · HEAL · FLY · HELP', 22, VH-102);
  ctx.font = '800 18px monospace';
  ctx.fillStyle = '#fff';
  const blink = Math.floor(G.t*2)%2 === 0 ? '_' : ' ';
  ctx.fillText('> ' + G.cheatInput + blink, 22, VH-72);
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(200,255,220,0.8)';
  for(let i=0;i<G.cheatLog.length;i++){
    ctx.fillText(G.cheatLog[i], 22, VH-50 + i*12);
  }
}

function drawWorldMapStandalone(){
  ctx.fillStyle = 'rgba(4,10,14,0.9)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.font = '900 24px system-ui, sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20;
  ctx.fillText('WORLD MAP', VW/2, 40);
  ctx.shadowBlur = 0;
  const mapW = 640, mapH = 360;
  const mapX = VW/2 - mapW/2, mapY = 80;
  ctx.fillStyle = 'rgba(10,20,30,0.9)';
  ctx.fillRect(mapX-4, mapY-4, mapW+8, mapH+8);
  ctx.strokeStyle = '#5fe0b0'; ctx.lineWidth = 2;
  ctx.strokeRect(mapX-4, mapY-4, mapW+8, mapH+8);
  for(const r of REGIONS){
    const cx = mapX + (r.gx * REGION_W / WORLD_W) * mapW;
    const cy = mapY + (r.gy * REGION_H / WORLD_H) * mapH;
    const rw = (REGION_W / WORLD_W) * mapW;
    const rh = (REGION_H / WORLD_H) * mapH;
    const cols = regionColor(r.g);
    ctx.fillStyle = cols.base;
    ctx.fillRect(cx, cy, rw, rh);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
    ctx.strokeRect(cx, cy, rw, rh);
    if(r.bossAt && !G.defeatedBosses[r.bossAt.boss]){
      ctx.fillStyle = '#ff2a6a';
      ctx.beginPath(); ctx.arc(cx + rw/2, cy + rh/2, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  // Ship parts on map
  for(const sp of SHIP_PARTS){
    if(G.shipParts[sp.key]) continue;
    const bx = mapX + (sp.x / WORLD_W) * mapW;
    const by = mapY + (sp.y / WORLD_H) * mapH;
    ctx.fillStyle = sp.col;
    ctx.beginPath(); ctx.arc(bx, by, 4, 0, TAU); ctx.fill();
  }
  const px = mapX + (player.x / WORLD_W) * mapW;
  const py = mapY + (player.y / WORLD_H) * mapH;
  ctx.fillStyle = '#7fe9ff';
  ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Press M or click to close · Click a spot to fast-travel', VW/2, VH - 20);
}
function drawEndScreen(win){
  ctx.fillStyle = '#0a1a2a';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  if(win){
    ctx.font = '900 60px system-ui, sans-serif';
    const g = ctx.createLinearGradient(0, 180, 0, 260);
    g.addColorStop(0, '#fff2a8'); g.addColorStop(1, '#ffb84d');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 40;
    ctx.fillText('NAMEK IS FREE', VW/2, 240);
    ctx.shadowBlur = 0;
  } else {
    ctx.font = '900 60px system-ui, sans-serif';
    const g = ctx.createLinearGradient(0, 180, 0, 260);
    g.addColorStop(0, '#ff9bb0'); g.addColorStop(1, '#c02a4a');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ff6b8a'; ctx.shadowBlur = 40;
    ctx.fillText('DEFEATED', VW/2, 240);
    ctx.shadowBlur = 0;
  }
  ctx.font = '800 18px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(160,255,220,'+(0.55+Math.sin(G.t*4)*0.45)+')';
  ctx.fillText('CLICK OR PRESS SPACE TO RETURN', VW/2, 440);
}

function drawDialogue(){
  const d = G.dialogue;
  ctx.fillStyle = 'rgba(4,10,14,0.92)';
  rr(ctx, 60, VH-260, 840, 200, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(127,233,255,0.5)'; ctx.lineWidth = 2;
  rr(ctx, 60, VH-260, 840, 200, 14); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.font = '900 18px system-ui, sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.fillText(d.name, 90, VH-224);
  ctx.font = '500 15px system-ui, sans-serif';
  ctx.fillStyle = '#eaf4ff';
  for(let i=0;i<d.lines.length;i++) ctx.fillText(d.lines[i], 90, VH-194 + i*24);
  const baseY = VH - 200;
  for(let i=0;i<d.options.length;i++){
    const y = baseY + i*32;
    const hover = mouseX > 100 && mouseX < 460 && mouseY > y && mouseY < y+26;
    ctx.fillStyle = hover ? 'rgba(127,233,255,0.15)' : 'rgba(255,255,255,0.05)';
    rr(ctx, 90, y, 360, 26, 6); ctx.fill();
    ctx.strokeStyle = hover ? '#7fe9ff' : 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    rr(ctx, 90, y, 360, 26, 6); ctx.stroke();
    ctx.fillStyle = '#eaf4ff';
    ctx.font = '700 13px system-ui, sans-serif';
    ctx.fillText(d.options[i].label, 100, y + 17);
  }
  ctx.textAlign = 'right';
  ctx.font = '700 11px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('ESC to close', 890, VH-72);
}

/* ══════════════ MAIN LOOP ══════════════ */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.045, (now - last) / 1000);
  last = now;
  G.t += dt; worldTime += dt;
  let rdt = dt;
  if(G.hitStop > 0){ G.hitStop -= dt; rdt = dt*0.15; }

  // Cheat console toggle
  if(pressed['/'] || pressed['`']){
    G.cheatOpen = !G.cheatOpen;
    G.cheatInput = '';
    sfx('ui');
  }

  if(G.cheatOpen){
    // Freeze world while in console (but still animate particles)
  }
  else if(G.mode === 'title'){
    if(pressed[' '] || pressed['enter'] || mouseClicked){ G.mode = 'explore'; sfx('ui'); }
  }
  else if(G.mode === 'explore'){
    updateExplore(rdt);
    updateNPCs(dt);
    updatePeds(dt);
    updateProtectors(dt);
    updateWanted(dt);
    updateMission(dt);
    updateWorldEvents(dt);
    cam.x = lerp(cam.x, player.x - VW*0.42, 1 - Math.exp(-6*dt));
    cam.y = lerp(cam.y, player.y - (VH - GROUND_TOP)/ISO*0.45, 1 - Math.exp(-6*dt));
    cam.x = clamp(cam.x, 0, Math.max(0, WORLD_W - VW));
    cam.y = clamp(cam.y, 0, Math.max(0, WORLD_H - (VH - GROUND_TOP)/ISO));
    if(pressed['b']) openWardrobe();
    if(pressed['c']) openCampus('highschool');
  }
  else if(G.mode === 'interior'){
    updateInterior(rdt);
    updateSchoolTeacher();
    if(shopOpen) updateShop(dt);
    if(campusOpen) updateCampus();
    if(G.laptop) updateLaptop(dt);
    if(G.wardrobe) updateWardrobe(dt);
  }
  else if(G.mode === 'battle'){ updateBattle(rdt); }
  else if(G.mode === 'map'){}
  else if(G.mode === 'win' || G.mode === 'lose'){
    if(pressed[' '] || pressed['enter'] || mouseClicked){
      G.mode = 'title';
      G.defeatedBosses = {}; G.visitedRegions = {}; G.completedMissions = {};
      initMissionMarkers();
      GTA.wanted = 0; GTA.reputation = 0;
      GTA.peds.length = 0; GTA.protectors.length = 0;
      GTA.activeMission = null;
      G.career = { education:{highschool:false,university:false,lawSchool:false,teachersCollege:false},
        path:null, jobs:{lawyer:false,judge:false,teacher:false,principal:false},
        salary:0, lessonsCreated:0, gamesCreated:0, websitesPublished:0, studentsTaught:0 };
      G.relationships = {}; G.married = null; G.children = [];
      G.dialogue = null; G.laptop = null; G.wardrobe = null; G.day = 1;
      G.shipParts = {engine:false,fuel:false,cockpit:false,hull:false};
      G.hasShip = false; G.godMode = false;
      player.hp = player.maxHp; player.ki = player.maxKi;
      player.x = 800; player.y = 500; player.z = 0;
      player.form = 0; player.outfit = 0; player.dead = false;
      player.zeni = 200;
      player.inventory = { potion:3, kiPotion:2, senzu:0 };
      player.weapon = 1; player.armor = 1;
      player.maxHp = 300; player.maxKi = 120;
      player.power = 1000; player.pedKills = 0;
      boss = null;
      for(const r of REGIONS) if(r.enemies) for(const en of r.enemies) en.dead = false;
    }
  }

  if(!G.cheatOpen){
    if((G.mode === 'explore' || G.mode === 'map') && pressed['m']){
      G.mode = G.mode === 'map' ? 'explore' : 'map';
      sfx('ui');
    }
    if(G.mode === 'map' && mouseClicked){
      const mapW = 640, mapH = 360;
      const mapX = VW/2 - mapW/2, mapY = 80;
      if(mouseX >= mapX && mouseX <= mapX+mapW && mouseY >= mapY && mouseY <= mapY+mapH){
        const wx = ((mouseX - mapX) / mapW) * WORLD_W;
        const wy = ((mouseY - mapY) / mapH) * WORLD_H;
        player.x = clamp(wx, 40, WORLD_W-40);
        player.y = clamp(wy, 40, WORLD_H-40);
        player.flying = false; player.z = 0;
        G.mode = 'explore';
        toast('📍 Fast travelled to ' + (regionAt(player.x, player.y)?.name || 'unknown'));
        sfx('power');
      } else { G.mode = 'explore'; sfx('ui'); }
    }
    updateDialogue();
  }

  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0 || !FIN(p.x) || !FIN(p.y)){ parts.splice(i,1); continue; }
    if(!p.ring){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.97; p.vy *= 0.97; }
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i];
    f.life -= dt;
    if(!f.isToast) f.y -= 40*dt;
    if(f.life <= 0 || !FIN(f.x) || !FIN(f.y)) floats.splice(i,1);
  }
  if(cam.shake > 0) cam.shake *= Math.pow(0.0025, dt);
  if(cam.shake < 0.2) cam.shake = 0;
  if(cam.flash > 0) cam.flash = Math.max(0, cam.flash - dt*2.6);

  for(const k in pressed) delete pressed[k];
  mouseClicked = false;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  const shX = cam.shake ? rand(-cam.shake, cam.shake) : 0;
  const shY = cam.shake ? rand(-cam.shake, cam.shake) : 0;
  ctx.save();
  ctx.translate(shX, shY);

  if(G.mode === 'title') drawTitleScreen();
  else if(G.mode === 'explore'){ renderExplore(); drawHUD(); }
  else if(G.mode === 'interior'){ drawInterior(); if(shopOpen) drawShop(); }
  else if(G.mode === 'battle'){ drawBattleScreen(); drawHUD(); }
  else if(G.mode === 'map'){ renderExplore(); drawWorldMapStandalone(); }
  else if(G.mode === 'win') drawEndScreen(true);
  else if(G.mode === 'lose') drawEndScreen(false);

  if(G.dialogue) drawDialogue();
  if(G.mode === 'explore' || G.mode === 'battle' || G.mode === 'interior') drawCheatConsole();

  ctx.restore();
  if(cam.flash > 0 && FIN(cam.flash)){
    ctx.globalAlpha = cam.flash*0.55;
    ctx.fillStyle = cam.flashCol;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }
  const vg = ctx.createRadialGradient(VW/2, VH/2, VH*0.45, VW/2, VH/2, VH*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
})();
</script>
