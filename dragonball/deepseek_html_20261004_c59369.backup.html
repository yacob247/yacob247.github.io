const VW = 960, VH = 540;
let DPR = Math.min(2, devicePixelRatio || 1);
function fit(){
  DPR = Math.min(2, devicePixelRatio || 1);
  const s = Math.min(innerWidth/VW, innerHeight/VH);
  const w = VW*s, h = VH*s;
  cvs.width = VW*DPR; cvs.height = VH*DPR;
  cvs.style.width = w+'px'; cvs.style.height = h+'px';
  cvs.style.left = ((innerWidth-w)/2)+'px';
  cvs.style.top  = ((innerHeight-h)/2)+'px';
}
fit(); addEventListener('resize', fit);

/* World coords: worldX = left/right, worldY = depth (0 far → big near).
   Screen: sx = wx - cam.x ;  sy = GROUND_TOP + (wy - cam.y) * ISO - z */
const WORLD_W = 6400, WORLD_H = 3600;
const GROUND_TOP = 60;
const ISO = 0.55;
const FIN = v => Number.isFinite(v);
const cam = { x:0, y:0 };
const sx = wx => FIN(wx) ? wx - cam.x : -9999;
const sy = wy => FIN(wy) ? GROUND_TOP + (wy - cam.y) * ISO : -9999;

/* ══════════════ HELPERS ══════════════ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
const sgn=v=>v<0?-1:v>0?1:0;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function rr(g,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

function sfx(k){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const P={
      shoot:[900,220,0.02,0.06,'square'], hit:[240,70,0.04,0.08,'sawtooth'],
      boom:[150,32,0.07,0.35,'sawtooth'], power:[140,1300,0.05,0.4,'triangle'],
      ui:[660,880,0.02,0.05,'sine'], coin:[880,1400,0.03,0.1,'sine'],
      door:[300,180,0.05,0.15,'sine'],
    }[k]||[400,200,0.03,0.08,'square'];
    o.type=P[4];
    o.frequency.setValueAtTime(P[0],t);
    o.frequency.exponentialRampToValueAtTime(P[1],t+P[3]);
    g.gain.setValueAtTime(P[2],t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+P[3]+0.02);
    o.start(t); o.stop(t+P[3]+0.03);
  }catch(e){}
}

  npcList.push(n);
}

// Region lookup helper
function regionAt(x, y) {
  for(const r of REGIONS){
    const rx = r.gx * REGION_W, ry = r.gy * REGION_H;
    if(x >= rx && x < rx + REGION_W && y >= ry && y < ry + REGION_H) return r;
  }
  return null;
}
function isWaterAt(x, y) {
  const r = regionAt(x, y);
  return r && r.g === 'water';
}
function isWalkable(x, y) {
  if(isWaterAt(x, y) && !player.flying) return false;
  return true;
}

/* ══════════════ PARTICLES ══════════════ */
function spark(wx,wy,n,cols,spd,life,size){
  if(!FIN(wx)||!FIN(wy)) return;
  for(let i=0;i<n;i++){
    if(parts.length>400) break;
    const a=Math.random()*TAU, s=rand(spd*0.3,spd);
    parts.push({
      x:wx, y:wy,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s*ISO,
      life:rand(life*0.6,life), max:life,
      size:rand(size*0.5,size),
      c:cols[(Math.random()*cols.length)|0]
    });
  }
}
function ring(wx,wy,c,max,life){
  if(!FIN(wx)||!FIN(wy)) return;
  parts.push({x:wx,y:wy,vx:0,vy:0,life:life||0.4,max:life||0.4,size:max,c,ring:true});
}
function dmgText(wx,wy,v,c){
  if(!FIN(wx)||!FIN(wy)) return;
  floats.push({x:wx,y:wy,v:String(v),c,life:0.9,max:0.9});
}
function toast(msg){
  floats.push({x:player.x, y:player.y-40, v:msg, c:'#ffe066', life:1.6, max:1.6, isToast:true});
}

/* ══════════════ FIGHTER RENDER ══════════════ */
function drawFighter(g, cfg, f, opt){
  if(!cfg) return;
  if(!FIN(f.sx)||!FIN(f.sy)) return;
  opt = opt || {};
  const cs = cfg.scale, s = (FIN(cs)&&cs>0)?cs:1;
  const facing = (f.facing === -1) ? -1 : 1;
  const hurt = f.hurtT>0 && Math.floor(f.hurtT*30)%2===0;
  const moving = !!f.moving;
  const animT = FIN(f.animT) ? f.animT : 0;
  const walk = moving ? Math.sin(animT*12) : 0;
  const bob  = moving ? Math.abs(Math.sin(animT*12))*1.4 : Math.sin(animT*2.2)*1;
  const atk  = f.attackT>0 ? f.attackT : 0;

  g.save();
  g.translate(f.sx, f.sy);

  // Shadow, scaled by height off ground
  const shScale = clamp(1 - (f.z || 0) / 500, 0.3, 1);
  g.fillStyle = 'rgba(0,0,0,'+(0.3*shScale)+')';
  g.beginPath(); g.ellipse(0, 0, 16*s*shScale, 5*s*shScale, 0, 0, TAU); g.fill();

  // Lift for flying
  g.translate(0, -(f.z || 0));

  g.scale(facing*s, s);
  g.translate(0, -bob);

  const skin   = hurt ? '#fff' : cfg.skin;
  const hair   = hurt ? '#fff' : cfg.hair;
  const hairHi = hurt ? '#fff' : (cfg.hairHi||cfg.hair);
  const suit   = hurt ? '#fff' : cfg.suit;
  const suitHi = hurt ? '#fff' : (cfg.suitHi||cfg.suit);
  const pants  = hurt ? '#fff' : (cfg.pants||cfg.suit);
  const boots  = hurt ? '#fff' : (cfg.boots||'#222');

  const legSw = walk*0.55;
  g.fillStyle = pants;
  g.save(); g.translate(-4,-18); g.rotate(legSw);  rr(g,-4,0,8,18,4); g.fill(); g.restore();
  g.save(); g.translate( 4,-18); g.rotate(-legSw); rr(g,-4,0,8,18,4); g.fill(); g.restore();
  g.fillStyle = boots;
  g.save(); g.translate(-4,-18); g.rotate(legSw);  rr(g,-5,14,10,6,3); g.fill(); g.restore();
  g.save(); g.translate( 4,-18); g.rotate(-legSw); rr(g,-5,14,10,6,3); g.fill(); g.restore();

  g.fillStyle = suit;   rr(g,-11,-40,22,24,8); g.fill();
  g.fillStyle = suitHi; rr(g,-7,-37,14,10,5);  g.fill();

  if(cfg.armor){
    g.fillStyle = hurt?'#fff':cfg.armor;
    rr(g,-12,-41,24,10,4); g.fill();
    g.beginPath(); g.arc(-12,-37,6,0,TAU); g.fill();
    g.beginPath(); g.arc( 12,-37,6,0,TAU); g.fill();
    if(cfg.armorBand){
      g.fillStyle = hurt?'#fff':cfg.armorBand;
      rr(g,-12,-41,24,3,1.5); g.fill();
    }
  }

  const backSw = moving ? -walk*0.5 : Math.sin(animT*2.2)*0.12;
  g.save();
  g.translate(-9,-34); g.rotate(0.4 + backSw);
  g.fillStyle = skin; rr(g,-3.5,0,7,15,3.5); g.fill();
  g.restore();

  g.save();
  g.translate(1,-46);

  if(cfg.hairStyle!=='bald' && cfg.hairStyle!=='frieza'){
    g.fillStyle = hair;
    g.beginPath(); g.arc(0,-4,12,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='bulma' || cfg.hairStyle==='long'){
    g.fillStyle = hair;
    g.beginPath(); g.ellipse(-10,3,6,12,0.18,0,TAU); g.fill();
    g.beginPath(); g.ellipse( 9,2,5.5,11,-0.18,0,TAU); g.fill();
  }
  g.fillStyle = skin;
  g.beginPath(); g.arc(2,-1,9,0,TAU); g.fill();

  if(cfg.hairStyle==='bulma'){
    g.fillStyle = hair;
    g.beginPath();
    g.moveTo(-11,-4);
    g.quadraticCurveTo(0,-20,12,-5);
    g.quadraticCurveTo(0,-11,-11,-4);
    g.fill();
    g.fillStyle = hairHi;
    g.beginPath(); g.ellipse(-3,-9,5,2.6,-0.5,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='spike'){
    const spikes = [
      [-9,-9,-13,-22,-5,-14],[-4,-12,-5,-27,1,-17],
      [2,-12,4,-28,7,-15],[8,-9,12,-23,12,-11]
    ];
    g.fillStyle = hair;
    for(const sp of spikes){
      g.beginPath();
      g.moveTo(sp[0],sp[1]); g.lineTo(sp[2],sp[3]); g.lineTo(sp[4],sp[5]);
      g.closePath(); g.fill();
    }
    g.fillStyle = hairHi;
    g.beginPath(); g.ellipse(-2,-16,4,2,-0.4,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='frieza'){
    g.fillStyle = hair;
    g.beginPath(); g.ellipse(0,-6,12,9,0,0,TAU); g.fill();
    g.fillStyle = hairHi;
    g.beginPath(); g.ellipse(-2,-10,7,3,-0.3,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='dodoria'){
    g.fillStyle = hair;
    for(let i=0;i<5;i++){
      const a=-0.9+i*0.42;
      g.beginPath();
      g.moveTo(Math.cos(a-0.15)*11-1, Math.sin(a-0.15)*11-4);
      g.lineTo(Math.cos(a)*18-1, Math.sin(a)*18-6);
      g.lineTo(Math.cos(a+0.15)*11-1, Math.sin(a+0.15)*11-4);
      g.closePath(); g.fill();
    }
  }
  if(cfg.hairStyle==='zarbon'){
    g.fillStyle = hair;
    g.beginPath(); g.ellipse(-2,-8,13,8,-0.15,0,TAU); g.fill();
  }
  if(cfg.hairStyle==='ginyu'){
    g.fillStyle = hair;
    g.beginPath(); g.moveTo(-9,-9); g.lineTo(-14,-22); g.lineTo(-3,-12); g.closePath(); g.fill();
    g.beginPath(); g.moveTo( 9,-9); g.lineTo( 15,-22); g.lineTo( 3,-12); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(0,-7,11,7,0,0,TAU); g.fill();
  }

  if(!hurt){
    const ec = cfg.eyeColor || '#1a2030';
    g.fillStyle = ec;
    g.beginPath(); g.arc(6,-2.5,1.8,0,TAU); g.fill();
    g.beginPath(); g.arc(1,-2.5,1.8,0,TAU); g.fill();
    if(cfg.glowEye){
      g.fillStyle = cfg.glowEye;
      g.beginPath(); g.arc(6,-2.5,1.1,0,TAU); g.fill();
      g.beginPath(); g.arc(1,-2.5,1.1,0,TAU); g.fill();
    } else {
      g.fillStyle = 'rgba(255,255,255,.9)';
      g.beginPath(); g.arc(6.5,-3.2,0.6,0,TAU); g.fill();
      g.beginPath(); g.arc(1.5,-3.2,0.6,0,TAU); g.fill();
    }
  } else {
    g.strokeStyle='#333'; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(0,-4); g.lineTo(3,-1.5); g.lineTo(6,-4); g.stroke();
  }
  if(cfg.scouter && !hurt){
    g.fillStyle='#2b3550'; rr(g,-2,-7,11,7,2); g.fill();
    g.fillStyle='#4dff9e'; rr(g,3,-6,5,5,1.2); g.fill();
  }
  g.restore();

  let armAng = moving ? walk*0.4 : Math.sin(animT*2.2)*0.1;
  if(atk>0) armAng = -1.1 * Math.min(1, atk/0.18);
  g.save();
  g.translate(9,-34); g.rotate(armAng);
  g.fillStyle = skin; rr(g,-3.5,0,7,16,3.5); g.fill();
  g.translate(0,16);
  g.fillStyle = skin; g.beginPath(); g.arc(0,0,4.5,0,TAU); g.fill();
  if(atk>0){
    g.save();
    g.globalCompositeOperation='lighter';
    const rg=g.createRadialGradient(0,0,1,0,0,20);
    rg.addColorStop(0,'#fff');
    rg.addColorStop(0.4, cfg.kiColor||'#7fd4ff');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(0,0,20,0,TAU); g.fill();
    g.restore();
  }
  g.restore();

  if(cfg.aura && opt.auraOn!==false){
    g.save();
    g.globalCompositeOperation='lighter';
    const ac = cfg.aura;
    const r = (opt.auraR||34) + Math.sin(animT*6)*3;
    const ag = g.createRadialGradient(0,-22,3,0,-22,r);
    ag.addColorStop(0, ac+'bb');
    ag.addColorStop(0.5, ac+'44');
    ag.addColorStop(1, ac+'00');
    g.fillStyle = ag;
    g.beginPath(); g.arc(0,-22,r,0,TAU); g.fill();
    g.restore();
  }
  g.restore();
}

/* ══════════════ DRAW BUILDING ══════════════ */
function drawBuilding(b){
  if(!FIN(b.x)||!FIN(b.y)) return;
  const bx = sx(b.x), by = sy(b.y + b.h);  // base of building (bottom in depth)
  const bw = b.w, bh = b.h * ISO * 3.2;    // visual height
  const dep = b.h * ISO;                    // depth footprint on screen

  if(bx + bw < -80 || bx > VW+80) return;
  if(by < -200 || by - bh > VH+80) return;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(bx + bw/2, by, bw*0.55, dep*0.55, 0, 0, TAU);
  ctx.fill();

  // Walls (front face)
  const wallGrad = ctx.createLinearGradient(0, by - bh, 0, by);
  if(b.kind === 'shop'){ wallGrad.addColorStop(0,'#e8c85a'); wallGrad.addColorStop(1,'#8a6a1a'); }
  else if(b.kind === 'lab'){ wallGrad.addColorStop(0,'#b8e8ff'); wallGrad.addColorStop(1,'#3a7a9a'); }
  else { wallGrad.addColorStop(0,'#d8a878'); wallGrad.addColorStop(1,'#8a5a2a'); }
  ctx.fillStyle = wallGrad;
  ctx.fillRect(bx, by - bh, bw, bh);

  // Roof
  ctx.fillStyle = b.kind === 'lab' ? '#7a9ac8' : (b.kind === 'shop' ? '#c8443a' : '#a05a2a');
  ctx.beginPath();
  ctx.moveTo(bx - 8, by - bh);
  ctx.lineTo(bx + bw/2, by - bh - 32);
  ctx.lineTo(bx + bw + 8, by - bh);
  ctx.closePath();
  ctx.fill();

  // Door
  ctx.fillStyle = '#3a2a1a';
  const doorW = 42, doorH = 62;
  ctx.fillRect(bx + bw/2 - doorW/2, by - doorH, doorW, doorH);
  // Door handle
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.arc(bx + bw/2 + doorW/2 - 10, by - doorH/2, 2.5, 0, TAU);
  ctx.fill();

  // Windows
  ctx.fillStyle = 'rgba(180,240,255,0.85)';
  const winY = by - bh + 22;
  for(let i=0;i<Math.floor(bw/70);i++){
    const wx = bx + 22 + i*70;
    ctx.fillRect(wx, winY, 28, 28);
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(wx, winY, 28, 28);
    ctx.beginPath();
    ctx.moveTo(wx+14, winY); ctx.lineTo(wx+14, winY+28);
    ctx.moveTo(wx, winY+14); ctx.lineTo(wx+28, winY+14);
    ctx.stroke();
  }

  // Label
  ctx.fillStyle = 'rgba(4,10,14,0.75)';
  ctx.font = 'bold 11px system-ui, sans-serif';
  const lw = ctx.measureText(b.label).width + 16;
  rr(ctx, bx + bw/2 - lw/2, by - bh - 55, lw, 20, 6); ctx.fill();
  ctx.fillStyle = '#7fe9ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.label, bx + bw/2, by - bh - 45);
  ctx.textBaseline = 'alphabetic';
}

/* ══════════════ DRAW GROUND ══════════════ */
function regionColor(g){
  return {
    city:    { base:'#5a6a7a', top:'#7a8a9a', accent:'#c8d8e8' },
    grass:   { base:'#3a7a4a', top:'#5ab86a', accent:'#8ae89a' },
    forest:  { base:'#1e4a2c', top:'#357a4a', accent:'#5bc87f' },
    water:   { base:'#1a5a8a', top:'#3a8ac8', accent:'#7fd4ff' },
    desert:  { base:'#a07a3a', top:'#d8b878', accent:'#f0d8a0' },
    snow:    { base:'#8aa0b0', top:'#e0e8f0', accent:'#ffffff' },
    namek:   { base:'#2a5a4a', top:'#4ea863', accent:'#8fd07a' },
    dark:    { base:'#1a1a2a', top:'#2a2a4a', accent:'#5a3a8a' },
  }[g] || { base:'#3a4a5a', top:'#5a6a7a', accent:'#8a9aaa' };
}

function drawGround(){
  // Fill screen with dark water base (visible behind everything)
  ctx.fillStyle = '#0a1a2a';
  ctx.fillRect(0, 0, VW, VH);

  // Draw each region
  for(const r of REGIONS){
    const rx = r.gx * REGION_W;
    const ry = r.gy * REGION_H;
    const px = sx(rx);
    const py = sy(ry);
    const pw = REGION_W;
    const ph = REGION_H * ISO;

    // Cull
    if(px + pw < -50 || px > VW+50) continue;
    if(py + ph < -50 || py > VH+50) continue;

    const cols = regionColor(r.g);

    // Region body
    const grad = ctx.createLinearGradient(0, py, 0, py + ph);
    grad.addColorStop(0, cols.base);
    grad.addColorStop(1, cols.top);
    ctx.fillStyle = grad;
    ctx.fillRect(px, py, pw, ph);

    // Checkerboard for depth feel
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    const tile = 80;
    for(let yy = Math.floor(Math.max(0, (0 - py)/ph) * 12) * (REGION_H/12); yy < REGION_H; yy += REGION_H/12){
      const cy = sy(ry + yy);
      if(cy < -30 || cy > VH+30) continue;
      for(let xx = 0; xx < REGION_W; xx += tile*2){
        const cx = sx(rx + xx + (Math.floor(yy/(REGION_H/12))%2 === 1 ? tile : 0));
        if(cx < -tile || cx > VW) continue;
        ctx.fillRect(cx, cy, tile, REGION_H/12 * ISO);
      }
    }

    // Grass tufts / details
    if(r.g === 'grass' || r.g === 'forest' || r.g === 'namek'){
      ctx.strokeStyle = cols.accent + '60';
      ctx.lineWidth = 1.5;
      for(let i=0;i<40;i++){
        const wx = rx + (i * 137.5) % REGION_W;
        const wy = ry + (i * 211.3) % REGION_H;
        const cx = sx(wx), cy = sy(wy);
        if(cx < 0 || cx > VW || cy < 0 || cy > VH) continue;
        const sway = Math.sin(worldTime*2 + i)*2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + sway, cy - 6);
        ctx.stroke();
      }
    }

    // Water sparkle
    if(r.g === 'water'){
      ctx.fillStyle = 'rgba(200,255,255,'+(0.4+0.3*Math.sin(worldTime*3))+')';
      for(let i=0;i<15;i++){
        const wx = rx + (i * 211.7 + worldTime*40) % REGION_W;
        const wy = ry + (i * 137.5) % REGION_H;
        const cx = sx(wx), cy = sy(wy);
        if(cx < 0 || cx > VW || cy < 0 || cy > VH) continue;
        ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, TAU); ctx.fill();
      }
    }

    // Region border
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    ctx.strokeRect(px, py, pw, ph);

    // Region name on first visit
    if(G.currentRegion === r && !G.visitedRegions[r.id] && G.mode === 'explore'){
      // will draw separately
    }
  }
}

/* ══════════════ MOVEMENT ══════════════ */
function updateExplore(dt){
  const p = player;
  if(p.dead) return;

  // Input
  let ix = 0, iy = 0;
  if(keys['a']||keys['arrowleft'])  ix -= 1;
  if(keys['d']||keys['arrowright']) ix += 1;
  if(keys['w']||keys['arrowup'])    iy -= 1;
  if(keys['s']||keys['arrowdown'])  iy += 1;

  const mag = Math.hypot(ix, iy);
  if(mag > 0){ ix /= mag; iy /= mag; }
  if(ix !== 0) p.facing = ix > 0 ? 1 : -1;

  // Toggle flying
  if(pressed['f']){
    p.flying = !p.flying;
    sfx('power');
    toast(p.flying ? '✈ FLYING' : '🚶 WALKING');
  }

  // Flying height animation
  const targetZ = p.flying ? 180 : 0;
  p.z = lerp(p.z, targetZ, 1 - Math.exp(-8*dt));
  if(Math.abs(p.z - targetZ) < 1) p.z = targetZ;

  // Speed
  const speed = p.flying ? 400 : 260;
  const targetVx = ix * speed;
  const targetVy = iy * speed * 1.15; // depth compensation

  const k = 1 - Math.exp(-16*dt);
  p.vx = p.vx + (targetVx - p.vx) * k;
  p.vy = p.vy + (targetVy - p.vy) * k;

  // Move
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  // Bounds
  p.x = clamp(p.x, 20, WORLD_W - 20);
  p.y = clamp(p.y, 20, WORLD_H - 20);

  // Building collision (skip when flying)
  if(!p.flying){
    for(const b of ALL_BUILDINGS){
      const pad = 14;
      if(p.x > b.x + b.gx - pad && p.x < b.x + b.gx + b.w + pad &&
         p.y > b.y + b.gy - pad && p.y < b.y + b.gy + b.h + pad){
        // Push out
        const dx1 = Math.abs(p.x - (b.x + b.gx - pad));
        const dx2 = Math.abs(p.x - (b.x + b.gx + b.w + pad));
        const dy1 = Math.abs(p.y - (b.y + b.gy - pad));
        const dy2 = Math.abs(p.y - (b.y + b.gy + b.h + pad));
        const minD = Math.min(dx1, dx2, dy1, dy2);
        if(minD === dx1) p.x = b.x + b.gx - pad;
        else if(minD === dx2) p.x = b.x + b.gx + b.w + pad;
        else if(minD === dy1) p.y = b.y + b.gy - pad;
        else p.y = b.y + b.gy + b.h + pad;
      }
    }
  }

  // Water check (only when not flying)
  if(!p.flying && isWaterAt(p.x, p.y)){
    p.hp -= 30 * dt;
    if(Math.random() < 0.3)
      parts.push({x:p.x+rand(-8,8), y:p.y+rand(-8,8), vx:rand(-40,40), vy:rand(-40,40),
        life:0.4, max:0.4, size:3, c:'#7fd4ff'});
    if(p.hp <= 0) p.hp = 0;
  }

  // Region detection
  const r = regionAt(p.x, p.y);
  if(r && r !== G.currentRegion){
    G.currentRegion = r;
    if(!G.visitedRegions[r.id]){
      G.visitedRegions[r.id] = true;
      toast('📍 ' + r.name);
    }
  }

  // Enemy combat (light — walking into enemies damages both)
  for(const region of REGIONS){
    if(!region.enemies) continue;
    for(const en of region.enemies){
      if(en.dead) continue;
      if(dist(p.x, p.y, en.x, en.y) < 60){
        // Simple contact
        if(p.invuln <= 0){
          p.hp -= en.dmg * 0.5;
          p.invuln = 0.4;
          en.hp -= 25;
          spark(p.x, p.y-20, 8, ['#ff6b8a','#fff'], 200, 0.4, 3);
          dmgText(p.x, p.y-50, 'HIT!', '#ff6b8a');
          sfx('hit');
          if(en.hp <= 0){
            en.dead = true;
            p.zeni += en.zeni;
            spark(en.x, en.y, 20, ['#ff9be0','#fff'], 300, 0.7, 5);
            toast('+' + en.zeni + ' zeni');
            sfx('boom');
          }
        }
      }
    }
  }

  // Melee / blast
  if(p.attackCd > 0) p.attackCd -= dt;
  if(p.attackT > 0) p.attackT -= dt;
  if(p.shootT > 0) p.shootT -= dt;
  if(p.hurtT > 0) p.hurtT -= dt;
  if(p.invuln > 0) p.invuln -= dt;
  if(p.comboWindow > 0) p.comboWindow -= dt; else p.comboStep = 0;

  if(pressed['j'] || mouseClicked){
    p.attackT = 0.18;
    p.attackCd = 0.24;
    p.comboStep = (p.comboStep % 3) + 1;
    p.comboWindow = 0.6;
    const dmg = [0,18,22,30][p.comboStep] * FORMS[p.form].dmg;

    // Hit check vs enemies
    const reach = 60 + p.comboStep * 6;
    let hitAny = false;
    for(const region of REGIONS){
      if(!region.enemies) continue;
      for(const en of region.enemies){
        if(en.dead) continue;
        const dx = en.x - p.x, dy = en.y - p.y;
        if(Math.abs(dx) < reach && Math.abs(dy) < 50 && sgn(dx) === p.facing){
          en.hp -= dmg;
          hitAny = true;
          spark(en.x, en.y-20, 6, ['#fff','#ffd166'], 200, 0.3, 3);
          dmgText(en.x, en.y-50, Math.round(dmg), '#ffe066');
          sfx('hit');
          if(en.hp <= 0){
            en.dead = true;
            p.zeni += en.zeni;
            spark(en.x, en.y, 20, ['#ff9be0','#fff'], 300, 0.7, 5);
            toast('+' + en.zeni + ' zeni');
            sfx('boom');
          }
        }
      }
    }
    if(!hitAny){
      const fx = p.x + p.facing * reach * 0.7;
      spark(fx, p.y-20, 4, ['#fff','#7fd4ff'], 130, 0.22, 3);
      sfx('shoot');
    }
  }

  // Ki blast
  if(pressed['u']){
    if(p.shootT <= 0 && p.ki >= 3){
      p.shootT = FORMS[p.form].rate;
      p.ki -= 3;
      const col = p.form===2?'#ffe066':(p.form===1?'#4ff0c0':'#7fd4ff');
      bullets.push({
        x:p.x + p.facing*22, y:p.y, vx:p.facing*820, vy:0,
        r:6, dmg:15*FORMS[p.form].dmg, life:1.5, c:col, fromPlayer:true, t:0
      });
      sfx('shoot');
    }
  }

  // Transform
  if(pressed['e'] && p.transformFx <= 0){
    if(p.form < 2 && p.ki >= 30){
      p.form++;
      p.ki -= 24;
      p.transformFx = 1.0;
      p.invuln = 0.75;
      cam.flash = 0.85;
      cam.flashCol = p.form === 2 ? '#ffe066' : '#4ff0c0';
      ring(p.x, p.y, p.form === 2 ? '#ffe066' : '#4ff0c0', 110);
      spark(p.x, p.y, 40, [p.form===2?'#ffe066':'#4ff0c0','#fff'], 340, 0.85, 5);
      sfx('power');
      toast(FORMS[p.form].name + '!');
    } else if(p.form > 0){
      p.form = 0;
      p.transformFx = 0.5;
      ring(p.x, p.y, '#7fd4ff', 60);
    }
  }
  if(p.transformFx > 0) p.transformFx -= dt;

  // Use potion
  if(pressed['1'] && p.inventory.potion > 0 && p.hp < p.maxHp){
    p.inventory.potion--;
    p.hp = Math.min(p.maxHp, p.hp + 80);
    toast('Potion! +80 HP');
    sfx('coin');
  }
  if(pressed['2'] && p.inventory.kiPotion > 0 && p.ki < p.maxKi){
    p.inventory.kiPotion--;
    p.ki = Math.min(p.maxKi, p.ki + 60);
    toast('Ki! +60 KI');
    sfx('coin');
  }
  if(pressed['3'] && p.inventory.senzu > 0){
    p.inventory.senzu--;
    p.hp = p.maxHp; p.ki = p.maxKi;
    toast('Senzu! FULL RESTORE');
    sfx('power');
  }

  // Dash
  if(pressed['k'] && p.dashCd <= 0){
    p.dashCd = 0.55;
    p.invuln = 0.22;
    p.vx = p.facing * 800;
    for(let i=0;i<10;i++)
      spark(p.x + rand(-14,14), p.y + rand(-6,6), 1,
        [p.form===2?'#ffe066':'#7fd4ff','#fff'], rand(60,200), 0.35, 3);
    sfx('power');
  }
  if(p.dashCd > 0) p.dashCd -= dt;

  // Interaction: enter building
  if(pressed['e'] || pressed['enter']){
    for(const b of ALL_BUILDINGS){
      const doorX = b.x + b.gx + b.w/2;
      const doorY = b.y + b.gy + b.h;
      if(dist(p.x, p.y, doorX, doorY) < 90 && b.interior){
        enterInterior(b.interior);
        break;
      }
    }
  }

  // Boss encounter trigger
  for(const region of REGIONS){
    if(!region.bossAt) continue;
    if(G.defeatedBosses[region.bossAt.boss]) continue;
    if(boss) continue;
    const bd = region.bossAt;
    if(dist(p.x, p.y, bd.x, bd.y) < 380){
      startBossBattle(region.bossAt.boss, bd.x, bd.y);
      return;
    }
  }

  // Animation
  p.walking = Math.hypot(p.vx, p.vy) > 30;
  p.animT += dt * (p.walking ? Math.max(1, Math.hypot(p.vx,p.vy)/220) : 2.4);

  // Ki regen / aura
  if(p.form > 0){
    p.ki -= FORMS[p.form].drain * dt;
    if(p.ki <= 0){ p.ki = 0; p.form = 0; p.transformFx = 0.6; }
  } else {
    p.ki = Math.min(p.maxKi, p.ki + 12*dt);
  }
  if(p.form > 0 && Math.random() < 0.7){
    const c = p.form===2?'#ffe066':'#4ff0c0';
    parts.push({
      x:p.x+rand(-14,14), y:p.y+rand(-6,6),
      vx:rand(-30,30), vy:rand(-40,40),
      life:rand(0.3,0.6), max:0.6, size:rand(2,5), c
    });
  }
  // Flying thruster particles
  if(p.flying && Math.random() < 0.4){
    parts.push({
      x:p.x+rand(-10,10), y:p.y+rand(-4,4),
      vx:rand(-30,30), vy:rand(-30,30),
      life:rand(0.2,0.4), max:0.4, size:rand(2,4), c:'#7fd4ff'
    });
  }

  if(p.hp <= 0 && !p.dead){
    p.dead = true;
    spark(p.x, p.y, 40, ['#ff6b9d','#fff'], 340, 1.0, 5);
    cam.flash = 0.8; cam.flashCol = '#ff3b6b';
    setTimeout(()=>{ G.mode='lose'; }, 1200);
  }
}

/* ══════════════ NPCs ══════════════ */
function updateNPCs(dt){
  for(const n of npcList){
    n.t -= dt;
    if(n.t <= 0){
      n.t = rand(1.5, 4);
      const a = Math.random()*TAU;
      n.tx = n.homeX + Math.cos(a)*80;
      n.ty = n.homeY + Math.sin(a)*40;
    }
    if(n.tx !== undefined){
      const dx = n.tx - n.x, dy = n.ty - n.y;
      const d = Math.hypot(dx, dy);
      if(d > 5){
        n.x += (dx/d) * 40 * dt;
        n.y += (dy/d) * 30 * dt;
        n.moving = true;
        n.facing = dx > 0 ? 1 : -1;
      } else n.moving = false;
    }
    n.animT += dt * (n.moving ? 1.5 : 0.5);
  }
}

/* ══════════════ INTERIORS ══════════════ */
function enterInterior(key){
  const it = INTERIORS[key];
  if(!it) return;
  G.currentInterior = key;
  G.mode = 'interior';
  // Set up interior NPC positions
  it._npcs = (it.npcs || []).map(n => ({...n}));
  // Player position in interior (world coords INSIDE interior scene)
  player.x = it.w / 2;
  player.y = it.h - 80;
  player.vx = 0; player.vy = 0;
  player.z = 0; player.flying = false;
  cam.x = 0; cam.y = 0;
  sfx('door');
  toast('Entered: ' + it.name);
}
function exitInterior(){
  const it = INTERIORS[G.currentInterior];
  G.currentInterior = null;
  G.mode = 'explore';
  // Player back to a spot in front of the building
  if(it && G._lastBuilding){
    player.x = G._lastBuilding.x + G._lastBuilding.gx + G._lastBuilding.w/2;
    player.y = G._lastBuilding.y + G._lastBuilding.gy + G._lastBuilding.h + 60;
  }
  sfx('door');
}
function updateInterior(dt){
  const it = INTERIORS[G.currentInterior];
  if(!it) return;
  const p = player;

  let ix = 0, iy = 0;
  if(keys['a']||keys['arrowleft'])  ix -= 1;
  if(keys['d']||keys['arrowright']) ix += 1;
  if(keys['w']||keys['arrowup'])    iy -= 1;
  if(keys['s']||keys['arrowdown'])  iy += 1;

  const mag = Math.hypot(ix, iy);
  if(mag > 0){ ix /= mag; iy /= mag; }
  if(ix !== 0) p.facing = ix > 0 ? 1 : -1;

  const speed = 260;
  const k = 1 - Math.exp(-16*dt);
  p.vx = lerp(p.vx, ix * speed, k);
  p.vy = lerp(p.vy, iy * speed, k);

  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.x = clamp(p.x, 30, it.w - 30);
  p.y = clamp(p.y, 30, it.h - 30);

  p.walking = Math.hypot(p.vx, p.vy) > 30;
  p.animT += dt * (p.walking ? Math.max(1, Math.hypot(p.vx,p.vy)/220) : 2.4);

  // Exit
  if(pressed['escape'] || (p.y >= it.h - 35 && (pressed['s'] || pressed['arrowdown']))){
    exitInterior();
    return;
  }
  // Furniture / item interaction
  if(pressed['e']){
    if(it.items){
      for(const item of it.items){
        if(dist(p.x, p.y, item.x, item.y) < 70){
          if(item.kind === 'heal'){
            p.hp = p.maxHp; p.ki = p.maxKi;
            toast('Fully healed!');
            spark(p.x, p.y-20, 20, ['#7dffa8','#fff'], 200, 0.6, 4);
            sfx('power');
          }
          return;
        }
      }
    }
    if(it.shop){
      openShop(it.shop);
      return;
    }
  }

  if(p.hurtT > 0) p.hurtT -= dt;
  if(p.invuln > 0) p.invuln -= dt;
  if(p.transformFx > 0) p.transformFx -= dt;

  // Update interior NPCs (idle bob only)
  for(const n of (it._npcs || [])){
    n.animT = (n.animT||0) + dt * 1.2;
    n.moving = false;
    n.facing = n.x < p.x ? 1 : -1;
  }
}

/* ══════════════ SHOP ══════════════ */
let shopOpen = null; // { type, hoverIdx }
function openShop(type){
  shopOpen = { type, hoverIdx: -1 };
  sfx('door');
}
function closeShop(){ shopOpen = null; }
function updateShop(dt){
  if(!shopOpen) return;
  const items = SHOP_ITEMS[shopOpen.type];
  // Detect click on items
  if(mouseClicked){
    // Item rows at VW/2 - 200, VH/2 - 100 + i*70, w=400, h=56
    for(let i=0;i<items.length;i++){
      const ix = VW/2 - 200, iy = VH/2 - 100 + i*70;
      if(mouseX >= ix && mouseX <= ix+400 && mouseY >= iy && mouseY <= iy+56){
        buyItem(shopOpen.type, i);
        return;
      }
    }
    // Close button
    if(mouseX > VW/2 - 60 && mouseX < VW/2 + 60 && mouseY > VH/2 + 160 && mouseY < VH/2 + 200){
      closeShop();
      return;
    }
  }
  if(pressed['escape']){ closeShop(); return; }
}
function buyItem(shopType, idx){
  const items = SHOP_ITEMS[shopType];
  const item = items[idx];
  if(!item) return;
  if(player.zeni < item.cost){ toast('Not enough zeni!'); sfx('hit'); return; }
  player.zeni -= item.cost;

  if(shopType === 'items'){
    if(item.key === 'potion') player.inventory.potion++;
    else if(item.key === 'kiPotion') player.inventory.kiPotion++;
    else if(item.key === 'senzu') player.inventory.senzu++;
  } else {
    if(item.key === 'weapon'){
      player.weapon++;
      player.maxHp += 0;
    } else if(item.key === 'armor'){
      player.armor++;
      player.maxHp += 40;
      player.hp += 40;
    }
  }
  toast('Bought: ' + item.name);
  sfx('coin');
  spark(player.x, player.y-20, 10, ['#ffd166','#fff'], 180, 0.5, 4);
}

/* ══════════════ BOSS BATTLE ══════════════ */
function startBossBattle(bossId, bx, by){
  const d = BOSS_DEFS[bossId];
  if(!d) return;
  boss = {
    def:d, id:bossId, name:d.name,
    cfgKey:d.ch, cfg:CH[d.ch],
    x: bx + 200, y: by,
    vx:0, vy:0, facing:-1, moving:false,
    hp:d.hp, maxHp:d.hp, speed:d.speed,
    atkList:d.atk.slice(),
    hurtT:0, animT:0, dead:false,
    state:'enter', stateT:0.8, cd:1.2,
    attack:null, attackT:0, attackData:null,
    transformed:false, barked:{}, invuln:0,
    returnTo: { x:bx, y:by },
  };
  if(d.duo){
    boss.duo = {
      name:d.duo.name, cfg:CH[d.duo.ch],
      x: bx + 300, y: by + 60, vx:0, vy:0,
      hp:d.duo.hp, maxHp:d.duo.hp,
      facing:-1, animT:0, hurtT:0, moving:false,
      dead:false, attackT:0, cd:1.5,
    };
  }
  player.x = bx - 200;
  player.y = by;
  player.vx = 0; player.vy = 0;
  player.z = 0; player.flying = false;
  player.invuln = 1.2;
  player.dead = false;
  cam.x = player.x - VW/2;
  cam.y = player.y - VH/2/ISO;
  cam.flash = 0.5; cam.flashCol = '#ff6b9d';
  G.mode = 'battle';
  battleTitle = boss.name;
  battleIntroT = 1.6;
  bullets.length = 0;
  parts.length = 0;
  toast('⚔ ' + boss.name + ' approaches!');
  sfx('power');
}
let battleTitle = '', battleIntroT = 0;
function endBossBattle(won){
  if(won){
    G.defeatedBosses[boss.id] = true;
    player.zeni += 150 + Math.floor(Math.random()*100);
    toast('+' + (150) + ' zeni!');
  }
  boss = null;
  bullets.length = 0;
  parts.length = 0;
  G.mode = 'explore';
}

function updateBattle(dt){
  const p = player;
  if(battleIntroT > 0) battleIntroT -= dt;

  // Player movement (belt-scroller)
  let ix = 0, iy = 0;
  if(keys['a']||keys['arrowleft'])  ix -= 1;
  if(keys['d']||keys['arrowright']) ix += 1;
  if(keys['w']||keys['arrowup'])    iy -= 1;
  if(keys['s']||keys['arrowdown'])  iy += 1;
  const mag = Math.hypot(ix, iy);
  if(mag > 0){ ix /= mag; iy /= mag; }
  if(ix !== 0) p.facing = ix > 0 ? 1 : -1;

  const speed = FORMS[p.form].spd;
  const k = 1 - Math.exp(-16*dt);
  p.vx = lerp(p.vx, ix * speed, k);
  p.vy = lerp(p.vy, iy * speed * 1.15, k);
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.x = clamp(p.x, 40, WORLD_W-40);
  p.y = clamp(p.y, 40, WORLD_H-40);
  p.walking = Math.hypot(p.vx, p.vy) > 30;
  p.animT += dt * (p.walking ? Math.max(1, Math.hypot(p.vx,p.vy)/220) : 2.4);

  // Combat input
  if(p.attackCd > 0) p.attackCd -= dt;
  if(p.attackT > 0) p.attackT -= dt;
  if(p.shootT > 0) p.shootT -= dt;
  if(p.hurtT > 0) p.hurtT -= dt;
  if(p.invuln > 0) p.invuln -= dt;
  if(p.comboWindow > 0) p.comboWindow -= dt; else p.comboStep = 0;

  if((pressed['j'] || (mouseClicked && !shopOpen)) && p.attackCd <= 0){
    p.attackT = 0.18; p.attackCd = 0.24;
    p.comboStep = (p.comboStep % 3) + 1;
    p.comboWindow = 0.6;
    const dmg = [0,18,22,30][p.comboStep] * FORMS[p.form].dmg;
    let hitAny = false;
    if(boss && !boss.dead && boss.invuln <= 0){
      const dx = boss.x - p.x, dy = boss.y - p.y;
      if(Math.abs(dx) < 70 && Math.abs(dy) < 55 && sgn(dx) === p.facing){
        damageBoss(dmg, p.x); hitAny = true;
      }
      if(boss.duo && !boss.duo.dead){
        const dx2 = boss.duo.x - p.x, dy2 = boss.duo.y - p.y;
        if(Math.abs(dx2) < 70 && Math.abs(dy2) < 55 && sgn(dx2) === p.facing){
          damageDuo(dmg, p.x); hitAny = true;
        }
      }
    }
    spark(p.x + p.facing*44, p.y-20, 5, ['#fff','#7fd4ff'], 160, 0.22, 3);
    sfx(hitAny?'hit':'shoot');
    if(hitAny){ cam.shake = 5; G.hitStop = 0.04; }
  }

  if(pressed['u'] && p.shootT <= 0 && p.ki >= 3){
    p.shootT = FORMS[p.form].rate;
    p.ki -= 3;
    const col = p.form===2?'#ffe066':(p.form===1?'#4ff0c0':'#7fd4ff');
    bullets.push({
      x:p.x + p.facing*22, y:p.y, vx:p.facing*820, vy:0,
      r:6, dmg:15*FORMS[p.form].dmg, life:1.5, c:col, fromPlayer:true, t:0
    });
    sfx('shoot');
  }

  if(pressed['e'] && p.transformFx <= 0){
    if(p.form < 2 && p.ki >= 30){
      p.form++;
      p.ki -= 24;
      p.transformFx = 1.0;
      p.invuln = 0.75;
      cam.flash = 0.85;
      cam.flashCol = p.form === 2 ? '#ffe066' : '#4ff0c0';
      ring(p.x, p.y, p.form === 2 ? '#ffe066' : '#4ff0c0', 110);
      spark(p.x, p.y, 40, [p.form===2?'#ffe066':'#4ff0c0','#fff'], 340, 0.85, 5);
      sfx('power');
    } else if(p.form > 0){
      p.form = 0; p.transformFx = 0.5;
    }
  }
  if(p.transformFx > 0) p.transformFx -= dt;
  if(p.dashCd > 0) p.dashCd -= dt;

  if(p.form > 0){
    p.ki -= FORMS[p.form].drain * dt;
    if(p.ki <= 0){ p.ki = 0; p.form = 0; }
  } else p.ki = Math.min(p.maxKi, p.ki + 12*dt);

  // Update boss
  if(boss) updateBoss(dt);

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt; b.t += dt;
    if(b.life <= 0 || !FIN(b.x)){ bullets.splice(i,1); continue; }
    if(b.fromPlayer){
      if(boss && !boss.dead && Math.abs(b.x-boss.x) < 40 && Math.abs(b.y-boss.y) < 50){
        damageBoss(b.dmg, b.x); spark(b.x, b.y, 6, ['#fff',b.c], 200, 0.3, 3);
        bullets.splice(i,1); continue;
      }
    } else {
      if(!p.dead && p.invuln <= 0 && Math.abs(b.x-p.x) < 30 && Math.abs(b.y-p.y) < 40){
        damagePlayer(b.dmg, b.x); bullets.splice(i,1); continue;
      }
    }
  }

  // Camera
  cam.x = lerp(cam.x, p.x - VW*0.42, 1 - Math.exp(-4*dt));
  cam.y = lerp(cam.y, p.y - (VH/ISO)*0.5, 1 - Math.exp(-4*dt));
  cam.x = clamp(cam.x, 0, WORLD_W - VW);
  cam.y = clamp(cam.y, 0, WORLD_H - VH/ISO);

  // Win condition
  if(boss && boss.dead && boss.state !== 'dying'){}
  if(boss && boss.dead && boss.stateT === undefined){
    endBossBattle(true);
  }
}

function damageBoss(d, fromX){
  if(!boss || boss.dead || boss.invuln > 0) return;
  boss.hp -= d;
  boss.hurtT = 0.18;
  dmgText(boss.x, boss.y-60, Math.round(d), '#ffe066');
  boss.vx += (sgn(boss.x - fromX)||1) * 100;
  spark(boss.x, boss.y-20, 8, ['#fff','#ffd166'], 220, 0.3, 4);
  if(boss.hp <= 0){ boss.hp = 0; killBoss(); }
}
function damageDuo(d, fromX){
  if(!boss || !boss.duo || boss.duo.dead) return;
  boss.duo.hp -= d;
  boss.duo.hurtT = 0.18;
  dmgText(boss.duo.x, boss.duo.y-60, Math.round(d), '#ffe066');
  spark(boss.duo.x, boss.duo.y-20, 8, ['#fff','#ffd166'], 220, 0.3, 4);
  if(boss.duo.hp <= 0){
    boss.duo.dead = true;
    spark(boss.duo.x, boss.duo.y, 40, ['#ff9be0','#fff'], 400, 0.9, 6);
    ring(boss.duo.x, boss.duo.y, '#ff9be0', 100);
    sfx('boom');
  }
}
function damagePlayer(amount, fromX){
  const p = player;
  if(p.invuln > 0 || p.dead) return;
  p.hp -= amount;
  p.hurtT = 0.35; p.invuln = 0.8;
  p.vx = (sgn(p.x - fromX)||1) * 300;
  cam.shake = 10;
  cam.flash = 0.3; cam.flashCol = '#ff3b6b';
  spark(p.x, p.y-20, 12, ['#ff4d7a','#fff'], 240, 0.5, 4);
  dmgText(p.x, p.y-70, Math.round(amount), '#ff6b8a');
  sfx('hit');
  if(p.hp <= 0 && !p.dead){
    p.dead = true;
    spark(p.x, p.y-20, 40, ['#ff6b9d','#fff'], 340, 1.0, 5);
    cam.shake = 18;
    setTimeout(()=>{ G.mode = 'lose'; }, 1200);
  }
}
function killBoss(){
  const b = boss;
  if(!b) return;
  b.dead = true;
  b.state = 'dying';
  b.stateT = 1.8;
  cam.shake = 28;
  cam.flash = 1.0; cam.flashCol = '#ffffff';
  spark(b.x, b.y, 80, ['#ffe066','#fff','#ff8a3d','#ff4d7a'], 520, 1.4, 7);
  ring(b.x, b.y, '#ffffff', 220, 0.7);
  sfx('boom');
}

function updateBoss(dt){
  const b = boss;
  if(!b || b.dead) {
    if(b && b.state === 'dying'){
      b.stateT -= dt;
      if(Math.random()<0.5)
        parts.push({x:b.x+rand(-30,30), y:b.y+rand(-10,10), vx:rand(-80,80), vy:rand(-80,80),
          life:rand(0.3,0.7), max:0.7, size:rand(3,6), c:['#ffe066','#fff','#ff8a3d'][(Math.random()*3)|0]});
      if(b.stateT <= 0){
        endBossBattle(true);
      }
    }
    return;
  }

  b.animT += dt;
  if(b.hurtT > 0) b.hurtT -= dt;
  if(b.invuln > 0) b.invuln -= dt;
  b.x += b.vx*dt; b.y += b.vy*dt;
  b.vx *= 0.9; b.vy *= 0.9;
  b.x = clamp(b.x, 40, WORLD_W-40);
  b.y = clamp(b.y, 40, WORLD_H-40);
  b.moving = Math.hypot(b.vx, b.vy) > 40;

  const p = player;
  const dx = p.x - b.x, dy = p.y - b.y;
  const dist_ = Math.hypot(dx, dy);
  b.facing = dx > 0 ? 1 : -1;

  // Barks
  const pct = b.hp / b.maxHp;
  const list = b.transformed && b.def.monsterBarks ? b.def.monsterBarks : (b.def.barks || []);
  const prefix = b.transformed ? 'm_' : 'n_';
  for(const entry of list){
    const key = prefix + entry[0].toFixed(2);
    if(!b.barked[key] && pct <= entry[0]){
      b.barked[key] = true;
      toast(b.name + ': "' + entry[1] + '"');
      break;
    }
  }

  // Transform
  if(b.def.transformAt && !b.transformed && pct <= b.def.transformAt){
    b.transformed = true;
    b.state = 'transform';
    b.stateT = 1.6;
    b.invuln = 1.6;
    cam.shake = 22; cam.flash = 1.0; cam.flashCol = '#ffe066';
    sfx('power');
    toast(b.name + ': "' + b.def.transformBark + '"');
    return;
  }

  if(b.state === 'enter'){
    b.stateT -= dt;
    b.vx = -60;
    if(b.stateT <= 0){ b.state = 'idle'; b.cd = 0.6; }
    return;
  }
  if(b.state === 'transform'){
    b.stateT -= dt;
    b.vx = 0; b.vy = 0;
    if(Math.random() < 0.9)
      parts.push({x:b.x+rand(-26,26), y:b.y+rand(-10,10), vx:rand(-40,40), vy:rand(-160,-60),
        life:rand(0.3,0.7), max:0.7, size:rand(2,6), c:'#ffe066'});
    if(b.stateT <= 0){
      if(b.def.transformTo){ b.cfgKey = b.def.transformTo; b.cfg = CH[b.def.transformTo]; }
      if(b.def.monsterHp) b.maxHp = Math.round(b.maxHp * b.def.monsterHp);
      if(b.def.monsterSpeed) b.speed = b.def.monsterSpeed;
      if(b.def.monsterAtk) b.atkList = b.def.monsterAtk.slice();
      b.state = 'idle'; b.cd = 0.8;
      ring(b.x, b.y, '#ffe066', 150);
      spark(b.x, b.y, 60, ['#ffe066','#fff','#ffb84d'], 440, 1.0, 6);
      cam.shake = 26; sfx('boom');
    }
    return;
  }
  if(b.state === 'recover'){
    b.stateT -= dt;
    b.vx *= 0.9; b.vy *= 0.9;
    if(b.stateT <= 0){ b.state = 'idle'; b.cd = rand(0.5, 0.9); }
    return;
  }

  if(b.state === 'attack'){
    b.attackT -= dt;
    const A = b.attack;
    const dir = Math.atan2(dy, dx);

    if(A === 'dash'){
      if(dist_ < 70 && p.invuln <= 0){
        damagePlayer(b.transformed ? 22 : 14, b.x);
        b.vx *= -0.5; b.vy *= -0.5;
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.35; }
    }
    else if(A === 'blast' || A === 'barrage'){
      const shots = A === 'barrage' ? 6 : 2;
      b.attackData.timer -= dt;
      if(b.attackData.count < shots && b.attackData.timer <= 0){
        b.attackData.count++;
        b.attackData.timer = A === 'barrage' ? 0.11 : 0.18;
        const d2 = dir + rand(-0.15, 0.15);
        bullets.push({
          x:b.x + b.facing*24, y:b.y,
          vx:Math.cos(d2)*420, vy:Math.sin(d2)*280,
          r:7, dmg:12, life:2.5, c:'#ff7ad9', fromPlayer:false, t:0
        });
        sfx('shoot');
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.35; }
    }
    else if(A === 'charge' || A === 'rush' || A === 'kick'){
      if(!b.attackData.fired && b.attackT < 0.6){
        b.attackData.fired = true;
        const m = Math.hypot(dx, dy) || 1;
        b.vx = dx/m * 640; b.vy = dy/m * 400;
      }
      if(dist_ < 65 && p.invuln <= 0){
        damagePlayer(b.transformed ? 22 : 16, b.x);
        b.vx *= -0.4; b.vy *= -0.4;
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.45; }
    }
    else if(A === 'deathbeam' || A === 'nova'){
      if(!b.attackData.fired && b.attackT < 0.35){
        b.attackData.fired = true;
        bullets.push({
          x:b.x + b.facing*24, y:b.y,
          vx:Math.cos(dir)*950, vy:Math.sin(dir)*550,
          r:10, dmg:18, life:1.6, c:'#ff2a6a', fromPlayer:false, t:0
        });
        cam.shake = 6;
        spark(b.x + b.facing*28, b.y, 8, ['#ff2a6a','#fff'], 220, 0.3, 4);
        sfx('shoot');
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.3; }
    }
    else if(A === 'timestop'){
      if(!b.attackData.fired && b.attackT < 0.5){
        b.attackData.fired = true;
        G.hitStop = 0.5;
        cam.flash = 0.5; cam.flashCol = '#a0ff80';
        toast('GULDO: "TIME... STOP!"');
        ring(b.x, b.y, '#a0ff80', 180, 0.6);
        sfx('power');
        const self = b;
        setTimeout(()=>{
          if(!boss || boss !== self || player.dead) return;
          damagePlayer(16, b.x);
          toast('GULDO: "HA! Never saw it coming!"');
        }, 420);
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.7; }
    }
    else if(A === 'pose'){
      if(!b.attackData.fired && b.attackT < 0.9){
        b.attackData.fired = true;
        toast('GINYU: "TOKUSENTAI! PURPLE COMET ATTACK!"');
        const self = b;
        for(let i=0;i<5;i++){
          setTimeout(()=>{
            if(!boss || boss !== self) return;
            const d2 = Math.atan2(player.y-boss.y, player.x-boss.x) + rand(-0.3,0.3);
            bullets.push({
              x:boss.x, y:boss.y,
              vx:Math.cos(d2)*440, vy:Math.sin(d2)*300,
              r:8, dmg:11, life:2.5, c:'#c07bff', fromPlayer:false, t:0
            });
          }, i*110);
        }
      }
      if(b.attackT <= 0){ b.state='recover'; b.stateT=0.55; }
    }
    return;
  }

  if(b.state === 'idle'){
    b.cd -= dt;
    if(dist_ > 180){
      const m = Math.hypot(dx, dy) || 1;
      b.vx += (dx/m) * b.speed * 2.2 * dt;
      b.vy += (dy/m) * b.speed * 1.6 * dt;
      b.vx = clamp(b.vx, -b.speed*1.6, b.speed*1.6);
      b.vy = clamp(b.vy, -b.speed*1.2, b.speed*1.2);
    } else { b.vx *= 0.92; b.vy *= 0.92; }

    if(b.cd <= 0){
      const pool = b.atkList;
      const A = pool[(Math.random()*pool.length)|0];
      b.attack = A;
      b.attackData = { fired:false, count:0, timer:0 };
      const DUR = {dash:0.5, blast:0.5, barrage:1.3, charge:0.75, rush:0.9, kick:0.85,
        deathbeam:0.5, nova:0.6, timestop:0.9, pose:1.3}[A] || 0.6;
      b.attackT = DUR;
      b.state = 'attack';
      if(A === 'dash'){
        const m = Math.hypot(dx, dy) || 1;
        b.vx = dx/m * 560; b.vy = dy/m * 340;
      }
    }
  }
}

/* ══════════════ WORLD MAP ══════════════ */
function drawWorldMap(){
  ctx.fillStyle = 'rgba(4,10,14,0.9)';
  ctx.fillRect(0, 0, VW, VH);

  ctx.textAlign = 'center';
  ctx.font = '900 24px system-ui, sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20;
  ctx.fillText('WORLD MAP', VW/2, 40);
  ctx.shadowBlur = 0;

  const mapW = 640, mapH = 360;
  const mapX = VW/2 - mapW/2, mapY = 80;

  // Map background
  ctx.fillStyle = 'rgba(10,20,30,0.9)';
  ctx.fillRect(mapX-4, mapY-4, mapW+8, mapH+8);
  ctx.strokeStyle = '#5fe0b0';
  ctx.lineWidth = 2;
  ctx.strokeRect(mapX-4, mapY-4, mapW+8, mapH+8);

  // Draw regions
  for(const r of REGIONS){
    const cx = mapX + (r.gx * REGION_W / WORLD_W) * mapW;
    const cy = mapY + (r.gy * REGION_H / WORLD_H) * mapH;
    const rw = (REGION_W / WORLD_W) * mapW;
    const rh = (REGION_H / WORLD_H) * mapH;
    const cols = regionColor(r.g);
    ctx.fillStyle = cols.base;
    ctx.fillRect(cx, cy, rw, rh);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(cx, cy, rw, rh);

    // Boss marker
    if(r.bossAt && !G.defeatedBosses[r.bossAt.boss]){
      ctx.fillStyle = '#ff2a6a';
      ctx.beginPath(); ctx.arc(cx + rw/2, cy + rh/2, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    // Visited check
    if(G.visitedRegions[r.id]){
      ctx.fillStyle = 'rgba(127,233,255,0.7)';
      ctx.font = '9px system-ui, sans-serif';
      ctx.fillText(r.name, cx + rw/2, cy + rh/2 + 20);
    }
    // Building marker
    if(r.buildings){
      ctx.fillStyle = '#ffd166';
      for(const b of r.buildings){
        const bx = cx + ((b.x + b.gx) / WORLD_W) * mapW;
        const by = cy + ((b.y + b.gy) / WORLD_H) * mapH;
        ctx.fillRect(bx - 2, by - 2, 4, 4);
      }
    }
  }

  // Player marker
  const px = mapX + (player.x / WORLD_W) * mapW;
  const py = mapY + (player.y / WORLD_H) * mapH;
  ctx.fillStyle = '#7fe9ff';
  ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

  // Legend
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#7fe9ff';
  ctx.fillText('● You', VW/2 - 200, VH - 60);
  ctx.fillStyle = '#ff2a6a';
  ctx.fillText('● Boss (undefeated)', VW/2 - 100, VH - 60);
  ctx.fillStyle = '#ffd166';
  ctx.fillText('■ Building', VW/2 + 100, VH - 60);

  ctx.textAlign = 'center';
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Press M or click anywhere to close', VW/2, VH - 20);
}

};
function startIntroCutscene(){
  G.cutsceneQueue = INTRO_CUTSCENE.lines;
  G.cutsceneIdx = 0;
  G.cutsceneCharT = 0;
  G.cutsceneChars = 0;
  G.mode = 'cutscene';
}
function updateCutscene(dt){
  const line = G.cutsceneQueue[G.cutsceneIdx];
  if(!line){ G.mode = 'explore'; return; }
  G.cutsceneCharT += dt * 45;
  G.cutsceneChars = Math.min(line.text.length, G.cutsceneCharT);
  const complete = G.cutsceneChars >= line.text.length;
  if(pressed[' '] || pressed['enter'] || mouseClicked){
    if(!complete){ G.cutsceneChars = line.text.length; G.cutsceneCharT = line.text.length; }
    else {
      G.cutsceneIdx++;
      G.cutsceneCharT = 0; G.cutsceneChars = 0;
      sfx('ui');
      if(G.cutsceneIdx >= G.cutsceneQueue.length){
        G.mode = 'explore';
      }
    }
  }
}

/* ══════════════ MAIN RENDER ══════════════ */
function renderExplore(){
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, '#0a3a2a');
  sky.addColorStop(0.4, '#1d6b52');
  sky.addColorStop(0.7, '#4ea863');
  sky.addColorStop(1, '#8fd07a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VW, VH);

  // Suns
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const s1 = ctx.createRadialGradient(760, 80, 10, 760, 80, 160);
  s1.addColorStop(0, 'rgba(255,255,210,0.75)');
  s1.addColorStop(1, 'rgba(255,255,180,0)');
  ctx.fillStyle = s1; ctx.fillRect(560, -80, 420, 360);
  ctx.restore();

  // Ground
  drawGround();

  // Build render list (sorted by worldY)
  const list = [];

  // Buildings
  for(const b of ALL_BUILDINGS){
    if(!FIN(b.x + b.gx)) continue;
    list.push({ y: b.y + b.gy + b.h, draw: () => drawBuilding(b) });
  }

  // NPCs
  for(const n of npcList){
    if(!FIN(n.x)) continue;
    // cull
    if(sx(n.x) < -100 || sx(n.x) > VW+100) continue;
    if(sy(n.y) < -100 || sy(n.y) > VH+100) continue;
    list.push({ y: n.y, draw: () => {
      drawFighter(ctx, CH[n.ch] || CH.villager1, {
        sx: sx(n.x), sy: sy(n.y),
        facing: n.facing, animT: n.animT,
        moving: n.moving, hurtT: 0, attackT: 0, z: 0, scale: 1
      }, {});
    }});
  }

  // Enemies (only current region)
  for(const region of REGIONS){
    if(!region.enemies) continue;
    for(const en of region.enemies){
      if(en.dead) continue;
      if(sx(en.x) < -100 || sx(en.x) > VW+100) continue;
      if(sy(en.y) < -100 || sy(en.y) > VH+100) continue;
      list.push({ y: en.y, draw: () => {
        drawFighter(ctx, CH[en.ch] || CH.soldier, {
          sx: sx(en.x), sy: sy(en.y),
          facing: en.x < player.x ? 1 : -1, animT: G.t*1.5,
          moving: true, hurtT: 0, attackT: 0, z: 0, scale: 1
        }, {});
      }});
    }
  }

  // Boss preview (standing in the world, before fight)
  for(const region of REGIONS){
    if(!region.bossAt) continue;
    if(G.defeatedBosses[region.bossAt.boss]) continue;
    if(boss) continue;
    const bd = region.bossAt;
    if(sx(bd.x) < -150 || sx(bd.x) > VW+150) continue;
    if(sy(bd.y) < -200 || sy(bd.y) > VH+150) continue;
    list.push({ y: bd.y, draw: () => {
      const def = BOSS_DEFS[bd.boss];
      if(!def) return;
      // Aura
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const ac = def.transformAt ? '#ff7ad9' : '#ff2a6a';
      const gg = ctx.createRadialGradient(sx(bd.x), sy(bd.y)-30, 4, sx(bd.x), sy(bd.y)-30, 70);
      gg.addColorStop(0, ac + '55');
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(sx(bd.x), sy(bd.y)-30, 70, 0, TAU); ctx.fill();
      ctx.restore();

      drawFighter(ctx, CH[def.ch], {
        sx: sx(bd.x), sy: sy(bd.y),
        facing: bd.x < player.x ? 1 : -1, animT: G.t*1.2,
        moving: false, hurtT: 0, attackT: 0, z: 0, scale: 1
      }, { auraOn: true, auraR: 44 });
    }});
  }

  // Player
  const F = FORMS[player.form];
  const pcfg = CH[F.cfg];
  const blink = player.invuln > 0 && player.hurtT <= 0 && Math.floor(player.invuln*22)%2 === 0;
  list.push({ y: player.y, draw: () => {
    if(blink) ctx.globalAlpha = 0.45;
    drawFighter(ctx, pcfg, {
      sx: sx(player.x), sy: sy(player.y),
      facing: player.facing, animT: player.animT,
      moving: player.walking, hurtT: player.hurtT,
      attackT: player.attackT, z: player.z, scale: 1
    }, { auraOn: player.form > 0, auraR: player.form === 2 ? 46 : (player.form === 1 ? 40 : 0) });
    ctx.globalAlpha = 1;
  }});

  list.sort((a, b) => a.y - b.y);
  for(const item of list) item.draw();

  // Bullets
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const b of bullets){
    if(!FIN(b.x)||!FIN(b.y)) continue;
    const x = sx(b.x), y = sy(b.y) - 20;
    if(!FIN(x)||!FIN(y)) continue;
    const rg = ctx.createRadialGradient(x, y, 1, x, y, b.r*3);
    rg.addColorStop(0, '#fff');
    rg.addColorStop(0.35, b.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, b.r*3, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // Particles
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const p of parts){
    if(!FIN(p.x)||!FIN(p.y)||!FIN(p.size)) continue;
    const a = clamp(p.life/p.max, 0, 1);
    const x = sx(p.x), y = sy(p.y) - 18;
    if(!FIN(x)||!FIN(y)) continue;
    if(p.ring){
      const t = 1-a;
      const rx = p.size*t, ry = p.size*t*ISO;
      if(!FIN(rx)||!FIN(ry)) continue;
      ctx.strokeStyle = p.c;
      ctx.globalAlpha = a*0.7;
      ctx.lineWidth = 3*a+1;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
      ctx.stroke();
      continue;
    }
    ctx.globalAlpha = a;
    const rr2 = p.size*2;
    if(!FIN(rr2)) continue;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, rr2);
    rg.addColorStop(0, p.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, rr2, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Floating texts / toasts
  for(const f of floats){
    const a = clamp(f.life/f.max, 0, 1);
    if(!FIN(a)||!FIN(f.x)||!FIN(f.y)) continue;
    const x = sx(f.x), y = sy(f.y) - (f.isToast ? 80 : 0);
    if(!FIN(x)||!FIN(y)) continue;
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    if(f.isToast){
      ctx.font = '700 14px system-ui, sans-serif';
      const w = ctx.measureText(f.v).width + 24;
      ctx.fillStyle = 'rgba(4,10,14,0.85)';
      rr(ctx, x-w/2, y-12, w, 26, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(255,209,102,0.6)';
      ctx.lineWidth = 1.5;
      rr(ctx, x-w/2, y-12, w, 26, 8); ctx.stroke();
      ctx.fillStyle = f.c;
      ctx.fillText(f.v, x, y+6);
    } else {
      ctx.font = '800 20px system-ui, sans-serif';
      ctx.fillStyle = f.c;
      ctx.shadowColor = f.c; ctx.shadowBlur = 10;
      ctx.fillText(f.v, x, y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
}

function drawBattleScreen(){
  // Same world but with battle elements
  renderExplore();

  // Battle intro banner
  if(battleIntroT > 0){
    const a = clamp(battleIntroT/1.6, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(4,10,14,0.85)';
    ctx.fillRect(VW/2-280, 180, 560, 70);
    ctx.strokeStyle = 'rgba(255,90,138,0.7)';
    ctx.lineWidth = 3;
    ctx.strokeRect(VW/2-280, 180, 560, 70);
    ctx.font = '900 32px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5a8a';
    ctx.shadowColor = '#ff5a8a'; ctx.shadowBlur = 20;
    ctx.fillText(battleTitle, VW/2, 226);
    ctx.shadowBlur = 0;
    ctx.restore();

}

function drawInterior(){
  const it = INTERIORS[G.currentInterior];
  if(!it) return;
  // Background
  ctx.fillStyle = it.bg;
  ctx.fillRect(0, 0, VW, VH);

  // Walls
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, VW, 100);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(0, 100, VW, 2);

  // Room bounds (visible floor)
  const roomX = VW/2 - it.w/2;
  const roomY = VH/2 - it.h/2 + 40;
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.fillRect(roomX, roomY, it.w, it.h);
  ctx.strokeRect(roomX, roomY, it.w, it.h);

  // Name
  ctx.textAlign = 'center';
  ctx.font = '800 20px system-ui, sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.fillText(it.name, VW/2, 50);

  // Items
  if(it.items){
    for(const item of it.items){
      const ix = roomX + item.x;
      const iy = roomY + item.y;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(ix, iy, 4, ix, iy, 50);
      gg.addColorStop(0, 'rgba(125,255,168,0.6)');
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(ix, iy, 50, 0, TAU); ctx.fill();
      ctx.restore();

      // Icon
      ctx.fillStyle = '#7dffa8';
      ctx.beginPath(); ctx.arc(ix, iy, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#08301e';
      ctx.fillRect(ix-6, iy-2, 12, 4);
      ctx.fillRect(ix-2, iy-6, 4, 12);

      // Label
      ctx.font = '700 12px system-ui, sans-serif';
      ctx.fillStyle = '#7dffa8';
      ctx.fillText(item.label, ix, iy + 30);
    }
  }

  // Shop indicator
  if(it.shop){
    const sx0 = roomX + it.w/2;
    const sy0 = roomY + 100;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(sx0, sy0, 4, sx0, sy0, 80);
    gg.addColorStop(0, 'rgba(255,209,102,0.5)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(sx0, sy0, 80, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.font = '900 18px system-ui, sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('🛒 SHOP', sx0, sy0 + 8);
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Walk here and press E', sx0, sy0 + 30);
  }

  // NPCs
  for(const n of (it._npcs || [])){
    drawFighter(ctx, CH[n.ch] || CH.villager1, {
      sx: roomX + n.x, sy: roomY + n.y,
      facing: n.facing || -1, animT: n.animT || G.t,
      moving: false, hurtT: 0, attackT: 0, z: 0, scale: 1
    }, {});

    // Speech bubble
    ctx.save();
    ctx.font = '600 11px system-ui, sans-serif';
    const tw = ctx.measureText(n.dialogue).width;
    const bx = roomX + n.x - tw/2 - 8;
    const by = roomY + n.y - 100;
    ctx.fillStyle = 'rgba(4,10,14,0.9)';
    rr(ctx, bx, by, tw+16, 26, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(127,233,255,0.6)';
    ctx.lineWidth = 1.5;
    rr(ctx, bx, by, tw+16, 26, 8); ctx.stroke();
    ctx.fillStyle = '#eaf4ff';
    ctx.textAlign = 'center';
    ctx.fillText(n.dialogue, roomX + n.x, by + 17);
    ctx.restore();
  }

  // Player
  const F = FORMS[player.form];
  const pcfg = CH[F.cfg];
  drawFighter(ctx, pcfg, {
    sx: roomX + player.x, sy: roomY + player.y,
    facing: player.facing, animT: player.animT,
    moving: player.walking, hurtT: player.hurtT,
    attackT: player.attackT, z: 0, scale: 1
  }, { auraOn: player.form > 0 });

  // Floating texts
  for(const f of floats){
    const a = clamp(f.life/f.max, 0, 1);
    if(!FIN(a)) continue;
    const x = roomX + f.x, y = roomY + f.y - 80;
    ctx.globalAlpha = a;
    ctx.font = '700 14px system-ui, sans-serif';
    const w = ctx.measureText(f.v).width + 24;
    ctx.fillStyle = 'rgba(4,10,14,0.85)';
    rr(ctx, x-w/2, y-12, w, 26, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,209,102,0.6)';
    ctx.lineWidth = 1.5;
    rr(ctx, x-w/2, y-12, w, 26, 8); ctx.stroke();
    ctx.fillStyle = f.c;
    ctx.textAlign = 'center';
    ctx.fillText(f.v, x, y+6);
    ctx.globalAlpha = 1;
  }

  // Exit hint
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(160,255,220,'+(0.5+Math.sin(G.t*5)*0.4)+')';
  ctx.fillText('Walk to bottom + press S, or press ESC to exit', VW/2, VH - 20);
}

      rr(ctx,dx,dy2,dw*dp,10,4); ctx.fill();

  }
}

/* ══════════════ MAIN LOOP ══════════════ */
let last = performance.now();

function frame(now){
  const dt = Math.min(0.045, (now - last) / 1000);
  last = now;
  G.t += dt;
  worldTime += dt;

  let rdt = dt;
  if(G.hitStop > 0){ G.hitStop -= dt; rdt = dt*0.15; }

  /* UPDATE */
  if(G.mode === 'title'){
    if(pressed[' '] || pressed['enter'] || mouseClicked){
      startIntroCutscene();
      sfx('ui');
    }
  }
  else if(G.mode === 'cutscene'){
    updateCutscene(dt);
  }
  else if(G.mode === 'explore'){
    updateExplore(rdt);
    updateNPCs(dt);
    // Camera follow
    cam.x = lerp(cam.x, player.x - VW*0.42, 1 - Math.exp(-6*dt));
    cam.y = lerp(cam.y, player.y - (VH - GROUND_TOP)/ISO*0.45, 1 - Math.exp(-6*dt));
    cam.x = clamp(cam.x, 0, Math.max(0, WORLD_W - VW));
    cam.y = clamp(cam.y, 0, Math.max(0, WORLD_H - (VH - GROUND_TOP)/ISO));
  }
  else if(G.mode === 'interior'){
    updateInterior(rdt);
    if(shopOpen) updateShop(dt);
  }
  else if(G.mode === 'battle'){
    updateBattle(rdt);
  }
  else if(G.mode === 'map'){
    // handled by keypress below
  }
  else if(G.mode === 'win' || G.mode === 'lose'){
    if(pressed[' '] || pressed['enter'] || mouseClicked){
      // reset
      G.mode = 'title';
      G.defeatedBosses = {};
      G.visitedRegions = {};
      player.hp = player.maxHp; player.ki = player.maxKi;
      player.x = 800; player.y = 500; player.z = 0;
      player.form = 0; player.dead = false;
      player.zeni = 200;
      player.inventory = { potion:3, kiPotion:2, senzu:0 };
      player.weapon = 1; player.armor = 1;
      player.maxHp = 300; player.maxKi = 120;
      boss = null;
      // Reset enemies
      for(const r of REGIONS) if(r.enemies) for(const en of r.enemies) en.dead = false;
    }
  }

  // Map toggle (during explore)
  if((G.mode === 'explore' || G.mode === 'map') && pressed['m']){
    G.mode = G.mode === 'map' ? 'explore' : 'map';
    sfx('ui');
  }
  if(G.mode === 'map' && mouseClicked){
    // Fast travel
    const mapW = 640, mapH = 360;
    const mapX = VW/2 - mapW/2, mapY = 80;
    if(mouseX >= mapX && mouseX <= mapX+mapW && mouseY >= mapY && mouseY <= mapY+mapH){
      const wx = ((mouseX - mapX) / mapW) * WORLD_W;
      const wy = ((mouseY - mapY) / mapH) * WORLD_H;
      player.x = clamp(wx, 40, WORLD_W-40);
      player.y = clamp(wy, 40, WORLD_H-40);
      player.flying = false;
      player.z = 0;
      G.mode = 'explore';
      toast('📍 Fast travelled to ' + (regionAt(player.x, player.y)?.name || 'unknown'));
      sfx('power');
    } else {
      G.mode = 'explore';
      sfx('ui');
    }
  }

  // Update particles and floats regardless
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0 || !FIN(p.x) || !FIN(p.y)){ parts.splice(i,1); continue; }
    if(!p.ring){
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.97; p.vy *= 0.97;
    }
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i];
    f.life -= dt;
    if(!f.isToast) f.y -= 40*dt;
    if(f.life <= 0 || !FIN(f.x) || !FIN(f.y)) floats.splice(i,1);
  }

  // Camera shake / flash decay
  if(cam.shake > 0) cam.shake *= Math.pow(0.0025, dt);
  if(cam.shake < 0.2) cam.shake = 0;
  if(cam.flash > 0) cam.flash = Math.max(0, cam.flash - dt*2.6);

  /* RESET input */
  for(const k in pressed) delete pressed[k];
  mouseClicked = false;

  /* RENDER */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);

  const shX = cam.shake ? rand(-cam.shake, cam.shake) : 0;
  const shY = cam.shake ? rand(-cam.shake, cam.shake) : 0;

  ctx.save();
  ctx.translate(shX, shY);

  if(G.mode === 'title') drawTitleScreen();
  else if(G.mode === 'cutscene') drawCutsceneScene();
  else if(G.mode === 'explore'){ renderExplore(); drawHUD(); }
  else if(G.mode === 'interior'){ drawInterior(); if(shopOpen) drawShop(); }
  else if(G.mode === 'battle'){ drawBattleScreen(); drawHUD(); }
  else if(G.mode === 'map'){ renderExplore(); drawWorldMap(); }
  else if(G.mode === 'win') drawEndScreen(true);
  else if(G.mode === 'lose') drawEndScreen(false);

  ctx.restore();

  if(cam.flash > 0 && FIN(cam.flash)){
    ctx.globalAlpha = cam.flash*0.55;
    ctx.fillStyle = cam.flashCol;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }

  // Vignette
  const vg = ctx.createRadialGradient(VW/2, VH/2, VH*0.45, VW/2, VH/2, VH*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);

  requestAnimationFrame(frame);
}

function drawCutsceneScene(){
  // Sky background
  ctx.fillStyle = '#0a1a2a';
  ctx.fillRect(0, 0, VW, VH);
  const sky = ctx.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, '#1d6b52');
  sky.addColorStop(1, '#0a1a2a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VW, VH);

  // Slight ground
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, VH-100, VW, 100);

  const line = G.cutsceneQueue[G.cutsceneIdx];
  if(!line) return;

  // Who
  ctx.font = '800 16px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#7fe9ff';
  ctx.fillText(line.who, 100, VH - 130);

  // Text
  const text = line.text.slice(0, Math.floor(G.cutsceneChars));
  ctx.font = '500 20px system-ui, sans-serif';
  ctx.fillStyle = '#eaf4ff';
  const maxW = VW - 200;
  const words = text.split(' ');
  let cx = 100, cy = VH - 90;
  for(const w of words){
    const ww = ctx.measureText(w + ' ').width;
    if(cx + ww > 100 + maxW){ cx = 100; cy += 28; }
    ctx.fillText(w, cx, cy);
    cx += ww;
  }

  const complete = G.cutsceneChars >= line.text.length;
  if(complete){
    ctx.textAlign = 'right';
    ctx.font = '700 13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(160,255,220,'+(0.5+Math.sin(G.t*5)*0.45)+')';
    ctx.fillText('▶ CLICK OR SPACE', VW - 100, VH - 40);
  }

  // Progress dots
  const total = G.cutsceneQueue.length;
  for(let i=0;i<total;i++){
    ctx.fillStyle = i === G.cutsceneIdx ? '#7fe9ff' : 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(VW/2 - (total-1)*8 + i*16, 40, 4, 0, TAU);
    ctx.fill();
  }
}

function drawEndScreen(win){
  ctx.fillStyle = '#0a1a2a';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  if(win){
    ctx.font = '900 60px system-ui, sans-serif';
    const g = ctx.createLinearGradient(0, 180, 0, 260);
    g.addColorStop(0, '#fff2a8');
    g.addColorStop(1, '#ffb84d');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 40;
    ctx.fillText('NAMEK IS FREE', VW/2, 240);
    ctx.shadowBlur = 0;
    ctx.font = '700 20px system-ui, sans-serif';
    ctx.fillStyle = '#7fe9ff';
    ctx.fillText('Bulma defeated every boss.', VW/2, 300);
    ctx.font = '500 16px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('The green sky clears. The Dragon Balls are safe.', VW/2, 340);
  } else {
    ctx.font = '900 60px system-ui, sans-serif';
    const g = ctx.createLinearGradient(0, 180, 0, 260);
    g.addColorStop(0, '#ff9bb0');
    g.addColorStop(1, '#c02a4a');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ff6b8a'; ctx.shadowBlur = 40;
    ctx.fillText('DEFEATED', VW/2, 240);
    ctx.shadowBlur = 0;
    ctx.font = '700 20px system-ui, sans-serif';
    ctx.fillStyle = '#ff9bb0';
    ctx.fillText('Bulma fell on Planet Namek.', VW/2, 300);
  }
  ctx.font = '800 18px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(160,255,220,'+(0.55+Math.sin(G.t*4)*0.45)+')';
  ctx.fillText('CLICK OR PRESS SPACE TO RETURN', VW/2, 440);
}

/* ══════════════ BOOT ══════════════ */
requestAnimationFrame(frame);

})();
</script>
