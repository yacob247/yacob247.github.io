name: Pack Games
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --cwd bottleship-main
      - run: bun run --cwd bottleship-main tools/make-wgb.ts "../Project_IGI_RIP/PC/" IGI1.wgb --name "Project IGI" --exe IGI.exe --os win98
      - run: bun run --cwd bottleship-main tools/make-wgb.ts "../IGI 2 - Covert Strike/" IGI2.wgb --name "IGI 2 Covert Strike" --exe IGI2.exe --os win98
      - uses: actions/upload-artifact@v4
        with:
          name: IGI-bundles
          path: |
            IGI1.wgb
            IGI2.wgb
