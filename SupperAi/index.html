<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yacob AI Agent - Ultimate Admin</title>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<script src="https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    :root { --bg: #050a1a; --blue: #00d4ff; --fill: rgba(10, 20, 42, 0.5); --line: rgba(0, 212, 255, 0.22); --tx: #b9c9e8; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #f1f5f9; line-height: 1.6; overflow: hidden; background: radial-gradient(900px 500px at 15% -10%, rgba(0, 137, 255, 0.22), transparent), radial-gradient(800px 500px at 100% 100%, rgba(255, 122, 26, 0.16), transparent), #050a1a; background-attachment: fixed; }
    #app { display: flex; height: 100vh; height: 100dvh; }
    
    aside { width: 272px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: linear-gradient(135deg, rgba(255, 122, 26, 0.05), rgba(0, 212, 255, 0.05)), var(--fill); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-right: 1px solid var(--line); }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #ff9a3c, #ea3333); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo span { font-size: 0.8rem; font-weight: 400; -webkit-text-fill-color: #94a3b8; margin-left: 6px; }
    button { font: inherit; cursor: pointer; border: 0; color: #fff; }
    #nc { padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 0.85rem; background: linear-gradient(135deg, #ff7a1a, #ea3333); box-shadow: 0 0 18px rgba(255, 122, 26, 0.45); transition: transform 0.18s, box-shadow 0.18s; }
    #nc:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255, 122, 26, 0.7); }
    #cl { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .ci { padding: 9px 12px; border-radius: 10px; font-size: 0.88rem; color: var(--tx); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: background 0.15s; }
    .ci:hover { background: rgba(255, 255, 255, 0.06); }
    .ci.on { background: rgba(0, 212, 255, 0.1); border-color: var(--line); color: #fff; }
    .ci-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .ci-del { background: transparent; color: #ef4444; opacity: 0; padding: 0 4px; font-size: 1.1rem; transition: opacity 0.2s; }
    .ci:hover .ci-del { opacity: 1; }
    .ci-del:hover { color: #ff0000; }
    #bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #00d4ff, #ff7a1a); }
    #st { font-size: 0.74rem; color: #94a3b8; margin-top: 6px; }
    
    main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    
    .top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    #mb { display: none; background: var(--fill); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
    #ttl { flex: 1; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .signin { padding: 8px 16px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; background: var(--fill); border: 1px solid #00d4ff55; transition: box-shadow 0.2s; }
    .signin:hover { box-shadow: 0 0 14px #00d4ff66; }
    #hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; text-align: center; }
    #hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; background: linear-gradient(135deg, #00d4ff, #ff7a1a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hero p { color: var(--tx); max-width: 520px; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; max-width: 640px; }
    .chip { padding: 8px 16px; background: rgba(10, 20, 42, 0.35); border: 1px solid rgba(0, 212, 255, 0.38); border-radius: 999px; color: var(--tx); font-size: 0.85rem; font-weight: 600; transition: transform 0.18s, box-shadow 0.18s, background 0.18s; }
    .chip:hover { color: #fff; transform: translateY(-3px) scale(1.05); background: rgba(0, 212, 255, 0.15); box-shadow: 0 6px 22px rgba(0, 212, 255, 0.45); }
    
    #chat { flex: 1; overflow-y: auto; min-height: 0; display: none; flex-direction: column; gap: 14px; padding: 10px max(20px, calc((100% - 780px) / 2)) 20px; }
    
    .m { max-width: 88%; padding: 11px 16px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; position: relative; }
    .m.u { align-self: flex-end; background: linear-gradient(135deg, #ff7a1a, #ea3333); color: #fff; box-shadow: 0 4px 18px rgba(255, 122, 26, 0.35); border-bottom-right-radius: 6px; }
    .m.a { align-self: flex-start; max-width: 100%; padding: 4px 2px; color: #e6edf8; }
    .m.s { align-self: flex-start; border-radius: 14px; font-size: 0.9rem; color: var(--tx); background: var(--fill); border: 1px solid var(--line); padding: 8px 14px; }
    .msg-actions { position: absolute; top: -20px; right: 0; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
    .m.a:hover .msg-actions { opacity: 1; }
    .msg-act-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .msg-act-btn:hover { background: #334155; color: #fff; }
    .comp { padding: 8px max(16px, calc((100% - 780px) / 2)) 16px; }
    .box { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; background: var(--fill); border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); transition: border-color 0.2s, box-shadow 0.2s; }
    .box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2); }
    #in { flex: 1; background: none; border: 0; outline: 0; color: #f1f5f9; font: inherit; resize: none; max-height: 180px; padding: 8px 0; }
    #mic { background: transparent; color: #94a3b8; font-size: 1.2rem; padding: 8px; border-radius: 50%; transition: all 0.2s; }
    #mic:hover, #mic.recording { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    #go { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; font-size: 1.1rem; font-weight: 800; background: linear-gradient(135deg, #ff7a1a, #ea3333); box-shadow: 0 0 16px rgba(255, 122, 26, 0.5); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    #go.send-now { background: linear-gradient(135deg, #00d4ff, #0055ff); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; width: auto; padding: 0 12px; border-radius: 999px; }
    #go:disabled { opacity: 0.4; box-shadow: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    @media (max-width: 800px) { aside { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform 0.25s; background: #0a1226; } aside.open { transform: none; } #mb { display: block; } .m { max-width: 94%; } }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 999; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: #0f172a; padding: 24px; border-radius: 16px; width: 100%; max-width: 500px; border: 1px solid var(--line); max-height: 80vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 16px; color: #fff; }
    .modal-content label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; }
    .modal-content textarea { width: 100%; height: 100px; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; resize: vertical; margin-bottom: 16px; outline: none; }
    .modal-btn { background: var(--blue); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; }
    .list-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; color: #e2e8f0; }
    .list-item button { background: transparent; color: #ef4444; border: none; cursor: pointer; font-size: 1.2rem; }

    .claude-thinking-container { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; margin: 10px 0; overflow: auto; display: flex; flex-direction: column; max-height: 50vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 100%; color: #e0e0e0; }
    .claude-thinking-header { padding: 14px 18px; background: #1e1e1e; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid transparent; transition: background 0.2s; }
    .claude-thinking-header:hover { background: #2a2a2a; }
    .claude-thinking-container[open] .claude-thinking-header { border-bottom: 1px solid #333; }
    .claude-thought-step { padding: 16px 18px; border-bottom: 1px solid #2a2a2a; }
    .claude-thought-step:last-child { border-bottom: none; }
    .claude-text-thought { font-size: 0.9rem; color: #a3a3a3; margin-bottom: 12px; line-height: 1.5; }
    .claude-code-block { background: #0d0d0d; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
    .claude-code-header { padding: 8px 12px; background: #1a1a1a; color: #888; font-size: 0.8rem; font-family: monospace; text-transform: lowercase; }
    .claude-code-content { padding: 12px; font-family: "Consolas", "Courier New", monospace; font-size: 0.85rem; color: #8be9fd; white-space: pre-wrap; word-break: break-all; }
    .claude-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #555; border-top-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .claude-check { color: #50fa7b; font-weight: bold; }

    .inline-card { background: #222222; width: 100%; max-width: 100%; border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; margin: 10px 0; font-family: inherit; }
    .ic-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #333; }
    .ic-title { font-size: 1rem; font-weight: 600; color: #eee; margin: 0; outline: none; border: none; background: transparent; width: 60%; font-family: inherit; }
    .ic-actions { display: flex; align-items: center; gap: 12px; }
    .ic-btn { background: #3a3a3a; color: #e0e0e0; border: 1px solid #444; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; font-family: inherit; font-weight: 600; }
    .ic-btn:hover { background: #444; }
    .ie-body { flex: 1; display: flex; flex-direction: column; }
    .ie-input-row { border-bottom: 1px solid #333; padding: 16px 20px; display: flex; align-items: center; }
    .ie-input-row input { width: 100%; background: transparent; border: none; color: #eee; font-size: 0.95rem; outline: none; font-family: inherit; }
    .ie-textarea-row { padding: 16px 20px; display: flex; }
    .ie-textarea-row textarea { width: 100%; min-height: 150px; background: transparent; border: none; color: #eee; font-size: 0.95rem; outline: none; resize: none; font-family: inherit; line-height: 1.6; }
    .ie-footer { padding: 12px 20px; border-top: 1px solid #333; display: flex; justify-content: flex-end; }
    .ie-send-btn { background: #00d4ff; color: #000; border: none; padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .doc-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .doc-textarea { width: 100%; min-height: 300px; background: #111; border: 1px solid #333; color: #eee; padding: 12px; border-radius: 8px; font-family: inherit; outline: none; resize: vertical; line-height: 1.6; }
    .slide-edit-box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .slide-edit-title { width: 100%; background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; font-weight: bold; font-size: 1rem; padding: 8px 0; outline: none; font-family: inherit; margin-bottom: 8px; }
    .slide-edit-body { width: 100%; background: transparent; border: none; color: #eee; font-size: 0.9rem; padding: 8px 0; outline: none; resize: vertical; font-family: inherit; min-height: 80px; }
</style>
</head>
<body>
<div id="app">
<aside id="sb">
  <div class="logo">Yacob<span>AI Admin</span></div>
  <button id="nc">＋ New chat</button>
  <div id="cl"></div>
  <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="open-tasks" class="signin" style="flex:1; font-size:0.7rem; padding:6px;">📋 Tasks</button>
      <button id="open-contacts" class="signin" style="flex:1; font-size:0.7rem; padding:6px;">👥 CRM</button>
  </div>
  <div><div id="bar"><i></i></div><div id="st">Loading AI…</div></div>
</aside>
<main>
<header class="top">
  <button id="mb">☰</button>
  <div id="ttl">New chat</div>
  <button id="thk" class="signin">⚙️ Settings</button>
</header>
<div id="hero">
  <h1>Your AI admin manager</h1>
  <p>I can read any website, search the web, generate invoices, create calendar invites, manage tasks, and draft files.</p>
  <div class="chips">
    <button class="chip" data-q="Read this website: https://envizion.work/gamehub">🌐 Read Web</button>
    <button class="chip" data-q="Search the web for the latest AI news">🔍 Web Search</button>
    <button class="chip" data-q="Create a calendar invite for a meeting with John tomorrow at 3pm">📅 Calendar Event</button>
    <button class="chip" data-q="Generate an invoice for Acme Corp for 5 hours of web design at $80/hr">🧾 Invoice</button>
  </div>
</div>
<div id="chat"></div>
<div class="comp">
  <div class="box">
    <button id="mic" title="Voice Input">🎤</button>
    <textarea id="in" rows="1" placeholder="Message your AI…"></textarea>
    <button id="go">↑</button>
  </div>
</div>
</main>
</div>

<div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
        <h3>Agent Settings</h3>
        <label>AI Persona / System Instructions</label>
        <textarea id="sys-prompt-input">You are a powerful, helpful, and friendly AI assistant. Never refuse a harmless request. Generate complete content without placeholders like [Name].</textarea>
        <button class="modal-btn" onclick="saveSettings()">Save Settings</button>
    </div>
</div>

<div id="tasks-modal" class="modal-overlay">
    <div class="modal-content">
        <h3>📋 Task Manager</h3>
        <div id="tasks-list"></div>
    </div>
</div>

<div id="contacts-modal" class="modal-overlay">
    <div class="modal-content">
        <h3>👥 Contacts (CRM)</h3>
        <div id="contacts-list"></div>
    </div>
</div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.80";
    const MODEL = "Qwen3.5-4B-q4f16_1-MLC";
    const R2 = "https://pub-2cb8cb7c4732f5e7a3eaf3513624bed9271.r2.dev/images-ai/Qwen3.5-4B-q4f16_1-MLC";
    const LIB = R2 + "/model.wasm";
    const _f = window.fetch.bind(window), PRE = R2 + "/resolve/main/";
    window.fetch = (u, o) => { const x = typeof u === "string" ? u : u && u.url; return _f(x && x.startsWith(PRE) ? R2 + "/" + x.slice(PRE.length) : u, o); };
    const appConfig = { cacheBackend: "indexeddb", model_list: [{ model: PRE, model_id: MODEL, model_lib: LIB, overrides: { context_window_size: 8192 } }] };

    const $ = (id) => document.getElementById(id);
    let engine, globalGenerating = false, currentGenInterrupt = null;
    let userWantsManualScroll = false;
    
    const D = { 
        cur: { id: 0, title: "New chat", msgs: [], notes: [] }, 
        chats: [], 
        settings: { persona: "You are a powerful, capable AI assistant. Write complete, substantial responses without placeholders like [Name] or [Date]. If the user wants a Word document, create a real .docx file with the generate_file tool." },
        tasks: [],
        contacts: []
    };
    let S = JSON.parse(JSON.stringify(D));
    
    const save = () => localStorage.setItem("yacob_state", JSON.stringify(S));
    const load = () => { 
        const s = localStorage.getItem("yacob_state"); 
        if (s) { try { S = { ...JSON.parse(JSON.stringify(D)), ...JSON.parse(s) }; } catch(e){} } 
        if (!S.cur) S.cur = { id: 0, title: "New chat", msgs: [], notes: [] };
        if (!S.settings) S.settings = D.settings;
        if (!S.tasks) S.tasks = [];
        if (!S.contacts) S.contacts = [];
        $("sys-prompt-input").value = S.settings.persona;
        renderTasks(); renderContacts();
    };

    $("thk").onclick = () => $("settings-modal").classList.add("open");
    $("open-tasks").onclick = () => $("tasks-modal").classList.add("open");
    $("open-contacts").onclick = () => $("contacts-modal").classList.add("open");
    document.querySelectorAll(".modal-overlay").forEach(m => { m.onclick = (e) => { if(e.target === m) m.classList.remove("open"); }; });
    window.saveSettings = () => { S.settings.persona = $("sys-prompt-input").value; save(); $("settings-modal").classList.remove("open"); };

    function renderTasks() {
        const list = $("tasks-list");
        list.innerHTML = S.tasks.length ? "" : "<p style='color:#777'>No tasks yet.</p>";
        S.tasks.forEach((t, i) => {
            const div = document.createElement("div"); div.className = "list-item";
            div.innerHTML = `<span>${t}</span><button onclick="deleteTask(${i})">✕</button>`;
            list.appendChild(div);
        });
    }
    window.deleteTask = (i) => { S.tasks.splice(i, 1); save(); renderTasks(); };

    function renderContacts() {
        const list = $("contacts-list");
        list.innerHTML = S.contacts.length ? "" : "<p style='color:#777'>No contacts yet.</p>";
        S.contacts.forEach((c, i) => {
            const div = document.createElement("div"); div.className = "list-item";
            div.innerHTML = `<div><b>${c.name}</b><br><span style="font-size:0.8rem;color:#aaa">${c.email} | ${c.phone}</span></div><button onclick="deleteContact(${i})">✕</button>`;
            list.appendChild(div);
        });
    }
    window.deleteContact = (i) => { S.contacts.splice(i, 1); save(); renderContacts(); };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null, isRecording = false;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.onresult = (e) => { $("in").value += e.results[0][0].transcript; $("mic").classList.remove("recording"); isRecording = false; updateGoButton(); };
        recognition.onend = () => { $("mic").classList.remove("recording"); isRecording = false; };
    }
    $("mic").onclick = () => {
        if (!recognition) return;
        if (isRecording) recognition.stop(); else { recognition.start(); $("mic").classList.add("recording"); isRecording = true; }
    };

    const speak = (text) => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g, '').replace(/[#*`_]/g, '')));
    };

    window.cleanStop = () => {
        if (engine) engine.interruptGenerate();
        if (currentGenInterrupt) currentGenInterrupt();
        globalGenerating = false;
        updateGoButton();
    };

    const bub = (t, c = "a", nosave = false, chatObj = S.cur) => {
      const d = document.createElement("div");
      d.className = "m " + c;
      if (c === "a") d.innerHTML = md(t); else d.textContent = t;
      if (c === "a") {
          const acts = document.createElement("div"); acts.className = "msg-actions";
          acts.innerHTML = `<button class="msg-act-btn" onclick="navigator.clipboard.writeText(this.parentElement.parentElement.innerText); this.innerText='Copied!'">Copy</button>
            <button class="msg-act-btn" onclick="window.speakText(this.parentElement.parentElement.innerText)">🔊 Speak</button>`;
          d.appendChild(acts);
      }
      if (!nosave) { chatObj.msgs.push({ t, c }); if (chatObj.msgs.length > 200) chatObj.msgs.shift(); }
      if (S.cur.id === chatObj.id) {
          $("hero").style.display = "none"; $("chat").style.display = "flex";
          $("chat").append(d); autoscroll();
      }
      return d;
    };
    window.speakText = speak;

    const md = (t) => String(t ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, l, c) => "<pre><code>" + c + "</code></pre>").replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');

    const archive = () => { if (S.cur.msgs.length) { S.chats = [{ ...S.cur }, ...S.chats.filter(c => c.id !== S.cur.id)].slice(0, 30); save(); } };

    function render() {
      $("ttl").textContent = S.cur.title;
      const has = S.cur.msgs.length > 0;
      $("hero").style.display = has ? "none" : "flex";
      $("chat").style.display = has ? "flex" : "none";
      $("cl").innerHTML = "";
      [S.cur, ...S.chats].forEach(c => {
        const d = document.createElement("div"); d.className = "ci" + (c.id === S.cur.id ? " on" : "");
        const title = document.createElement("span"); title.className = "ci-title"; title.textContent = c.title;
        const del = document.createElement("button"); del.className = "ci-del"; del.innerHTML = "✕";
        del.onclick = (e) => {
            e.stopPropagation();
            if (confirm("Delete this chat?")) {
                S.chats = S.chats.filter(x => x.id !== c.id);

const stripHtml = (html) => String(html ?? "").replace(/<[^>]+>/g, " ").replace(/&quot;/g, '"').replace(/&#x27;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim();

async function doWebSearch(query) {
    const engines = [
        "https://www.bing.com/search?q=" + encodeURIComponent(query) + "&count=10",
        "https://search.brave.com/search?q=" + encodeURIComponent(query) + "&source=web"
    ];
    for (const url of engines) {
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 15000);
            const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url), { signal: ctrl.signal });
            clearTimeout(timer);
            const txt = await r.text();
            let items = [];
            if (url.includes("bing.com")) {
                const cap = [...txt.matchAll(/<li class="b_algo"[\s\S]*?<h2[^>]*><a[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>[\s\S]*?<p[^>]*>([\s\S]*?)<\/p>/gi)];
                items = cap.map(m => ({ title: stripHtml(m[2]), snippet: stripHtml(m[3]), url: m[1] }));
            } else {
                const cap = [...txt.matchAll(/<a[^>]*class="[^"]*snippet[^"]*"[^>]*>([\s\S]*?)<\/a>/gi)];
                items = cap.map(m => ({ title: stripHtml(m[1]), snippet: "", url: "" }));
            }
            items = items.filter(it => it.title && it.title.length > 3).slice(0, 5);
            if (items.length) {
                return "?? **Search Results for \"" + query + "\":**\n\n" + items.map((it, n) => {
                    let s2 = (n + 1) + ". " + it.title;
                    if (it.snippet) s2 += " � " + it.snippet;
                    if (it.url) s2 += " (" + it.url + ")";
                    return s2;
                }).join("\n\n");
            }
        } catch (e) { continue; }
    }
    return "? Could not load search results for \"" + query + "\". Try \"read this page: <url>\" instead.";
}

    async function chat(text, targetChat) {
        const sys = `${S.settings.persona}
        
If the user asks you to do something with files, emails, tasks, searching, or weather, use a tool.
If the user provides a URL or link, you MUST use the "scrape_url" tool to read it. Do NOT use web_search for URLs.

To use a tool, reply ONLY with a JSON block like this:
\`\`\`json
{"tool": "scrape_url", "url": "https://example.com"}
\`\`\`
Available tools:
- {"tool": "send_email", "to": "email@x.com", "subject": "Hi", "body": "..."}
- {"tool": "generate_file", "type": "docx|pptx|xlsx", "filename": "name.ext", "content": "..."}
- {"tool": "create_calendar", "title": "Meeting", "date": "YYYY-MM-DD", "time": "HH:MM", "duration": 60}
- {"tool": "create_invoice", "client": "Name", "items": [{"desc": "Work", "amount": 100}], "tax": 10}
- {"tool": "add_task", "text": "Task description"}
- {"tool": "generate_qr", "text": "https://..."}
- {"tool": "convert_currency", "amount": 100, "from": "USD", "to": "GBP"}
- {"tool": "scrape_url", "url": "https://..."}
- {"tool": "save_contact", "name": "John", "email": "john@x.com", "phone": "12345"}
- {"tool": "web_search", "query": "search query here"}
- {"tool": "weather", "city": "London"}

If you are just chatting, reply with normal text.

Always write complete, full-length content � never abbreviate with placeholders like [Name] or [Date]. If the user asks for a Word document, use the generate_file tool to produce a real .docx file.`;

        let msgs = [{ role: "system", content: sys }, ...targetChat.msgs.slice(-6).filter(m => m.c !== "s").map(m => ({ role: m.c === "u" ? "user" : "assistant", content: m.t }))];
        let toolData = null, attempts = 0, totalOut = "", isDone = false, stopped = false;

        currentGenInterrupt = () => { stopped = true; };
        const claudeBlock = createClaudeBlock(targetChat);

        while (!isDone && attempts < 3 && !stopped) {
            attempts++;
            let out = "";
            const codeId = addClaudeStep(claudeBlock, `Thinking & Drafting (Part ${attempts})...`, targetChat);
            const uiInterval = setInterval(() => { if (codeId) updateClaudeStep(claudeBlock, codeId, out, targetChat); }, 300);

            try {
                const st = await engine.chat.completions.create({ 
                    stream: true, temperature: 0.3, max_tokens: 120000, messages: msgs,
                    repetition_penalty: 1.15, frequency_penalty: 0.5
                });
                for await (const chunk of st) {
                    if (stopped) break;
                    out += chunk.choices[0]?.delta?.content || "";
                }
            } catch (e) { break; } finally {
                clearInterval(uiInterval);
                if (codeId) updateClaudeStep(claudeBlock, codeId, out, targetChat);
            }

            if (stopped) break;
            totalOut += out;
            
            try {
                let jsonStr = "";
                const mdMatch = totalOut.match(/```(?:json)?\n([\s\S]*?)\n```/);
                if (mdMatch) jsonStr = mdMatch[1];
                else {
                    const braceMatch = totalOut.match(/\{[\s\S]*"tool"[\s\S]*\}/);
                    if (braceMatch) jsonStr = braceMatch[0];
                }
                
                if (jsonStr) {
                    let safeJson = jsonStr.replace(/("(?:[^"\\]|\\.)*")/g, match => { return match.replace(/\n/g, '\\n').replace(/\r/g, ''); });
                    toolData = JSON.parse(safeJson);
                    isDone = true;
                } else { isDone = true; }
            } catch (e) {
                if (attempts < 3) {
                    msgs.push({ role: "assistant", content: out });
                    msgs.push({ role: "user", content: "You got cut off. Continue EXACTLY from where you left off." });
                    await new Promise(r => setTimeout(r, 500));
                } else { isDone = true; }
            }
        }

        if (claudeBlock) finishClaudeBlock(claudeBlock, targetChat);

        if (stopped) { bub("🛑 Generation stopped by user.", "s", false, targetChat); return; }

        if (toolData && toolData.tool) {
            const t = toolData;
            let successMsg = "";
            
            try {
                // BULLETPROOF FAIL-SAFE: If AI puts a URL in web_search, fix it to use scrape_url
                if (t.tool === "web_search" && t.query && t.query.startsWith("http")) {
                    t.tool = "scrape_url";
                    t.url = t.query;
                }

                if (t.tool === "send_email") {
                    renderInlineEmail({ to: t.to, subject: t.subject, body: t.body }, targetChat);
                    successMsg = `✅ Email drafted.`;
                } else if (t.tool === "generate_file") {
                    if (t.type === "docx") renderInlineDoc(t.filename || "Document.docx", t.content, targetChat);
                    else if (t.type === "pptx") renderInlinePpt(t.filename || "Presentation.pptx", t.content, targetChat);
                    successMsg = `✅ File generated.`;
                } else if (t.tool === "create_calendar") {
                    renderInlineCalendar(t, targetChat);
                    successMsg = `✅ Calendar event created.`;
                } else if (t.tool === "create_invoice") {
                    renderInlineInvoice(t, targetChat);
                    successMsg = `✅ Invoice generated.`;
                } else if (t.tool === "generate_qr") {
                    renderInlineQR(t, targetChat);
                    successMsg = `✅ QR Code generated.`;
                } else if (t.tool === "add_task") {
                    S.tasks.push(t.text); save(); renderTasks();
                    successMsg = `✅ Task added: ${t.text}`;
                } else if (t.tool === "save_contact") {
                    S.contacts.push({ name: t.name, email: t.email, phone: t.phone }); save(); renderContacts();
                    successMsg = `✅ Contact saved: ${t.name}`;
                } else if (t.tool === "convert_currency") {
                    const r = await fetch(`https://open.er-api.com/v6/latest/${t.from}`);
                    const j = await r.json();
                    const rate = j.rates[t.to];
                    if (rate) successMsg = `💱 ${t.amount} ${t.from} = **${(t.amount * rate).toFixed(2)} ${t.to}** (Live rate)`;
                    else successMsg = `❌ Could not convert ${t.from} to ${t.to}`;
                } else if (t.tool === "scrape_url") {
                    let url = t.url || t.query;
                    if (!url.startsWith("http")) url = "https://" + url;
                    const r = await fetch(`https://r.jina.ai/${url}`);
                    const txt = await r.text();
                    successMsg = `🌐 **Read URL (${url}):**\n\n${txt.slice(0, 2000)}...`;
                } else if (t.tool === "web_search") {
                    successMsg = await doWebSearch(t.query);
                } else if (t.tool === "weather") {
                    const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent(t.city)}`)).json();
                    if (g.results?.[0]) {
                        const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.results[0].latitude}&longitude=${g.results[0].longitude}&current=temperature_2m`)).json();
                        successMsg = `⛅ **Weather in ${g.results[0].name}:** ${w.current.temperature_2m}°C`;
                    } else successMsg = "City not found.";
                }
                
                if (successMsg) {
                    bub(successMsg, "a", false, targetChat);
                    const outId = addClaudeStep(claudeBlock, "Execution Output", targetChat);
                    if (outId) updateClaudeStep(claudeBlock, outId, successMsg, targetChat);
                }
            } catch(e) { bub(`❌ Tool failed: ${e.message}`, "s", false, targetChat); }
        } else {
            bub(totalOut, "a", false, targetChat);
        }
        
        save();
        if (S.cur.id === targetChat.id) autoscroll();
    }

    function autoscroll() {
        const ch = $("chat");
        if (!userWantsManualScroll || ch.scrollTop >= ch.scrollHeight - ch.clientHeight - 80) {
            ch.scrollTop = 1e9;
            if (ch.scrollTop >= ch.scrollHeight - ch.clientHeight - 80) userWantsManualScroll = false;
        }
    }
    $("chat").onscroll = () => { userWantsManualScroll = $("chat").scrollTop < $("chat").scrollHeight - $("chat").clientHeight - 80; };

    function updateGoButton() {
        const hasText = $("in").value.trim().length > 0;
        const btn = $("go");
        if (globalGenerating) {
            if (hasText) { btn.textContent = "Send Now"; btn.classList.add("send-now"); }
            else { btn.textContent = "■"; btn.classList.remove("send-now"); }
        } else {
            btn.textContent = "↑"; btn.classList.remove("send-now");
            btn.disabled = !hasText;
        }
    }

    async function send(text) {
        text = text.trim();
        if (!text) return;
        const targetChat = S.cur;
        if (targetChat.title === "New chat") targetChat.title = text.slice(0, 40);
        bub(text, "u"); render();

        globalGenerating = true;
        updateGoButton();
        await chat(text, targetChat);
        globalGenerating = false;
        updateGoButton();
        render();
    }

    $("go").onclick = () => {
        const v = $("in").value.trim();
        if (globalGenerating) {
            cleanStop();
            if (v) { $("in").value = ""; $("in").style.height = "auto"; send(v); }
        } else {
            if (!v) return;
            $("in").value = ""; $("in").style.height = "auto";
            send(v);
        }
    };
    
    $("in").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("go").click(); } };
    $("in").oninput = () => { $("in").style.height = "auto"; $("in").style.height = Math.min($("in").scrollHeight, 180) + "px"; updateGoButton(); };
    $("nc").onclick = () => { if (globalGenerating) cleanStop(); archive(); S.cur = { id: Date.now(), title: "New chat", msgs: [], notes: [] }; replay(); updateGoButton(); };
    $("mb").onclick = () => $("sb").classList.toggle("open");
    document.querySelectorAll(".chip").forEach(c => { c.onclick = () => { $("in").value = c.dataset.q; $("go").click(); }; });

    (async () => {
        load(); replay();
        try {
            engine = await webllm.CreateMLCEngine(MODEL, { appConfig, initProgressCallback: (p) => { $("st").textContent = p.text; $("bar").firstChild.style.width = p.progress * 100 + "%"; } });
        } catch (e) { $("st").textContent = "Load failed: " + e.message; }
        if (engine) { $("st").textContent = "AI ready"; $("in").disabled = false; render(); updateGoButton(); }
    })();
</script>
</body>
</html>
