<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>

aside{width:272px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:16px;background:linear-gradient(135deg,rgba(255,122,26,.05),rgba(0,212,255,.05)),var(--fill);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-right:1px solid var(--line)}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#ff9a3c,#ea3333);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-size:.8rem;font-weight:400;-webkit-text-fill-color:#94a3b8;margin-left:6px}
button{font:inherit;cursor:pointer;border:0;color:#fff}
#nc{padding:10px 16px;border-radius:999px;font-weight:800;font-size:.85rem;background:linear-gradient(135deg,#ff7a1a,#ea3333);box-shadow:0 0 18px rgba(255,122,26,.45);transition:transform .18s,box-shadow .18s}
#nc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,122,26,.7)}
#cl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.ci{padding:9px 12px;border-radius:10px;font-size:.88rem;color:var(--tx);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;transition:background .15s,border-color .15s}
.ci:hover{background:rgba(255,255,255,.06)}.ci.on{background:rgba(0,212,255,.1);border-color:var(--line);color:#fff}

#st{font-size:.74rem;color:#94a3b8;margin-top:6px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px}
#mb{display:none;background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:6px 12px}

.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:640px}
.chip{padding:8px 16px;background:rgba(10,20,42,.35);border:1px solid rgba(0,212,255,.38);border-radius:999px;color:var(--tx);font-size:.85rem;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .18s cubic-bezier(.2,.9,.3,1.4),box-shadow .18s,background .18s}

.m{max-width:88%;padding:11px 16px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:linear-gradient(135deg,#ff7a1a,#ea3333);color:#fff;box-shadow:0 4px 18px rgba(255,122,26,.35);border-bottom-right-radius:6px}
.m.a{align-self:flex-start;max-width:100%;padding:4px 2px;color:#e6edf8}
.m.s,.m.card{align-self:flex-start;border-radius:14px;font-size:.9rem;color:var(--tx);background:linear-gradient(135deg,rgba(255,122,26,.05),rgba(0,212,255,.05)),var(--fill);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.m.card h4{color:#fff;margin-bottom:6px;padding-left:10px;border-left:4px solid #ff7a1a;text-shadow:0 0 18px rgba(0,212,255,.4)}
.m.card .ln{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)}
code{background:rgba(0,212,255,.12);padding:1px 6px;border-radius:6px;font-size:.88em}

a{color:var(--blue)}
.ab{margin:8px 8px 0 0;padding:6px 16px;border-radius:999px;font-weight:800;font-size:.8rem;background:transparent;border:1px solid var(--line);transition:transform .15s,box-shadow .2s}
.ab:hover{transform:translateY(-2px)}

.ab.edit:hover{box-shadow:0 0 14px rgba(0,212,255,.6)}.ab.reject{border-color:#ea333388}

.box{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 18px;background:var(--fill);border:1px solid var(--line);border-radius:26px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.4);transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,212,255,.2),0 8px 32px rgba(0,0,0,.4)}
#in{flex:1;background:none;border:0;outline:0;color:#f1f5f9;font:inherit;resize:none;max-height:180px;padding:8px 0}
#in::placeholder{color:#94a3b8}
#go{width:40px;height:40px;flex-shrink:0;border-radius:50%;font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#ff7a1a,#ea3333);box-shadow:0 0 16px rgba(255,122,26,.5)}
#go:disabled{opacity:.4;box-shadow:none}
.fine{text-align:center;font-size:.72rem;color:#64748b;margin-top:8px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
@media(max-width:800px){aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .25s;background:#0a1226}aside.open{transform:none}#mb{display:block}*{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.m{max-width:94%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app">
<aside id="sb"><div class="logo">Yacob<span>AI Agent</span></div><button id="nc">＋ New chat</button><div id="cl"></div>

</main></div>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.79";
const MODEL="Llama-3.2-1B-Instruct-q4f16_1-MLC";
const R2="https://pub-841bd448812d4979b52ba64efdb90c94.r2.dev/Llama-3.2-1B-Instruct-q4f16_1-MLC";
const LIB=webllm.prebuiltAppConfig.model_list.find(m=>m.model_id===MODEL).model_lib;
const _f=window.fetch.bind(window),PRE=R2+"/resolve/main/";
window.fetch=(u,o)=>{const x=typeof u==="string"?u:u&&u.url;return _f(x&&x.startsWith(PRE)?R2+"/"+x.slice(PRE.length):u,o)};
const _add=Cache.prototype.add;
Cache.prototype.add=async function(r){const res=await window.fetch(r);if(!res.ok)throw new Error("HTTP "+res.status+" "+(r.url||r));await this.put(r,res)};
Cache.prototype.addAll=async function(a){for(const r of a)await this.add(r)};
const appConfig={cacheBackend:"indexeddb",model_list:[{model:PRE,model_id:MODEL,model_lib:LIB}]};
const $=id=>document.getElementById(id);
const D={cur:{id:0,title:"New chat",msgs:[]},chats:[],cfg:{clientId:"",fb:"",user:"",mode:"all",paused:false,perm:{gmail:true,calendar:true,drive:true,sheets:true,docs:true,slides:true},sheetId:""},log:[],inbox:[],last:"",profile:{},rules:[],sites:[],flows:[],bookings:[],emails:[],tasks:[],snips:[],hist:[]};
let S=D;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("yacob-agent",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kv=async(m,...a)=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("kv",m==="get"?"readonly":"readwrite").objectStore("kv")[m](...a);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const save=()=>kv("put",JSON.parse(JSON.stringify(S)),"state").catch(()=>{});
const FIELDS=["name","services","prices","hours","tone","email"];
let engine,busy=false;

const bub=(t,c="a",nosave)=>{const d=document.createElement("div");d.className="m "+c;if(c==="a")d.innerHTML=md(t);else d.textContent=t;
 if(!nosave){S.cur.msgs.push({t,c});if(S.cur.msgs.length>200)S.cur.msgs.shift()}
 $("hero").style.display="none";$("chat").style.display="flex";$("chat").append(d);$("chat").scrollTop=1e9;return d};
const ok=t=>bub("✔ "+t,"s");

async function readSite(url){
 let txt;
 try{const r=await fetch(url);txt=await r.text();
  const d=new DOMParser().parseFromString(txt,"text/html");d.querySelectorAll("script,style,nav,footer").forEach(n=>n.remove());txt=d.body.textContent}
 catch{const r=await fetch("https://r.jina.ai/"+url);txt=await r.text()}
 return txt.replace(/\s+/g," ").trim().slice(0,4000);
}
async function addSite(url,purpose=""){
 url=url.replace(/[.,)]+$/,"");
 let s=S.sites.find(x=>x.url===url);
 if(!s){s={url,purpose,text:""};S.sites.push(s);ok("Site added: "+url)}
 try{s.text=await readSite(url);ok("Read "+url+" ("+s.text.length+" chars)")}catch(e){ok("Could not read "+url)}
}
function snippet(type){
 const to=S.profile.email;if(!to)return;
 if(S.snips.some(x=>x.type===type))return;
 const code=`<form action="mailto:${to}" method="post" enctype="text/plain" style="display:grid;gap:8px;max-width:360px;font:14px system-ui">
<input name="name" placeholder="Your name" required>
<input name="email" type="email" placeholder="Your email" required>
<textarea name="${type==="booking"?"booking request (date/time/service)":"message"}" required></textarea>
<button>${type==="booking"?"Request booking":"Send enquiry"}</button></form>`;
 S.snips.push({type,code});ok("Embed snippet created: "+type);
}
function apply(a){
 try{switch(a.type){
  case"set_profile":if(FIELDS.includes(a.field)&&a.value){S.profile[a.field]=String(a.value);ok(a.field+" set");if(a.field==="email"){snippet("enquiry");snippet("booking")}}break;
  case"add_site":if(a.url)return addSite(a.url,a.purpose);break;
  case"add_workflow":if(a.when&&a.then){S.flows.push({when:a.when,then:a.then});ok("Workflow: "+a.when+" → "+a.then)}break;
  case"add_booking":if(a.name){S.bookings.push({name:a.name,date:a.date||"",time:a.time||"",note:a.note||""});ok("Booking: "+a.name)}break;
  case"draft_email":if(a.body){S.emails.push({to:a.to||"",subject:a.subject||"",body:a.body});ok("Email draft saved")}break;
  case"add_rule":if(a.text){S.rules.push(a.text);ok("Rule saved: "+a.text)}break;
  case"add_task":if(a.text){S.tasks.push(a.text);ok("Task: "+a.text)}break;
  case"make_snippet":snippet(a.kind==="booking"?"booking":"enquiry");break;
 }}catch{}
}
const Q=[],FREE=new Set(["show","approve_all","export_data","pause","resume","signout"]);let TOK=null;
const log=t=>{S.log=(S.log||[]).concat(new Date().toLocaleTimeString()+" "+t).slice(-40)};
const EXT=new Set(["send_email","gmail_search","create_event","list_events","log_to_sheet","drive_save","add_site","create_doc","create_slides","create_sheet","read_doc"]);
function describe(a){const t=a.type;
 if(t==="send_email")return `SEND EMAIL (Gmail) → ${a.to}\nSubject: ${a.subject}\n${a.body}`;
 if(t==="create_event")return `CREATE CALENDAR EVENT: ${a.title} on ${a.date} ${a.time||""} (${a.minutes||60} min)${a.attendee?" + "+a.attendee:""}`;
 if(t==="gmail_search")return "SEARCH GMAIL: "+(a.query||"unread");
 if(t==="list_events")return "READ YOUR CALENDAR (next 10)";
 if(t==="log_to_sheet")return "ADD ROW TO GOOGLE SHEET: "+[].concat(a.row||[]).join(" | ");
 if(t==="drive_save")return "SAVE TO DRIVE: "+a.name;
 if(t==="add_site")return "READ WEBSITE: "+a.url;
 if(t==="create_doc")return `CREATE GOOGLE DOC: ${a.title}\n${String(a.content||"").slice(0,300)}`;
 if(t==="create_slides")return `CREATE GOOGLE SLIDES: ${a.title} (${(a.slides||[]).length} slides)\n`+(a.slides||[]).map(x=>"• "+x.title).join("\n");
 if(t==="create_sheet")return `CREATE GOOGLE SHEET: ${a.title} (${(a.rows||[]).length} rows)`;
 if(t==="read_doc")return "READ GOOGLE DOC: "+(a.url||a.id);
 return t.replace(/_/g," ").toUpperCase()+": "+Object.entries(a).filter(([k])=>k!=="type").map(([k,v])=>v).join(" · ");
}
async function propose(a){
 if(!a||!a.type)return;
 if(FREE.has(a.type))return run(a);
 if(S.cfg.paused){log("paused, skipped "+a.type);return}
 const key=x=>x.type+(x.url||x.field||x.text||x.to||x.title||"");
 if(Q.some(x=>key(x.a)===key(a)))return;
 if(S.cfg.mode==="external"&&!EXT.has(a.type))return run(a);
 const it={a,el:document.createElement("div")};it.el.className="m s";Q.push(it);
 draw(it);$("chat").append(it.el);$("chat").scrollTop=1e9;render();
}
function draw(it){
 const e=it.el;e.innerHTML="";const t=document.createElement("div");t.style.whiteSpace="pre-wrap";t.textContent="⏳ Needs your approval: "+describe(it.a);e.append(t);
 for(const [l,f] of [["Approve",()=>decide(it,true)],["Edit",()=>edit(it)],["Reject",()=>decide(it,false)]]){const b=document.createElement("button");b.textContent=l;b.className="ab "+l.toLowerCase();b.onclick=f;e.append(b)}
}
async function decide(it,yes){
 const i=Q.indexOf(it);if(i<0)return;Q.splice(i,1);
 it.el.textContent=(yes?"✔ Approved: ":"✖ Rejected: ")+describe(it.a).split("\n")[0];
 log((yes?"approved ":"rejected ")+it.a.type);
 if(yes)await run(it.a);save();render();
}
function edit(it){const v=prompt("Edit action (JSON)",JSON.stringify(it.a,null,1));if(!v)return;try{it.a=JSON.parse(v);draw(it)}catch{alert("Invalid JSON")}}
async function run(a){
 if(S.cfg.paused&&!["resume","show"].includes(a.type)){bub("⏸ AI is paused. Say “resume” to continue.","s");return}
 try{const r=G[a.type]?await G[a.type](a):await apply(a);
  if(typeof r==="string"){S.last=r.slice(0,1000);const d=bub(r,r.startsWith("✔")?"s":"a");const u=r.match(/https:\/\/docs\.google\.com\/\S+/);if(u){const l=document.createElement("a");l.href=u[0];l.target="_blank";l.textContent="  Open ↗";l.style.color="#9bd";d.append(l)}}log("done "+a.type)}
 catch(e){bub("✖ "+a.type+": "+e.message,"s");log("failed "+a.type+": "+e.message)}
 save();render();
}
const SC={gmail:["gmail.send","gmail.readonly"],calendar:["calendar.events"],drive:["drive.file"],sheets:["spreadsheets"],docs:["documents"],slides:["presentations"]};
const FB={apiKey:"AIzaSyDLeM4MrsA1Q8zq7_QcQfTJKk049vOVOO4",authDomain:"envizionwork.firebaseapp.com",databaseURL:"https://envizionwork-default-rtdb.firebaseio.com",projectId:"envizionwork",storageBucket:"envizionwork.firebasestorage.app",messagingSenderId:"706251024837",appId:"1:706251024837:web:4c931733d3a9f430a703ac",measurementId:"G-9CL929H67Z"};
const parseFb=t=>{const o={};for(const m of (t||"").matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];return o.apiKey&&o.authDomain?o:null};
async function connect(){
 const fc=parseFb(S.cfg.fb)||FB;
 const sc=Object.keys(SC).filter(k=>S.cfg.perm[k]).flatMap(k=>SC[k]).map(x=>"https://www.googleapis.com/auth/"+x);
 if(!sc.length)return alert("Allow at least one service");
 try{
  const B="https://www.gstatic.com/firebasejs/10.14.1/";
  const {initializeApp,getApps}=await import(B+"firebase-app.js"),A=await import(B+"firebase-auth.js");
  const app=getApps()[0]||initializeApp(fc),pr=new A.GoogleAuthProvider();
  sc.forEach(x=>pr.addScope(x));
  const r=await A.signInWithPopup(A.getAuth(app),pr);
  TOK=A.GoogleAuthProvider.credentialFromResult(r).accessToken;S.cfg.user=r.user.email;save();
  ok("Signed in as "+r.user.email+" — Google connected");log("google connected "+r.user.email);render();
 }catch(e){ok("Sign-in failed: "+e.message)}
}
function gisConnect(){
 const c=S.cfg;if(!c.clientId)return alert("Paste your Google OAuth Client ID first");
 const scope=Object.keys(SC).filter(k=>c.perm[k]).flatMap(k=>SC[k]).map(x=>"https://www.googleapis.com/auth/"+x).join(" ");
 if(!scope)return alert("Allow at least one service");
 const go=()=>google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope,callback:r=>{if(r.access_token){TOK=r.access_token;ok("Google connected");log("google connected")}else ok("Google connect failed");render()}}).requestAccessToken({prompt:"consent"});
 if(window.google?.accounts)go();else{const x=document.createElement("script");x.src="https://accounts.google.com/gsi/client";x.onload=go;document.head.append(x)}
}
async function gf(url,o={},svc){
 if(!TOK)throw new Error("Press “Sign in with Google” (top right) first");
 if(svc&&!S.cfg.perm[svc])throw new Error(svc+" permission is off");
 const r=await fetch(url,{...o,headers:{Authorization:"Bearer "+TOK,"Content-Type":"application/json",...(o.headers||{})}});
 if(r.status===401){TOK=null;render();throw new Error("Google session expired, press Connect Google")}
 if(!r.ok)throw new Error("Google "+r.status+" "+(await r.text()).slice(0,150));
 return r.json();
}
const b64u=s=>{let x="";new TextEncoder().encode(s).forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const G={
 async send_email(a){
  if(!a.to)throw new Error("No recipient");
  const raw=`To: ${a.to}\r\nSubject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(a.subject||"")))}?=\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: 8bit\r\n\r\n${a.body||""}`;
  await gf("https://gmail.googleapis.com/gmail/v1/users/me/messages/send",{method:"POST",body:JSON.stringify({raw:b64u(raw)})},"gmail");
  S.emails.push({to:a.to,subject:a.subject,body:(a.body||"")+"\n[SENT]"});return "✔ Email sent to "+a.to;
 },
 async gmail_search(a){
  const l=await gf("https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=5&q="+encodeURIComponent(a.query||"is:unread in:inbox"),{},"gmail");
  S.inbox=[];
  for(const m of l.messages||[]){const d=await gf("https://gmail.googleapis.com/gmail/v1/users/me/messages/"+m.id+"?format=metadata&metadataHeaders=From&metadataHeaders=Subject",{},"gmail");
   const h=n=>(d.payload.headers.find(x=>x.name===n)||{}).value||"";S.inbox.push({from:h("From"),subject:h("Subject"),snippet:d.snippet})}
  return S.inbox.length?"Inbox:\n"+S.inbox.map(m=>"• "+m.from+" — "+m.subject).join("\n"):"No matching emails";
 },
 async create_event(a){
  const s=new Date(a.date+"T"+(a.time||"09:00")+":00");if(isNaN(s))throw new Error("Bad date/time: "+a.date+" "+a.time);
  const e=new Date(s.getTime()+(+a.minutes||60)*6e4),tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,19);
  const ev={summary:a.title||"Booking",description:a.note||"",start:{dateTime:iso(s),timeZone:tz},end:{dateTime:iso(e),timeZone:tz}};

 },

 },

 },

 },
 async create_slides(a){
  const p=await gf("https://slides.googleapis.com/v1/presentations",{method:"POST",body:JSON.stringify({title:a.title||"Untitled"})},"slides"),rq=[];

  if(rq.length){rq.push({deleteObject:{objectId:p.slides[0].objectId}});await gf(`https://slides.googleapis.com/v1/presentations/${p.presentationId}:batchUpdate`,{method:"POST",body:JSON.stringify({requests:rq})},"slides")}

 async create_sheet(a){

 },
 show(a){const w=(a.what||"").toLowerCase().replace(/^drafts?/,"emails"),k=Object.keys(VIEWS).find(v=>w.startsWith(v.slice(0,4)));
  if(!k)return "I can show: "+Object.keys(VIEWS).join(", ");
  card(k[0].toUpperCase()+k.slice(1),VIEWS[k](),k==="inbox"?i=>send("Customer enquiry from "+S.inbox[i].from+" — "+S.inbox[i].subject+": "+S.inbox[i].snippet+". Draft a reply email to them."):null)},
 pause(){S.cfg.paused=true;log("AI paused");return "⏸ Paused. Say “resume” to continue."},

 async drive_save(a){
  const b="x"+Date.now(),n=a.name||"note.txt";
  await gf("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:n})}\r\n--${b}\r\nContent-Type: text/plain\r\n\r\n${a.content||""}\r\n--${b}--`},"drive");

const missing=()=>FIELDS.filter(f=>!S.profile[f]);

function chatSys(){const m=missing();return `You are the owner's online admin manager for their business. Keep replies short (1-3 sentences).
You CAN, when the owner asks: send emails and search the inbox (Gmail), create and read Google Calendar events, create Google Docs, Slides and Sheets, read Google Docs, log rows to Sheets, save notes to Drive, read websites, track bookings and tasks, remember standing instructions, show any data (bookings, tasks, emails, rules, sites, inbox, activity, settings), pause/resume, change the approval mode, switch Google services on/off, approve all, export, and reset. Every action is shown to the owner and only runs after they press Approve; say briefly what you will do and never claim it is already done. If the owner gives a task, do not ask onboarding questions.
Business so far: ${JSON.stringify(S.profile)}
Still unknown: ${m.join(", ")||"nothing"}. ${m.length?"Only if no task was given, ask about: "+m[0]+".":""}
Standing instructions (ALWAYS obey exactly): ${S.rules.join("; ")||"none"}
Workflows you follow: ${S.flows.map(f=>"when "+f.when+" then "+f.then).join("; ")||"none"}
Last action result:\n${S.last||"none"}\nWebsite knowledge:\n${know()||"none"}
The system saves details and runs actions automatically and shows ✔ lines. Never say you cannot do admin; never invent facts.`}

 {role:"system",content:`Convert the user's latest request into actions. Output JSON {"actions":[...]}, max 4. Include only what the user asked for or stated; never invent emails, dates or names. Today is ${new Date().toISOString().slice(0,10)}. Dates YYYY-MM-DD, times HH:MM 24h.

{"type":"set_perm","service":"gmail|calendar|drive|sheets|docs|slides","on":true}

Examples: "email sam@x.com that we open at 9" -> send_email. "what's on my calendar" -> list_events. "check my inbox" -> gmail_search. "book Ana friday 3pm" -> add_booking + create_event. "show my bookings" -> show. "pause" -> pause. "approve everything" -> approve_all. "turn off gmail" -> set_perm. Chit-chat or questions -> {"actions":[]}.`},
 {role:"user",content:"USER: "+user+"\nASSISTANT: "+reply}]});
 let j;try{j=JSON.parse(r.choices[0].message.content)}catch{return}

}

async function send(text){
 text=text.trim();if(!text||busy)return;
 busy=true;$("go").textContent="■";$("in").disabled=true;if(S.cur.title==="New chat")S.cur.title=text.slice(0,40);bub(text,"u");
 try{
  for(const u of text.match(/https?:\/\/[^\s]+/g)||[])await propose({type:"add_site",url:u.replace(/[.,)]+$/,"")});
  const em=text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);if(em&&!S.profile.email)await propose({type:"set_profile",field:"email",value:em[0]});
  S.hist.push({role:"user",content:text});
  const d=bub("…");let out="";
  const st=await engine.chat.completions.create({stream:true,temperature:.6,max_tokens:300,messages:[{role:"system",content:chatSys()},...S.hist.slice(-8)]});
  for await(const c of st){out+=c.choices[0]?.delta?.content||"";d.innerHTML=md(out);$("chat").scrollTop=1e9}
  S.cur.msgs[S.cur.msgs.length-1].t=out;S.hist.push({role:"assistant",content:out});
  await setupPass(text,out);
 }catch(e){bub("Error: "+e.message,"s")}
 S.hist=S.hist.slice(-20);save();render();busy=false;$("go").textContent="↑";$("in").disabled=false;$("in").focus();
}
$("go").onclick=()=>{if(busy){engine.interruptGenerate();return}const v=$("in").value;$("in").value="";$("in").style.height="auto";send(v)};
$("in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("go").click()}};$("in").oninput=()=>{$("in").style.height="auto";$("in").style.height=Math.min($("in").scrollHeight,180)+"px"};

const E=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md=t=>E(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>"<pre><code>"+c+"</code></pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');

 sites:()=>S.sites.map(x=>x.url+(x.text?" ("+x.text.length+" chars read)":" (not read)")),

function card(title,lines,fn){
 const d=document.createElement("div");d.className="m card";const h=document.createElement("h4");h.textContent=title;d.append(h);
 (lines.length?lines:["Nothing yet"]).forEach((l,i)=>{const r=document.createElement("div");r.className="ln";r.textContent=l;
  if(fn&&lines.length){const b=document.createElement("button");b.className="ab edit";b.textContent="Draft reply";b.onclick=()=>fn(i);r.append(b)}d.append(r)});
 $("hero").style.display="none";$("chat").style.display="flex";$("chat").append(d);$("chat").scrollTop=1e9;
}
const archive=()=>{if(S.cur.msgs.length)S.chats=[{...S.cur,hist:S.hist},...S.chats].slice(0,30)};

}
